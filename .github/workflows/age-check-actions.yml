# ============================================================================
# REUSABLE: GitHub Actions Pin Age Check (supply-chain guard, PUBLIC mirror)
# ----------------------------------------------------------------------------
# Self-contained: the bash lib is inlined below. No cross-repo checkout,
# no secrets required, no GitHub App involved. Public consumer repos
# point at this file (at the equivalent `layervai/ops-routines-workflows`
# mirror) because GitHub blocks public → internal reusable-workflow calls.
#
# DO NOT EDIT THIS FILE DIRECTLY. It's generated by
# `scripts/embed-lib-into-workflows.py` from:
#   - lib/_preflight.sh
#   - lib/age-check-actions.sh
#   - templates/workflows/age-check-actions.yml.tmpl
# Edit those sources and run `make embed-workflows`.
# ============================================================================
name: Dependency Age Check (Actions, reusable)

on:
  workflow_call:
    inputs:
      min_age_days:
        description: "Minimum commit age in days for any newly-added uses: SHA"
        type: number
        required: false
        default: 7
      comment_on_failure:
        description: |
          Post a sticky PR comment listing pins that failed the age check
          and how many days each has left until eligible. Requires the
          calling job to grant `pull-requests: write` (Dependabot PRs need
          this granted explicitly; the default Dependabot token is
          read-only). Soft-fails to a `::notice` if the token can't write.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: age-check-actions-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  age-check:
    name: Check GitHub Actions pin ages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only used when `comment_on_failure: true`. Caller's job-level
      # `permissions:` block caps this; if the caller restricts to
      # `contents: read` (or runs as Dependabot without an explicit
      # grant), the post-step soft-fails to a `::notice`.
      pull-requests: write
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'age-check-bypass') }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run age-check-actions.sh
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          # Default skip-list includes this very workflow repo so fresh
          # releases here don't self-block. Override via env to tighten
          # or widen the list.
          AGE_CHECK_SKIP_SELF_REFS: "layervai/ops-routines layervai/ops-routines-workflows"
          # Binds the self-reference rollout seam to the caller's organization.
          # The checker still requires the exact pin to be a verified commit on
          # the exact repository's protected default branch.
          ACTIONS_AGE_TRUSTED_OWNER: ${{ github.repository_owner }}
          # `record_failure` writes a TSV row here for each too-new pin
          # so the post-step below can render the data into a comment
          # without redoing classification. Unset → no-op.
          AGE_CHECK_FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          GH_TOKEN: ${{ github.token }}
        run: |
          # ============================================================================
          # _preflight.sh - Shared preflight helpers for age-check-*.sh
          # ============================================================================
          #
          # Sourced by each ecosystem-specific age-check script so the validator
          # logic stays consistent. Covers the class of silent-pass bugs that
          # bit the sibling per-repo dep-age checks (website#189, qurl-mcp#52,
          # qurl-portal#14, qurl-typescript#32, discord#21) before they were
          # hardened, plus the preflight probes those rounds added:
          #
          # - Positive-integer validation for MIN_AGE_DAYS (reject 0 and
          #   non-numeric)
          # - GNU `date -d` availability probe (catches BSD/macOS silently
          #   replacing GNU date)
          # - Required-tool existence checks (caller supplies its exact tool list)
          # - Explicit base_ref verification before `git diff` so a missing ref
          #   doesn't get conflated with "no changes detected" by a trailing
          #   `|| true` on the filter pipeline
          # - Step-summary helpers so the Actions UI never shows an empty panel
          #   on early-exit paths
          # - Shared age comparison + ISO-8601 parsing to keep those callers
          #   minimal
          #
          # REQUIRED CALL ORDER in main():
          #
          #   preflight::require_tools <tool> [...]      # tools first
          #   preflight::require_gnu_date                # then date-d probe
          #   preflight::validate_min_age_days           # then env validation
          #   preflight::verify_base_ref "origin/${BASE_REF}"  # MUST come before any
          #                                              # subsequent `git diff` — see
          #                                              # the function comment for
          #                                              # the silent-pass reason.
          #
          # Usage (from an age-check script):
          #
          #   # shellcheck source=lib/_preflight.sh
          #   source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"
          #
          # ============================================================================

          # Guard against double-sourcing — IFS and `set -e` state are caller's.
          if [ -n "${_PREFLIGHT_SOURCED:-}" ]; then
            return 0
          fi
          _PREFLIGHT_SOURCED=1

          # ----- Required-tool probes --------------------------------------------------

          preflight::require_tools() {
            local missing=()
            local tool
            for tool in "$@"; do
              command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Required tools not available on runner: ${missing[*]}. This workflow depends on ubuntu-latest (or a runner image with these installed)."
              exit 1
            fi
          }

          # GNU date supports `date -d @<epoch>` syntax that BSD/macOS date
          # rejects. Every age-check script converts an ISO-8601 timestamp to
          # epoch via `date -d "$ts" +%s`; probing up front catches a silent
          # regression if the runner ever stops providing GNU date.
          preflight::require_gnu_date() {
            if ! date -d @0 >/dev/null 2>&1; then
              echo "::error::GNU date -d not available on runner — this workflow depends on GNU date's \`@\`-prefix epoch syntax. Fix: run on an \`ubuntu-latest\` / Linux runner, or replace the \`date -d\` calls with a portable alternative (e.g., \`python -c 'from datetime import datetime; ...'\`)."
              exit 1
            fi
          }

          # ----- MIN_AGE_DAYS validation ----------------------------------------------

          # Accept only POSITIVE integers (numeric value >= 1). Leading zeros are
          # allowed because some config generators pad to fixed width (e.g. "07");
          # a `07 ... 10#` base-10 round-trip keeps later arithmetic from tripping
          # on bash's octal parsing of zero-prefixed numbers at `$age_days -lt
          # $MIN_AGE_DAYS`.
          #
          # Rejects: 0, 00, negatives, non-numeric, empty.
          # Accepts: 1, 07, 100, 0007.
          preflight::validate_min_age_days() {
            local raw="${MIN_AGE_DAYS:-}"
            # Require at least one digit, reject non-digits. The `10#` base-10
            # prefix on the arithmetic below sidesteps bash's octal interpretation
            # of leading zeros (`$((07))` is 7 but `$((08))` is a syntax error).
            if ! [[ "$raw" =~ ^[0-9]+$ ]]; then
              echo "::error::MIN_AGE_DAYS must be a positive integer (got: ${raw:-<unset>})"
              exit 1
            fi
            if [ "$((10#$raw))" -lt 1 ]; then
              echo "::error::MIN_AGE_DAYS must be >= 1 (got: ${raw}). Zero would make the quarantine a silent-pass no-op."
              exit 1
            fi
            # Normalize to the base-10 numeric form so all subsequent callers do
            # integer comparisons without re-parsing leading zeros. Exported
            # because the variable was passed via env and most scripts reference
            # it directly rather than through a local.
            MIN_AGE_DAYS=$((10#$raw))
            export MIN_AGE_DAYS
          }

          # ----- Base-ref verification -------------------------------------------------

          # Verify the base ref exists in the local checkout before running
          # `git diff` against it. Without this, `git diff ... 2>/dev/null` on
          # a missing ref produces empty output, and a trailing `|| true` on
          # the downstream filter pipeline silently swallows the failure — the
          # script exits 0 with "No changes detected" even though the diff
          # never ran. Friendly error here, explicit failure exit.
          #
          # MUST BE CALLED before any subsequent `git diff`. Callers that extract
          # a diff via `$(git diff ...)` inside a helper function are protected
          # by this preflight *only* for the expected "missing base ref" failure
          # mode; for catastrophic git failures mid-script the helper still needs
          # its own `|| { echo ::error; return 1; }` branch.
          preflight::verify_base_ref() {
            local base_ref="$1"
            if [ -z "$base_ref" ]; then
              echo "::error::preflight::verify_base_ref called with empty argument"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "$base_ref" >/dev/null; then
              echo "::error::Base ref ${base_ref} not found in this checkout. If you triggered this workflow via workflow_dispatch, ensure the base branch is fetched (fetch-depth: 0 on actions/checkout)."
              exit 1
            fi
            # Record successful verification so `preflight::require_base_ref_verified`
            # can assert it elsewhere if callers want a belt-and-suspenders check.
            _PREFLIGHT_BASE_REF_VERIFIED=1
          }

          # Optional defensive check: assert verify_base_ref has run. Callers can
          # invoke this right before a `git diff` as a static sanity check that
          # the required-call-order convention was actually followed.
          preflight::require_base_ref_verified() {
            if [ -z "${_PREFLIGHT_BASE_REF_VERIFIED:-}" ]; then
              echo "::error::preflight::verify_base_ref must be called before any git diff. This is a coding error, not a runtime condition."
              exit 1
            fi
          }

          # ----- ISO-8601 → epoch helper ----------------------------------------------

          # Every ecosystem converts a registry-returned ISO-8601 timestamp into
          # epoch seconds via `date -d "$ts" +%s`, and every one had its own
          # error-handling branch. Shared helper echoes epoch on stdout, exits 1
          # on parse failure with the offending timestamp in the stderr message.
          # Caller can use `if ! epoch=$(preflight::iso8601_to_epoch "$ts"); then
          # ...skip or fail... fi`.
          preflight::iso8601_to_epoch() {
            local ts="$1"
            local epoch
            if [ -z "$ts" ]; then
              return 1
            fi
            if ! epoch=$(date -d "$ts" +%s 2>/dev/null); then
              return 1
            fi
            echo "$epoch"
          }

          # Given a publish epoch + now epoch + MIN_AGE_DAYS, emit the age in
          # days on stdout and return a classification via exit code:
          #   0 - passes; age >= MIN_AGE_DAYS + 2 (clearly past threshold)
          #   2 - passes but borderline; MIN_AGE_DAYS <= age <= MIN_AGE_DAYS + 1
          #       (the "just past threshold" :eyes: case — advance warning that
          #       a small threshold bump or an unpublish would flip this PR)
          #   1 - fails; age < MIN_AGE_DAYS (too new)
          #
          # !!! CALLER CONVENTION !!!
          # Callers MUST use a 3-way `case` on the exit code, NOT a 2-way
          # `if/then/else`. A naïve `if preflight::classify_age …; then ok; else fail; fi`
          # would silently misclassify BOTH `1` (too_new) AND `2` (borderline)
          # as failures — losing the advance-warning signal and (worse) treating
          # a borderline pass as a block.
          #
          # Correct pattern:
          #   rc=0
          #   age_days=$(preflight::classify_age "$pub" "$now" "$MIN_AGE_DAYS") || rc=$?
          #   case "$rc" in
          #     0) ok ;;
          #     2) borderline ;;
          #     *) too_new ;;  # catches 1 and any future non-pass codes
          #   esac
          #
          preflight::classify_age() {
            local publish_epoch="$1" now_epoch="$2" min_age_days="$3"
            local age_days=$(( (now_epoch - publish_epoch) / 86400 ))
            echo "$age_days"
            if [ "$age_days" -lt "$min_age_days" ]; then
              return 1
            fi
            if [ "$age_days" -le "$((min_age_days + 1))" ]; then
              return 2
            fi
            return 0
          }

          # Given a publish epoch + MIN_AGE_DAYS, echo the ISO date (UTC) when
          # the package becomes eligible. Used in the "too new" error message
          # so developers know when to retry without needing the bypass label.
          # Falls back to "unknown" on parse error rather than breaking the
          # error message flow.
          preflight::eligible_date_utc() {
            local publish_epoch="$1" min_age_days="$2"
            date -u -d "@$((publish_epoch + min_age_days * 86400))" +%Y-%m-%d 2>/dev/null || echo "unknown"
          }

          # Append a single failure row to a workflow-level TSV so a downstream
          # job step can render the data into a PR comment without re-doing the
          # classification work. No-op when AGE_CHECK_FAILURES_FILE is unset (the
          # common case — local dev, callers that didn't opt into the comment
          # feature). Format is one row per failed pin:
          #
          #   <display_id>\t<display_version>\t<age_days>\t<min_age_days>\t<eligible_date>\t<days_remaining>\t<kind>
          #
          # `kind` is `too_new` (this helper) or `unverifiable` (sibling helper
          # `preflight::record_unverifiable`). The downstream renderer splits on
          # kind so each failure class gets the right operator guidance:
          # too-new → "wait until the eligible date"; unverifiable → "re-run".
          #
          # Tabs were chosen over JSON because the consumer (a small bash step in
          # the template) parses with `IFS=$'\t' read` — no jq dependency, and
          # `display_id` / `display_version` have already been run through
          # `safe_for_md` so they cannot contain tabs.
          #
          # `days_remaining` is computed as calendar-day delta between today (UTC,
          # midnight) and the eligible-after date. That matches the `eligible_date`
          # column the user reads on the same row — the alternative (`min - age`)
          # off-by-ones on freshly-committed pins because `age_days` floors:
          # a pin committed 22h ago has age_days=0, so `min - age` would suggest
          # "wait 7 days" when in calendar terms only 6 days remain until eligible.
          # Falls back to the floor approximation only if the eligible string is
          # unparseable (defensive — should never happen since the caller fed it
          # through `eligible_date_utc`). Clamped at 0 to defend against clock
          # skew producing a negative.
          preflight::record_failure() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" age_days="$3"
            local min_age_days="$4" eligible="$5"
            local days_remaining today_epoch eligible_epoch
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s 2>/dev/null || true)
            eligible_epoch=$(date -u -d "${eligible}" +%s 2>/dev/null || true)
            if [ -n "${today_epoch}" ] && [ -n "${eligible_epoch}" ]; then
              days_remaining=$(( (eligible_epoch - today_epoch) / 86400 ))
            else
              days_remaining=$(( min_age_days - age_days ))
            fi
            [ "$days_remaining" -lt 0 ] && days_remaining=0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "$age_days" \
              "$min_age_days" "$eligible" "$days_remaining" \
              "too_new" \
              >> "$file"
          }

          # Sibling of `record_failure` for the "couldn't fetch metadata" failure
          # class — a pin shape-checks fine, but the registry / API / proxy returned
          # an error or empty body so the script can't compute an age. Without
          # this, transient upstream failures produce a red required check with
          # no PR-level explanation: the comment-on-failure step gates on `[ -s
          # FAILURES_FILE ]`, and the only writer was `record_failure` (too-new
          # only). The reviewer then has to dig into the run log to discover that
          # the failure was a 5xx and a re-run will pass.
          #
          # Writes the same TSV schema as `record_failure` so the renderer reads
          # one format. The age / eligible / remaining columns carry sentinels
          # (`?` / "n/a" / `?`) — the renderer hides those columns for the
          # unverifiable section since "wait N days" copy doesn't apply. The
          # `reason` arg is what gets shown to the operator in lieu of the
          # eligible-after date.
          #
          # Args:
          #   $1 display_id        already sanitized via safe_for_md
          #   $2 display_version   already sanitized via safe_for_md
          #   $3 reason            short human-readable cause, e.g.
          #                        "gh api unreachable or commit not found"
          #                        — surfaces in the comment so the reviewer
          #                        knows whether to re-run or open an upstream
          #                        issue. Tabs are stripped to keep the row
          #                        parseable.
          preflight::record_unverifiable() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2"
            local reason="${3:-unknown reason}"
            # Strip characters that would corrupt the downstream comment:
            #   - tabs/newlines break `IFS=$'\t' read` (multiline reason would
            #     produce row count != failure count)
            #   - `|` breaks the markdown table layout — the reason cell sits
            #     between two `|` separators in the rendered comment, and an
            #     embedded `|` would split the row into extra columns. All
            #     in-tree call sites pass pipe-free strings today; this strip
            #     defends a future caller forwarding upstream error text (e.g.,
            #     curl stderr that happens to contain `|`).
            reason=$(printf '%s' "$reason" | tr -d '\t\n|')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "?" \
              "n/a" "$reason" "?" \
              "unverifiable" \
              >> "$file"
          }

          # ----- Shared age-check outcome helper --------------------------------------

          # Classify a dependency's age and emit the full CI output for it
          # (markdown row + log annotation). Returns an exit code the caller
          # can map to its counters. For the typical caller pattern that
          # updates both `checked_count` and `failed`, use the thin wrapper
          # `preflight::age_row_and_tally` which does the mapping via bash's
          # dynamic scoping.
          #
          # !!! SECURITY CONTRACT !!!
          # `display_id` and `display_version` are interpolated directly into:
          #   - the markdown row (caller-inspectable via $GITHUB_STEP_SUMMARY)
          #   - log lines (visible in the Actions job log)
          # This helper does NOT re-sanitize them. Callers MUST pre-sanitize via
          # `preflight::safe_for_md` (or a tighter ecosystem-specific validator
          # like `is_valid_pkg_name`) before passing in, otherwise a crafted
          # lockfile / registry response could inject active markdown into the
          # step summary.
          #
          # Arguments:
          #   $1 display_id        e.g. "lodash" or "actions/checkout" (sanitized)
          #   $2 display_version   e.g. "4.17.21" or "1a2b3c4d" (sanitized)
          #   $3 publish_time      ISO-8601 string from the registry
          #   $4 now_epoch         caller's pre-computed `date +%s`
          #   $5 min_age_days      positive integer (caller already validated)
          #   $6 verb              past-tense verb for too-new error messages
          #                        ("published" | "committed" | "tagged" |
          #                        "built" | "uploaded"). Defaults to "published".
          #   $7 file_hint         optional source filename for `file=` annotation
          #   $8 separator         how to join id + version in log lines. Default
          #                        "@"; pip uses "==".
          #
          # Exit codes (richer than ok/fail so callers can distinguish borderline
          # from too_new, and parse_error from a real too-new result):
          #   0 — ok (clearly past threshold)
          #   1 — too_new
          #   2 — borderline (just past threshold; counts as pass, with :eyes: row)
          #   3 — parse_error (malformed ISO-8601 or missing required arg)
          preflight::age_row_for_publish() {
            local display_id="$1" display_version="$2" publish_time="$3"
            local now_epoch="$4" min_age_days="$5"
            local verb="${6:-published}"
            local file_hint="${7:-}"
            local sep="${8:-@}"

            # Required-arg validation. Name the specific missing arg in the
            # error so a future caller doesn't have to bisect. `verb`, `file_hint`,
            # `sep` have defaults; the five below do not. Empty values would
            # surface later as arithmetic errors or spurious row text.
            local arg
            for arg in display_id display_version publish_time now_epoch min_age_days; do
              if [ -z "${!arg}" ]; then
                echo "::error::preflight::age_row_for_publish: required arg \`${arg}\` was empty"
                return 3
              fi
            done

            # Full identifier for log lines; row cells stay separate.
            local full_id="${display_id}${sep}${display_version}"

            # GitHub Actions annotation format requires `::` between command
            # (+ optional params) and message. `::error::msg` is valid;
            # `::error msg` is NOT and will render as plain log text. So:
            #   no file_hint → `::` (bare delimiter)
            #   with hint    → ` file=<path>::` (leading space separates
            #                  `::error` from params, trailing `::` closes them)
            local file_prefix="::"
            [ -n "$file_hint" ] && file_prefix=" file=${file_hint}::"

            local publish_epoch
            if ! publish_epoch=$(preflight::iso8601_to_epoch "$publish_time"); then
              echo "::error${file_prefix}Could not parse publish timestamp for ${full_id}: ${publish_time}"
              echo "| \`${display_id}\` | ${display_version} | — | :x: parse error |" >> "$GITHUB_STEP_SUMMARY"
              return 3
            fi

            local age_days class_rc=0
            age_days=$(preflight::classify_age "$publish_epoch" "$now_epoch" "$min_age_days") || class_rc=$?

            case "$class_rc" in
              0)
                echo "  OK: ${full_id} (${age_days} days old)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
                return 0
                ;;
              2)
                echo "::notice${file_prefix}${full_id} is ${age_days} day(s) old — just past the ${min_age_days}-day threshold"
                echo "  OK: ${full_id} (${age_days} days old, barely past threshold)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :eyes: just past threshold |" >> "$GITHUB_STEP_SUMMARY"
                return 2
                ;;
              *)
                local eligible; eligible=$(preflight::eligible_date_utc "$publish_epoch" "$min_age_days")
                echo "::error${file_prefix}${full_id} ${verb} ${age_days} day(s) ago (minimum: ${min_age_days}; eligible after ${eligible})"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :x: **too new** (eligible after ${eligible}) |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_failure "$display_id" "$display_version" "$age_days" "$min_age_days" "$eligible"
                return 1
                ;;
            esac
          }

          # Wraps `preflight::age_row_for_publish` and updates the caller's
          # `checked_count` and `failed` via bash's dynamic scoping. This is the
          # call most ecosystem scripts should use — one line, no case statement
          # at the callsite.
          #
          # Convention: caller MUST have locals named exactly `checked_count`
          # (integer) and `failed` ("true"/"false"). These are looked up through
          # the dynamic scope chain at runtime — no nameref magic, works on
          # bash >= 4.0 (and on macOS bash 3.2 for local-dev tests).
          #
          # Outcome mapping:
          #   ok (rc 0)            → checked_count++
          #   borderline (rc 2)    → checked_count++
          #   too_new (rc 1)       → checked_count++, failed=true
          #   parse_error (rc 3)   → failed=true (checked not incremented)
          #
          # All args are passed through to age_row_for_publish unchanged.
          preflight::age_row_and_tally() {
            local rc=0
            preflight::age_row_for_publish "$@" || rc=$?
            # Deliberate dynamic-scope writes: caller provides `checked_count`
            # and `failed` as locals; we update them in place.
            # shellcheck disable=SC2034
            case "$rc" in
              0|2) checked_count=$((checked_count + 1)) ;;
              1)   checked_count=$((checked_count + 1)); failed=true ;;
              3)   failed=true ;;
            esac
          }

          # ----- Output sanitization --------------------------------------------------

          # Sanitize arbitrary strings before writing to $GITHUB_STEP_SUMMARY.
          # Used for values that either pre-date a validator (the invalid-name
          # branch in each ecosystem) or come from untrusted lockfile / registry
          # output (version strings, image tags). Strips to a character class
          # that can't form active markdown (link/image/emphasis/HTML) and caps
          # length at 80 so a crafted over-long entry can't blow out the summary.
          #
          # Kept permissive enough that legitimate semver (`1.2.3+build.7`) and
          # scoped package names (`@scope/name`) survive round-trip unchanged.
          #
          # `LC_ALL=C` forces byte-level (ASCII-only) behavior so the tr + head
          # combo is deterministic across hosts. In a UTF-8 locale, `[:alnum:]`
          # would keep accented Latin letters and CJK chars, and `head -c 80`
          # could split a multibyte char at the boundary. Neither is a security
          # hole (markdown injection is still blocked), but byte-level behavior
          # is easier to audit and test. Unicode homoglyph attacks on package
          # names are a separate concern — handled (if at all) by the caller's
          # `is_valid_*` ASCII-only allowlists, not here.
          preflight::safe_for_md() {
            LC_ALL=C printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:]@/_.:+-' | LC_ALL=C head -c 80
          }

          # ----- Step-summary helpers --------------------------------------------------

          # `GITHUB_STEP_SUMMARY` is provided by GitHub Actions; default to
          # /dev/null for local runs so the helper doesn't error out. The
          # workflow always provides it in CI.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          preflight::step_summary_header() {
            local ecosystem="$1"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "| Package | Version | Age (days) | Status |"
              echo "|---------|---------|------------|--------|"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # For the "no changes" / "no deps" early-exit paths. Writes a single
          # summary blockquote line so the Actions UI reflects the early-exit
          # outcome instead of an empty summary panel.
          preflight::step_summary_no_changes() {
            local ecosystem="$1" reason="$2"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "> ${reason} :white_check_mark:"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          preflight::step_summary_all_passed() {
            local checked_count="$1" min_age_days="$2" skipped_count="${3:-0}"
            {
              echo ""
              echo "> Verified ${checked_count} package(s) at ≥ ${min_age_days} days old. :white_check_mark:"
              if [ "$skipped_count" -gt 0 ]; then
                echo "> ${skipped_count} skipped (see warnings above)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Now accepts optional counts so the footer breakdown matches what
          # callers actually tracked. Positional args are kept backwards-compatible
          # (only min_age_days is required).
          preflight::step_summary_failed() {
            local min_age_days="$1" checked_count="${2:-}" skipped_count="${3:-}"
            {
              echo ""
              echo "> **One or more dependencies failed the ${min_age_days}-day age check.** Add the \`age-check-bypass\` label to override (verified-CVE bypass only — see runbooks/phase-0-checklist.md)."
              if [ -n "$checked_count" ] || [ -n "$skipped_count" ]; then
                echo ">"
                echo "> Breakdown: **${checked_count:-?}** checked, **${skipped_count:-0}** skipped. See the table above for which rows failed (marked :x:)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Guard against "registry outage → every package skipped → workflow
          # passes" — if nothing actually got verified, fail and write a
          # summary explaining why.
          preflight::step_summary_all_skipped() {
            local skipped_count="$1"
            {
              echo ""
              echo "> **No packages could be verified** (all ${skipped_count} were skipped). Treating as failure to avoid silent pass on registry outage."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # ============================================================================
          # age-check-actions.sh - Block newly published GitHub Actions refs
          # ============================================================================
          #
          # Purpose:
          #   Actions analog of dependency-age-check.yml. Greps `uses: <owner>/<repo>@<sha>`
          #   lines in changed workflow and composite-action files, rejects any entry
          #   that's not pinned by a 40-char hex SHA, and confirms each pinned commit
          #   is >= MIN_AGE_DAYS old.
          #
          # Expected env vars:
          #   MIN_AGE_DAYS - default 7
          #   BASE_REF     - default 'main'
          #   GH_TOKEN     - used for the authenticated commit lookup. NOT sufficient on
          #                  its own: an org with a GitHub IP allow list 403s an
          #                  authenticated read from a hosted runner even for a public
          #                  repo, so each pin falls back to an anonymous git fetch of
          #                  the exact SHA. See actions_age::git_committer_date.
          #                  A consequence worth knowing on self-hosted runners: that
          #                  fallback deliberately runs with the ambient git config
          #                  excluded, so `http.proxy` / `http.sslCAInfo` kept in
          #                  /etc/gitconfig or ~/.gitconfig do NOT apply to it. On a
          #                  runner that reaches the server only via such a proxy the
          #                  fallback cannot connect, and the pin fails closed with a
          #                  reason naming the host as unreachable. Note this applies to
          #                  git-config proxies only: `https_proxy` / `HTTPS_PROXY` /
          #                  `ALL_PROXY` are environment variables, are NOT scrubbed,
          #                  and git still honours them — so most proxied runners are
          #                  unaffected.
          #   ACTIONS_AGE_TRUSTED_OWNER - caller repository owner; self-reference pins
          #                  may skip age only inside this owner and after provenance
          #   AGE_CHECK_SKIP_SELF_REFS - trusted reusable repositories whose exact pins
          #                  receive the provenance-gated self-reference treatment
          #
          # Exit codes:
          #   0 - all newly-added uses: refs are SHA-pinned and >= MIN_AGE_DAYS old
          #   1 - symbolic ref, unverifiable age, or commit too young
          #
          # ============================================================================

          set -euo pipefail
          IFS=$'\n\t'

          MIN_AGE_DAYS="${MIN_AGE_DAYS:-7}"
          BASE_REF="${BASE_REF:-main}"
          ACTIONS_AGE_TRUSTED_OWNER="${ACTIONS_AGE_TRUSTED_OWNER:-}"


          # ----- Input validation: owner/repo slug ------------------------------------

          # Validates that the part before `@` in a `uses:` ref is a plausible
          # `owner/repo[/subpath]` slug. Defense against a crafted workflow file
          # smuggling shell metacharacters or URL fragments into the gh api call.
          # GitHub's username/repo naming: [A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?
          # and repos/paths allow `.`, `_`, `-`. Kept permissive enough to match
          # real-world composite action paths (e.g. `actions/cache/save`,
          # `rhysd/actionlint/tree/main`).
          actions_age::is_valid_repo_slug() {
            local slug="$1"
            # Length cap: owner max 39 + "/" + repo max 100 + subpath reasonable
            # upper bound. 255 accommodates deep monorepo paths.
            [ ${#slug} -le 255 ] || return 1
            [[ "$slug" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || return 1

            # The character-class check above is intentionally permissive for real action
            # subpaths (including dotfiles), but path structure is security-sensitive:
            # owner/repo is parsed before the trusted self-reference decision. Reject
            # empty, `.` and `..` segments so a crafted path cannot inherit trust from its
            # first two segments while resolving somewhere else. A trailing slash is an
            # empty final segment and is rejected explicitly for a clearer invariant.
            [[ "$slug" != */ ]] || return 1
            [[ "$slug" != *//* ]] || return 1
            [[ "$slug" != */./* && "$slug" != */. ]] || return 1
            [[ "$slug" != */../* && "$slug" != */.. ]] || return 1
          }

          # ----- Separable: find changed action/workflow files ------------------------

          # Split `git diff` from the awk filter so a diff failure (missing
          # base ref, invalid workflow_dispatch ref, etc.) doesn't silently
          # pass as "no changes detected." Caller is expected to have already
          # invoked `preflight::verify_base_ref`.
          actions_age::changed_files() {
            local base_ref="$1"
            local diff_out
            diff_out=$(git diff --name-only "${base_ref}"...HEAD) \
              || { echo "::error::git diff --name-only against ${base_ref} failed"; return 1; }
            printf '%s\n' "$diff_out" \
              | awk '
                /^\.github\/workflows\/.+\.ya?ml$/ { print; next }
                /^\.github\/actions\/.+\/action\.ya?ml$/ { print; next }' \
              | sort -u || true
          }

          # Extract added `uses: OWNER/REPO[/subpath]@REF` lines. Emits one ref per line.
          # `|| true` on the awk/grep/sed pipeline is safe: it only catches the
          # expected "no matching lines" case. A genuine git diff failure would
          # have been caught by the preflight base_ref verification.
          actions_age::added_uses() {
            local file="$1" base_ref="$2"
            local diff_out
            diff_out=$(git diff "${base_ref}"...HEAD -- "$file") \
              || { echo "::error::git diff against ${base_ref} for ${file} failed"; return 1; }
            printf '%s\n' "$diff_out" \
              | awk '/^\+[^+]/' \
              | sed 's/^\+//' \
              | grep -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*' \
              | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//;s/^[\"\x27]//;s/[\"\x27].*$//' \
              | awk 'NF > 0 && $0 !~ /^\./ && $0 !~ /^docker:/' \
              | sort -u || true
          }

          # ----- Separable: GitHub commit timestamp -----------------------------------

          # Path to the file carrying the reason the last committer-date lookup failed.
          # A FILE, not just a variable, because `committer_date` and its two tiers are
          # invoked as `ts=$(...)` — a command substitution runs in a SUBSHELL, so a
          # plain assignment would be discarded at exactly the moment the caller needs
          # it. main() creates one up front; `committer_date` allocates its own when the
          # path is empty (see the wrapper below), so there is NO variable-only mode to
          # get wrong — every path that can set a reason has a file behind it. A stub
          # that replaces `committer_date` wholesale (as the tests do) writes no reason
          # at all, and the caller falls back to a generic one.
          # NOT seeded from the environment. main() is the only writer, and that is
          # load-bearing rather than incidental: a pre-seeded path would let a caller
          # choose where reasons are written, and the sibling cache below is worse.
          ACTIONS_AGE_REASON_FILE=""
          ACTIONS_AGE_LOOKUP_REASON=""

          # Per-run memo for committer-date lookups, keyed `owner@repo@sha`. A FILE tree
          # for the same reason the reason is a file: lookups run inside `ts=$(...)`, so
          # an associative array would not survive back to main().
          #
          # `added_uses` dedupes per FILE, so one pin repeated across N changed workflow
          # files costs N lookups — and the anonymous tier turns each of those into a
          # network fetch. A Dependabot bump touching one action across several
          # workflows is exactly that shape. `@` is the separator because owner and repo
          # are validated to `[A-Za-z0-9._-]`, which cannot contain it, so distinct pins
          # cannot collide on a key.
          #
          # Failures are memoized too, and that is the more valuable half: `timeout 30`
          # is PER INVOCATION, and one pin can spend it on `gh api`, the filtered fetch,
          # the unfiltered retry, `cat-file` and `log`. Against a black-holing host the
          # per-pin ceiling is minutes, not 30s, so an unreachable pin repeated across N
          # files is the worst tail this check has. Scope is one job, so nothing is
          # cached across runs.
          # NOT seeded from the environment, and this one is security-relevant: a
          # pre-seeded directory holding `owner@repo@sha` files with `ok\n<ancient
          # timestamp>` would let a pin skip BOTH tiers entirely, because the memo
          # replay returns before either runs. main() overwrites it with a fresh
          # `mktemp -d` before any lookup; keeping the env fallback would have made
          # that overwrite the only thing standing between a hostile environment and a
          # forged age.
          ACTIONS_AGE_CACHE_DIR=""

          # Reasons come from a FIXED vocabulary defined in this file — never from
          # upstream text — because they are interpolated into markdown and workflow-
          # command channels that `preflight::record_unverifiable` only partially
          # escapes. The verbatim upstream error goes to the job log instead, via
          # `actions_age::log_detail`.
          actions_age::set_reason() {
            ACTIONS_AGE_LOOKUP_REASON="$1"
            [ -n "$ACTIONS_AGE_REASON_FILE" ] && printf '%s' "$1" > "$ACTIONS_AGE_REASON_FILE"
            return 0
          }

          actions_age::get_reason() {
            if [ -n "$ACTIONS_AGE_REASON_FILE" ] && [ -s "$ACTIONS_AGE_REASON_FILE" ]; then
              cat "$ACTIONS_AGE_REASON_FILE"
              return 0
            fi
            printf '%s' "$ACTIONS_AGE_LOOKUP_REASON"
          }

          actions_age::clear_reason() {
            ACTIONS_AGE_LOOKUP_REASON=""
            [ -n "$ACTIONS_AGE_REASON_FILE" ] && : > "$ACTIONS_AGE_REASON_FILE"
            return 0
          }

          # Echo an upstream error verbatim into the job log. This is the half of the
          # old `2>/dev/null` that was worth keeping: an operator reading a red run
          # needs GitHub's actual words ("IP allow list", "Not Found", a TLS error),
          # not our paraphrase of them. Plain `echo`, not `::error::`, so it annotates
          # nothing; `::` is defanged so crafted upstream text cannot open a workflow
          # command on the log channel.
          #
          # Collapse RUNS of colons rather than substituting pairs. Pair substitution
          # was not idempotent (`:::` yielded `:.::`, which still contains `::`), which
          # left the guarantee resting on the label prefix — and therefore on the
          # runner parsing `::` only at the start of a line, which is not a property
          # worth betting on. `s/::\{1,\}/:/g` cannot leave a `::` behind at any
          # position, so the invariant holds without any assumption about the parser.
          # The prefix stays for legibility; it is no longer load-bearing.
          actions_age::log_detail() {
            local label="$1" text="$2"
            [ -z "$text" ] && return 0
            # Say so when the text was altered. The collapse is not free: it mangles
            # legitimate diagnostics carrying `::` — an IPv6 peer in a curl error
            # (`Failed to connect to 2606:50c0::153`) is exactly the transport failure
            # this change is trying to make legible. Keeping the defang and labelling it
            # beats presenting altered text as verbatim.
            case "$text" in
              *::*) label="${label} (colon runs collapsed)" ;;
            esac
            printf '%s\n' "$text" | sed 's/::\{1,\}/:/g' | sed "s/^/  ${label}: /" >&2
            return 0
          }

          # Tier 1 — authenticated REST. Still first because it is the only tier that
          # can read a pin from a PRIVATE repository the workflow token has access to.
          # Captures stderr instead of discarding it so the caller can classify the
          # failure and log GitHub's own words.
          actions_age::api_committer_date() {
            local owner="$1" repo="$2" sha="$3"
            local err_file out err rc=0
            # Mirror of the tier-2 guard below: without a reason here, clear_reason has
            # already emptied the file, so `api_reason` comes back "" and the composed
            # reason ships as a leading "; " — non-empty, so main()'s generic fallback
            # never fires.
            err_file=$(mktemp) || {
              actions_age::set_reason "API lookup could not allocate a workspace"
              return 1
            }
            # Bounded like tier 2. `gh` has internal timeouts, but leaving one tier
            # unbounded while the other is capped is an asymmetry with no rationale.
            out=$(timeout 30 gh api "/repos/${owner}/${repo}/commits/${sha}" \
              --jq '.commit.committer.date // empty' 2>"$err_file") || rc=$?
            err=$(cat "$err_file")
            rm -f "$err_file"

            if [ "$rc" -ne 0 ]; then
              actions_age::log_detail "gh api" "$err"
              # An org-level GitHub IP allow list answers 403 to an AUTHENTICATED read
              # from a GitHub-hosted runner even when the repository is public. That is
              # the case the tier-2 fallback below exists for, so name it distinctly: it
              # is a network-position problem, not a missing commit, and the operator
              # should not go looking for a deleted SHA.
              case "$err" in
                *"IP allow list"*)          actions_age::set_reason "org IP allow list blocked the authenticated API read" ;;
                # Also served as 403, and at fleet scale a likelier tier-1 failure than
                # an allow list. Without its own arm it read as "unreachable", and the
                # aggregate warning then sent the operator to audit a healthy token.
                *"rate limit"*|*"Rate Limit"*|*"secondary rate"*)
                                            actions_age::set_reason "GitHub API rate limit reached" ;;
                # A 404 also covers "the token cannot see this repository", so do not
                # assert the commit is missing: composed with tier 2's reason it would
                # otherwise read "commit not found via API; repository is not publicly
                # readable", which contradicts itself.
                *"Not Found"*|*"HTTP 404"*) actions_age::set_reason "commit not found or not visible to this token" ;;
                *)                          actions_age::set_reason "gh api unreachable" ;;
              esac
              return 1
            fi

            if [ -z "$out" ]; then
              actions_age::set_reason "gh api returned no committer date"
              return 1
            fi
            printf '%s\n' "$out"
          }

          # ----- Tier 2: anonymous git ------------------------------------------------
          #
          # WHY THIS EXISTS: an organization with a GitHub IP allow list (aquasecurity,
          # which publishes trivy-action, is the case that found this) answers 403 to an
          # authenticated API read from a GitHub-hosted runner even for a public repo.
          # Allow lists gate *authenticated* access; anonymous public git read is
          # unaffected. Same root cause and same remedy as the `git ls-remote` tag
          # resolution in qurl-reverse-tunnel-server's check-action-pin-comments.sh.
          #
          # WHY IT IS NOT WEAKER THAN THE API: git is content-addressed. We ask for one
          # 40-hex object and git verifies that what came back hashes to exactly that
          # SHA, so the commit whose date we read is provably the commit that is pinned.
          # The date is the committer field of that object — the very same bytes the
          # REST API reports as `.commit.committer.date`. Author-controlled in both
          # tiers; the trust model does not change.
          #
          # SCOPE OF THAT GUARANTEE: it establishes that the date belongs to the SHA
          # that was pinned — the claim this check actually rests on. It does NOT
          # establish that the SHA is reachable from a branch or tag of the named repo:
          # GitHub serves fork-network objects through the parent's URL, so a fork-only
          # commit resolves here. Tier 1 behaves the same way (`/repos/O/R/commits/SHA`
          # also resolves across the fork network), so this is neither introduced nor
          # worsened by the fallback. The self-reference seam is the one place ancestry
          # is proven, and it still does that through the API.
          #
          # The anonymity mechanism — which is load-bearing, not tidiness — is stated
          # once, over `anon_git` below. Do not re-argue it at the call sites.

          # THE anonymity boundary. Every git invocation in tier 2 goes through here, so
          # the invariant holds STRUCTURALLY rather than by an argument repeated at each
          # call site. If a credential leaks into the fetch, the allow list rejects it
          # again and the whole tier is useless.
          #
          # A fresh temp repo excludes the local `.git/config` extraheader that
          # `actions/checkout` writes. Everything else is an environment channel, and
          # each was verified to defeat the obvious guard:
          #
          #   GIT_CONFIG_COUNT + GIT_CONFIG_KEY_n/VALUE_n, GIT_CONFIG_PARAMETERS
          #     inject config past GIT_CONFIG_GLOBAL/SYSTEM=/dev/null — either can
          #     carry the very `http.extraheader` actions/checkout uses.
          #   GIT_ASKPASS / SSH_ASKPASS
          #     consulted BEFORE the terminal prompt, so GIT_TERMINAL_PROMPT=0 does
          #     not stop them re-authenticating.
          #   GIT_DIR / GIT_COMMON_DIR
          #     `git -C <path>` does not override either. GIT_DIR wins over discovery;
          #     GIT_COMMON_DIR redirects non-worktree files (config among them) and is
          #     not gated on discovery at all. Both hand back a planted extraheader.
          #   HOME (via ~/.netrc)
          #     not a git-config channel at all: git hands libcurl
          #     CURL_NETRC_OPTIONAL, so ~/.netrc is consulted independently of git
          #     config, and `-c credential.helper=` does not apply since netrc is not
          #     a helper. Verified on git 2.43 — against a server that challenges, a
          #     planted ~/.netrc puts `Authorization: Basic` on the wire; an empty HOME
          #     puts none. A public repo never challenges, so this cannot fire on the
          #     happy path, but a self-hosted runner with a netrc entry would hand
          #     credentials to exactly the host this tier routes around.
          #
          # The GIT_TRACE* write primitives are scrubbed — every documented one that can
          # be reached from a normal runner, which is NOT the same claim as "in full",
          # and the difference is the point. An earlier version of this paragraph did
          # assert completeness and was wrong twice over; enumerating a family by hand is
          # the failure mode #110's `env -i` allowlist exists to end, and until that
          # lands this list is a best effort, not a closed set. GIT_TRACE_REFS is worth
          # naming: it fires on the ref update this tier's own fetch performs.
          #
          # GIT_SSH / GIT_SSH_COMMAND / GIT_PROXY_COMMAND go too. They are unreachable
          # today — the remote is a hard-coded `https://` URL and every `insteadOf`
          # channel is shut — so this is the same uniformity argument as
          # GIT_SSL_VERSION below, not a live hole.
          #
          # The reversal that started this list, reversing an earlier call that
          # weighed only the stderr noise they add. Every one of them takes git's trace
          # value convention, where an absolute path means "append trace output to this
          # file" — so each is a primitive for making git WRITE attacker-chosen files.
          # GIT_TRACE_CURL additionally echoes request headers and GIT_TRACE_PACKFILE
          # writes the raw packfile. SSLKEYLOGFILE is the same shape one layer down:
          # libcurl/OpenSSL writes to an attacker-chosen path, and the content is key
          # material. None is an integrity break — no credential is on the wire by
          # construction — but a write side-effect is not "cosmetic". Listing only the
          # handful one happens to think of makes the rationale read as complete when it
          # is not, which is exactly the denylist failure #110 exists to end.
          #
          # GIT_SSL_VERSION / GIT_SSL_CIPHER_LIST are also scrubbed, and unlike the
          # trust-anchor four they carry NO integrity argument: github.com will not
          # negotiate down to anything trivially breakable, so weakening them can only
          # cause a failure. They are here for uniformity — "no ambient TLS
          # configuration" is one sentence, where "no ambient TLS configuration except
          # the two that only affect negotiation" is a rule nobody will maintain. The
          # cost is that a runner setting them for a local TLS policy sees this tier
          # negotiate differently from the rest of its jobs; it fails closed if that
          # matters.
          #
          # XDG_CONFIG_HOME is belt-and-braces (already shadowed by GIT_CONFIG_GLOBAL),
          # kept so "no ambient config, no ambient credentials" needs no per-variable
          # argument.
          #
          # GIT_EXEC_PATH is the dispatch table for every git subcommand and remote
          # helper, so a planted directory gets code execution on the first call — a
          # strictly larger door than the template one below, and equally config-free.
          #
          # GIT_TEMPLATE_DIR is a config-free route to what `init.templateDir` reaches,
          # so neutralizing the config channels alone would not stop a planted
          # `reference-transaction` hook firing on the fetch's ref update.
          #
          # GIT_SSL_NO_VERIFY *is* scrubbed, though the availability-not-integrity
          # argument still holds HERE: this file fetches a 40-hex SHA, so a MITM can only
          # make the fetch fail, never substitute a different date. It does NOT hold for
          # the sibling tier in lib/age-check-precommit.sh, which fetches `refs/tags/
          # <rev>` — a NAME — and reads the date off whatever object arrives. The two
          # wrappers are kept identical (a test asserts it; #110 will hoist them into
          # one), so the stricter requirement wins.
          #
          # GIT_SSL_CAINFO / GIT_SSL_CAPATH are scrubbed for the SAME reason, and an
          # earlier version of this comment had it backwards: these replace the TRUST
          # ANCHOR SET, not the path to the usual one, so a bundle carrying an attacker
          # CA makes a forged github.com certificate VALIDATE. That is not a failure, it
          # is a silent success against the wrong peer — the identical integrity break
          # GIT_SSL_NO_VERIFY is scrubbed to prevent, reached through a different door.
          # GIT_SSL_CERT / GIT_SSL_KEY go too: they put a CLIENT CERTIFICATE on the wire,
          # which cannot coexist with a wrapper whose contract is "no credential reaches
          # the fetch". All four are read straight from the environment by git's HTTP
          # layer, so neutralizing the config channels does not cover them.
          #
          # SSL_CERT_FILE / SSL_CERT_DIR / CURL_CA_BUNDLE join the scrub list: libcurl
          # reads them from the environment and they replace the same trust anchor set
          # GIT_SSL_CAINFO does, so leaving them out would have made the argument above
          # depend on which TLS backend the image was built against — a build detail,
          # where everything else here is structural. Cost is nil on a runner whose curl
          # has the system store compiled in, which is every supported one.
          #
          # http_proxy / https_proxy / ALL_PROXY are DELIBERATELY NOT scrubbed, and this
          # is the one place availability is allowed to win. They are read by libcurl,
          # so nothing above covers them, and a proxy URL can carry credentials that
          # libcurl puts on the wire as `Proxy-Authorization` — which does sit awkwardly
          # against "no credential reaches the fetch". But scrubbing them would remove
          # the only route by which a proxied self-hosted runner can reach github.com AT
          # ALL, turning a working configuration into a permanently red check: the exact
          # failure class this tier exists to remove, re-created in the name of tidiness.
          # The residual is bounded — TLS verification is intact (see the four variables
          # above), so a proxy cannot forge github.com; a proxy credential reaches the
          # proxy its own operator configured, not an attacker-chosen host.
          #
          # KNOWN CONSEQUENCE of scrubbing the trust anchors, stated so nobody has to
          # discover it from a bare fetch failure: those five variables are also how a
          # TLS-INTERCEPTING corporate proxy supplies its own CA when it is not in the
          # system store — so the very runner shape the proxy carve-out above protects
          # is the one most likely to break on this scrub. It fails closed rather than
          # wrong, which is the correct direction, but the fix is to install that CA in
          # the system trust store rather than pass it through the environment.
          #
          # ACCEPTED OUT OF SCOPE, so this enumeration is not mistaken for exhaustive:
          # `git` and `timeout` are still resolved through the ambient PATH, and
          # LD_PRELOAD is untouched. Either is a strictly larger code-execution door than
          # GIT_EXEC_PATH, reached with less setup. Closing them means absolute binary
          # paths and a scrubbed PATH, which is a different change with its own failure
          # modes; scrubbing GIT_EXEC_PATH closes one member of that class, not the
          # class. A hostile co-tenant STEP in the consumer's job is outside the model
          # this wrapper defends — it defends against ambient config and credentials
          # that a normal job (notably actions/checkout) leaves lying around.
          #
          # `-c http.extraheader=` is git's documented reset for that multi-valued key.
          # Redundant once every channel above is shut — there is nowhere left for the
          # key to come from — but it names the actions/checkout vector explicitly
          # instead of leaving it to inference, and keeps this wrapper identical to
          # `precommit_age::anon_git`, which a test now asserts.
          #
          # The reads matter as much as the fetch: `--filter=blob:none` makes the temp
          # repo a promisor, so an object read that missed locally would hit the network
          # — unbounded and unscrubbed without this. `timeout` bounds each call.
          #
          # ACTIONS_AGE_ANON_HOME below is NOT seeded from the environment,
          # deliberately. Every call site sets it as a `local` pointing at a fresh empty
          # directory it just allocated, and dynamic scoping means that local wins. Read
          # from the ambient environment, though, the value would be attacker-choosable,
          # and pointing HOME at a directory holding a `.netrc` reopens the one channel
          # `-c credential.helper=` demonstrably does not cover. Clearing it at module
          # scope makes the caller's local the ONLY way it can be set, so the guarantee
          # does not depend on every future call site remembering to shadow it.
          ACTIONS_AGE_ANON_HOME=""

          actions_age::anon_git() {
            env -u GIT_ASKPASS -u SSH_ASKPASS -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT \
              -u GIT_DIR -u GIT_COMMON_DIR -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY \
              -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_INDEX_FILE -u GIT_NAMESPACE \
              -u GIT_TEMPLATE_DIR -u GIT_SSL_NO_VERIFY -u GIT_EXEC_PATH \
              -u GIT_SSL_CAINFO -u GIT_SSL_CAPATH -u GIT_SSL_CERT -u GIT_SSL_KEY \
              -u GIT_SSL_VERSION -u GIT_SSL_CIPHER_LIST \
              -u SSL_CERT_FILE -u SSL_CERT_DIR -u CURL_CA_BUNDLE \
              -u GIT_TRACE -u GIT_TRACE2 -u GIT_TRACE2_EVENT -u GIT_TRACE2_PERF \
              -u GIT_TRACE_CURL -u GIT_TRACE_PACKET -u GIT_TRACE_PACKFILE \
              -u GIT_TRACE_SETUP -u GIT_TRACE_PERFORMANCE -u GIT_TRACE_SHALLOW \
              -u GIT_TRACE_PACK_ACCESS -u GIT_TRACE_REFS -u GIT_TRACE_FSMONITOR \
              -u SSLKEYLOGFILE -u GIT_SSH -u GIT_SSH_COMMAND -u GIT_PROXY_COMMAND \
              HOME="${ACTIONS_AGE_ANON_HOME:-/nonexistent}" \
              XDG_CONFIG_HOME="${ACTIONS_AGE_ANON_HOME:-/nonexistent}" \
              GIT_TERMINAL_PROMPT=0 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_SYSTEM=/dev/null \
              timeout 30 git -c credential.helper= -c http.extraheader= "$@"
          }

          actions_age::git_committer_date() {
            local owner="$1" repo="$2" sha="$3"
            local work err_file err rc=0 ts
            # NOTE: these two branches are argued-correct rather than test-covered —
            # provoking a `mktemp` failure in the suite is not worth the machinery.
            # Set a reason on BOTH allocation failures. Falling through without one
            # leaves tier 1's text in the file, and the composed reason then reads
            # "gh api unreachable; gh api unreachable" — pointing the operator at the
            # API when the actual failure was local.
            work=$(mktemp -d) || {
              actions_age::set_reason "anonymous git fallback could not allocate a workspace"
              return 1
            }
            err_file=$(mktemp) || {
              rm -rf "$work"
              actions_age::set_reason "anonymous git fallback could not allocate a workspace"
              return 1
            }
            # An empty directory to stand in for $HOME, so no ambient ~/.netrc,
            # ~/.gitconfig or XDG config is reachable from any call in this tier.
            local anon_home
            anon_home=$(mktemp -d) || {
              rm -rf "$work" "$err_file"
              actions_age::set_reason "anonymous git fallback could not allocate a workspace"
              return 1
            }
            local ACTIONS_AGE_ANON_HOME="$anon_home"
            # Structural cleanup: this function runs inside `ts=$(...)`, and a
            # command-substitution subshell resets traps, so main()'s EXIT trap does not
            # cover these. RETURN fires on every `return` below, and is NOT inherited by
            # the nested anon_git/set_reason calls, so it runs exactly once. It is the
            # only cleanup path below this line; the allocation branches above clean up
            # explicitly because they precede it.
            #
            # It does NOT cover an errexit abort: under `set -e` the subshell exits
            # rather than returning, and these temps would leak. Accepted — they are
            # runner-scoped, and every command below is either guarded or a `return`.
            trap 'rm -rf "$work" "$anon_home"; rm -f "$err_file"' RETURN

            if ! actions_age::anon_git init -q "$work" >/dev/null 2>&1; then
              actions_age::set_reason "anonymous git fallback could not init a workspace"
              return 1
            fi

            # `--filter=blob:none` skips file contents; a server without partial-clone
            # support ignores it with a warning rather than failing. `--depth=1` keeps
            # it to the single pinned commit. `timeout` bounds a hung TLS session so one
            # unreachable host cannot burn the whole job's budget: a measured
            # single-commit fetch is ~0.6s even for a large action repo, so 30s leaves
            # ~50x headroom. The bound matters because a missing or expired GH_TOKEN
            # sends EVERY added pin down this path.
            # Hardcoding github.com here would let the two tiers target DIFFERENT
            # servers on GHES, where a name collision between an enterprise org/repo and
            # a public one would date the wrong repository's object. GITHUB_SERVER_URL
            # is the best available signal for the host the run belongs to.
            #
            # It is NOT a guarantee that the tiers agree: `gh` resolves its host from
            # GH_HOST, else the current repo's git remote, else github.com — it never
            # reads GITHUB_SERVER_URL. In a checked-out GHES job the two agree via the
            # remote; a job with no checkout, or one setting GH_HOST explicitly, can
            # still diverge. Closer than a hardcoded host, not a pinned invariant.
            local server="${GITHUB_SERVER_URL:-https://github.com}"
            server="${server%/}"

            # `--filter=blob:none` is worth ~2x wall time and ~19x transferred bytes on
            # a large action repo (measured: codeql-action 1.17s/2188KB -> 0.62s/116KB),
            # but older git refuses `--filter` unless the remote is configured with
            # `extensions.partialClone`. Retry once without it rather than let the whole
            # fallback become a no-op on an older self-hosted image.
            actions_age::anon_git -C "$work" \
              fetch --quiet --depth=1 --no-tags --filter=blob:none \
              "${server}/${owner}/${repo}.git" "$sha" >/dev/null 2>"$err_file" || rc=$?
            # Match git's actual filter-rejection wording, not a bare `filter`: on a
            # transport error git embeds the URL, and `dorny/paths-filter` is one of the
            # most widely-pinned actions in the fleet. A substring match would log a
            # misleading "lacks partial clone" and burn a second doomed fetch, up to the
            # 30s bound, on every unreachable pin from that repo.
            local fetch_err; fetch_err=$(cat "$err_file")
            local filter_rejected=false
            case "$fetch_err" in
              *"--filter"*|*"filtering not recognized"*|*"extensions.partialClone"*|*"partialclone"*)
                filter_rejected=true ;;
              # The case the retry was actually written for. git's parse-options strips
              # the leading `--` before formatting, so a client too old to know the
              # option emits `error: unknown option \`filter=blob:none'` — which matches
              # none of the patterns above. Verified on git 2.43.
              *"unknown option"*"filter"*)
                filter_rejected=true ;;
            esac
            if [ "$rc" -ne 0 ] && [ "$filter_rejected" = true ]; then
              actions_age::log_detail "anonymous git" "$fetch_err"
              echo "  retrying the anonymous fetch without --filter (server or client lacks partial clone)" >&2
              rc=0
              actions_age::anon_git -C "$work" \
                fetch --quiet --depth=1 --no-tags \
                "${server}/${owner}/${repo}.git" "$sha" >/dev/null 2>"$err_file" || rc=$?
            fi

            err=$(cat "$err_file")

            if [ "$rc" -ne 0 ]; then
              actions_age::log_detail "anonymous git" "$err"
              # `timeout` kills with 124 and produces NO stderr, so without this the
              # case below falls to the generic bucket — losing the one failure mode
              # where "re-run it" is the right advice.
              if [ "$rc" -eq 124 ]; then
                actions_age::set_reason "anonymous git fetch exceeded its 30s bound"
                return 1
              fi
              case "$err" in
                # `upload-pack: not our ref` is git's answer for a SHA the remote does
                # not have: a deleted or rewritten commit, or one that only exists on a
                # fork. Distinct from "we could not reach the repository at all".
                # `not our ref` is the protocol-v2 wording; `unadvertised object` is the
                # v0 equivalent, reachable with an older client or an overridden
                # GIT_PROTOCOL. Both mean the same thing to an operator.
                *"not our ref"*|*"not a valid object name"*|*"unadvertised object"*)
                  actions_age::set_reason "commit not found in the public repository" ;;
                *"could not read Username"*|*"Authentication failed"*|*"Repository not found"*)
                  actions_age::set_reason "repository is not publicly readable and the API read failed" ;;
                # This tier deliberately runs with the ambient git config excluded, so a
                # runner that reaches github.com only through an `http.proxy` or a
                # custom `http.sslCAInfo` in /etc/gitconfig cannot connect here. Name it
                # rather than let it fall into the generic bucket, which would tell the
                # operator nothing about the cause.
                *"Could not resolve host"*|*"Failed to connect"*|*"unable to access"*|*"SSL certificate problem"*|*"Connection timed out"*)
                  actions_age::set_reason "anonymous git could not reach the host (this tier excludes ambient git transport config such as http.proxy)" ;;
                *)
                  actions_age::set_reason "anonymous git fallback failed" ;;
              esac
              return 1
            fi

            # Read by the PINNED SHA, not FETCH_HEAD: it states the content-addressed
            # invariant at the point the security argument relies on it, rather than
            # trusting that FETCH_HEAD in a fresh temp repo can only be the requested
            # object. The type check closes the one place tier 2 could be laxer than
            # tier 1 — `ref_part` is validated as 40-hex, not as a *commit*, and
            # `git log` silently peels a tag object to its commit where the API would
            # 404. Fail closed rather than date a different object.
            local obj_type
            obj_type=$(actions_age::anon_git -C "$work" cat-file -t "$sha" 2>/dev/null) || obj_type=""
            if [ "$obj_type" != "commit" ]; then
              actions_age::set_reason "pinned SHA is not a commit object"
              return 1
            fi
            ts=$(actions_age::anon_git -C "$work" log -1 --format=%cI "$sha" 2>/dev/null) || rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$ts" ]; then
              actions_age::set_reason "anonymous git fetch produced no committer date"
              return 1
            fi
            # `%cI` is strict ISO-8601 and preserves the commit's original UTC offset
            # (`...+06:00`), unlike the API's always-`Z` form. `date -d` inside
            # `preflight::iso8601_to_epoch` normalizes the offset, so the measured age
            # is identical either way.
            printf '%s\n' "$ts"
          }

          # Resolve a pinned SHA's committer date: authenticated first, anonymous
          # second. The fallback runs on ANY tier-1 failure, not only the allow-list
          # 403 — a genuinely missing commit fails both tiers anyway, and routing
          # transient API outages through it makes the gate more AVAILABLE without
          # making it more PERMISSIVE. Both tiers must fail for a pin to go
          # unverifiable, and unverifiable still fails the check exactly as before.
          #
          # Thin wrapper over _impl that guarantees a reason file exists. Without it a
          # caller that never set ACTIONS_AGE_REASON_FILE (a direct unit call, or a
          # future consumer of this lib) would lose every reason to the same subshell
          # boundary the file exists to defeat, and _impl would compose the two empty
          # halves into a meaningless `"; "` — non-empty, so main()'s `[ -n ]` guard
          # would happily report it. The reason is copied back into the variable before
          # the file is dropped, so a direct caller can read it afterwards — but only if
          # it did NOT invoke this in a command substitution, which discards variables
          # at its own boundary no matter what happens inside. A caller that needs both
          # the timestamp and the reason should set ACTIONS_AGE_REASON_FILE and read
          # `actions_age::get_reason`, which is exactly what main() does.
          actions_age::committer_date() {
            # Validate BEFORE allocating anything, and unconditionally — not nested in
            # the memo branch. Two reasons the previous placement was wrong:
            #
            #  - `is_valid_repo_slug "$1/$2"` cannot police `$2`, because the slug
            #    pattern deliberately permits `/` in the second component for monorepo
            #    action paths (`actions/cache/save`). A repo of `cache/save` validated
            #    fine and produced a cache path under a directory that does not exist.
            #    main() is safe (it splits at the first `/` before calling), but this
            #    guard exists for the standalone caller, and for them it did not hold.
            #  - Nested in the memo branch, a caller that set no cache dir got NO
            #    validation at all before owner/repo/sha reached `gh api` and `git
            #    fetch`. The memo key is one consumer of this check, not its purpose.
            #
            # Placed ahead of the reason-file allocation so there is nothing to tear
            # down on this path.
            if [[ ! "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
              || [[ ! "$2" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
              || [[ ! "$3" =~ ^[0-9a-fA-F]{40}$ ]]; then
              actions_age::set_reason "refusing to look up an invalid owner/repo/sha"
              return 1
            fi

            local own_file="" rc=0 out cache_file=""
            if [ -z "$ACTIONS_AGE_REASON_FILE" ]; then
              ACTIONS_AGE_REASON_FILE=$(mktemp) || return 1
              own_file="$ACTIONS_AGE_REASON_FILE"
            fi

            # Memo hit: replay the recorded outcome without touching the network. The
            # first line is the status so a timestamp can never be mistaken for a
            # reason, or the reverse.
            if [ -n "$ACTIONS_AGE_CACHE_DIR" ]; then
              # `ref_part` is validated as [0-9a-fA-F]{40}, so the same commit written
              # in upper and lower hex would otherwise take two keys. Both `gh api` and
              # git accept either, so this only costs a redundant lookup — normalized
              # because the key's whole job is to identify a pin uniquely.
              # `LC_ALL=C` for the same reason preflight::safe_for_md documents: a bare
              # range expression is locale-dependent in principle. Input is 40-hex so
              # nothing can go wrong in practice, but the file holds itself to this bar.
              local key_sha; key_sha=$(printf '%s' "$3" | LC_ALL=C tr 'A-F' 'a-f')
              cache_file="${ACTIONS_AGE_CACHE_DIR}/$1@$2@${key_sha}"
              if [ -f "$cache_file" ]; then
                # Clear the FILE, not just the variable, and do it before the own_file
                # teardown drops the path. The file is the channel that survives the
                # `ts=$(...)` subshell, so leaving a previous pin's failure in it makes
                # its contents stop being a statement about the last lookup — the
                # property every other path here maintains.
                actions_age::clear_reason
                local cached_status cached_payload
                cached_status=$(head -n 1 "$cache_file")
                cached_payload=$(tail -n +2 "$cache_file")
                if [ -n "$own_file" ]; then
                  rm -f "$own_file"
                  ACTIONS_AGE_REASON_FILE=""
                fi
                if [ "$cached_status" = "ok" ]; then
                  printf '%s\n' "$cached_payload"
                  return 0
                fi
                actions_age::set_reason "$cached_payload"
                return 1
              fi
            fi

            out=$(actions_age::committer_date_impl "$@") || rc=$?

            # _impl ran in a command substitution, so read the reason back from the file
            # (the only thing that survived) and leave it in the variable for callers.
            # Clear first: on success the file is empty and `get_reason` would fall
            # through to whatever the variable already held, handing a stale reason to
            # the "future consumer of this lib" this wrapper is written for.
            ACTIONS_AGE_LOOKUP_REASON=""
            ACTIONS_AGE_LOOKUP_REASON=$(actions_age::get_reason)
            if [ -n "$own_file" ]; then
              rm -f "$own_file"
              ACTIONS_AGE_REASON_FILE=""
            fi

            if [ -n "$cache_file" ]; then
              if [ "$rc" -eq 0 ]; then
                printf 'ok\n%s\n' "$out" > "$cache_file"
              else
                printf 'fail\n%s\n' "$ACTIONS_AGE_LOOKUP_REASON" > "$cache_file"
              fi
            fi

            if [ -n "$out" ]; then
              printf '%s\n' "$out"
            fi
            return "$rc"
          }

          actions_age::committer_date_impl() {
            local owner="$1" repo="$2" sha="$3" ts api_reason

            actions_age::clear_reason
            if ts=$(actions_age::api_committer_date "$owner" "$repo" "$sha"); then
              printf '%s\n' "$ts"
              return 0
            fi
            api_reason=$(actions_age::get_reason)

            echo "  API lookup failed (${api_reason}); retrying anonymously over git" >&2
            if ts=$(actions_age::git_committer_date "$owner" "$repo" "$sha"); then
              echo "  ANON-GIT: resolved ${owner}/${repo}@${sha} with no credentials (API said: ${api_reason})" >&2
              # Tallied so main() can say once, loudly, that the authenticated path is
              # not working — see the end-of-run warning.
              if [ -n "$ACTIONS_AGE_CACHE_DIR" ]; then
                printf '%s\n' "${owner}/${repo}@${sha}" >> "${ACTIONS_AGE_CACHE_DIR}/.anon-tally"
              fi
              printf '%s\n' "$ts"
              return 0
            fi

            # Both tiers failed: report them together so the operator can tell an
            # allow-list rejection from a genuinely absent commit without reverse-
            # engineering it from a runner log. Tier 2's reason comes back through
            # get_reason (the FILE) for the same reason tier 1's did — the call above
            # ran in a command-substitution subshell, so the variable it assigned is
            # already gone by the time control reaches this line.
            local git_reason; git_reason=$(actions_age::get_reason)
            actions_age::set_reason "${api_reason}; ${git_reason}"
            return 1
          }

          # The provenance path had the same blindness this change removes from the
          # committer-date lookup: `2>/dev/null` meant an unreachable API surfaced as
          # "self-reference repository, signature, or default-branch provenance
          # mismatch" — a message that accuses the PIN when the problem is the
          # TRANSPORT. That reads worse than the case originally fixed, because an
          # operator is told their signature or ancestry is wrong.
          #
          # No anonymous fallback here, deliberately: provenance needs signature
          # verification and protected-branch ancestry, which have no git equivalent,
          # and it must stay fail-closed. Only the diagnosis improves.
          actions_age::github_tsv() {
            local path="$1" filter="$2"
            local err_file out err rc=0
            # Same guard as api_committer_date: without a reason here, main() falls
            # through to "signature or default-branch provenance mismatch" — the
            # accuses-the-pin-for-a-transport-fault message this change exists to remove.
            err_file=$(mktemp) || {
              actions_age::set_reason "provenance lookup could not allocate a workspace"
              return 1
            }
            out=$(timeout 30 gh api "$path" --jq "$filter" 2>"$err_file") || rc=$?
            err=$(cat "$err_file")
            rm -f "$err_file"

            if [ "$rc" -ne 0 ]; then
              actions_age::log_detail "gh api" "$err"
              case "$err" in
                *"IP allow list"*) actions_age::set_reason "org IP allow list blocked the authenticated API read" ;;
                *"Not Found"*|*"HTTP 404"*) actions_age::set_reason "provenance endpoint not found" ;;
                *) actions_age::set_reason "gh api unreachable" ;;
              esac
              return 1
            fi
            printf '%s' "$out"
          }

          # A reusable workflow cannot quarantine its own fresh release without creating
          # a rollout deadlock. The narrow self-reference seam therefore skips commit age
          # only after proving that the exact pinned SHA is a GitHub-verified commit on
          # the exact same-owner repository's protected default branch. Emit the default
          # branch name on success; any missing/mismatched evidence fails closed.
          actions_age::trusted_self_ref_provenance() {
            local owner="$1" repo="$2" sha="$3"
            if [ -z "$ACTIONS_AGE_TRUSTED_OWNER" ] || [ "$owner" != "$ACTIONS_AGE_TRUSTED_OWNER" ]; then
              echo "Self-reference repository is outside the caller's trusted owner: ${owner}/${repo}" >&2
              return 1
            fi

            local repo_fields full_name repo_owner default_branch
            repo_fields=$(actions_age::github_tsv "/repos/${owner}/${repo}" \
              '[.full_name, .owner.login, .default_branch] | map(. // "") | @tsv') || return 1
            IFS=$'\t' read -r full_name repo_owner default_branch <<< "$repo_fields"
            if [ "$full_name" != "${owner}/${repo}" ] || [ "$repo_owner" != "$owner" ] || [ -z "$default_branch" ]; then
              echo "Self-reference repository identity mismatch: ${owner}/${repo}" >&2
              return 1
            fi

            local branch_fields branch_name branch_protected branch_head
            branch_fields=$(actions_age::github_tsv "/repos/${owner}/${repo}/branches/${default_branch}" \
              '[.name, ((.protected // false) | tostring), .commit.sha] | map(. // "") | @tsv') || return 1
            IFS=$'\t' read -r branch_name branch_protected branch_head <<< "$branch_fields"
            if [ "$branch_name" != "$default_branch" ] || [ "$branch_protected" != "true" ] \
              || [[ ! "$branch_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Self-reference default branch is missing or unprotected: ${owner}/${repo}@${default_branch}" >&2
              return 1
            fi

            local commit_fields commit_sha commit_verified commit_reason
            commit_fields=$(actions_age::github_tsv "/repos/${owner}/${repo}/commits/${sha}" \
              '[.sha, ((.commit.verification.verified // false) | tostring), (.commit.verification.reason // "unknown")] | @tsv') || return 1
            IFS=$'\t' read -r commit_sha commit_verified commit_reason <<< "$commit_fields"
            if [ "$commit_sha" != "$sha" ] || [ "$commit_verified" != "true" ] || [ "$commit_reason" != "valid" ]; then
              echo "Self-reference commit is not GitHub-verified: ${owner}/${repo}@${sha} (reason: ${commit_reason})" >&2
              return 1
            fi

            local compare_fields compare_status base_sha merge_base_sha behind_by
            compare_fields=$(actions_age::github_tsv "/repos/${owner}/${repo}/compare/${sha}...${default_branch}" \
              '[.status, .base_commit.sha, .merge_base_commit.sha, .behind_by] | map(. // "") | @tsv') || return 1
            IFS=$'\t' read -r compare_status base_sha merge_base_sha behind_by <<< "$compare_fields"
            if { [ "$compare_status" != "identical" ] && [ "$compare_status" != "ahead" ]; } \
              || [ "$base_sha" != "$sha" ] || [ "$merge_base_sha" != "$sha" ] || [ "$behind_by" != "0" ]; then
              echo "Self-reference commit is not on ${owner}/${repo}'s default branch ${default_branch}: ${sha}" >&2
              return 1
            fi

            printf '%s\n' "$default_branch"
          }

          # ----- Main -----------------------------------------------------------------

          actions_age::main() {
            # `git` was always a hard dependency (every diff goes through it) but was
            # never declared; `timeout` bounds the anonymous-git fallback, `mktemp`
            # backs the reason file and the fetch workspace, `env` IS the anonymity
            # scrub, and tr/head/tail/wc/cat carry the memo and reason plumbing. All
            # ship in the same GNU coreutils/git baseline the GNU-date probe below
            # already assumes, so declaring them costs nothing and fails legibly if
            # absent — and the list should name everything the new paths lean on,
            # not an arbitrary subset.
            preflight::require_tools gh git env timeout mktemp tr head tail wc cat awk sed grep sort
            preflight::require_gnu_date
            preflight::validate_min_age_days

            # Carries the committer-date failure reason across the command-substitution
            # subshell boundary — see the ACTIONS_AGE_REASON_FILE comment above.
            #
            # This is the only EXIT trap set in THIS file, and `trap ... EXIT`
            # replaces rather than appends. If a future caller or sibling helper ever
            # installs one, this line silently disables it — chain them explicitly
            # instead of adding a second unconditional `trap`.
            ACTIONS_AGE_REASON_FILE=$(mktemp)
            ACTIONS_AGE_CACHE_DIR=$(mktemp -d)
            trap 'rm -f "$ACTIONS_AGE_REASON_FILE"; rm -rf "$ACTIONS_AGE_CACHE_DIR"' EXIT

            local base_ref="origin/${BASE_REF}"
            preflight::verify_base_ref "$base_ref"

            local now_epoch; now_epoch=$(date +%s)
            local failed=false
            local checked_count=0
            local skipped_count=0

            local files; files=$(actions_age::changed_files "$base_ref")
            if [ -z "$files" ]; then
              echo "No action/workflow changes detected"
              preflight::step_summary_no_changes "GitHub Actions" "No action/workflow file changes detected in this diff."
              exit 0
            fi

            preflight::step_summary_header "GitHub Actions"

            for file in $files; do
              echo "::group::Checking ${file}"
              local uses; uses=$(actions_age::added_uses "$file" "$base_ref")
              if [ -z "$uses" ]; then
                echo "No new 'uses:' entries in ${file}"
                echo "::endgroup::"
                continue
              fi

              while IFS= read -r ref; do
                [ -z "$ref" ] && continue
                # Split into "owner/repo[/subpath]" and "ref"
                local repo_part="${ref%@*}" ref_part="${ref##*@}"
                if [ "$repo_part" = "$ref_part" ]; then
                  echo "::error file=${file}::uses: ${ref} is missing a pinned ref (expected @<sha>)"
                  echo "| \`${ref}\` | — | — | :x: missing @ref |" >> "$GITHUB_STEP_SUMMARY"
                  failed=true
                  continue
                fi
                # Strip the optional comment the ref_part may carry after whitespace
                ref_part="${ref_part%% *}"

                if [[ ! "$ref_part" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "::error file=${file}::uses: ${ref} must be pinned by 40-char SHA (got '${ref_part}')"
                  echo "| \`${repo_part}\` | \`${ref_part}\` | — | :x: not a 40-char SHA |" >> "$GITHUB_STEP_SUMMARY"
                  failed=true
                  continue
                fi

                # Security check: validate the slug BEFORE it reaches `gh api`.
                # Blocks URL-fragment / shell-metachar injection via a crafted
                # workflow file smuggling "../" or "?" or backticks into the path.
                if ! actions_age::is_valid_repo_slug "$repo_part"; then
                  local safe_slug; safe_slug=$(preflight::safe_for_md "$repo_part")
                  echo "::error file=${file}::uses: ${safe_slug} — does not match owner/repo[/subpath] shape"
                  echo "| \`${safe_slug}\` | — | — | :x: invalid slug |" >> "$GITHUB_STEP_SUMMARY"
                  failed=true
                  continue
                fi

                local owner="${repo_part%%/*}"
                local rest="${repo_part#*/}"
                local repo="${rest%%/*}"  # handles monorepo subpath like actions/cache/save

                if [ -z "$owner" ] || [ -z "$repo" ] || [ "$owner" = "$repo_part" ]; then
                  local safe_slug; safe_slug=$(preflight::safe_for_md "$repo_part")
                  echo "::error file=${file}::cannot parse owner/repo from '${safe_slug}'"
                  echo "| \`${safe_slug}\` | — | — | :x: parse error |" >> "$GITHUB_STEP_SUMMARY"
                  failed=true
                  continue
                fi

                # Self-reference provenance seam: this reusable cannot quarantine its own
                # fresh release without a rollout deadlock. A configured exact repository
                # may skip age only after the pinned SHA proves same-owner repository
                # identity, a valid GitHub signature, and protected-default-branch ancestry.
                #
                # Override via AGE_CHECK_SKIP_SELF_REFS env var (space-separated
                # `owner/repo` pairs). Set empty to disable the skip.
                # ${VAR-DEFAULT} (no colon) substitutes only when unset, not empty.
                # Explicit empty string disables the skip; unset uses the default.
                local skip_refs="${AGE_CHECK_SKIP_SELF_REFS-layervai/ops-routines}"
                if [ -n "$skip_refs" ] && echo " $skip_refs " | grep -qF " ${owner}/${repo} "; then
                  local safe_owner_repo_skip; safe_owner_repo_skip=$(preflight::safe_for_md "${owner}/${repo}")
                  local safe_sha_short_skip; safe_sha_short_skip=$(preflight::safe_for_md "${ref_part:0:8}")
                  local trusted_default_branch
                  actions_age::clear_reason
                  if ! trusted_default_branch=$(actions_age::trusted_self_ref_provenance "$owner" "$repo" "$ref_part"); then
                    # Distinguish "the evidence contradicted the pin" from "the API was
                    # unreachable". The old text asserted the former for both, which is
                    # an alarming and misleading thing to tell an operator whose only
                    # problem is network position.
                    local prov_reason; prov_reason=$(actions_age::get_reason)
                    if [ -n "$prov_reason" ]; then
                      prov_reason="self-reference provenance could not be read: ${prov_reason}"
                    else
                      prov_reason="self-reference repository, signature, or default-branch provenance mismatch"
                    fi
                    echo "::error file=${file}::Could not verify self-reference provenance for ${owner}/${repo}@${ref_part} (${prov_reason})"
                    echo "| \`${safe_owner_repo_skip}\` | \`${safe_sha_short_skip}\` | — | :x: self-ref provenance unverifiable |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$safe_owner_repo_skip" "$safe_sha_short_skip" \
                      "$prov_reason"
                    failed=true
                    continue
                  fi
                  echo "  SELF-REF: ${owner}/${repo}@${ref_part} commit=verified default=${trusted_default_branch} branch=protected"
                  echo "| \`${safe_owner_repo_skip}\` | \`${safe_sha_short_skip}\` | — | :white_check_mark: self-ref provenance |" >> "$GITHUB_STEP_SUMMARY"
                  skipped_count=$((skipped_count + 1))
                  continue
                fi

                # Sanitized labels for step-summary cells.
                local safe_owner_repo; safe_owner_repo=$(preflight::safe_for_md "${owner}/${repo}")
                local safe_sha_short; safe_sha_short=$(preflight::safe_for_md "${ref_part:0:8}")

                local ts
                if ! ts=$(actions_age::committer_date "$owner" "$repo" "$ref_part"); then
                  # Both the authenticated and the anonymous tier failed. The reason is
                  # composed from this file's fixed vocabulary, so it is safe to
                  # interpolate and it names WHICH wall was hit — an org IP allow list
                  # reads very differently from a deleted commit, and the next person
                  # should not have to reverse-engineer that from a runner log.
                  local reason; reason=$(actions_age::get_reason)
                  [ -n "$reason" ] || reason="gh api unreachable or commit not found"
                  echo "::error file=${file}::Could not verify age for ${owner}/${repo}@${ref_part} (${reason})"
                  echo "| \`${safe_owner_repo}\` | \`${safe_sha_short}\` | — | :x: unverifiable |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_owner_repo" "$safe_sha_short" "$reason"
                  failed=true
                  continue
                fi
                if [ -z "$ts" ]; then
                  echo "::error file=${file}::No committer date for ${owner}/${repo}@${ref_part}"
                  echo "| \`${safe_owner_repo}\` | \`${safe_sha_short}\` | — | :x: no committer date |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_owner_repo" "$safe_sha_short" \
                    "gh api returned no committer date"
                  failed=true
                  continue
                fi
                # Classify + emit via shared helper. _and_tally updates counters
                # via dynamic scoping. Verb is "committed" (commit timestamp,
                # not release). Row cells carry owner/repo + short SHA.
                preflight::age_row_and_tally \
                  "$safe_owner_repo" "$safe_sha_short" "$ts" "$now_epoch" "$MIN_AGE_DAYS" \
                  "committed" "$file" "@"
              done <<< "$uses"

              echo "::endgroup::"
            done

            # A pin dated by tier 2 is a normal outcome for an allow-listed org, but it
            # is also what a broken GH_TOKEN looks like — and in that state the check
            # now PASSES on public pins where it used to fail. Without this the only
            # evidence is a per-pin stderr line inside a collapsed `::group::`, so say
            # it once at the top level. A warning, not an error: the pins were verified.
            local anon_tally="${ACTIONS_AGE_CACHE_DIR:-}/.anon-tally"
            if [ -n "${ACTIONS_AGE_CACHE_DIR:-}" ] && [ -s "$anon_tally" ]; then
              local anon_count; anon_count=$(wc -l < "$anon_tally" | tr -d ' ')
              echo "::warning::${anon_count} pin(s) were dated by the anonymous git fallback because the authenticated API read failed. Expected for an org with a GitHub IP allow list, and benign under an API rate limit; otherwise check GH_TOKEN, which no longer fails public pins on its own. The per-pin reasons above say which."
              # Also on the step summary: on a green run that is the only artifact a
              # reviewer sees (the PR comment path is gated on a non-empty failures
              # file, so it never fires), and an unqualified :white_check_mark: hides
              # the one state worth noticing.
              echo "> :warning: ${anon_count} pin(s) dated by the anonymous git fallback — the authenticated API read failed. Expected for an org with a GitHub IP allow list; otherwise check \`GH_TOKEN\`." >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ "$failed" = true ]; then
              preflight::step_summary_failed "$MIN_AGE_DAYS" "$checked_count" "$skipped_count"
              echo ""
              echo "::error::One or more GitHub Actions failed the age check."
              echo "To bypass for emergency security updates, add the 'age-check-bypass' label to this PR."
              exit 1
            fi

            preflight::step_summary_all_passed "$checked_count" "$MIN_AGE_DAYS" "$skipped_count"
            echo "All GitHub Actions dependencies are at least ${MIN_AGE_DAYS} days old"
          }
          actions_age::main

      - name: Comment retry-after dates on PR
        if: ${{ !cancelled() && inputs.comment_on_failure && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          # Per-ecosystem render parameters. Bash body below is identical
          # across all reusables; only these env values change.
          ECOSYSTEM: actions
          ITEM_COLUMN: Pin
          SEPARATOR: "@"
        run: |
          # ============================================================================
          # comment-on-failure.sh - Post sticky PR comment with retry-after dates
          # ============================================================================
          #
          # Embedded into each `age-check-<eco>.yml.tmpl` at the
          # `# @@COMMENT_ON_FAILURE@@` marker by `scripts/embed-lib-into-workflows.py`.
          #
          # Reads the TSV that `preflight::record_failure` and
          # `preflight::record_unverifiable` wrote during the main run step (one row
          # per failed pin) and renders a single sticky comment. Each row carries a
          # `kind` column — `too_new` or `unverifiable` — so the renderer can split
          # into two sections with the right operator action: too-new pins get an
          # eligible-after date and "wait then push any commit"; unverifiable pins
          # (registry/API outages, missing manifests, etc.) get the upstream reason
          # and "re-run the failed check." Updates an existing sticky in place
          # (marker is `<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->`);
          # deletes the sticky on a clean run so a stale "X days remaining" doesn't
          # outlive the failure that produced it.
          #
          # Soft-fails on permission denial (typical on Dependabot PRs where the
          # token is read-only) — emits a `::notice` so the run still succeeds and
          # the user can find retry-after dates in the Job Summary.
          #
          # Required env (set per-ecosystem in the calling step):
          #   GH_TOKEN, REPO, PR_NUMBER, RUN_URL, MIN_AGE_DAYS, FAILURES_FILE,
          #   ECOSYSTEM, ITEM_COLUMN, SEPARATOR
          # ============================================================================

          set -euo pipefail

          MARKER="<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->"

          # `gh api ... --paginate` pages through all PR comments. The jq filter
          # selects whichever one carries our marker (there should be 0 or 1).
          # `--jq '... // empty'` returns the empty string when no match — keeps
          # `existing_id` testable with `[ -n "$existing_id" ]`.
          existing_id=$(
            gh api --paginate "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | first | .id // empty" \
              2>/dev/null || true
          )

          if [ -s "${FAILURES_FILE:-/dev/null}" ]; then
            body_file=$(mktemp)
            # Dedupe rows: a single pin referenced in N workflow / lockfile
            # entries records N identical TSV rows (one per file processed by
            # the main script). Per-file `::error file=…` annotations correctly
            # fire N times so each file in the Files Changed tab gets its own
            # inline annotation; this comment is a SUMMARY, not a per-file
            # annotation, so it should list each pin once. `sort -u` works
            # because age / eligible / remaining / kind are identical for a
            # given (id, version) within a single run (the script captures
            # `now_epoch` once at startup).
            deduped_failures=$(mktemp)
            sort -u "${FAILURES_FILE}" > "${deduped_failures}"

            # Split rows by kind, deduping cross-kind for the same pin. The
            # legacy assumption was "a pin is either too_new OR unverifiable in a
            # single run" — true within a single file, but a pin referenced in
            # two changed files can hit both branches if `gh api` succeeds for
            # file A and fails for file B (transient mid-run flake). When that
            # happens the too_new judgment is the durable answer (we have a valid
            # age from the file where the fetch succeeded); the unverifiable from
            # the other file is just noise. Without this dedup, a reviewer sees
            # the same pin in both sections with conflicting actions
            # ("wait until eligible" AND "re-run the failed check"), which is
            # confusing and slightly misleading.
            #
            # Two-pass awk via the `NR==FNR` trick: pass 1 collects the set of
            # (id, version) pairs that have a too_new row; pass 2 emits each row
            # to its kind's output file, skipping an unverifiable row when its
            # (id, version) is already in the too_new set. Empty `kind` column on
            # a legacy row defaults to too_new — defensive only; both writers
            # always set it.
            #
            # Wrapped in `if !` so a future regression in the awk script (output
            # path collision, syntax error, etc.) doesn't trip `set -e` and
            # silently suppress the comment — the whole point of this feature is
            # to surface failures at PR review time without forcing the reviewer
            # to dig into logs. Fallback dumps the deduped data into the too_new
            # bucket so the reviewer at least sees the failed pins, with a
            # `::warning` flagging the degraded render.
            too_new_failures=$(mktemp)
            unverifiable_failures=$(mktemp)
            if ! awk -F '\t' '
              NR == FNR {
                if (($7 == "" ? "too_new" : $7) == "too_new") {
                  too_new_pins[$1 "\t" $2] = 1
                }
                next
              }
              {
                kind = $7 == "" ? "too_new" : $7
                if (kind == "too_new") {
                  print > too_new_out
                } else if (kind == "unverifiable") {
                  key = $1 "\t" $2
                  if (!(key in too_new_pins)) {
                    print > unverifiable_out
                  }
                }
              }
            ' too_new_out="${too_new_failures}" \
              unverifiable_out="${unverifiable_failures}" \
              "${deduped_failures}" "${deduped_failures}"; then
              echo "::warning::age-check renderer failed to split rows by kind; falling back to a flat list — some entries may be unverifiable rather than too-new (see the per-pin annotations in this run for the real classification)."
              cp "${deduped_failures}" "${too_new_failures}"
              : > "${unverifiable_failures}"
            fi

            # shellcheck disable=SC2016
            # The printf format strings below intentionally contain literal
            # backticks and `%s` placeholders for Markdown rendering — no shell
            # expansion is wanted in those slots.
            {
              printf '%s\n\n' "${MARKER}"
              printf '### Dependency Age Check failed — %s\n\n' "${ECOSYSTEM}"

              if [ -s "${too_new_failures}" ]; then
                printf '#### Pins below quarantine\n\n'
                printf 'New pin(s) below have not yet reached the **%s-day** quarantine. Wait until the eligible date, push any new commit, and the check will pass.\n\n' "${MIN_AGE_DAYS}"
                printf '| %s | Age (days) | Eligible after | Days remaining |\n' "${ITEM_COLUMN}"
                printf '|---|---:|---|---:|\n'
                while IFS=$'\t' read -r id ver age _min eligible remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s | %s | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${age}" "${eligible}" "${remaining}"
                done < "${too_new_failures}"
                printf '\n'
              fi

              if [ -s "${unverifiable_failures}" ]; then
                printf '#### Pins that could not be verified\n\n'
                printf 'Upstream metadata fetch failed for the pin(s) below. This is usually a transient registry/API issue — re-run the failed check from the Actions tab; if it keeps failing, open an issue with the reason text.\n\n'
                printf '| %s | Reason |\n' "${ITEM_COLUMN}"
                printf '|---|---|\n'
                while IFS=$'\t' read -r id ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${reason}"
                done < "${unverifiable_failures}"
                printf '\n'
              fi

              printf '> Need to merge sooner? Add the **`age-check-bypass`** label — verified-CVE emergencies only.\n'
              printf '\n<sub>Updated by `ops-routines-workflows/age-check-%s` · [run log](%s)</sub>\n' "${ECOSYSTEM}" "${RUN_URL}"
            } > "${body_file}"
            rm -f "${deduped_failures}" "${too_new_failures}" "${unverifiable_failures}"

            if [ -n "${existing_id}" ]; then
              if ! gh api -X PATCH "/repos/${REPO}/issues/comments/${existing_id}" \
                   -F "body=@${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not update age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            else
              if ! gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not post age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            fi
            rm -f "${body_file}"
          elif [ -n "${existing_id}" ]; then
            # No failures this run (neither too-new nor unverifiable); clear the
            # stale sticky if one exists so reviewers don't act on outdated
            # retry-after dates or stale upstream-error reasons.
            if ! gh api -X DELETE "/repos/${REPO}/issues/comments/${existing_id}" >/dev/null 2>&1; then
              echo "::notice::Could not delete stale age-check comment (id ${existing_id}). Caller workflow may need \`pull-requests: write\`."
            fi
          fi
