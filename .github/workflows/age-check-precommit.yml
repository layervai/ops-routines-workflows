# ============================================================================
# REUSABLE: pre-commit Hook Rev Age Check (supply-chain guard, PUBLIC mirror)
# ----------------------------------------------------------------------------
# Self-contained: the bash lib is embedded below. No cross-repo checkout,
# no secrets required, no GitHub App involved. Public consumer repos
# point at this file (at the equivalent `layervai/ops-routines-workflows`
# mirror) because GitHub blocks public → internal reusable-workflow calls.
#
# Quarantines any newly added / bumped `.pre-commit-config.yaml` `rev:`
# pinned to a github.com tag younger than `min_age_days`, on EVERY PR —
# the all-PRs parity the bot-path autoupdate gate (qurl-service#889) could
# not provide. See lib/age-check-precommit.sh for the age basis and the
# explicit non-github-host (fail-closed) handling (qurl-service#890).
#
# DO NOT EDIT THIS FILE DIRECTLY. It's generated by
# `scripts/embed-lib-into-workflows.py` from:
#   - lib/_preflight.sh
#   - lib/age-check-precommit.sh
#   - templates/workflows/age-check-precommit.yml.tmpl
# Edit those sources and run `make embed-workflows`.
# ============================================================================
name: Dependency Age Check (pre-commit, reusable)

on:
  workflow_call:
    inputs:
      min_age_days:
        description: "Minimum tag age in days for any newly-pinned pre-commit hook rev"
        # Still `number` while `age_check_deadline_seconds` below is `string`.
        # Not an accident: the empty-value reasoning there applies here too,
        # but this is the SECURITY parameter, where a shim silently falling
        # back to a default is the wrong failure mode — an empty value should
        # stop the check, not quietly pick 7. Changing it is its own PR.
        type: number
        required: false
        default: 7
      age_check_deadline_seconds:
        description: |
          Wall clock, measured from the START OF THE CHECK, after which no
          further rev is looked up at all — the authenticated tiers and the
          anonymous-git fallback alike. Whole-run elapsed time, not metered
          fetch time: the thing being defended against is `timeout-minutes`,
          which measures wall clock too. Past the deadline the remaining revs
          are recorded unverifiable immediately, so the job exits 1 with
          annotations rather than being CANCELLED, which would suppress them.
          A positive integer <= 480; 0, negatives and fractions are rejected
          with a clear error, and a larger value is clamped with a warning
          rather than silently ignored. The ceiling exists because the job is
          killed at `timeout-minutes` (900s) regardless — the check's own
          clock starts later than the job's, so the difference funds checkout
          and setup. Worst-case in-flight work is reserved inside the lib, so
          this value does not have to leave room for it. An empty value means
          "not supplied" and takes the default, so a shim wiring its own
          optional input through does not turn the check red.
        # `string`, not `number`, deliberately. A shim passing its own unset
        # optional through (`age_check_deadline_seconds: ${{ inputs.x }}`)
        # hands Actions an empty value, and what a `number`-typed input
        # coerces that to is Actions' decision, not ours — if it lands on 0
        # the lib's "0 is rejected" path fires and the check goes red for
        # exactly the passthrough this input documents as safe. As a string
        # the empty value reaches the lib intact, which already parses and
        # validates it.
        type: string
        required: false
        default: "420"
      comment_on_failure:
        description: |
          Post a sticky PR comment listing pins that failed the age check
          and how many days each has left until eligible. Requires the
          calling job to grant `pull-requests: write` (Dependabot PRs need
          this granted explicitly; the default Dependabot token is
          read-only). Soft-fails to a `::notice` if the token can't write.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: age-check-precommit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  age-check:
    name: Check pre-commit hook rev ages
    runs-on: ubuntu-latest
    # 15, not 5: in an allow-listed org every changed pin also makes an
    # anonymous git fetch, and a `pre-commit autoupdate` PR can bump a dozen
    # hooks. The lib carries its own run deadline so the job exits 1 with
    # annotations rather than being CANCELLED here — a kill would suppress
    # both the annotations and the comment step, which is gated on
    # `!cancelled()`. This is the outer belt for that.
    #
    # 15 so the deadline's ceiling (480) leaves 420s for the
    # `fetch-depth: 0` checkout above. At 10 it left 120s, which is not enough
    # for a full-history clone of a large monorepo — and a checkout that
    # overruns is cancelled before the deadline can convert it into an
    # annotated failure, which is the whole point of having one.
    timeout-minutes: 15
    permissions:
      contents: read
      # Only used when `comment_on_failure: true`. Caller's job-level
      # `permissions:` block caps this; if the caller restricts to
      # `contents: read` (or runs as Dependabot without an explicit
      # grant), the post-step soft-fails to a `::notice`.
      pull-requests: write
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'age-check-bypass') }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Write the age-check library — lib/_preflight.sh, lib/age-check-precommit.sh (part 1 of 3)
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP:?}/ops-routines-lib"
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat > "${RUNNER_TEMP}/ops-routines-lib/_preflight.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #!/usr/bin/env bash
          # ============================================================================
          # _preflight.sh - Shared preflight helpers for age-check-*.sh
          # ============================================================================
          #
          # Sourced by each ecosystem-specific age-check script so the validator
          # logic stays consistent. Covers the class of silent-pass bugs that
          # bit the sibling per-repo dep-age checks (website#189, qurl-mcp#52,
          # qurl-portal#14, qurl-typescript#32, discord#21) before they were
          # hardened, plus the preflight probes those rounds added:
          #
          # - Positive-integer validation for MIN_AGE_DAYS (reject 0 and
          #   non-numeric)
          # - GNU `date -d` availability probe (catches BSD/macOS silently
          #   replacing GNU date)
          # - Required-tool existence checks (caller supplies its exact tool list)
          # - Explicit base_ref verification before `git diff` so a missing ref
          #   doesn't get conflated with "no changes detected" by a trailing
          #   `|| true` on the filter pipeline
          # - One resolution of "the base" — the merge base of base_ref and HEAD —
          #   so a parser that reads a base image (`git show <rev>:<path>`) sees
          #   the same revision its three-dot `git diff` compares against
          # - One comparator for every parser that reads a base image
          #   (`preflight::new_lines_since_base`): probe, read, parse both images,
          #   difference — so the ecosystems cannot drift on those details
          # - Step-summary helpers so the Actions UI never shows an empty panel
          #   on early-exit paths
          # - Shared age comparison + ISO-8601 parsing to keep those callers
          #   minimal
          #
          # REQUIRED CALL ORDER in main():
          #
          #   preflight::require_tools <tool> [...]      # tools first
          #   preflight::require_gnu_date                # then date-d probe
          #   preflight::validate_min_age_days           # then env validation
          #   preflight::verify_base_ref "origin/${BASE_REF}"  # MUST come before any
          #                                              # subsequent `git diff` — see
          #                                              # the function comment for
          #                                              # the silent-pass reason. Also
          #                                              # resolves the merge base once;
          #                                              # read it via preflight::base_rev
          #                                              # for every `<rev>:<path>` read.
          #
          # Usage (from an age-check script):
          #
          #   # shellcheck source=lib/_preflight.sh
          #   source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"
          #
          # ============================================================================

          # Guard against double-sourcing — IFS and `set -e` state are caller's.
          if [ -n "${_PREFLIGHT_SOURCED:-}" ]; then
            return 0
          fi
          _PREFLIGHT_SOURCED=1

          # ----- Required-tool probes --------------------------------------------------

          preflight::require_tools() {
            local missing=()
            local tool
            for tool in "$@"; do
              command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Required tools not available on runner: ${missing[*]}. This workflow depends on ubuntu-latest (or a runner image with these installed)."
              exit 1
            fi
          }

          # GNU date supports `date -d @<epoch>` syntax that BSD/macOS date
          # rejects. Every age-check script converts an ISO-8601 timestamp to
          # epoch via `date -d "$ts" +%s`; probing up front catches a silent
          # regression if the runner ever stops providing GNU date.
          preflight::require_gnu_date() {
            if ! date -d @0 >/dev/null 2>&1; then
              echo "::error::GNU date -d not available on runner — this workflow depends on GNU date's \`@\`-prefix epoch syntax. Fix: run on an \`ubuntu-latest\` / Linux runner, or replace the \`date -d\` calls with a portable alternative (e.g., \`python -c 'from datetime import datetime; ...'\`)."
              exit 1
            fi
          }

          # ----- MIN_AGE_DAYS validation ----------------------------------------------

          # Accept only POSITIVE integers (numeric value >= 1). Leading zeros are
          # allowed because some config generators pad to fixed width (e.g. "07");
          # a `07 ... 10#` base-10 round-trip keeps later arithmetic from tripping
          # on bash's octal parsing of zero-prefixed numbers at `$age_days -lt
          # $MIN_AGE_DAYS`.
          #
          # Rejects: 0, 00, negatives, non-numeric, empty.
          # Accepts: 1, 07, 100, 0007.
          preflight::validate_min_age_days() {
            local raw="${MIN_AGE_DAYS:-}"
            # Require at least one digit, reject non-digits. The `10#` base-10
            # prefix on the arithmetic below sidesteps bash's octal interpretation
            # of leading zeros (`$((07))` is 7 but `$((08))` is a syntax error).
            if ! [[ "$raw" =~ ^[0-9]+$ ]]; then
              echo "::error::MIN_AGE_DAYS must be a positive integer (got: ${raw:-<unset>})"
              exit 1
            fi
            if [ "$((10#$raw))" -lt 1 ]; then
              echo "::error::MIN_AGE_DAYS must be >= 1 (got: ${raw}). Zero would make the quarantine a silent-pass no-op."
              exit 1
            fi
            # Normalize to the base-10 numeric form so all subsequent callers do
            # integer comparisons without re-parsing leading zeros. Exported
            # because the variable was passed via env and most scripts reference
            # it directly rather than through a local.
            MIN_AGE_DAYS=$((10#$raw))
            export MIN_AGE_DAYS
          }

          # ----- Base-ref verification -------------------------------------------------

          # Verify the base ref exists in the local checkout before running
          # `git diff` against it. Without this, `git diff ... 2>/dev/null` on
          # a missing ref produces empty output, and a trailing `|| true` on
          # the downstream filter pipeline silently swallows the failure — the
          # script exits 0 with "No changes detected" even though the diff
          # never ran. Friendly error here, explicit failure exit.
          #
          # MUST BE CALLED before any subsequent `git diff`. Callers that extract
          # a diff via `$(git diff ...)` inside a helper function are protected
          # by this preflight *only* for the expected "missing base ref" failure
          # mode; for catastrophic git failures mid-script the helper still needs
          # its own failure branch — `preflight::git_diff_or_fail` below is that
          # branch, and keeps the diagnosis off the caller's captured stdout.
          #
          # Also resolves "the base" ONCE, as the merge base of base_ref and HEAD,
          # and exposes it via `preflight::base_rev`. Every `git diff
          # ${base_ref}...HEAD` in the ecosystem scripts already compares against
          # that merge base (three-dot semantics); a parser that instead READS a
          # base image — `git show <rev>:<path>`, `git cat-file -e` — must read
          # the same revision, or the two halves of one function disagree about
          # which base they mean. Read at the TIP of base_ref, any dependency the
          # base branch dropped or bumped after this branch forked is present in
          # the head image and absent from the base one, so it reads as newly
          # added and, if young, fails a PR that never touched it. Every
          # ecosystem's main() hands its parsers this revision rather than the
          # ref, so no call site re-derives what "the base" means.
          preflight::verify_base_ref() {
            local base_ref="$1"
            if [ -z "$base_ref" ]; then
              echo "::error::preflight::verify_base_ref called with empty argument"
              exit 1
            fi
            # Sanitized once, here, for every surface the two failures below reach
            # — the log line, the PR-comment row and the summary footer all render
            # markdown, and a legally-named ref can carry `_`, `#` or a backtick.
            local safe_ref; safe_ref=$(preflight::safe_for_md "$base_ref")
            if ! git rev-parse --verify --quiet "$base_ref" >/dev/null; then
              preflight::fail_not_run "$safe_ref" "base ref ${safe_ref} is not in this checkout — the base branch has to be fetched (fetch-depth: 0 on actions/checkout)"
            fi
            # A ref that resolves is not yet a usable base: on a shallow checkout
            # (fetch-depth: 1) it exists but shares no reachable history with
            # HEAD, and every three-dot diff downstream would fail on the same
            # missing merge base. Failing here names the fix once, for every
            # ecosystem.
            if ! _PREFLIGHT_BASE_REV=$(git merge-base "$base_ref" HEAD); then
              preflight::fail_not_run "$safe_ref" "could not resolve the merge base of ${safe_ref} and HEAD — most often a shallow checkout, in which case the workflow needs fetch-depth: 0 on actions/checkout"
            fi
            # The parsers are handed the revision, not the ref, and name only the
            # revision in their own diagnostics; this is where the log ties the two.
            echo "Base ${safe_ref}: merge base with HEAD is ${_PREFLIGHT_BASE_REV}"
          }

          # Fail a run that never got to examine a pin, on every surface an
          # operator might read: the log annotation, the failures TSV as a
          # `not_run` row (so the PR comment carries the remedy — see
          # record_not_run for why that row gets its own section) and the
          # step-summary footer. For the failures a consumer repo reaches through
          # an ordinary workflow setting — an unfetched base branch, a shallow
          # checkout — because the PR comment is the one surface an operator sees
          # without opening the run log. That comment only exists when there is a
          # pull request to put it on: the render step is gated on a PR number,
          # so a `push` or `workflow_dispatch` run — the shapes that reach these
          # failures most easily — gets the ::error and the summary footer only.
          # Coding errors stay ::error-only. The footer lands before any ecosystem
          # header, since preflight runs first; its text stands on its own.
          #
          # Both arguments arrive SANITIZED (see verify_base_ref): they are rendered
          # as markdown twice over. `reason` is one lowercase clause with no
          # terminal period — the footer wraps it as `— ${reason}.` and the
          # comment renders it in a table cell beside short sibling clauses.
          preflight::fail_not_run() {
            local display_id="$1" reason="$2"
            echo "::error::${reason}"
            preflight::record_not_run "$display_id" "$reason"
            preflight::step_summary_unverifiable "$reason"
            exit 1
          }

          # Assert verify_base_ref has run. `base_rev` uses it as its guard;
          # callers can also invoke it right before a `git diff` as a static
          # sanity check that the required-call-order convention was followed.
          # Stderr, because `base_rev` is read through `$(...)` and a message on
          # stdout would be captured and lost.
          preflight::require_base_ref_verified() {
            if [ -z "${_PREFLIGHT_BASE_REV:-}" ]; then
              echo "::error::preflight::verify_base_ref must be called before any git diff. This is a coding error, not a runtime condition." >&2
              exit 1
            fi
          }

          # The merge base `verify_base_ref` resolved, on stdout — the revision
          # every parser reads its base image from and diffs against, never the
          # tip of base_ref. Fails closed if verify_base_ref has not run: with an
          # empty revision `git show :<path>` reads the INDEX, a silent wrong
          # answer rather than an error.
          preflight::base_rev() {
            preflight::require_base_ref_verified
            printf '%s\n' "$_PREFLIGHT_BASE_REV"
          }

          # `git diff` for the separable parsers, which `main` reads through
          # `$(...)`. That makes a parser's stdout the work-list, so a failure is
          # announced on stderr — where it reaches the job log and the annotations
          # panel rather than the captured (and, under `set -e`, discarded) stdout —
          # and the caller propagates the non-zero return:
          #
          #   diff_out=$(preflight::git_diff_or_fail "${base_rev}...HEAD" -- "$file") || return 1
          preflight::git_diff_or_fail() {
            git diff "$@" || {
              # `%q` keeps the reproduced command re-runnable (pathspec globs stay
              # quoted) and, unlike `$*`, does not join on the libs' newline+tab IFS.
              local cmd; printf -v cmd ' %q' "$@"
              echo "::error::git diff${cmd} failed" >&2
              return 1
            }
          }

          # ----- Head-only lines: one comparator for every image-reading parser --------

          # Emit the lines <parser_fn> yields for the HEAD image of <file> but not for
          # its image at <base_rev> — "what this branch introduces". <base_rev> is
          # preflight::base_rev: the merge base, already resolved once, handed in as a
          # revision so this function cannot disagree with the caller's three-dot diff
          # about which base it means. <parser_fn> is any function meeting the parser
          # contract every ecosystem's extractors already satisfy: one manifest image
          # on stdin, one work-list line per entry on stdout, every diagnostic on
          # stderr, non-zero on input it cannot read.
          #
          # This is the body `precommit_age::changed_pins` and `npm_age::changed_pins`
          # each carried verbatim — probe, temp-file read, two checked parses, a set
          # difference — and it lives here so the two cannot drift on the details
          # they had already drifted on (`grep -vxF` versus `comm -13`, a bare path
          # versus `./`, whether a failed read is an error or an empty set).
          #
          # Deliberately OVER-checks rather than under-checks: a line reintroduced
          # after removal, or re-pinned to a version the repo used before, is
          # re-verified and simply passes. Records are compared as whole lines, so a
          # caller that encodes provenance in the line (npm's `offregistry<TAB>`
          # prefix) gets a pin that changed registries reported as new for free.
          #
          # Exit codes — the caller MUST branch on these; an unchecked non-zero
          # collapses into an empty work-list, which reads as "nothing changed" and
          # passes the PR. They match what both callers' main() already render:
          #   0 - stdout is the work-list, possibly empty
          #   1 - the HEAD image could not be parsed, or the comparison itself failed
          #   2 - the BASE image exists but could not be read or parsed, or no scratch
          #       space for it — a checkout or environment problem, not this branch's
          # A coding error (unknown parser, empty revision) aborts instead — see below.
          #
          # MUST be called under `$(...)`, as every binding does: the two coding-error
          # guards `exit`, and a bare `if new_lines_since_base ...; then` would take the
          # script down mid-run instead of reaching the caller's fail-closed branch.
          # Tools: git, sort, comm — and mktemp unless a path is supplied. Each
          # caller declares them in its own preflight::require_tools list; a new
          # binding owes that list an edit too.
          #
          # Optional 4th argument <base_blob>: a caller-owned path. When given, the
          # base image is written THERE and left for the caller, instead of into a
          # temp file this function removes on return. For an ecosystem that wants
          # to say something about a base image that contributed nothing (pnpm's
          # absent/vendored/unreadable/empty classification, package-lock's
          # lockfileVersion-1 probe) without a second `git show` of a 10 MB blob.
          # Untouched when the base has no image, so a caller probes existence the
          # same way this function does before reading it. The caller owns cleanup —
          # and, if it reuses one path across manifests, truncation between them:
          # nothing here empties a file it did not write to.
          preflight::new_lines_since_base() {
            local file="$1" base_rev="$2" parser_fn="$3" base_blob="${4:-}"

            # Two coding errors, and both `exit` rather than return: a misspelled
            # parser name would otherwise fail per-image below and be rendered by
            # main() as a manifest that could not be parsed, and an empty revision
            # makes `git show :<path>` read the INDEX — a silent wrong answer. Neither
            # is a runtime condition the exit-code contract below describes, so they
            # take the same path as require_base_ref_verified: abort, naming the bug.
            # (Every caller runs this under `$(...)`, so the abort reaches them as
            # rc 1 and the ::error on stderr; run bare, it stops the script.)
            if ! declare -F "$parser_fn" >/dev/null 2>&1; then
              echo "::error::preflight::new_lines_since_base: '${parser_fn}' is not a shell function. This is a coding error, not a runtime condition." >&2
              exit 1
            fi
            if [ -z "$base_rev" ]; then
              echo "::error::preflight::new_lines_since_base: empty base revision for ${file}. This is a coding error, not a runtime condition." >&2
              exit 1
            fi

            # Base side FIRST, and unconditionally when an image exists. A head that
            # parses to nothing — or is deleted on this branch — would let a
            # head-first short-circuit return "nothing new" without ever opening the
            # base image, and a base that cannot be read (a partial clone's lazy blob
            # fetch) would then pass unannounced: an empty work-list is exactly the
            # silent-pass shape this check exists to prevent, so the checkout problem
            # must surface even when there would be nothing to difference.
            #
            # `<rev>:./<path>` — the "./" is load-bearing. `git show <rev>:<path>`
            # resolves <path> from the TOP OF THE WORKING TREE unless it starts with
            # `./`, while the head read below is an ordinary cwd-relative redirect.
            # Under a workflow that sets `working-directory` (npm's does) a bare path
            # would compare a sub-app manifest against the REPO ROOT's, and the set
            # difference would then suppress any head pin that also appears there —
            # a fail-OPEN in a supply-chain gate. Where cwd is the repo root the two
            # spellings coincide, so callers without that input lose nothing.
            # Existence is answered from the TREE — `rev-parse --verify` resolves the
            # entry without needing the blob — and the read below is what touches the
            # object. `git cat-file -e` would touch it too, and on a partial clone
            # whose lazy fetch fails it exits 128: the probe would then report "no
            # base image", the whole head manifest would be promoted, and the
            # operator would be told every pin is new instead of that their checkout
            # is incomplete — on a 3000-package lockfile, the job timeout.
            local base_lines=""
            if git rev-parse --verify --quiet "${base_rev}:./${file}" >/dev/null 2>&1; then
              # Read, then parse, as two checked steps, because they have different
              # remedies: a `git show` that fails on an object the merge base names
              # is a checkout problem (a partial clone's lazy blob fetch — the case
              # the probe above deliberately leaves to this step — or a corrupt
              # object), while an image the parser rejects is a manifest problem —
              # and one pipeline reports both as the second. Through a temp file so
              # a monorepo-scale image is never held in a shell variable (npm
              # lockfiles here run to 10 MB+; a here-string would spool it back out
              # to a temp file anyway). Same mktemp + `trap ... RETURN` idiom as
              # npm_age::published_at; the trap fires when THIS function returns,
              # not when the parser it calls does.
              if [ -z "$base_blob" ]; then
                base_blob=$(mktemp) \
                  || { echo "::error::could not create a temporary file for the base image" >&2; return 2; }
                # shellcheck disable=SC2064
                trap "rm -f \"$base_blob\"" RETURN
              fi
              if ! git show "${base_rev}:./${file}" > "$base_blob"; then
                echo "::error file=${file}::could not read ${file} at the merge base (${base_rev}) — git show failed; see its message above" >&2
                return 2
              fi
              # Fail closed and fast rather than promote the whole head image: on a
              # 3000-package lockfile that promotion is a guaranteed job timeout —
              # the same red build with a far worse message.
              if ! base_lines=$("$parser_fn" < "$base_blob"); then
                echo "::error file=${file}::${file} at the merge base (${base_rev}) could not be parsed; cannot determine which entries this branch introduces" >&2
                return 2
              fi
            fi
            # An ABSENT base image is not an error — it is what a file this branch
            # adds looks like, and an empty base set promotes the whole head image,
            # which is the right answer for it.

            # The head is read from the WORKING TREE, deliberately: main() selects
            # targets by working-tree presence, and the working tree is what the job
            # would actually install. A file this branch DELETES introduces nothing.
            local head_lines=""
            if [ -f "$file" ]; then
              head_lines=$("$parser_fn" < "$file") \
                || { echo "::error file=${file}::${file} could not be parsed; refusing to report an empty work-list" >&2; return 1; }
            fi
            # No early return for an empty head: the capture below strips the one
            # blank line comm would emit for it, and the emit guard drops it. An
            # early return here would be a second defence for the same input, which
            # nothing could fence — see the deleted-file and no-blank-line tests,
            # which measure the guard byte-exactly.

            # `comm` wants both sides sorted under one collation and reads an empty
            # operand as the empty set, so neither the added-file case nor a parser
            # that emitted nothing needs special-casing. It also settles the
            # `comm -13` / `grep -vxF -f` split the callers had reached
            # independently: -F needed telling that a record may carry a literal tab
            # and that a URL's regex metacharacters are data, and its exit 1 ("no
            # lines selected") had to be told apart from a real failure at every
            # site; comm compares whole lines and its non-zero status is only ever a
            # failure. The lone blank a printf of an empty base set produces is in
            # neither head set, so comm never emits it.
            #
            # Each sort is its own checked step. `set -o pipefail` does not reach
            # into a process substitution, so a `sort -u` running INSIDE comm's
            # `<(...)` that dies partway (OOM-killed on a monorepo work-list) hands
            # comm a truncated set and comm exits 0 — a silently SHORT work-list,
            # fewer pins aged, green build. Sorted into variables first, each sort's
            # status is observable and a failure is rc 1; what the substitutions
            # below carry is a printf of an already-complete string, which has no
            # partial-failure mode comm's own status does not cover. The work-list
            # is bounded (npm caps it), so two sorted copies do not reintroduce the
            # memory concern the temp-file read avoids.
            local base_sorted head_sorted
            base_sorted=$(printf '%s\n' "$base_lines" | LC_ALL=C sort -u) \
              || { echo "::error file=${file}::failed to sort the base image of ${file} for comparison; refusing to report an empty work-list" >&2; return 1; }
            head_sorted=$(printf '%s\n' "$head_lines" | LC_ALL=C sort -u) \
              || { echo "::error file=${file}::failed to sort ${file} for comparison; refusing to report an empty work-list" >&2; return 1; }
            # comm's status is captured, not inherited: its own 2 would otherwise be
            # rendered by main() as an unreadable base image and a fetch-depth remedy.
            local out cmp_rc=0
            out=$(LC_ALL=C comm -13 <(printf '%s\n' "$base_sorted") <(printf '%s\n' "$head_sorted")) || cmp_rc=$?
            if [ "$cmp_rc" -ne 0 ]; then
              echo "::error file=${file}::failed to compare ${file} against its base image (comm exited ${cmp_rc}); refusing to report an empty work-list" >&2
              return 1
            fi
            # The emit guard is what turns "comm produced only the blank line the
            # empty set printf'd" into zero bytes rather than one newline.
            [ -n "$out" ] && printf '%s\n' "$out"
            return 0
          }

          # ----- ISO-8601 → epoch helper ----------------------------------------------

          # Every ecosystem converts a registry-returned ISO-8601 timestamp into
          # epoch seconds via `date -d "$ts" +%s`, and every one had its own
          # error-handling branch. Shared helper echoes epoch on stdout, exits 1
          # on parse failure with the offending timestamp in the stderr message.
          # Caller can use `if ! epoch=$(preflight::iso8601_to_epoch "$ts"); then
          # ...skip or fail... fi`.
          preflight::iso8601_to_epoch() {
            local ts="$1"
            local epoch
            if [ -z "$ts" ]; then
              return 1
            fi
            if ! epoch=$(date -d "$ts" +%s 2>/dev/null); then
              return 1
            fi
            echo "$epoch"
          }

          # Given a publish epoch + now epoch + MIN_AGE_DAYS, emit the age in
          # days on stdout and return a classification via exit code:
          #   0 - passes; age >= MIN_AGE_DAYS + 2 (clearly past threshold)
          #   2 - passes but borderline; MIN_AGE_DAYS <= age <= MIN_AGE_DAYS + 1
          #       (the "just past threshold" :eyes: case — advance warning that
          #       a small threshold bump or an unpublish would flip this PR)
          #   1 - fails; age < MIN_AGE_DAYS (too new)
          #
          # !!! CALLER CONVENTION !!!
          # Callers MUST use a 3-way `case` on the exit code, NOT a 2-way
          # `if/then/else`. A naïve `if preflight::classify_age …; then ok; else fail; fi`
          # would silently misclassify BOTH `1` (too_new) AND `2` (borderline)
          # as failures — losing the advance-warning signal and (worse) treating
          # a borderline pass as a block.
          #
          # Correct pattern:
          #   rc=0
          #   age_days=$(preflight::classify_age "$pub" "$now" "$MIN_AGE_DAYS") || rc=$?
          #   case "$rc" in
          #     0) ok ;;
          #     2) borderline ;;
          #     *) too_new ;;  # catches 1 and any future non-pass codes
          #   esac
          #
          preflight::classify_age() {
            local publish_epoch="$1" now_epoch="$2" min_age_days="$3"
            local age_days=$(( (now_epoch - publish_epoch) / 86400 ))
            echo "$age_days"
            if [ "$age_days" -lt "$min_age_days" ]; then
              return 1
            fi
            if [ "$age_days" -le "$((min_age_days + 1))" ]; then
              return 2
            fi
            return 0
          }

          # Given a publish epoch + MIN_AGE_DAYS, echo the ISO date (UTC) when
          # the package becomes eligible. Used in the "too new" error message
          # so developers know when to retry without needing the bypass label.
          # Falls back to "unknown" on parse error rather than breaking the
          # error message flow.
          preflight::eligible_date_utc() {
            local publish_epoch="$1" min_age_days="$2"
            date -u -d "@$((publish_epoch + min_age_days * 86400))" +%Y-%m-%d 2>/dev/null || echo "unknown"
          }

          # Append a single failure row to a workflow-level TSV so a downstream
          # job step can render the data into a PR comment without re-doing the
          # classification work. No-op when AGE_CHECK_FAILURES_FILE is unset (the
          # common case — local dev, callers that didn't opt into the comment
          # feature). Format is one row per failed pin:
          #
          #   <display_id>\t<display_version>\t<age_days>\t<min_age_days>\t<eligible_date>\t<days_remaining>\t<kind>
          #
          # `kind` is `too_new` (this helper) or `unverifiable` (sibling helper
          # `preflight::record_unverifiable`). The downstream renderer splits on
          # kind so each failure class gets the right operator guidance:
          # too-new → "wait until the eligible date"; unverifiable → "re-run".
          #
          # Tabs were chosen over JSON because the consumer (a small bash step in
          # the template) parses with `IFS=$'\t' read` — no jq dependency, and
          # `display_id` / `display_version` have already been run through
          # `safe_for_md` so they cannot contain tabs.
          #
          # `days_remaining` is computed as calendar-day delta between today (UTC,
          # midnight) and the eligible-after date. That matches the `eligible_date`
          # column the user reads on the same row — the alternative (`min - age`)
          # off-by-ones on freshly-committed pins because `age_days` floors:
          # a pin committed 22h ago has age_days=0, so `min - age` would suggest
          # "wait 7 days" when in calendar terms only 6 days remain until eligible.
          # Falls back to the floor approximation only if the eligible string is
          # unparseable (defensive — should never happen since the caller fed it
          # through `eligible_date_utc`). Clamped at 0 to defend against clock
          # skew producing a negative.
          preflight::record_failure() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" age_days="$3"
            local min_age_days="$4" eligible="$5"
            local days_remaining today_epoch eligible_epoch
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s 2>/dev/null || true)
            eligible_epoch=$(date -u -d "${eligible}" +%s 2>/dev/null || true)
            if [ -n "${today_epoch}" ] && [ -n "${eligible_epoch}" ]; then
              days_remaining=$(( (eligible_epoch - today_epoch) / 86400 ))
            else
              days_remaining=$(( min_age_days - age_days ))
            fi
            [ "$days_remaining" -lt 0 ] && days_remaining=0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "$age_days" \
              "$min_age_days" "$eligible" "$days_remaining" \
              "too_new" \
              >> "$file"
          }

          # Sibling of `record_failure` for the "couldn't fetch metadata" failure
          # class — a pin shape-checks fine, but the registry / API / proxy returned
          # an error or empty body so the script can't compute an age. Without
          # this, transient upstream failures produce a red required check with
          # no PR-level explanation: the comment-on-failure step gates on `[ -s
          # FAILURES_FILE ]`, and the only writer was `record_failure` (too-new
          # only). The reviewer then has to dig into the run log to discover that
          # the failure was a 5xx and a re-run will pass.
          #
          # Writes the same TSV schema as `record_failure` so the renderer reads
          # one format. The age / eligible / remaining columns carry sentinels
          # (`?` / "n/a" / `?`) — the renderer hides those columns for the
          # unverifiable section since "wait N days" copy doesn't apply. The
          # `reason` arg is what gets shown to the operator in lieu of the
          # eligible-after date.
          #
          # Args:
          #   $1 display_id        already sanitized via safe_for_md
          #   $2 display_version   already sanitized via safe_for_md
          #   $3 reason            short human-readable cause, e.g.
          #                        "gh api unreachable or commit not found"
          #                        — surfaces in the comment so the reviewer
          #                        knows whether to re-run or open an upstream
          #                        issue. Tabs are stripped to keep the row
          #                        parseable.
          preflight::record_unverifiable() {
            preflight::_record_reason_row "$1" "$2" "${3:-unknown reason}" unverifiable
          }

          # A row of kind `not_run`: the check stopped in preflight, before it
          # examined a single pin — an unfetched base branch, a shallow clone. The
          # remedy is a checkout setting, so the comment renders these in their
          # own section with no "re-run" copy and no `age-check-bypass` offer:
          # re-running cannot help, and the label would switch the gate off for a
          # PR whose checkout is what needs fixing. `display_id` is the base ref,
          # already sanitized (see verify_base_ref).
          preflight::record_not_run() {
            preflight::_record_reason_row "$1" "n/a" "$2" not_run
          }

          # Shared writer for the reason-carrying kinds. Strips characters that
          # would corrupt the downstream comment:
          #   - tabs/newlines break `IFS=$'\t' read` (multiline reason would
          #     produce row count != failure count)
          #   - `|` breaks the markdown table layout — the reason cell sits
          #     between two `|` separators in the rendered comment, and an
          #     embedded `|` would split the row into extra columns. All
          #     in-tree call sites pass pipe-free strings today; this strip
          #     defends a future caller forwarding upstream error text (e.g.,
          #     curl stderr that happens to contain `|`).
          preflight::_record_reason_row() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" reason="$3" kind="$4"
            reason=$(printf '%s' "$reason" | tr -d '\t\n|')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "?" \
              "n/a" "$reason" "?" \
              "$kind" \
              >> "$file"
          }

          # ----- Shared age-check outcome helper --------------------------------------

          # Classify a dependency's age and emit the full CI output for it
          # (markdown row + log annotation). Returns an exit code the caller
          # can map to its counters. For the typical caller pattern that
          # updates both `checked_count` and `failed`, use the thin wrapper
          # `preflight::age_row_and_tally` which does the mapping via bash's
          # dynamic scoping.
          #
          # !!! SECURITY CONTRACT !!!
          # `display_id` and `display_version` are interpolated directly into:
          #   - the markdown row (caller-inspectable via $GITHUB_STEP_SUMMARY)
          #   - log lines (visible in the Actions job log)
          # This helper does NOT re-sanitize them. Callers MUST pre-sanitize via
          # `preflight::safe_for_md` (or a tighter ecosystem-specific validator
          # like `is_valid_pkg_name`) before passing in, otherwise a crafted
          # lockfile / registry response could inject active markdown into the
          # step summary.
          #
          # Arguments:
          #   $1 display_id        e.g. "lodash" or "actions/checkout" (sanitized)
          #   $2 display_version   e.g. "4.17.21" or "1a2b3c4d" (sanitized)
          #   $3 publish_time      ISO-8601 string from the registry
          #   $4 now_epoch         caller's pre-computed `date +%s`
          #   $5 min_age_days      positive integer (caller already validated)
          #   $6 verb              past-tense verb for too-new error messages
          #                        ("published" | "committed" | "tagged" |
          #                        "built" | "uploaded"). Defaults to "published".
          #   $7 file_hint         optional source filename for `file=` annotation
          #   $8 separator         how to join id + version in log lines. Default
          #                        "@"; pip uses "==".
          #
          # Exit codes (richer than ok/fail so callers can distinguish borderline
          # from too_new, and parse_error from a real too-new result):
          #   0 — ok (clearly past threshold)
          #   1 — too_new
          #   2 — borderline (just past threshold; counts as pass, with :eyes: row)
          #   3 — parse_error (malformed ISO-8601 or missing required arg)
          preflight::age_row_for_publish() {
            local display_id="$1" display_version="$2" publish_time="$3"
            local now_epoch="$4" min_age_days="$5"
            local verb="${6:-published}"
            local file_hint="${7:-}"
            local sep="${8:-@}"

            # Required-arg validation. Name the specific missing arg in the
            # error so a future caller doesn't have to bisect. `verb`, `file_hint`,
            # `sep` have defaults; the five below do not. Empty values would
            # surface later as arithmetic errors or spurious row text.
            local arg
            for arg in display_id display_version publish_time now_epoch min_age_days; do
              if [ -z "${!arg}" ]; then
                echo "::error::preflight::age_row_for_publish: required arg \`${arg}\` was empty" >&2
                return 3
              fi
            done

            # Full identifier for log lines; row cells stay separate.
            local full_id="${display_id}${sep}${display_version}"

            # GitHub Actions annotation format requires `::` between command
            # (+ optional params) and message. `::error::msg` is valid;
            # `::error msg` is NOT and will render as plain log text. So:
            #   no file_hint → `::` (bare delimiter)
            #   with hint    → ` file=<path>::` (leading space separates
            #                  `::error` from params, trailing `::` closes them)
            local file_prefix="::"
            [ -n "$file_hint" ] && file_prefix=" file=${file_hint}::"

            local publish_epoch
            if ! publish_epoch=$(preflight::iso8601_to_epoch "$publish_time"); then
              echo "::error${file_prefix}Could not parse publish timestamp for ${full_id}: ${publish_time}"
              echo "| \`${display_id}\` | ${display_version} | — | :x: parse error |" >> "$GITHUB_STEP_SUMMARY"
              return 3
            fi

            local age_days class_rc=0
            age_days=$(preflight::classify_age "$publish_epoch" "$now_epoch" "$min_age_days") || class_rc=$?

            case "$class_rc" in
              0)
                echo "  OK: ${full_id} (${age_days} days old)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
                return 0
                ;;
              2)
                echo "::notice${file_prefix}${full_id} is ${age_days} day(s) old — just past the ${min_age_days}-day threshold"
                echo "  OK: ${full_id} (${age_days} days old, barely past threshold)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :eyes: just past threshold |" >> "$GITHUB_STEP_SUMMARY"
                return 2
                ;;
              *)
                local eligible; eligible=$(preflight::eligible_date_utc "$publish_epoch" "$min_age_days")
                echo "::error${file_prefix}${full_id} ${verb} ${age_days} day(s) ago (minimum: ${min_age_days}; eligible after ${eligible})"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :x: **too new** (eligible after ${eligible}) |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_failure "$display_id" "$display_version" "$age_days" "$min_age_days" "$eligible"
                return 1
                ;;
            esac
          }

          # Wraps `preflight::age_row_for_publish` and updates the caller's
          # `checked_count` and `failed` via bash's dynamic scoping. This is the
          # call most ecosystem scripts should use — one line, no case statement
          # at the callsite.
          #
          # Convention: caller MUST have locals named exactly `checked_count`
          # (integer) and `failed` ("true"/"false"). These are looked up through
          # the dynamic scope chain at runtime — no nameref magic, works on
          # bash >= 4.0 (and on macOS bash 3.2 for local-dev tests).
          #
          # Outcome mapping:
          #   ok (rc 0)            → checked_count++
          #   borderline (rc 2)    → checked_count++
          #   too_new (rc 1)       → checked_count++, failed=true
          #   parse_error (rc 3)   → failed=true (checked not incremented)
          #
          # All args are passed through to age_row_for_publish unchanged.
          preflight::age_row_and_tally() {
            local rc=0
            preflight::age_row_for_publish "$@" || rc=$?
            # Deliberate dynamic-scope writes: caller provides `checked_count`
            # and `failed` as locals; we update them in place.
            # shellcheck disable=SC2034
            case "$rc" in
              0|2) checked_count=$((checked_count + 1)) ;;
              1)   checked_count=$((checked_count + 1)); failed=true ;;
              3)   failed=true ;;
            esac
          }

          # ----- Output sanitization --------------------------------------------------

          # Sanitize arbitrary strings before writing to $GITHUB_STEP_SUMMARY.
          # Used for values that either pre-date a validator (the invalid-name
          # branch in each ecosystem) or come from untrusted lockfile / registry
          # output (version strings, image tags). Strips to a character class
          # that can't form active markdown (link/image/emphasis/HTML) and caps
          # length at 80 so a crafted over-long entry can't blow out the summary.
          #
          # Kept permissive enough that legitimate semver (`1.2.3+build.7`) and
          # scoped package names (`@scope/name`) survive round-trip unchanged.
          #
          # `LC_ALL=C` forces byte-level (ASCII-only) behavior so the tr + head
          # combo is deterministic across hosts. In a UTF-8 locale, `[:alnum:]`
          # would keep accented Latin letters and CJK chars, and `head -c 80`
          # could split a multibyte char at the boundary. Neither is a security
          # hole (markdown injection is still blocked), but byte-level behavior
          # is easier to audit and test. Unicode homoglyph attacks on package
          # names are a separate concern — handled (if at all) by the caller's
          # `is_valid_*` ASCII-only allowlists, not here.
          preflight::safe_for_md() {
            # $2 is an optional length; the default keeps a summary-table cell
            # readable. A log annotation has no table to fit and can carry more —
            # a git URL loses its commit fragment at 80.
            LC_ALL=C printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:]@/_.:+-' | LC_ALL=C head -c "${2:-80}"
          }

          # ----- Operational knobs ----------------------------------------------------
          #
          # Not sanitization: these validate tuning inputs. Kept below the
          # sanitization block so the markdown-allowlist rationale above stays
          # attached to safe_for_md, which is the function a maintainer reads it
          # for.

          # Validate an operational positive-integer knob, echoing the value to
          # use. Normalizes leading zeros through a base-10 round-trip for the
          # same reason validate_min_age_days does — a `010` would otherwise be
          # read as octal by arithmetic contexts.
          #
          # Unlike validate_min_age_days this FALLS BACK rather than aborting:
          # MIN_AGE_DAYS is the security threshold, while these are tuning knobs
          # (work-list caps, budgets), and a fat-fingered value must not take a
          # supply-chain check offline. The warning goes to stderr because callers
          # read the value from stdout.
          preflight::validate_positive_int() {
            local name="$1" value="$2" fallback="$3"
            # Unset/empty is "not provided", not "misconfigured" — take the
            # fallback silently. Warning here would fire on every run for any
            # consumer whose workflow revision predates the input (the
            # `ref: main` split makes that a real population), and would blame
            # them for a value they never set. The ::warning below is reserved for
            # a value that is present and genuinely unusable.
            if [ -z "$value" ]; then
              printf '%s' "$fallback"
              return 0
            fi
            if [[ "$value" =~ ^[0-9]+$ ]]; then
              value=$((10#$value))
            else
              value=0
            fi
            if [ "$value" -lt 1 ]; then
              echo "::warning::${name} is not a positive integer; falling back to ${fallback}" >&2
              value="$fallback"
            fi
            printf '%s' "$value"
          }

          # Sanitize each element of a list and join with ", ". safe_for_md's
          # `tr -cd` keeps neither `,` nor space, so sanitizing an already-joined
          # string collapses "package-lock.json, yarn.lock" into
          # "package-lock.jsonyarn.lock". Map-then-join makes the safe order the
          # obvious one for the next caller.
          preflight::safe_list_for_md() {
            local out="" item safe
            for item in "$@"; do
              safe=$(preflight::safe_for_md "$item")
              # Skip an element that sanitized away entirely. Testing the
              # ACCUMULATOR for emptiness instead would emit a dangling "a, " for a
              # trailing empty and "a, , c" for a middle one — the same class of
              # mis-rendering this function was added to fix, one step further out.
              [ -n "$safe" ] || continue
              out="${out:+${out}, }${safe}"
            done
            printf '%s' "$out"
          }

          # ----- Step-summary helpers --------------------------------------------------

          # `GITHUB_STEP_SUMMARY` is provided by GitHub Actions; default to
          # /dev/null for local runs so the helper doesn't error out. The
          # workflow always provides it in CI.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          preflight::step_summary_header() {
            local ecosystem="$1"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "| Package | Version | Age (days) | Status |"
              echo "|---------|---------|------------|--------|"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # For the "no changes" / "no deps" early-exit paths. Writes a single
          # summary blockquote line so the Actions UI reflects the early-exit
          # outcome instead of an empty summary panel.
          preflight::step_summary_no_changes() {
            local ecosystem="$1" reason="$2"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "> ${reason} :white_check_mark:"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          preflight::step_summary_all_passed() {
            local checked_count="$1" min_age_days="$2" skipped_count="${3:-0}"
            {
              echo ""
              echo "> Verified ${checked_count} package(s) at ≥ ${min_age_days} days old. :white_check_mark:"
              if [ "$skipped_count" -gt 0 ]; then
                echo "> ${skipped_count} skipped (see warnings above)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Now accepts optional counts so the footer breakdown matches what
          # callers actually tracked. Positional args are kept backwards-compatible
          # (only min_age_days is required).
          preflight::step_summary_failed() {
            local min_age_days="$1" checked_count="${2:-}" skipped_count="${3:-}"
            {
              echo ""
              echo "> **One or more dependencies failed the ${min_age_days}-day age check.** Add the \`age-check-bypass\` label to override (verified-CVE bypass only — see runbooks/phase-0-checklist.md)."
              if [ -n "$checked_count" ] || [ -n "$skipped_count" ]; then
                echo ">"
                echo "> Breakdown: **${checked_count:-?}** checked, **${skipped_count:-0}** skipped. See the table above for which rows failed (marked :x:)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run where one or more manifests were skipped wholesale by
          # explicit configuration rather than examined. Takes both counts because
          # the honest sentence depends on whether anything else WAS checked:
          # with a nonzero checked_count the skip is a caveat on a real result,
          # with zero it is the whole result. Emitting one blockquote per
          # condition produced two adjacent paragraphs saying the same thing, and
          # a forward reference to a count that never followed.
          preflight::step_summary_registry_free() {
            local skipped_files="$1" checked_count="${2:-0}"
            {
              echo ""
              if [ "$checked_count" -gt 0 ]; then
                echo "> **${skipped_files} lockfile(s) were not age-checked at all**, having resolved nothing from a registry; they were skipped by configuration. The count below covers only the rest."
              else
                echo "> **Nothing was age-checked.** ${skipped_files} lockfile(s) resolved nothing from a registry and were skipped by configuration. This is a pass by configuration, not by verification."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run that verified NOTHING — because a manifest could not
          # be read, or because preflight stopped the run before any manifest was
          # examined (see fail_not_run) — as distinct from a dependency failing the
          # age check, which is what `step_summary_failed` is for.
          #
          # Deliberately does NOT mention `age-check-bypass`. That label is scoped
          # to verified-CVE overrides, the conditions reaching this footer can be
          # permanent rather than incidental, and the label genuinely clears the
          # check (the reusable job is gated on its absence) — so naming it here
          # would hand the operator the exact anti-pattern the ecosystem scripts
          # warn against in their own ::error:: on the same failure.
          preflight::step_summary_unverifiable() {
            local reason="$1"
            {
              echo ""
              echo "> **Nothing could be verified — ${reason}.** No dependency was age-checked in this run, so this fails rather than reporting a pass it cannot support."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Guard against "registry outage → every package skipped → workflow
          # passes" — if nothing actually got verified, fail and write a
          # summary explaining why.
          preflight::step_summary_all_skipped() {
            local skipped_count="$1"
            {
              echo ""
              echo "> **No packages could be verified** (all ${skipped_count} were skipped). Treating as failure to avoid silent pass on registry outage."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          OPS_ROUTINES_AGE_CHECK_LIB
          cat > "${RUNNER_TEMP}/ops-routines-lib/age-check-precommit.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #!/usr/bin/env bash
          # ============================================================================
          # age-check-precommit.sh - Block newly-pinned pre-commit hook revs (supply chain)
          # ============================================================================
          #
          # Purpose:
          #   pre-commit analog of the go/actions/docker checks. Diffs
          #   `.pre-commit-config.yaml` against origin/$BASE_REF, and for every remote
          #   hook whose `rev:` is newly added or changed, confirms the pinned TAG is
          #   >= MIN_AGE_DAYS old. Fails closed if a rev is too young or its age can't
          #   be verified.
          #
          #   This closes the gap the bot-path gate could not: the weekly
          #   `pre-commit autoupdate` quarantine (qurl-service's
          #   .github/scripts/precommit_age_gate.py, #889) only governs revs the BOT
          #   adopts. This check runs on EVERY PR, so a human hand-editing
          #   `.pre-commit-config.yaml` to a fresh rev is quarantined too — matching how
          #   the go/actions/docker age-checks already gate human-authored pins
          #   (qurl-service#890).
          #
          # Age basis (TAG pins, mirrors precommit_age_gate.py::publish_dt):
          #   A pre-commit `rev:` pins a TAG, and a tag is a movable pointer — it can be
          #   re-pointed onto an old commit while the release itself is brand new. So the
          #   faithful "age of what we're adopting" is the tag's *publish* moment:
          #     1. GitHub Release `published_at` for the tag (the freshness signal).
          #     2. Annotated tag → tagger date.
          #     3. Lightweight tag → commit committer date.
          #   Tiers 1-2 reflect the publish moment; tier 3 can UNDERSTATE freshness — a
          #   lightweight tag re-pointed onto an old commit but pushed today reports the
          #   old commit's age. GitHub exposes no creation time for a lightweight tag
          #   ref, so there is no better signal; any hook that ships a Release or an
          #   annotated tag (the two qurl-service pins today) is covered by tiers 1-2.
          #   Day math is the shared `preflight::classify_age` floor, identical to every
          #   other ecosystem.
          #
          # Anonymous fallback (tier 4 — runs only when tiers 1-3 ALL come back empty):
          #   An organization with a GitHub IP allow list answers 403 to an
          #   AUTHENTICATED API read from a GitHub-hosted runner even when the
          #   repository is PUBLIC. All three tiers above route through `gh api`, so a
          #   single hook hosted in such an org made this check permanently red with
          #   the generic reason "gh api unreachable or tag not found" — the message
          #   that would have explained why having been discarded by a `2>/dev/null`.
          #   Allow lists gate AUTHENTICATED access; anonymous public git read is
          #   unaffected. Same root cause and same remedy as the `git ls-remote` tag
          #   resolution in qurl-reverse-tunnel-server's
          #   .github/scripts/check-action-pin-comments.sh — and, once layervai/
          #   ops-routines#107 lands, as lib/age-check-actions.sh (still open at the time
          #   of writing, so do not read this as describing main).
          #
          #   Tier 4 REPRODUCES tiers 2 and 3 and CANNOT reproduce tier 1:
          #     4a. annotated tag  -> tagger date     (the same bytes as tier 2)
          #     4b. lightweight tag / SHA rev -> committer date (same bytes as tier 3)
          #   A GitHub Release is database metadata with no git object behind it, so
          #   `published_at` has NO anonymous equivalent. The consequence, stated
          #   plainly rather than buried: where a Release was published LATER than the
          #   tag it names, tier 4 reports the older tag date and can therefore pass a
          #   rev that tier 1 would have blocked. The window is bounded and it is the
          #   deliberate price of verifying a hook the API refuses to discuss at all —
          #   the tag was publicly fetchable, and already adoptable by `pre-commit
          #   autoupdate` (which resolves TAGS, not Releases), for exactly as long as
          #   tier 4 reports. The alternative is a required check that stays red
          #   forever for every consumer pinning a hook from an allow-listed org.
          #
          #   Which is exactly why tier 4 does NOT run on every API failure. The
          #   authenticated failure is classified first (see the verdict `kind` block
          #   further down), and a TRANSIENT one — rate limit, 5xx, anything
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/age-check-precommit.sh (part 2 of 3)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/age-check-precommit.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #   unrecognized — fails closed instead of falling through. Otherwise an
          #   unrelated blip would silently convert a tier-1 block into a tier-4 pass on
          #   the very rev whose Release was published today; re-running the job is the
          #   correct and cheap remedy there, and it recovers the real answer. So the
          #   basis swap above is confined to the one class that a re-run can never fix:
          #   the structural block this tier exists for.
          #
          #   All four tiers must fail for a rev to go unverifiable, and unverifiable
          #   still fails closed exactly as before.
          #
          # GITHUB.COM-ONLY (non-github hosts handled explicitly — qurl-service#890):
          #   Age probing uses the GitHub REST API, so only github.com hooks are
          #   verifiable. A non-github host (GitLab/Codeberg/self-hosted) is treated as
          #   UNVERIFIABLE and FAILS CLOSED — the quarantine's natural parallel to the
          #   bot gate's "defer forever, never adopt". Because the check is diff-scoped
          #   (only newly added/changed revs), this blocks ONLY the PR that introduces or
          #   bumps a non-github hook, not every later PR; the `age-check-bypass` label is
          #   the escape hatch for a vetted hook. Acceptable today (this repo pins only
          #   github.com hooks); a real host (with its own age API) can be supported
          #   later without changing callers.
          #
          # Self-reference skip: intentionally OMITTED. The actions check skips pins at
          #   layervai/ops-routines{,-workflows} to dodge a chicken-and-egg on its own
          #   releases. pre-commit hooks never reference the age-check infra, so there is
          #   no parallel — adding a skip-list here would be cargo-culting.
          #
          # Expected env vars:
          #   MIN_AGE_DAYS - default 7 (hook revs are source tags, like go/actions)
          #   BASE_REF     - default 'main'
          #   PRECOMMIT_AGE_DEADLINE_SECONDS - wall clock, measured from the START
          #                  OF THE CHECK, after which no further rev is looked up at
          #                  all — the authenticated tiers and tier 4 alike. Default 420.
          #                  Surfaced by both reusables as the `age_check_deadline_seconds`
          #                  input. Past it, remaining revs are recorded unverifiable
          #                  immediately so the job exits 1 with reasons instead of being
          #                  killed by the job timeout. Must be a POSITIVE INTEGER
          #                  (`0`, negatives and fractions are rejected up front with a
          #                  clear error rather than reaching bash arithmetic); values
          #                  above PRECOMMIT_AGE_DEADLINE_MAX_SECONDS are clamped with a
          #                  warning, because the job is killed at `timeout-minutes`
          #                  regardless.
          #   PRECOMMIT_AGE_DEADLINE_DEFAULT_SECONDS - what an EMPTY (not omitted)
          #                  deadline falls back to, default 420. Set by each reusable to
          #                  match its own YAML `default:`, so empty and omitted agree.
          #                  Not a consumer input.
          #   PRECOMMIT_AGE_DEADLINE_MAX_SECONDS - the clamp ceiling, default 480. Set by
          #                  each reusable from its OWN `timeout-minutes` minus an
          #                  allowance for the work that runs before this clock starts,
          #                  because those differ per flavour. Not a consumer input.
          #
          #                  SIZING IT. A rev is admitted only if it can FINISH by the
          #                  deadline: the gate reserves PRECOMMIT_AGE_MAX_REV_COST (see
          #                  that constant for the arithmetic), so in-flight overshoot is
          #                  accounted for rather than left as headroom to be eroded by
          #                  the next timeout somebody adds. What the caller still has to
          #                  fund is the work OUTSIDE this clock — it starts when the
          #                  SCRIPT does, while `timeout-minutes` starts at JOB start, so
          #                  checkout and the App-token mint sit outside it. At the
          #                  shipped 420 against a 600s job that leaves 180s for setup;
          #                  at the 480 ceiling, 120s.
          #
          #                  Whole-run wall clock is deliberate, not an approximation of
          #                  an anon-git budget: the thing being defended against is the
          #                  job timeout, which measures wall clock too. Metering only
          #                  fetch time would let slow `gh api` tiers exhaust the job
          #                  while the anon budget still read as unspent.
          #   GH_TOKEN     - used for the authenticated release/tag/commit lookups.
          #                  NOTE for self-hosted runners: tier 4 deliberately excludes
          #                  ambient git config, so an `http.proxy` or `http.sslCAInfo`
          #                  in /etc/gitconfig does NOT apply to it. A runner that reaches
          #                  github.com only through such a proxy will fail tier 4 with
          #                  "anonymous git could not reach the host".
          #                  NOT sufficient on its own: an org with a GitHub IP allow
          #                  list 403s an authenticated read from a hosted runner even
          #                  for a public repo. Revs blocked that way (and revs the API
          #                  reports absent) fall back to an anonymous git read; a
          #                  TRANSIENT failure — rate limit, 5xx — does not, and fails
          #                  closed so a re-run can recover the release date. See
          #                  precommit_age::git_publish_dt and the verdict-kind block.
          #
          # Exit codes:
          #   0 - all newly-added hook revs are SHA/tag-resolvable and >= MIN_AGE_DAYS old
          #   1 - a rev is too young, unverifiable, or hosted off github.com
          #
          # ============================================================================

          set -euo pipefail
          IFS=$'\n\t'

          MIN_AGE_DAYS="${MIN_AGE_DAYS:-7}"
          BASE_REF="${BASE_REF:-main}"

          # shellcheck source=lib/_preflight.sh
          source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"

          # ----- Input validation: github slug + tag ----------------------------------

          # These values flow into `gh api` URL paths. They are passed as subprocess
          # list-args (never a shell string), and additionally constrained here so a
          # hostile owner/repo/tag from a compromised hook repo cannot redirect the API
          # path (e.g. a `../` traversal in a tag name). Anything failing the pattern is
          # treated as unverifiable -> fail-closed, never adopted. Mirrors
          # precommit_age_gate.py's SAFE_SLUG / SAFE_TAG.
          precommit_age::is_valid_tag() {
            [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          }

          # Echo the `owner/repo` slug for a github.com hook URL, else return 1.
          # Only `https://github.com/...` (and http / www.) URLs resolve; the scp-style
          # `git@github.com:owner/repo` form, and every non-github host, return 1 and
          # fail closed at the call site. Mirrors precommit_age_gate.py::slug_of,
          # including the explicit `.`/`..` path-segment rejection that SAFE_SLUG alone
          # would let through.
          precommit_age::github_slug() {
            local url="$1" rest host path owner repo
            rest="${url#*://}"
            # No scheme stripped => not an http(s) URL (e.g. scp-style git@host:owner/repo).
            [ "$rest" = "$url" ] && return 1
            host="${rest%%/*}"
            path="${rest#*/}"
            host="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"
            case "$host" in
              github.com|www.github.com) ;;
              *) return 1 ;;
            esac
            path="${path%/}"        # trailing slash
            path="${path%.git}"     # trailing .git
            # Require exactly one slash: reject host-only (`github.com/owner`, no repo —
            # `${path#*/}` would otherwise echo the owner back as a bogus repo) and 3+
            # segments (`owner/repo/extra`) so the slug stays a single owner/repo that
            # can't walk the API path.
            case "$path" in
              */*/*) return 1 ;;   # 3+ segments
              */*) ;;              # exactly owner/repo — ok
              *) return 1 ;;       # no slash => host-only, no repo
            esac
            owner="${path%%/*}"
            repo="${path#*/}"
            [ -n "$owner" ] && [ -n "$repo" ] || return 1
            # Reject `.`/`..` segments explicitly: SAFE_SLUG below allows `.` as an
            # ordinary char, so `owner/..` would otherwise pass and walk the API path.
            case "$owner" in .|..) return 1 ;; esac
            case "$repo" in .|..) return 1 ;; esac
            [[ "$owner/$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || return 1
            printf '%s' "$owner/$repo"
          }

          # Strip a single layer of matching surrounding quotes from a YAML scalar.
          # `revs()`-style values are read raw from the file, so a quoted pin
          # (`rev: "v1.2.3"`) round-trips to the unquoted value for validation + the
          # gh api call. A bare value passes through unchanged.
          precommit_age::unquote() {
            local s="$1" f l
            if [ "${#s}" -ge 2 ]; then
              f="${s:0:1}"
              l="${s:$((${#s} - 1)):1}"
              if { [ "$f" = '"' ] || [ "$f" = "'" ]; } && [ "$f" = "$l" ]; then
                printf '%s' "${s:1:$((${#s} - 2))}"
                return 0
              fi
            fi
            printf '%s' "$s"
          }

          # ----- Separable: find changed pre-commit configs ---------------------------

          # Split `git diff` from the awk filter so a diff failure (missing base ref,
          # etc.) doesn't silently pass as "no changes detected." Caller is expected to
          # have already invoked `preflight::verify_base_ref`. Matches the canonical
          # `.pre-commit-config.yaml` (and `.yml`) at any directory depth — monorepos can
          # carry nested configs used with `pre-commit -c`.
          precommit_age::changed_configs() {
            local base_rev="$1" diff_out
            diff_out=$(preflight::git_diff_or_fail --name-only "${base_rev}...HEAD") || return 1
            printf '%s\n' "$diff_out" \
              | awk '/(^|\/)\.pre-commit-config\.ya?ml$/' \
              | sort -u || true
          }

          # ----- Separable: parse remote (repo URL -> rev) pairs ----------------------

          # Read a pre-commit config document on stdin, emit one `url<TAB>rev` line per
          # remote hook that carries a `rev:`. A disciplined line walk (NOT a full YAML
          # parse): track the most recent `repo:` value, and on a `rev:` line emit it for
          # that repo. This mirrors the bot gate's documented assumption that every hook
          # block lists `repo:` before its `rev:` — which `pre-commit autoupdate` always
          # emits, and humans conventionally write. Comments and surrounding quotes are
          # left on the raw value here; the caller normalizes (`unquote`) before use, and
          # `repo: local` / `meta` blocks carry no `rev:` so they never emit. Exotic
          # shapes (flow style, anchors) are not handled — a rev the walk can't associate
          # is simply not checked, which is safe because the diff-vs-base comparison in
          # `changed_pins` only ever ADDS work; it never suppresses a sibling ecosystem.
          precommit_age::pairs_from_text() {
            awk '
              {
                line = $0
                # Strip a trailing inline comment ( # ...). Requires whitespace before
                # the # so a # inside a value is not eaten (hook URLs/tags carry none).
                sub(/[[:space:]]+#.*$/, "", line)
              }
              match(line, /^[[:space:]]*-?[[:space:]]*repo:[[:space:]]*/) {
                val = substr(line, RSTART + RLENGTH)
                sub(/[[:space:]]+$/, "", val)
                cur = val
                next
              }
              match(line, /^[[:space:]]*rev:[[:space:]]*/) {
                val = substr(line, RSTART + RLENGTH)
                sub(/[[:space:]]+$/, "", val)
                if (cur != "" && val != "") print cur "\t" val
                next
              }
            '
          }

          # Emit `url<TAB>rev` for every remote hook pin that is newly added or changed
          # in <file> relative to <base_rev> — the set difference of the after-state
          # pairs minus the before-state pairs (full-line, tab-joined), so a brand-new
          # hook (whole file added => empty before) and a bumped rev are both caught
          # while an untouched pin is not. Deliberately OVER-checks rather than
          # under-checks: a rev re-pinned to a previously-used (older) tag is
          # re-verified and simply passes.
          #
          # The probe, the base-image read, both checked parses and the difference are
          # `preflight::new_lines_since_base` — the one comparator every ecosystem that
          # reads a base image shares, so this file and npm cannot drift on those
          # details again. `pairs_from_text` already met its parser contract (stdin
          # text -> lines on stdout, non-zero on input it cannot read), so what is
          # left here is naming the binding. Exit codes pass through unchanged: 2 for
          # the base image (read or parse — a checkout problem), 1 for the head config,
          # which is exactly the split main() renders.
          #
          # <base_rev> is preflight::base_rev, the merge base `changed_configs` also
          # diffs against (see verify_base_ref for why the tip is the wrong image).
          precommit_age::changed_pins() {
            preflight::new_lines_since_base "$1" "$2" precommit_age::pairs_from_text
          }

          # ----- Failure-reason plumbing ----------------------------------------------

          # Path to the file carrying the verdict on the last publish_dt lookup.
          # A FILE, not just a variable, because `publish_dt` and all four of its tiers
          # are invoked as `ts=$(...)` — a command substitution runs in a SUBSHELL, so a
          # plain assignment would be discarded at exactly the moment the caller needs
          # it. main() creates the file; a stub that replaces `publish_dt` wholesale (as
          # the tests do) simply leaves it empty and the caller falls back to a generic
          # reason.
          #
          # The FILE is the only channel that actually works. `write_verdict` also sets
          # the two variables below, but every writer is reached from inside a
          # command substitution, so with no file path set the assignment dies with the
          # subshell and NOTHING is recorded — there is no usable "variable-only mode",
          # and the variables are a local convenience for same-shell reads only. A
          # direct unit call that skips main() therefore observes an empty verdict; the
          # tier-4 gate in publish_dt is an allowlist specifically so that empty case
          # fails CLOSED rather than reading as "no failure observed".
          #
          # The verdict is `<kind>\t<reason>`. `kind` classifies an AUTHENTICATED
          # failure and decides whether tier 4 is allowed to answer at all:
          #
          #   blocked   - the authenticated channel is structurally unavailable to this
          #               runner (an org IP allow list). Permanent: a re-run never helps,
          #               and anonymous git is unaffected. Tier 4 RUNS.
          #   absent    - 404. There is no Release / tag / commit to read, so tier 1 has
          #               no answer being masked. Tier 4 runs and will normally fail too,
          #               which is the correct outcome with a better reason.
          #   transient - rate limit, 5xx, or anything unrecognized. Tier 1's
          #               `published_at` may well exist and simply be unreadable this
          #               minute. Tier 4 is NOT run: it would silently swap the Release
          #               basis for the older tag basis (see the header) when a re-run
          #               would have recovered the real answer. FAIL CLOSED instead.
          #
          # The default is deliberately `transient`, the fail-closed class: an
          # unrecognized message must never quietly loosen the age basis. A new
          # structural-block wording shows up verbatim in the job log via `log_detail`,
          # and belongs in the `blocked` arm of `note_api_failure` once observed.
          # NOT seeded from the environment, matching actions_age. main() is the only
          # writer and that is load-bearing rather than incidental: a pre-seeded path
          # would let a caller choose where reasons are written.
          PRECOMMIT_AGE_REASON_FILE=""
          PRECOMMIT_AGE_LOOKUP_KIND=""
          PRECOMMIT_AGE_LOOKUP_REASON=""

          precommit_age::write_verdict() {
            local kind="$1" reason="$2"
            PRECOMMIT_AGE_LOOKUP_KIND="$kind"
            PRECOMMIT_AGE_LOOKUP_REASON="$reason"
            [ -n "$PRECOMMIT_AGE_REASON_FILE" ] && printf '%s\t%s' "$kind" "$reason" > "$PRECOMMIT_AGE_REASON_FILE"
            return 0
          }

          precommit_age::read_verdict() {
            if [ -n "$PRECOMMIT_AGE_REASON_FILE" ] && [ -s "$PRECOMMIT_AGE_REASON_FILE" ]; then
              cat "$PRECOMMIT_AGE_REASON_FILE"
              return 0
            fi
            if [ -n "${PRECOMMIT_AGE_LOOKUP_KIND}${PRECOMMIT_AGE_LOOKUP_REASON}" ]; then
              printf '%s\t%s' "$PRECOMMIT_AGE_LOOKUP_KIND" "$PRECOMMIT_AGE_LOOKUP_REASON"
            fi
            return 0
          }

          # Reasons come from a FIXED vocabulary defined in this file — never from
          # upstream text — because they are interpolated into markdown and workflow-
          # command channels that `preflight::record_unverifiable` only partially
          # escapes. The verbatim upstream error goes to the job log instead, via
          # `precommit_age::log_detail`. This writer carries no kind (`-`): it is for the
          # anonymous tier and for the final composed reason, neither of which feeds the
          # tier-4 gate.
          precommit_age::set_reason() {
            precommit_age::write_verdict "-" "$1"
          }

          precommit_age::get_reason() {
            local raw; raw=$(precommit_age::read_verdict)
            printf '%s' "${raw#*$'\t'}"
          }

          precommit_age::get_api_kind() {
            local raw; raw=$(precommit_age::read_verdict)
            [ -z "$raw" ] && return 0
            printf '%s' "${raw%%$'\t'*}"
          }

          precommit_age::clear_reason() {
            PRECOMMIT_AGE_LOOKUP_KIND=""
            PRECOMMIT_AGE_LOOKUP_REASON=""
            [ -n "$PRECOMMIT_AGE_REASON_FILE" ] && : > "$PRECOMMIT_AGE_REASON_FILE"
            return 0
          }

          # One spelling of the deadline verdict, shared by every path that gives up on
          # it — the API gate, tier 4's entry check and its bare-SHA recheck. Three
          # hand-written copies would drift, and one of them already said the wrong thing.
          PRECOMMIT_AGE_DEADLINE_REASON="run deadline reached before this rev could be checked; re-run, or raise age_check_deadline_seconds if it happens every time"

          # Worst-case wall clock ONE rev can consume once admitted. The deadline gates
          # whether the NEXT rev starts, so a rev admitted a second before it still runs
          # to completion — and a ceiling chosen to "leave room" for that silently goes
          # stale every time a timeout is added to the rev path. It already did once:
          # the `--filter` retry widened this by two fetches after the ceiling was set.
          # So RESERVE it explicitly instead, and derive the number from the timeouts:
          #
          #   3 x `timeout 30`   authenticated tiers 1-3
          #   4 x `timeout 20`   tier 4: tag fetch + bare-SHA fetch, each with the
          #                      one-shot unfiltered retry
          #
          # Anything that adds a bounded call to the rev path must add it here too.
          #
          # Subtracted ONCE, as headroom — not charged per rev. Admission therefore runs
          # until `deadline - 170` of ELAPSED check time, so how many revs fit depends on
          # how slow they are, not on a per-rev allowance: a dozen hooks resolving in
          # ~1s each use ~12s of a 190-250s window. The reservation only bites when revs
          # are individually slow, which is exactly the case where the alternative is
          # the job being cancelled with no annotations at all.
          PRECOMMIT_AGE_MAX_REV_COST=170

          precommit_age::kind_rank() {
            case "$1" in
              blocked)   printf '3' ;;
              transient) printf '2' ;;
              absent)    printf '1' ;;
              *)         printf '0' ;;
            esac
          }

          # Record an AUTHENTICATED failure, keeping the highest-ranking verdict seen
          # across the three tiers. Ranking matters in both directions:
          #
          #   - a 404 on tier 2 must not erase an allow-list 403 from tier 1 (tiers 1-2
          #     legitimately 404 on every lightweight-tag pin, so `absent` is the least
          #     informative thing we can learn);
          #   - a transport blip on tier 2 must not erase it either, or the operator
          #     loses the one signal saying this is a network-position problem rather
          #     than an outage — and tier 4, the actual remedy, would be skipped.
          #
          # `blocked` therefore outranks `transient`: an allow list is permanent, and an
          # incidental blip alongside it must not reintroduce the permanently-red check
          # this tier exists to fix.
          #
          # ACCEPTED EDGE, stated rather than hidden: if tier 1 fails transiently and a
          # LATER tier returns the allow-list 403, the verdict is `blocked` and the basis
          # swap happens on a failure a re-run might have fixed. It is the one gap in
          # "the swap is confined to the structural block". An allow list 403s all three
          # tiers uniformly, so this needs a rate limit and an allow list to interleave
          # within one rev; taking the other side would cost the permanently-red check in
          # the common case, which is the worse trade.
          # `-gt`, deliberately, not `-ge`: rate-limit, 5xx and the catch-all all carry
          # kind `transient` but DIFFERENT reasons, and at equal rank the last writer
          # would win — a rate limit on tier 1 followed by anything unrecognized on tier
          # 2 would leave the operator with the generic "gh api unreachable" instead of
          # the one message that names the remedy. First-most-specific wins instead. The
          # initial verdict is empty (rank 0) and every real kind ranks >= 1, so the
          # first observation still always writes, and the blocked > transient > absent
          # escalation is unaffected.
          precommit_age::set_api_verdict() {
            local kind="$1" reason="$2" cur
            cur=$(precommit_age::get_api_kind)
            if [ "$(precommit_age::kind_rank "$kind")" -gt "$(precommit_age::kind_rank "$cur")" ]; then
              precommit_age::write_verdict "$kind" "$reason"
            fi
            return 0
          }

          # Echo an upstream error verbatim into the job log. This is the half of the
          # old `2>/dev/null` that was worth keeping: an operator reading a red run
          # needs GitHub's actual words ("IP allow list", "Not Found", a TLS error), not
          # our paraphrase of them. Plain `echo`, not `::error::`, so it annotates
          # nothing.
          #
          # Collapses colon RUNS rather than substituting pairs. Pair substitution was
          # not idempotent (`:::` yielded `:.::`, which still contains `::`), which left
          # the guarantee resting on the label prefix — and therefore on the runner
          # parsing `::` only at the start of a line, which is not a property worth
          # betting on. Ported verbatim from actions_age::log_detail so #110's hoist is
          # a pure move; having two copies defend the same channel differently is worse
          # than either choice.
          precommit_age::log_detail() {
            local label="$1" text="$2"
            [ -z "$text" ] && return 0
            # Say so when the text was altered. The collapse is not free: it mangles
            # legitimate diagnostics carrying `::` — an IPv6 peer in a curl error
            # (`Failed to connect to 2606:50c0::153`) is exactly the transport failure
            # this is trying to make legible. Keeping the defang and labelling it beats
            # presenting altered text as verbatim.
            case "$text" in
              *::*) label="${label} (colon runs collapsed)" ;;
            esac
            printf '%s\n' "$text" | sed 's/::\{1,\}/:/g' | sed "s/^/  ${label}: /" >&2
            return 0
          }

          # ----- Separable: tag publish timestamp via GitHub REST ---------------------

          # Single field from `gh api <path> --jq <jq>`, or empty on any error.
          # Fail-closed: non-zero exit, empty body, or literal `null` all map to "" so
          # the caller treats the pin as unverifiable rather than adopting it unchecked.
          #
          # Stderr is captured rather than discarded so the failure can be CLASSIFIED
          # (an org IP allow list is a network-position problem, not a missing tag) and
          # so GitHub's own words reach the job log. The return contract is unchanged —
          # always 0, value on stdout — because all three call sites below branch on
          # `[ -z "$ts" ]`, not on exit status.
          precommit_age::gh_api() {
            local path="$1" jq="$2" out err err_file rc=0
            # An infrastructure failure must not read like "the API returned 200 with an
            # empty field": without a verdict the kind stays empty, which is not
            # `transient`, so tier 4 would run and the fail-closed default would not be
            # uniform across the ways this function can give up.
            err_file=$(mktemp) || {
              precommit_age::set_api_verdict transient "could not allocate a temp file for the API read"
              printf '%s' ""
              return 0
            }
            # Bounded for the same reason `anon_git` is. The run deadline stops tier 4
            # ADDING to a slow run, but nothing stopped tiers 1-3 consuming the job
            # timeout on their own: a PR bumping 15 hooks issues up to 45 calls, and `gh`
            # rides Go's default transport, which has connection timeouts but no overall
            # request deadline. A cancelled run suppresses every annotation and the
            # `!cancelled()` comment step — the outcome the deadline exists to prevent.
            # An `rc` of 124 falls through the classifier's default to `transient`, which
            # is the right class: fail closed, and a re-run may well help.
            out=$(timeout 30 gh api "$path" --jq "$jq" 2>"$err_file") || rc=$?
            if [ "$rc" -eq 124 ]; then
              # `timeout` kills without a word, so err_file is empty and the catch-all
              # arm would fire the classification-drift `::warning::` on ordinary
              # network slowness. That warning is the one signal that has to stay
              # meaningful; crying drift over a known class is how it gets ignored.
              rm -f "$err_file"
              precommit_age::set_api_verdict transient "gh api call timed out; re-run the job"
              out=""
            elif [ "$rc" -ne 0 ]; then
              err=$(cat "$err_file")
              rm -f "$err_file"
              precommit_age::note_api_failure "$err"
              out=""
            else
              rm -f "$err_file"
            fi
            [ "$out" = "null" ] && out=""
            printf '%s' "$out"
          }

          # Map one `gh api` failure onto a kind + a fixed reason, and decide whether it
          # deserves a job-log line. A 404 is ORDINARY traffic here — tiers 1 and 2 miss
          # on every lightweight-tag pin — so it is recorded quietly. Anything else is
          # genuinely abnormal and is logged verbatim the moment it happens.
          precommit_age::note_api_failure() {
            local err="$1"
            case "$err" in
              # ORDER MATTERS. Rate limits and a bad token are themselves 403/401
              # responses, so they are taken out of the running before the status-based
              # structural arm below can claim them.
              *"rate limit"*|*"HTTP 429"*)
                precommit_age::log_detail "gh api" "$err"
                precommit_age::set_api_verdict transient "gh api rate limit hit; re-run the job"
                ;;
              # A missing or invalid token is a KNOWN class, and telling the operator to
              # add its wording to the `blocked` arm would be wrong advice. Same reason
              # rc=124 got its own arm: the drift alarm only stays useful while it means
              # drift. Fail closed rather than route around a misconfiguration.
              *"gh auth login"*|*"GH_TOKEN"*|*"Bad credentials"*|*"authentication"*)
                precommit_age::log_detail "gh api" "$err"
                precommit_age::set_api_verdict transient "gh api rejected the token; check GH_TOKEN"
                ;;
              *"Not Found"*|*"HTTP 404"*)
                precommit_age::set_api_verdict absent "no release, tag, or commit for this rev via the API"
                ;;
              # KEYED ON STATUS, not wording. Matching "IP allow list" alone meant a
              # reworded body would silently demote every allow-listed org to
              # `transient` — back to the permanently-red required check this whole
              # change exists to remove, with nothing signalling the regression. A 403
              # that is not a rate limit is a STRUCTURAL refusal of the AUTHENTICATED
              # read: an org IP allow list, SAML enforcement, a third-party-application
              # restriction, "not accessible by integration". Anonymous public git is
              # unaffected by every one of them, so they share one remedy — and keying
              # on status degrades in the SAFE direction when GitHub changes its prose.
              # The wording match survives only to pick the more specific REASON.
              *"HTTP 403"*|*"IP allow list"*|*"not permitted to access this resource"*)
                precommit_age::log_detail "gh api" "$err"
                case "$err" in
                  *"IP allow list"*|*"not permitted to access this resource"*)
                    precommit_age::set_api_verdict blocked "org IP allow list blocked the authenticated API read" ;;
                  *)
                    precommit_age::set_api_verdict blocked "the authenticated API read was refused (HTTP 403); anonymous git is unaffected" ;;
                esac
                ;;
              # 5xx is the other class where a re-run genuinely recovers tier 1's
              # answer, so it is named separately for the operator even though it shares
              # the fail-closed `transient` kind with the default.
              *"HTTP 5"*)
                precommit_age::log_detail "gh api" "$err"
                precommit_age::set_api_verdict transient "gh api server error; re-run the job"
                ;;
              *)
                # LOUD, not just logged. An unrecognized failure on a required check is
                # how classification drift announces itself, and `log_detail`'s plain
                # stderr sinks into ordinary job noise — nobody would be looking. Fixed
                # text only: the upstream words go to the log, never into an annotation.
                #
                # `>&2` IS LOAD-BEARING, not style. This function is only ever reached
                # from `gh_api`, and every gh_api call site is `ts=$(...)`. On stdout the
                # annotation is not merely invisible — it is CAPTURED INTO `$ts`, which
                # then reads as a successful tier-1 lookup: tiers 2-3 are skipped by
                # their `[ -z "$ts" ]` guards, tier 4 is never consulted, and publish_dt
                # returns 0 with the warning text as the timestamp. The runner parses
                # workflow commands on stderr too, so this both renders and stays out of
                # the return value.
                echo "::warning::Unrecognized gh api failure — classified as transient (fail-closed). If this is a structural block, add its wording to the blocked arm of precommit_age::note_api_failure. Verbatim error is in the job log." >&2
                precommit_age::log_detail "gh api" "$err"
                precommit_age::set_api_verdict transient "gh api unreachable"
                ;;
            esac
            return 0
          }

          # ----- Separable: tag publish timestamp via anonymous git (tier 4) ----------

          # EVERY git invocation on the anonymous path runs through here, so the
          # scrubbing is uniform and there is exactly one place to harden.
          #
          # ANONYMITY IS LOAD-BEARING, NOT TIDINESS: an allow list rejects an
          # AUTHENTICATED read, so a credential leaking into this fetch would reproduce
          # the very 403 the fallback exists to route around — and would classify as a
          # generic failure, hiding why. A fresh temp repo excludes the local
          # `.git/config` extraheader `actions/checkout` writes; every other channel here
          # defeats that guard on its own. This list is kept IDENTICAL to
          # `actions_age::anon_git` in lib/age-check-actions.sh, which carries the full
          # per-channel derivation and the verification notes; a test asserts the two do
          # not drift, and layervai/ops-routines#110 will hoist them into one definition.
          # In brief, and none of these is hypothetical:
          #
          #   GIT_CONFIG_COUNT + GIT_CONFIG_KEY_n/VALUE_n, GIT_CONFIG_PARAMETERS
          #       inject config at COMMAND-LINE precedence, above the files neutralized
          #       below. Verified here: a planted `http.extraheader: Authorization:
          #       basic ...` reached the wire and github.com answered HTTP 400.
          #   GIT_ASKPASS / SSH_ASKPASS
          #       consulted BEFORE the terminal prompt, so GIT_TERMINAL_PROMPT=0 alone
          #       does not stop them re-authenticating.
          #   GIT_DIR / GIT_COMMON_DIR / GIT_WORK_TREE / GIT_INDEX_FILE /
          #   GIT_OBJECT_DIRECTORY / GIT_ALTERNATE_OBJECT_DIRECTORIES / GIT_NAMESPACE
          #       outrank `git -C`. Verified: with GIT_DIR set, `anon_git init -q
          #       "$work"` never creates $work/.git at all — it initializes GIT_DIR, so
          #       the fetch then runs inside the consumer checkout, the one repo on the
          #       machine carrying actions/checkout's extraheader.
          #   HOME (via ~/.netrc), XDG_CONFIG_HOME
          #       NOT a git-config channel: git hands libcurl CURL_NETRC_OPTIONAL, so
          #       ~/.netrc is read independently of git config and `-c
          #       credential.helper=` does not apply to it. Pointed at a FRESH EMPTY
          #       DIRECTORY the caller allocates, never at an ambient override — see
          #       git_publish_dt.
          #   GIT_EXEC_PATH
          #       the dispatch table for every git subcommand and remote helper —
          #       `git-remote-https` and `git-fetch` are resolved through it. Strictly
          #       larger than the template-dir door below: a planted directory gets code
          #       execution on the FIRST call here, with no ref update needed to trigger
          #       it. Config-free, so none of the lines above touch it.
          #   GIT_TEMPLATE_DIR
          #       a config-free route to the same place `init.templateDir` reaches, so
          #       neutralizing the config channels alone does NOT stop a planted
          #       `reference-transaction` hook from firing on the fetch's ref update —
          #       which is the outcome routing `git init` through this wrapper is
          #       supposed to prevent.
          #   GIT_SSL_NO_VERIFY
          #       age-check-actions.sh can leave this alone: it fetches a 40-hex SHA, so
          #       content-addressing means a MITM can only make the fetch FAIL, never
          #       substitute a different date — TLS is availability there, not
          #       integrity. THAT ARGUMENT DOES NOT HOLD HERE. Tier 4's primary path
          #       fetches `refs/tags/<rev>`, a NAME, and reads the date off whatever
          #       object comes back; with verification disabled the tagger date this
          #       tier trusts would be attacker-supplied. Scrubbed in both files anyway,
          #       so the one wrapper stays one wrapper.
          #
          # `-c http.extraheader=` is git's documented reset for that multi-valued key.
          # Belt-and-braces once the channels above are shut, but it names the
          # actions/checkout vector explicitly rather than leaving it to inference.
          #
          # The READS matter as much as the fetch: `--filter=blob:none` makes the temp
          # repo a promisor, so an object read that missed locally would hit the network
          # — unbounded and unscrubbed without this. `timeout` bounds each call. 20s, not
          # 30: tier 4 can make two attempts per rev, once per changed pin. The aggregate
          # bound is `PRECOMMIT_AGE_DEADLINE_SECONDS` (see git_publish_dt), with the
          # reusable's `timeout-minutes` as the outer belt — not the other way round, and
          # deliberately not the job timeout alone, because a timeout kill cancels the
          # run and suppresses every annotation.
          #
          # PRECOMMIT_AGE_ANON_HOME below is NOT seeded from the environment,
          # deliberately. Every call site sets it as a `local` pointing at a fresh empty
          # directory it just allocated, and dynamic scoping means that local wins. Read
          # from the ambient environment, though, the value would be attacker-choosable,
          # and pointing HOME at a directory holding a `.netrc` reopens the one channel
          # `-c credential.helper=` demonstrably does not cover. Clearing it at module
          # scope makes the caller's local the ONLY way it can be set, so the guarantee
          # does not depend on every future call site remembering to shadow it.
          PRECOMMIT_AGE_ANON_HOME=""

          precommit_age::anon_git() {
            env -u GIT_ASKPASS -u SSH_ASKPASS -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT \
              -u GIT_DIR -u GIT_COMMON_DIR -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY \
              -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_INDEX_FILE -u GIT_NAMESPACE \
              -u GIT_TEMPLATE_DIR -u GIT_SSL_NO_VERIFY -u GIT_EXEC_PATH \
              -u GIT_SSL_CAINFO -u GIT_SSL_CAPATH -u GIT_SSL_CERT -u GIT_SSL_KEY \
              -u GIT_SSL_VERSION -u GIT_SSL_CIPHER_LIST \
              -u SSL_CERT_FILE -u SSL_CERT_DIR -u CURL_CA_BUNDLE \
              -u GIT_TRACE -u GIT_TRACE2 -u GIT_TRACE2_EVENT -u GIT_TRACE2_PERF \
              -u GIT_TRACE_CURL -u GIT_TRACE_PACKET -u GIT_TRACE_PACKFILE \
              -u GIT_TRACE_SETUP -u GIT_TRACE_PERFORMANCE -u GIT_TRACE_SHALLOW \
              -u GIT_TRACE_PACK_ACCESS -u GIT_TRACE_REFS -u GIT_TRACE_FSMONITOR \
              -u SSLKEYLOGFILE -u GIT_SSH -u GIT_SSH_COMMAND -u GIT_PROXY_COMMAND \
              HOME="${PRECOMMIT_AGE_ANON_HOME:-/nonexistent}" \
              XDG_CONFIG_HOME="${PRECOMMIT_AGE_ANON_HOME:-/nonexistent}" \
              GIT_TERMINAL_PROMPT=0 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_SYSTEM=/dev/null \
              timeout 20 git -c credential.helper= -c http.extraheader= "$@"
          }

          # One credential-free `git fetch` into <work>. Everything after <work> and
          # <err_file> is handed to `git fetch` verbatim; its stderr lands in <err_file>.
          #
          # `--filter=blob:none` is NOT redundant with `--depth=1`: depth bounds how much
          # HISTORY is sent, the filter bounds how much CONTENT. Depth-1 alone still
          # ships the pinned commit's complete tree, which for a large action repo is
          # megabytes we never read — this tier only ever runs `cat-file -t`,
          # `for-each-ref` and `log -1`, none of which touch a blob, so no lazy fetch can
          # fire against the promisor remote the filter creates. A server without
          # partial-clone support ignores it with a warning rather than failing.
          precommit_age::anon_fetch() {
            local work="$1" err_file="$2"
            shift 2
            local rc=0
            precommit_age::anon_git -C "$work" \
              fetch --quiet --depth=1 --no-tags --filter=blob:none "$@" 2>"$err_file" || rc=$?
            [ "$rc" -eq 0 ] && return 0

            # The comment above is true of SERVERS — they ignore an unsupported filter
            # with a warning. It is NOT true of older CLIENTS, which refuse `--filter`
            # outright unless the remote is configured with `extensions.partialClone`.
            # Without this retry tier 4 is DEAD on a self-hosted runner with an older
            # git image: every rev reports "anonymous git fallback failed" and the check
            # is permanently red for an allow-listed org — the exact symptom this whole
            # change removes, wearing a different message. Ported from
            # actions_age::git_committer_date.
            local fetch_err; fetch_err=$(cat "$err_file")
            local filter_rejected=false
            case "$fetch_err" in
              *"--filter"*|*"filtering not recognized"*|*"extensions.partialClone"*|*"partialclone"*)
                filter_rejected=true ;;
              # The case the retry was actually written for. git's parse-options strips
              # the leading `--` before formatting, so a client too old to know the
              # option emits `error: unknown option \`filter=blob:none'` — which matches
              # none of the patterns above. Verified on git 2.43.
              *"unknown option"*"filter"*)
                filter_rejected=true ;;
            esac
            [ "$filter_rejected" = true ] || return "$rc"

            precommit_age::log_detail "anonymous git" "$fetch_err"
            echo "  retrying the anonymous fetch without --filter (server or client lacks partial clone)" >&2
            rc=0
            precommit_age::anon_git -C "$work" \
              fetch --quiet --depth=1 --no-tags "$@" 2>"$err_file" || rc=$?
            return "$rc"
          }

          # Map one anonymous-fetch failure onto the fixed reason vocabulary.
          precommit_age::classify_git_error() {
            case "$1" in
              # `couldn't find remote ref` is git's answer for a tag the remote does not
              # publish; `upload-pack: not our ref` is the same answer for a SHA. Either
              # way the rev is absent upstream — distinct from "we could not reach the
              # repository at all".
              *"couldn't find remote ref"*|*"not our ref"*)
                precommit_age::set_reason "rev not found in the public repository" ;;
              # The server HAS the object but will not serve it directly — a mirror or a
              # GHES without `uploadpack.allowAnySHA1InWant`. Distinct from absent,
              # because the remedy is different: nothing about the rev is wrong.
              *"unadvertised object"*)
                precommit_age::set_reason "the public repository does not serve unadvertised objects" ;;
              *"could not read Username"*|*"Authentication failed"*|*"Repository not found"*)
                precommit_age::set_reason "repository is not publicly readable and the API read failed" ;;
              # `anon_git` deliberately excludes ambient git config, so a runner that
              # reaches github.com only through an `http.proxy` or a custom
              # `http.sslCAInfo` in /etc/gitconfig cannot connect here. Name it rather
              # than let this tier's own scrubbing surface as a generic failure.
              *"Could not resolve host"*|*"Failed to connect"*|*"unable to access"*|*"SSL certificate problem"*|*"Connection timed out"*)
                precommit_age::set_reason "anonymous git could not reach the host (this tier excludes ambient git transport config such as http.proxy)" ;;
              *)
                precommit_age::set_reason "anonymous git fallback failed" ;;
            esac
            return 0
          }

          # Tier 4 — resolve the rev's publish moment with NO credentials. Echo an
          # ISO-8601 timestamp, or return 1 having recorded a reason.
          #
          # WHY A FETCH AND NOT `git ls-remote`: ls-remote is the right primitive for
          # resolving a tag to a SHA, but it publishes no DATES, and a date is the only
          # thing this check wants. So we fetch the one ref and read the timestamp off
          # the object itself. That also sidesteps, structurally, the annotated-tag trap
          # documented in qurl-reverse-tunnel-server's check-action-pin-comments.sh
          # (`git/ref/tags/<tag>` returns the TAG-OBJECT sha, not the commit, so the
          # peeled `refs/tags/<tag>^{}` line is the one to read): we never compare SHAs
          # at all, we ask `cat-file -t` what kind of object the ref names and read the
          # matching date field. `git log -1` peels an annotated tag on its own, so the
          # lightweight path doubles as the fallback for a tag object with no tagger.
          #
          # WHY IT IS NOT WEAKER THAN THE API for the tiers it covers: git is content-
          # addressed and these are the same objects the REST API reads its answer from.
          # `%(taggerdate:iso-strict)` is the byte-for-byte source of tier 2's
          # `.tagger.date`; `%cI` is tier 3's `.commit.committer.date`. Both are
          # author-controlled in either tier; the trust model does not change. What
          # tier 4 CANNOT do is stand in for tier 1 — see the header, and see the
          # `transient` gate in publish_dt that keeps that substitution from happening
          # on a failure a re-run would have fixed.
          precommit_age::git_publish_dt() {
            local slug="$1" rev="$2"
            local work err_file err rc=0 obj_type ts="" basis=""

            # RUN DEADLINE. `timeout 20` bounds ONE fetch, but in an allow-listed
            # org EVERY changed pin reaches tier 4, a `pre-commit autoupdate` PR
            # routinely bumps 5-15 hooks, and each can cost two fetches. Left unbounded
            # that reaches the reusable's job timeout — and a timeout KILL is strictly
            # worse than a slow job: the run is CANCELLED, so the `::error` annotations
            # never render and the comment step (gated on `!cancelled()`) never posts.
            # The operator would get less signal than the permanently-red check this
            # whole change exists to fix. Past the deadline the remaining revs are
            # recorded unverifiable immediately, so the job still exits 1 with reasons.
            if [ -n "${PRECOMMIT_AGE_DEADLINE:-}" ] && \
               [ "$(date +%s)" -ge "$PRECOMMIT_AGE_DEADLINE" ]; then
              # Name the knob: a re-run only helps if the exhaustion was caused by
              # transient slowness. A PR bumping enough pins to exhaust the budget
              # DETERMINISTICALLY needs a bigger budget, not another attempt, and the
              # operator should not have to guess which case they are in.
              precommit_age::set_reason "$PRECOMMIT_AGE_DEADLINE_REASON"
              return 1
            fi

            work=$(mktemp -d) || { precommit_age::set_reason "anonymous git fallback could not init a workspace"; return 1; }
            err_file=$(mktemp) || {
              rm -rf "$work"
              precommit_age::set_reason "anonymous git fallback could not init a workspace"
              return 1
            }
            # An empty directory to stand in for $HOME, so no ambient ~/.netrc,
            # ~/.gitconfig or XDG config is reachable from any call in this tier. A
            # `local` deliberately SHADOWS any ambient PRECOMMIT_AGE_ANON_HOME: read
            # from the environment it would be attacker-choosable, and pointing it at a
            # directory containing a .netrc reopens exactly the channel the wrapper
            # singles out as not covered by `-c credential.helper=`.
            local anon_home
            anon_home=$(mktemp -d) || {
              rm -rf "$work" "$err_file"
              precommit_age::set_reason "anonymous git fallback could not init a workspace"
              return 1
            }
            local PRECOMMIT_AGE_ANON_HOME="$anon_home"

            if ! precommit_age::anon_git init -q "$work" >/dev/null 2>&1; then
              rm -rf "$work" "$err_file" "${anon_home:-}"
              precommit_age::set_reason "anonymous git fallback could not init a workspace"
              return 1
            fi

            # TAG FIRST, even for a hex-shaped rev: git's own rev resolution prefers
            # `refs/tags/<name>` over an object id, so this matches how `pre-commit`
            # itself would check the rev out. `slug` and `rev` reached here through
            # `github_slug` and `is_valid_tag`, whose character classes exclude every
            # refspec and URL metacharacter (no `:`, `^`, `~`, `*`, whitespace, and no
            # leading `-`), and both are passed as single argv elements.
            precommit_age::anon_fetch "$work" "$err_file" \
              "https://github.com/${slug}.git" "refs/tags/${rev}:refs/tags/${rev}" || rc=$?

            if [ "$rc" -eq 0 ]; then
              obj_type=$(precommit_age::anon_git -C "$work" cat-file -t "refs/tags/${rev}" 2>/dev/null) || obj_type=""
              if [ "$obj_type" = "tag" ]; then
                # 4a — annotated tag. Re-pointing an annotated tag writes a NEW tag
                # object with a new tagger date, which is why tiers 2 and 4a are a
                # faithful "when did this become adoptable" and tier 3/4b is not.
                # `for-each-ref <pattern>` matches at `/` boundaries, so this would also
                # match `refs/tags/<rev>/x`. Safe twice over: is_valid_tag excludes `/`
                # from `rev`, and the temp repo holds exactly the one ref just fetched.
                ts=$(precommit_age::anon_git -C "$work" for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/${rev}" 2>/dev/null) || ts=""
                basis="the annotated tag object"
              fi
              if [ -z "$ts" ]; then
                # 4b — lightweight tag (or a tag object carrying no tagger line, which
                # `log -1` peels through). Same freshness caveat as tier 3.
                ts=$(precommit_age::anon_git -C "$work" log -1 --format=%cI "refs/tags/${rev}" 2>/dev/null) || ts=""
                basis="the tagged commit (lightweight tag — freshness may be understated)"
              fi
            else
              err=$(cat "$err_file")
              # A `rev:` is conventionally a tag, but pre-commit accepts a full SHA and
              # tier 3 resolves one, so the fallback covers the same input space rather
              # than silently narrowing it. Abbreviated SHAs are excluded: GitHub only
              # serves a fetch for a full object id.
              #
              # The tag-namespace miss above is EXPECTED for a SHA rev, so it is NOT
              # logged before this attempt — same discipline as the 404s on API tiers 1
              # and 2. Printing it would put `fatal: couldn't find remote ref` in the log
              # of a run that then succeeds, which reads as a failure and is not one.
              # Re-checked here, not just on entry: otherwise a rev starting one second
              # before the deadline could run BOTH fetches and overshoot by two full
              # `timeout 20`s. With the recheck the overshoot is bounded by one.
              local sha_skipped_for_deadline=0
              if [[ "$rev" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] && \
                 [ -n "${PRECOMMIT_AGE_DEADLINE:-}" ] && \
                 [ "$(date +%s)" -ge "$PRECOMMIT_AGE_DEADLINE" ]; then
                # Tracked, not silently skipped: `err` still holds the TAG fetch's
                # "couldn't find remote ref", and letting that reach classify_git_error
                # would tell the reviewer their SHA pin is bogus when it was never even
                # attempted.
                sha_skipped_for_deadline=1
              elif [[ "$rev" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
                : > "$err_file"
                rc=0
                precommit_age::anon_fetch "$work" "$err_file" \
                  "https://github.com/${slug}.git" "$rev" || rc=$?
                if [ "$rc" -eq 0 ]; then
                  # Ask what we actually got, exactly as the tag path above does. `rev`
                  # is validated as 40/64-hex, NOT as a *commit*, and `git log` silently
                  # PEELS a tag object to its commit — so an annotated tag object created
                  # today over a year-old commit, pinned by the tag object's own SHA,
                  # would be dated from the old commit and pass. Every authenticated tier
                  # fails closed there, and before tier 4 existed the rev was simply
                  # unverifiable, so skipping this check would loosen the gate relative
                  # to base. Read by `$rev` rather than FETCH_HEAD for the same reason
                  # the sibling does: it states the content-addressed invariant at the
                  # point the security argument leans on it, and FETCH_HEAD here has
                  # already been touched by the failed tag fetch.
                  obj_type=$(precommit_age::anon_git -C "$work" cat-file -t "$rev" 2>/dev/null) || obj_type=""
                  if [ "$obj_type" != "commit" ]; then
                    precommit_age::log_detail "anonymous git" "pinned rev resolved to a ${obj_type:-unknown} object, not a commit"
                    rm -rf "$work" "$err_file" "${anon_home:-}"
                    precommit_age::set_reason "pinned SHA is not a commit object"
                    return 1
                  fi
                  ts=$(precommit_age::anon_git -C "$work" log -1 --format=%cI "$rev" 2>/dev/null) || ts=""
                  basis="the pinned commit"
                  # The SHA fetch SUCCEEDED, so the tag-namespace miss still sitting in
                  # `err` is stale. Left there it would report "rev not found" for a rev
                  # we just fetched, and print the very line the comment above says must
                  # not appear once the SHA attempt is made.
                  err=""
                else
                  err=$(cat "$err_file")
                fi
              fi
              if [ -z "$ts" ]; then
                # Only now, with no attempt left to make, is the error worth the log.
                if [ "$sha_skipped_for_deadline" -eq 1 ]; then
                  precommit_age::set_reason "$PRECOMMIT_AGE_DEADLINE_REASON"
                elif [ "$rc" -eq 124 ]; then
                  # `timeout` kills the fetch without a word, leaving err_file empty —
                  # the one failure that would otherwise reach the operator with no
                  # signal whatsoever.
                  precommit_age::set_reason "anonymous git fetch timed out"
                elif [ -n "$err" ]; then
                  precommit_age::log_detail "anonymous git" "$err"
                  precommit_age::classify_git_error "$err"
                else
                  precommit_age::set_reason "anonymous git fetch produced no publish date"
                fi
                rm -rf "$work" "$err_file" "${anon_home:-}"
                return 1
              fi
            fi

            rm -rf "$work" "$err_file" "${anon_home:-}"
            if [ -z "$ts" ]; then
              precommit_age::set_reason "anonymous git fetch produced no publish date"
              return 1
            fi
            echo "  ANON-GIT: resolved ${slug}@${rev} from ${basis} with no credentials" >&2
            # `%cI` / `:iso-strict` preserve the object's original UTC offset
            # (`...+06:00`), unlike the API's always-`Z` form. `date -d` inside
            # `preflight::iso8601_to_epoch` normalizes the offset, so the measured age
            # is identical either way.
            printf '%s' "$ts"
          }

          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/age-check-precommit.sh (part 3 of 3)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/age-check-precommit.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          # Best-effort ISO-8601 timestamp the tag became public; return 1 if
          # unverifiable. Four tiers: three authenticated, then a credential-free git
          # read (see header for the age-basis rationale and what tier 4 cannot cover).
          precommit_age::publish_dt() {
            local slug="$1" tag="$2" ts ref obj_type sha api_reason api_kind git_reason
            # The reason is per-rev state and this function is the only writer's entry
            # point, so reset it here rather than in main()'s loop — a stale reason from
            # the previous hook would otherwise be reported against this one.
            precommit_age::clear_reason

            # The deadline gates the AUTHENTICATED tiers too, not just tier 4. Bounding
            # tier 4 alone was not enough: `timeout 30` bounds one `gh api` call, but a
            # PR bumping 15 hooks issues up to 45 of them, and 45 x 30s is well past the
            # reusable's `timeout-minutes` — the run would be CANCELLED before tier 4
            # ever observed the deadline it owns, which is the annotations-suppressed
            # outcome the whole mechanism exists to prevent. Past it, a rev costs no
            # network at all and is recorded unverifiable immediately.
            # Admit a rev only if it can FINISH by the deadline, not merely start before
            # it. Without the reservation the deadline bounds admission while the job
            # timeout bounds completion, and the gap between them is exactly the
            # cancelled-run-with-no-annotations mode this exists to prevent.
            if [ -n "${PRECOMMIT_AGE_DEADLINE:-}" ] && \
               [ "$(date +%s)" -ge "$((PRECOMMIT_AGE_DEADLINE - PRECOMMIT_AGE_MAX_REV_COST))" ]; then
              precommit_age::set_reason "$PRECOMMIT_AGE_DEADLINE_REASON"
              return 1
            fi

            # 1. GitHub Release publish date — the tag-pin freshness signal.
            ts=$(precommit_age::gh_api "repos/${slug}/releases/tags/${tag}" '.published_at // empty')
            # 2. Annotated tag -> tagger date. One ref lookup returns both the object
            #    type and sha (tab-joined) so this costs a single extra round-trip.
            if [ -z "$ts" ]; then
              # SINGULAR `git/ref/tags/<tag>` (exact match), NOT plural `git/refs/...`.
              # The plural endpoint is a PREFIX match: for a moving major-version pin
              # (`v1`, `v4`) that prefixes other tags it returns a JSON *array*, jq
              # `.object.type` then errors -> gh_api yields "" -> this tier is skipped
              # and the rev silently falls through to the freshness-understating commit
              # tier. The singular endpoint returns the single object for an exact tag
              # and 404s cleanly (-> "") for a non-exact one. Endpoint matches
              # lib/verify-cve.sh (singular ref form); the two-field tab-split below is
              # local to this function. The "\t" jq emits is a LITERAL tab; the
              # parameter expansions below split on the same tab. Keep the two in sync.
              ref=$(precommit_age::gh_api "repos/${slug}/git/ref/tags/${tag}" '.object.type + "\t" + .object.sha')
              obj_type="${ref%%$'\t'*}"
              sha="${ref#*$'\t'}"
              # {7,64} not {7,40}: allow SHA-256 object IDs (64 hex) for repos that
              # migrate off SHA-1, so an annotated tag doesn't fall through to the
              # freshness-understating lightweight-tag tier.
              if [ "$obj_type" = "tag" ] && [[ "$sha" =~ ^[0-9a-f]{7,64}$ ]]; then
                ts=$(precommit_age::gh_api "repos/${slug}/git/tags/${sha}" '.tagger.date // empty')
              fi
            fi
            # 3. Lightweight tag -> commit committer date. The one tier that can
            #    UNDERSTATE freshness (see header); no better signal exists.
            if [ -z "$ts" ]; then
              ts=$(precommit_age::gh_api "repos/${slug}/commits/${tag}" '.commit.committer.date // empty')
            fi
            if [ -n "$ts" ]; then
              printf '%s' "$ts"
              return 0
            fi

            # 4. Anonymous git — the authenticated tiers are all unreachable. See the
            #    header for what this tier can and cannot stand in for.
            api_reason=$(precommit_age::get_reason)
            api_kind=$(precommit_age::get_api_kind)
            [ -n "$api_reason" ] || api_reason="gh api returned no release, tag, or commit date"

            # A TRANSIENT authenticated failure is the one class where handing over to
            # tier 4 would quietly downgrade the age BASIS: tier 1's `published_at` may
            # exist and merely be unreadable this minute, and re-running the job
            # recovers it. Fail closed and say so instead. `absent` carries no such risk
            # (a 404 on releases/tags means there IS no Release, so nothing is masked),
            # and `blocked` is the permanent condition this tier exists for — the one
            # place the basis swap is a deliberate, documented trade.
            # An ALLOWLIST, not `[ "$api_kind" = transient ]`. Only the two classes
            # proven safe above may hand over; everything else — including an EMPTY kind
            # — fails closed. That empty case is real, not defensive padding: every
            # verdict is written from inside a `ts=$(...)` subshell, so if the reason
            # FILE is unset (a direct unit call that skips main()) nothing is recorded at
            # all, and a denylist would read "no failure observed" and run tier 4. The
            # fail-closed default then inverted precisely where it matters — a
            # rate-limited lookup would resolve off the author-controlled tag date.
            if [ "$api_kind" != "blocked" ] && [ "$api_kind" != "absent" ]; then
              precommit_age::set_reason "${api_reason}; not retried anonymously because a re-run may recover the release date"
              return 1
            fi

            echo "  API tiers failed (${api_reason}); retrying anonymously over git" >&2
            if ts=$(precommit_age::git_publish_dt "$slug" "$tag"); then
              printf '%s' "$ts"
              return 0
            fi

            # All four tiers failed: report the authenticated and anonymous verdicts
            # together so the operator can tell an allow-list rejection from a genuinely
            # absent rev without reverse-engineering it from a runner log. Tier 4's
            # reason comes back through get_reason (the FILE) for the same reason the
            # API tiers' did — the call above ran in a command-substitution subshell, so
            # the variable it assigned is already gone by the time control reaches here.
            git_reason=$(precommit_age::get_reason)
            precommit_age::set_reason "${api_reason}; ${git_reason}"
            return 1
          }

          # ----- Main -----------------------------------------------------------------

          precommit_age::main() {
            # `git` was always a hard dependency (every diff goes through it) but was
            # never declared; `timeout` bounds the anonymous-git tier, and `mktemp`
            # backs the reason file, the gh_api stderr capture and the tier-4 workspace.
            # All ship in the same GNU coreutils/git baseline the GNU-date probe below
            # already assumes, so declaring them costs nothing and fails legibly if
            # absent.
            # `cat`/`rm` back the reason file and the tier-4 workspace. `tr`/`head` are
            # also on the path but belong to _preflight.sh's own contract, shared with
            # every other ecosystem — they should be declared there, not only here.
            preflight::require_tools gh git timeout mktemp env cat rm awk sed grep sort comm
            preflight::require_gnu_date
            preflight::validate_min_age_days

            # Carries the publish_dt failure reason across the command-substitution
            # subshell boundary — see the PRECOMMIT_AGE_REASON_FILE comment above.
            PRECOMMIT_AGE_REASON_FILE=$(mktemp)
            trap 'rm -f "$PRECOMMIT_AGE_REASON_FILE"' EXIT

            # Wall-clock ceiling for tier 4, stamped here so it covers the WHOLE check —
            # see the run-deadline note in git_publish_dt for why that is the right
            # measure rather than metered fetch time. Read-only in the subshells that
            # check it, so a plain exported variable is enough (unlike the reason, which
            # is written there).
            #
            # Validated before it reaches `$(( ))`: bash evaluates array subscripts
            # inside arithmetic, so an unvalidated `a[$(...)]` would be a command-
            # execution surface, and a merely non-numeric value would abort the step
            # under `set -e` with no annotations, no summary and no comment — the exact
            # outcome the deadline exists to prevent. Same discipline, and the same
            # `10#` base-10 guard against leading zeros, as validate_min_age_days.
            # 420, not 180. The deadline gates the AUTHENTICATED tiers too, so it bounds
            # every run now, not just the ones reaching tier 4 — and at 180 against a
            # 600s job it would fail a check that PASSED before this PR (base had no
            # deadline and `timeout-minutes: 5`, so a 200s run passed; at 180 the same
            # run records its remaining pins unverifiable and exits 1). 420 leaves the
            # job ~3 minutes for checkout and setup, keeping the never-CANCELLED property
            # without inventing a regression window.
            # UNSET and EMPTY mean different things here, and telling them apart is what
            # protects consumers who have not re-pinned.
            #
            # The internal reusable checks out ops-routines at `ref: main`, so it runs
            # the LATEST lib — but fleet shims pin the WORKFLOW by SHA. A shim still on a
            # pre-deadline pin therefore gets the new tier 4 (an extra anonymous fetch
            # per blocked or absent rev) under that old workflow's `timeout-minutes: 5`,
            # with neither of these variables in its step `env:`. That is strictly more
            # wall clock inside a 300s cap, and before this change those consumers at
            # least failed FAST — a 403 went straight to fail-closed. Cancelling them
            # with no annotations would be a worse outcome than the bug being fixed.
            #
            # Every current reusable SETS the variable (possibly to empty, per the
            # `type: string` rationale), so a fully unset one uniquely identifies an old
            # pin — and gets a deadline sized for a 300s job rather than a 600s one.
            # Empty, by contrast, is an ordinary shim passing through its own unset
            # optional, and takes the caller's default. Deliberately unlike MIN_AGE_DAYS,
            # which rejects empty: that is a security parameter where fail-closed is the
            # right answer, and a tuning knob is not.
            # The EMPTY fallback is per-flavour, from the same env the ceiling comes
            # from. A hardcoded one could not be right for both: the two reusables
            # declare different YAML `default:`s (420 public, 360 internal), a YAML
            # default applies only when the input is OMITTED, and empty is precisely the
            # passthrough case `type: string` exists to protect. One constant would make
            # empty and omitted produce DIFFERENT deadlines on at least one flavour —
            # and on the internal one the empty value would have been the LARGER, so a
            # shim forwarding an unset optional would silently outrank a caller who
            # omitted the input entirely.
            local anon_deadline_raw anon_deadline_ceiling_default anon_deadline_default
            anon_deadline_default="${PRECOMMIT_AGE_DEADLINE_DEFAULT_SECONDS:-420}"
            [ -z "$anon_deadline_default" ] && anon_deadline_default=420
            if ! [[ "$anon_deadline_default" =~ ^[0-9]+$ ]] || [ "$((10#$anon_deadline_default))" -lt 1 ]; then
              echo "::error::PRECOMMIT_AGE_DEADLINE_DEFAULT_SECONDS must be a positive integer (got: ${anon_deadline_default:-<unset>})"
              exit 1
            fi
            if [ -z "${PRECOMMIT_AGE_DEADLINE_SECONDS+set}" ]; then
              anon_deadline_raw=180
              anon_deadline_ceiling_default=180
            else
              anon_deadline_raw="${PRECOMMIT_AGE_DEADLINE_SECONDS:-$anon_deadline_default}"
              anon_deadline_ceiling_default=480
              [ -z "$anon_deadline_raw" ] && anon_deadline_raw="$anon_deadline_default"
            fi
            if ! [[ "$anon_deadline_raw" =~ ^[0-9]+$ ]] || [ "$((10#$anon_deadline_raw))" -lt 1 ]; then
              echo "::error::PRECOMMIT_AGE_DEADLINE_SECONDS must be a positive integer (got: ${anon_deadline_raw:-<unset>})"
              exit 1
            fi
            # CLAMPED, because the deadline is a caller-settable workflow input while
            # `timeout-minutes: 10` in both reusables is not. A consumer who reads "raise
            # it if you have a lot of hooks" and passes 900 would get a job GUARANTEED to
            # be cancelled at 600s — silently, since the deadline never fires — which is
            # the annotation-suppressing outcome this whole mechanism exists to avoid.
            # The advice "keep it under timeout-minutes" cannot be followed from where it
            # is read: that line is not visible in the caller's workflow.
            #
            # 450 = 600s job budget - ~110s of in-flight overshoot (see the sizing note
            # in the header) - a margin for checkout and setup. IF `timeout-minutes`
            # CHANGES IN EITHER REUSABLE, THIS CEILING MUST CHANGE WITH IT.
            # PER-FLAVOUR, because the ceiling is a function of the CALLER's job budget
            # and those differ. A single hardcoded number was wrong in both directions
            # at once: too high for whichever flavour has the smaller `timeout-minutes`,
            # and too low for the other, which then had the largest job budget and the
            # smallest usable deadline. Each reusable now declares its own, derived from
            # its own timeout minus an allowance for the work that happens BEFORE this
            # clock starts (checkout, and for the internal flavour a token mint and a
            # second checkout). The default here is the conservative one, for a direct
            # invocation that sets nothing.
            #
            # The reservation above — not this ceiling — is what covers in-flight
            # overshoot; this funds only what sits outside the deadline's clock.
            local anon_deadline_max="${PRECOMMIT_AGE_DEADLINE_MAX_SECONDS:-$anon_deadline_ceiling_default}"
            [ -z "$anon_deadline_max" ] && anon_deadline_max="$anon_deadline_ceiling_default"
            if ! [[ "$anon_deadline_max" =~ ^[0-9]+$ ]] || [ "$((10#$anon_deadline_max))" -lt 1 ]; then
              echo "::error::PRECOMMIT_AGE_DEADLINE_MAX_SECONDS must be a positive integer (got: ${anon_deadline_max:-<unset>})"
              exit 1
            fi
            anon_deadline_max=$((10#$anon_deadline_max))
            if [ "$((10#$anon_deadline_raw))" -gt "$anon_deadline_max" ]; then
              echo "::warning::age_check_deadline_seconds=${anon_deadline_raw} exceeds the ${anon_deadline_max}s ceiling and was clamped. The job is killed at timeout-minutes (600s) regardless, and a kill suppresses every annotation and the PR comment — which is what this deadline exists to prevent."
              anon_deadline_raw="$anon_deadline_max"
            fi
            PRECOMMIT_AGE_DEADLINE=$(( $(date +%s) + 10#$anon_deadline_raw ))
            export PRECOMMIT_AGE_DEADLINE

            local base_ref="origin/${BASE_REF}"
            preflight::verify_base_ref "$base_ref"
            local base_rev; base_rev=$(preflight::base_rev) || exit 1  # closed even where errexit is off

            local now_epoch; now_epoch=$(date +%s)
            local failed=false
            local checked_count=0

            local files; files=$(precommit_age::changed_configs "$base_rev")
            if [ -z "$files" ]; then
              echo "No .pre-commit-config.yaml changes detected"
              preflight::step_summary_no_changes "pre-commit" "No \`.pre-commit-config.yaml\` changes detected in this diff."
              exit 0
            fi

            preflight::step_summary_header "pre-commit"

            for file in $files; do
              echo "::group::Checking ${file}"
              local pins="" pins_rc=0
              pins=$(precommit_age::changed_pins "$file" "$base_rev") || pins_rc=$?
              if [ "$pins_rc" -ne 0 ]; then
                # Nothing in this file was verified (changed_pins said why on
                # stderr), so this must not fall through to "no new or changed
                # revs". Same three surfaces as the npm script's per-file failure —
                # summary row, failures TSV, footer — so the PR comment names the
                # cause rather than a pin never read. rc 2 is the base image (read
                # or parse), anything else the head config.
                echo "::endgroup::"
                local safe_file; safe_file=$(preflight::safe_for_md "$file")
                local fail_cell fail_reason
                if [ "$pins_rc" -eq 2 ]; then
                  fail_cell=":x: base image unreadable"
                  fail_reason="could not read or parse the base image of ${safe_file} at the merge base — a partial clone (filter: on actions/checkout), an unreadable object, or no scratch space for the image; the job log says which"
                else
                  fail_cell=":x: config could not be parsed"
                  fail_reason="${safe_file} could not be parsed; see the job log"
                fi
                echo "::error file=${safe_file}::${fail_reason}"
                echo "| \`${safe_file}\` | — | — | ${fail_cell} |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_unverifiable "$safe_file" "n/a" "$fail_reason"
                preflight::step_summary_unverifiable "$fail_reason"
                exit 1
              fi
              if [ -z "$pins" ]; then
                echo "No new or changed remote hook revs in ${file}"
                echo "::endgroup::"
                continue
              fi

              while IFS=$'\t' read -r url rev; do
                [ -z "$url" ] && continue
                url=$(precommit_age::unquote "$url")
                rev=$(precommit_age::unquote "$rev")
                [ -z "$rev" ] && continue
                # `repo: local` / `meta` blocks carry no rev so normally never reach
                # here; skip defensively in case a malformed block emitted one.
                case "$url" in local|meta) continue ;; esac

                local slug
                if ! slug=$(precommit_age::github_slug "$url"); then
                  # Non-github host (or unparseable URL): unverifiable by the GitHub-API
                  # prober -> fail closed. Diff-scoped, so only the introducing PR is
                  # blocked; bypass label is the escape hatch (see header).
                  local safe_url safe_rev_u
                  safe_url=$(preflight::safe_for_md "$url")
                  safe_rev_u=$(preflight::safe_for_md "$rev")
                  echo "::error file=${file}::Cannot age-verify hook ${url}@${rev}: only github.com hooks are supported by the age prober (non-github host)."
                  echo "| \`${safe_url}\` | \`${safe_rev_u}\` | — | :x: non-github host (unverifiable) |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_url" "$safe_rev_u" \
                    "non-github host; only github.com hooks are age-verifiable"
                  failed=true
                  continue
                fi

                # Sanitized labels for step-summary cells + the shared age helper.
                local safe_slug safe_rev
                safe_slug=$(preflight::safe_for_md "$slug")
                safe_rev=$(preflight::safe_for_md "$rev")

                if ! precommit_age::is_valid_tag "$rev"; then
                  echo "::error file=${file}::Hook ${slug}@${rev} — rev failed shape validation (rejected before gh api)."
                  echo "| \`${safe_slug}\` | \`${safe_rev}\` | — | :x: invalid rev shape |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_slug" "$safe_rev" "rev failed shape validation"
                  failed=true
                  continue
                fi

                local ts
                if ! ts=$(precommit_age::publish_dt "$slug" "$rev"); then
                  # Every tier — authenticated and anonymous — failed. The reason is
                  # composed from this file's fixed vocabulary, so it is safe to
                  # interpolate and it names WHICH wall was hit: an org IP allow list
                  # reads very differently from a deleted tag, and the next person
                  # should not have to reverse-engineer that from a runner log.
                  local reason; reason=$(precommit_age::get_reason)
                  [ -n "$reason" ] || reason="gh api unreachable or tag not found"
                  echo "::error file=${file}::Could not verify age for ${slug}@${rev} (${reason})."
                  # Carry the reason into the cell. The step summary is the first thing
                  # a reviewer opens, and a bare "unverifiable" says less than the row
                  # said before this change — the whole point of the plumbing is that an
                  # allow list reads differently from a deleted tag. Safe to interpolate:
                  # every reason is from this file's fixed vocabulary, so none contains
                  # the `|` that would split the table row.
                  # The `|` strip is STRUCTURAL, not decoration: every reason is from
                  # this file's fixed vocabulary and pipe-free today, but that invariant
                  # would otherwise live only in a comment, and one `|` splits the table
                  # row. Mirrors what record_unverifiable already does to this string.
                  local safe_reason; safe_reason=$(printf '%s' "$reason" | tr -d '|')
                  echo "| \`${safe_slug}\` | \`${safe_rev}\` | — | :x: ${safe_reason} |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_slug" "$safe_rev" "$reason"
                  failed=true
                  continue
                fi

                # Classify + emit via shared helper. _and_tally updates checked_count
                # and failed via dynamic scoping. Verb is "published" (a tag is
                # published); row cells carry the owner/repo slug + rev.
                preflight::age_row_and_tally \
                  "$safe_slug" "$safe_rev" "$ts" "$now_epoch" "$MIN_AGE_DAYS" \
                  "published" "$file" "@"
              done <<< "$pins"

              echo "::endgroup::"
            done

            if [ "$failed" = true ]; then
              preflight::step_summary_failed "$MIN_AGE_DAYS" "$checked_count" "0"
              echo ""
              echo "::error::One or more pre-commit hooks failed the age check."
              echo "To bypass for emergency security updates, add the 'age-check-bypass' label to this PR."
              exit 1
            fi

            preflight::step_summary_all_passed "$checked_count" "$MIN_AGE_DAYS"
            echo "All pre-commit hook revs are at least ${MIN_AGE_DAYS} days old"
          }

          if [ "${BASH_SOURCE[0]}" = "$0" ] || [ -z "${BASH_SOURCE[0]:-}" ]; then
            precommit_age::main "$@"
          fi

          # Example:
          #   MIN_AGE_DAYS=7 BASE_REF=main GH_TOKEN=ghs_xxx bash lib/age-check-precommit.sh
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Run age-check-precommit.sh
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          # No AGE_CHECK_SKIP_SELF_REFS: unlike the actions check, pre-commit
          # hooks never reference the age-check infra, so there is no
          # self-block to dodge (see lib/age-check-precommit.sh header).
          #
          # `record_failure` writes a TSV row here for each too-new pin
          # so the post-step below can render the data into a comment
          # without redoing classification. Unset → no-op.
          AGE_CHECK_FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          PRECOMMIT_AGE_DEADLINE_SECONDS: ${{ inputs.age_check_deadline_seconds }}
          # Ceiling for the input above, derived from THIS flavour's
          # `timeout-minutes` (900s) minus an allowance for the setup that
          # runs before the check's clock starts. Not a consumer input: a
          # caller cannot see `timeout-minutes`, so it cannot size this.
          PRECOMMIT_AGE_DEADLINE_MAX_SECONDS: 480
          # What an EMPTY (not omitted) value falls back to. Kept equal to
          # this flavour's YAML `default:` above, so a shim forwarding its own
          # unset optional gets the same deadline as a caller who omits the
          # input entirely — a YAML default only applies to an OMITTED key.
          PRECOMMIT_AGE_DEADLINE_DEFAULT_SECONDS: 420
          # The consumer's default token drives the three authenticated
          # tiers, but it is NOT sufficient on its own: an org running a
          # GitHub IP allow list answers 403 to an AUTHENTICATED read from a
          # hosted runner even for a PUBLIC repo, which used to make this
          # check permanently red for any hook it publishes. Revs blocked that
          # way — and revs the API reports absent — now fall back to a
          # credential-free git read, which an allow list does not gate. No
          # extra permission or secret is involved.
          #
          # TRANSIENT failures (rate limit, 5xx) deliberately do NOT fall back
          # and still fail closed: the release date may exist and simply be
          # unreadable this minute, so re-run the job rather than accepting an
          # older basis. If you are debugging a red check, that is a withheld
          # fallback, not a broken one — see the tier-4 section of
          # lib/age-check-precommit.sh. Non-github hosts still fail closed
          # without any network call at all.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written verbatim from lib/ by the `Write the age-check library` step(s)
          # above, into the same directory, so this resolves the shared libs the
          # way a local checkout does. See the header of
          # scripts/embed-lib-into-workflows.py.
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/ops-routines-lib/age-check-precommit.sh"
          precommit_age::main

      - name: Comment retry-after dates on PR
        if: ${{ !cancelled() && inputs.comment_on_failure && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          # Per-ecosystem render parameters. Bash body below is identical
          # across all reusables; only these env values change.
          ECOSYSTEM: precommit
          ITEM_COLUMN: Hook
          SEPARATOR: "@"
        run: |
          # ============================================================================
          # comment-on-failure.sh - Post sticky PR comment with retry-after dates
          # ============================================================================
          #
          # Embedded into each `age-check-<eco>.yml.tmpl` at the
          # `# @@COMMENT_ON_FAILURE@@` marker by `scripts/embed-lib-into-workflows.py`.
          #
          # Reads the TSV that `preflight::record_failure`,
          # `preflight::record_unverifiable` and `preflight::record_not_run` wrote
          # during the main run step (one row per failed pin) and renders a single
          # sticky comment. Each row carries a `kind` column — `too_new`,
          # `unverifiable` or `not_run` — so the renderer can split into sections
          # with the right operator action: too-new pins get an eligible-after
          # date and "wait then push any commit"; unverifiable pins (registry/API
          # outages, missing manifests, etc.) get the upstream reason and "re-run
          # the failed check"; a not-run row (preflight stopped the check before
          # any pin — an unfetched base branch, a shallow clone) gets its reason,
          # no re-run copy, and NO bypass offer: the remedy is a checkout setting,
          # and the label would switch the gate off instead. Updates an existing
          # sticky in place
          # (marker is `<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->`);
          # deletes the sticky on a clean run so a stale "X days remaining" doesn't
          # outlive the failure that produced it.
          #
          # Soft-fails on permission denial (typical on Dependabot PRs where the
          # token is read-only) — emits a `::notice` so the run still succeeds and
          # the user can find retry-after dates in the Job Summary.
          #
          # Required env (set per-ecosystem in the calling step):
          #   GH_TOKEN, REPO, PR_NUMBER, RUN_URL, MIN_AGE_DAYS, FAILURES_FILE,
          #   ECOSYSTEM, ITEM_COLUMN, SEPARATOR
          # ============================================================================

          set -euo pipefail

          MARKER="<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->"

          # `gh api ... --paginate` pages through all PR comments. The jq filter
          # selects whichever one carries our marker (there should be 0 or 1).
          # `--jq '... // empty'` returns the empty string when no match — keeps
          # `existing_id` testable with `[ -n "$existing_id" ]`.
          existing_id=$(
            gh api --paginate "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | first | .id // empty" \
              2>/dev/null || true
          )

          if [ -s "${FAILURES_FILE:-/dev/null}" ]; then
            body_file=$(mktemp)
            # Dedupe rows: a single pin referenced in N workflow / lockfile
            # entries records N identical TSV rows (one per file processed by
            # the main script). Per-file `::error file=…` annotations correctly
            # fire N times so each file in the Files Changed tab gets its own
            # inline annotation; this comment is a SUMMARY, not a per-file
            # annotation, so it should list each pin once. `sort -u` works
            # because age / eligible / remaining / kind are identical for a
            # given (id, version) within a single run (the script captures
            # `now_epoch` once at startup).
            deduped_failures=$(mktemp)
            sort -u "${FAILURES_FILE}" > "${deduped_failures}"

            # Split rows by kind, deduping cross-kind for the same pin. The
            # legacy assumption was "a pin is either too_new OR unverifiable in a
            # single run" — true within a single file, but a pin referenced in
            # two changed files can hit both branches if `gh api` succeeds for
            # file A and fails for file B (transient mid-run flake). When that
            # happens the too_new judgment is the durable answer (we have a valid
            # age from the file where the fetch succeeded); the unverifiable from
            # the other file is just noise. Without this dedup, a reviewer sees
            # the same pin in both sections with conflicting actions
            # ("wait until eligible" AND "re-run the failed check"), which is
            # confusing and slightly misleading.
            #
            # Two-pass awk via the `NR==FNR` trick: pass 1 collects the set of
            # (id, version) pairs that have a too_new row; pass 2 emits each row
            # to its kind's output file, skipping an unverifiable row when its
            # (id, version) is already in the too_new set. Empty `kind` column on
            # a legacy row defaults to too_new — defensive only; both writers
            # always set it.
            #
            # Wrapped in `if !` so a future regression in the awk script (output
            # path collision, syntax error, etc.) doesn't trip `set -e` and
            # silently suppress the comment — the whole point of this feature is
            # to surface failures at PR review time without forcing the reviewer
            # to dig into logs. Fallback dumps the deduped data into the too_new
            # bucket so the reviewer at least sees the failed pins, with a
            # `::warning` flagging the degraded render.
            too_new_failures=$(mktemp)
            unverifiable_failures=$(mktemp)
            not_run_failures=$(mktemp)
            if ! awk -F '\t' '
              NR == FNR {
                if (($7 == "" ? "too_new" : $7) == "too_new") {
                  too_new_pins[$1 "\t" $2] = 1
                }
                next
              }
              {
                kind = $7 == "" ? "too_new" : $7
                if (kind == "too_new") {
                  print > too_new_out
                } else if (kind == "unverifiable") {
                  key = $1 "\t" $2
                  if (!(key in too_new_pins)) {
                    print > unverifiable_out
                  }
                } else if (kind == "not_run") {
                  print > not_run_out
                }
              }
            ' too_new_out="${too_new_failures}" \
              unverifiable_out="${unverifiable_failures}" \
              not_run_out="${not_run_failures}" \
              "${deduped_failures}" "${deduped_failures}"; then
              echo "::warning::age-check renderer failed to split rows by kind; falling back to a flat list — some entries may be unverifiable rather than too-new (see the per-pin annotations in this run for the real classification)."
              cp "${deduped_failures}" "${too_new_failures}"
              : > "${unverifiable_failures}"
              : > "${not_run_failures}"
            fi

            # shellcheck disable=SC2016
            # The printf format strings below intentionally contain literal
            # backticks and `%s` placeholders for Markdown rendering — no shell
            # expansion is wanted in those slots.
            {
              printf '%s\n\n' "${MARKER}"
              printf '### Dependency Age Check failed — %s\n\n' "${ECOSYSTEM}"

              # Preflight exits before any pin is examined, so a not-run row never
              # shares a comment with the two pin sections below.
              if [ -s "${not_run_failures}" ]; then
                printf '#### The check could not run\n\n'
                printf 'The check stopped before examining any dependency. The reason names the fix — a checkout setting, not a registry outage — so running the check again will not help until that setting is changed.\n\n'
                printf '| Base ref | Reason |\n'
                printf '|---|---|\n'
                while IFS=$'\t' read -r id _ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s` | %s |\n' "${id}" "${reason}"
                done < "${not_run_failures}"
                printf '\n'
              fi

              if [ -s "${too_new_failures}" ]; then
                printf '#### Pins below quarantine\n\n'
                printf 'New pin(s) below have not yet reached the **%s-day** quarantine. Wait until the eligible date, push any new commit, and the check will pass.\n\n' "${MIN_AGE_DAYS}"
                printf '| %s | Age (days) | Eligible after | Days remaining |\n' "${ITEM_COLUMN}"
                printf '|---|---:|---|---:|\n'
                while IFS=$'\t' read -r id ver age _min eligible remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s | %s | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${age}" "${eligible}" "${remaining}"
                done < "${too_new_failures}"
                printf '\n'
              fi

              if [ -s "${unverifiable_failures}" ]; then
                printf '#### Pins that could not be verified\n\n'
                printf 'Upstream metadata fetch failed for the pin(s) below. This is usually a transient registry/API issue — re-run the failed check from the Actions tab; if it keeps failing, open an issue with the reason text.\n\n'
                printf '| %s | Reason |\n' "${ITEM_COLUMN}"
                printf '|---|---|\n'
                while IFS=$'\t' read -r id ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${reason}"
                done < "${unverifiable_failures}"
                printf '\n'
              fi

              # No bypass offer under a not-run row: the label genuinely clears the
              # check, and the checkout would stay broken for the next PR. Keyed on
              # the raw rows rather than the awk bucket, so the degraded fallback
              # above (which dumps every row into too_new) cannot restore the offer.
              if ! grep -q $'\tnot_run$' "${deduped_failures}"; then
                printf '> Need to merge sooner? Add the **`age-check-bypass`** label — verified-CVE emergencies only.\n'
              fi
              printf '\n<sub>Updated by `ops-routines-workflows/age-check-%s` · [run log](%s)</sub>\n' "${ECOSYSTEM}" "${RUN_URL}"
            } > "${body_file}"
            rm -f "${deduped_failures}" "${too_new_failures}" "${unverifiable_failures}" "${not_run_failures}"

            if [ -n "${existing_id}" ]; then
              if ! gh api -X PATCH "/repos/${REPO}/issues/comments/${existing_id}" \
                   -F "body=@${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not update age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            else
              if ! gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not post age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            fi
            rm -f "${body_file}"
          elif [ -n "${existing_id}" ]; then
            # No failures this run (neither too-new nor unverifiable); clear the
            # stale sticky if one exists so reviewers don't act on outdated
            # retry-after dates or stale upstream-error reasons.
            if ! gh api -X DELETE "/repos/${REPO}/issues/comments/${existing_id}" >/dev/null 2>&1; then
              echo "::notice::Could not delete stale age-check comment (id ${existing_id}). Caller workflow may need \`pull-requests: write\`."
            fi
          fi
