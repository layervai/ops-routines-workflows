name: Proof other read-only callers
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  npm:
    permissions:
      contents: read
    uses: ./.github/workflows/age-check-npm.yml
  pip:
    permissions:
      contents: read
    uses: ./.github/workflows/age-check-pip.yml
  precommit:
    permissions:
      contents: read
    uses: ./.github/workflows/age-check-precommit.yml
