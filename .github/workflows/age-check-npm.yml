# ============================================================================
# REUSABLE: npm Dependency Age Check (supply-chain guard, PUBLIC mirror)
# ----------------------------------------------------------------------------
# Self-contained: the bash lib is embedded below. DO NOT EDIT DIRECTLY.
# Generated by `scripts/embed-lib-into-workflows.py` from:
#   - lib/_preflight.sh
#   - lib/_npm-lockfile-parsers.sh
#   - lib/age-check-npm.sh
#   - templates/workflows/age-check-npm.yml.tmpl
# ============================================================================
name: Dependency Age Check (npm, reusable)

on:
  workflow_call:
    inputs:
      min_age_days:
        description: "Minimum age in days for any newly-added npm dependency."
        required: false
        type: number
        default: 7
      lockfile_path:
        description: "Primary lockfile to inspect (relative to working_directory)."
        required: false
        type: string
        default: "package-lock.json"
      working_directory:
        description: "Directory containing the lockfile(s)."
        required: false
        type: string
        default: "."
      timeout_minutes:
        description: |
          Job timeout for the age check. Raise alongside `max_pins`: the
          scan costs ~0.45s per pin (~130 pins/minute), and a timeout
          kills the step before the step summary and PR comment are
          written, which is a worse outcome than an explained refusal.
          Values much beyond 10 hold a runner and sustained traffic
          against registry.npmjs.org, which the per-pin sleep exists to
          throttle — a work-list needing that long is a lockfile
          regeneration to review by hand, not a dependency change.
          A zero or negative value is clamped back to 5 by the job below,
          because reaching `timeout-minutes:` directly would have GitHub
          kill the job before the step summary or the PR comment exist —
          a red check with no diagnosis, the outcome `max_pins` exists to
          avoid.
        required: false
        type: number
        default: 5
      max_pins:
        description: |
          Refuse rather than verify a work-list larger than this. Each pin
          costs ~0.45s (rate-limit sleep plus a registry round-trip), so
          the scan sustains roughly 130 pins per minute of
          `timeout_minutes` — and checkout, token mint and setup come out
          of the same budget, so the default deliberately leaves room for
          them rather than sizing to the raw ceiling. Above the cap the
          check fails with an explanation instead of timing out mid-scan,
          which would kill the step before the summary and the PR comment
          are written. Move it together with `timeout_minutes`: the
          ceiling lives on the job INSIDE this reusable, so a caller's own
          `timeout-minutes` does not reach it.
        required: false
        type: number
        default: 350
      allow_registry_free:
        description: |
          A STANDING DECISION, not a one-off. Set this and every future
          change whose new pins all resolve from outside a registry
          passes too. Read that before enabling it: the flag is for a
          repo that genuinely vendors and would otherwise get a red
          check on every PR touching its lockfile, not for clearing one
          build.

          All three lockfile kinds. A dependency that resolves from no
          registry at all — a git URL, a tarball, a committed `file:`
          archive — has no publish date, so there is nothing for the age
          gate to measure. A change whose new pins are ALL of that kind
          therefore fails rather than reporting `Verified 0 package(s)`,
          which is a green tick on a change verified in no way at all.
          This input turns that failure into a warning.

          Vendored is not the same as off-registry. A registry-shaped
          entry whose resolution names some OTHER host is tagged and
          reported as skipped — so a repo on a private registry is not
          "vendored" and needs `registry_url`, not this.

          What it cannot do is suppress a too-new registry pin the
          branch actually moved: it applies only when nothing at all
          could be age-checked, so a change that also moves a registry
          pin is gated on that pin regardless.

          Whether or not it is set, every newly vendored arrival is
          annotated as a `::notice` naming the source and an info row in
          the step summary, so a reviewer can judge what arrived.

          A `file:`, `link:`, `portal:` or `workspace:` path naming a
          DIRECTORY is the repo's own tree, not vendoring, and is not
          counted — except when it names a tarball
          (`file:vendor/pkg-1.0.0.tgz`), which is a fetched artifact
          that happens to be committed.

          One caveat in a repo with more than one lockfile kind: this
          makes the pnpm file pass, but the run as a whole can still
          fail if another lockfile has packages that could not be
          verified. The all-skipped guard fires on that before this
          branch is reached, and it fails closed on purpose.
        type: boolean
        required: false
        default: false
      registry_url:
        description: |
          The registry whose publish dates this check reads, and the one
          a lockfile entry must resolve to before it is age-checked.
          Defaults to the public npm registry.

          Set this when the repo installs from a private registry. A
          lockfile entry names no registry in its key, so without this
          every entry was looked up on npmjs regardless of where it came
          from — and where a public package shares the name, a freshly
          published private one was aged against the PUBLIC package's
          history and passed. Entries resolving anywhere other than this
          URL are now reported as skipped instead.

          Resolution source, not the key: pnpm entries are matched on
          `resolution: {tarball: ...}`, or on the default/scoped
          registry in .npmrc for an integrity-only entry; package-lock
          and yarn v1 entries on the host of their `resolved` URL.
          Berry (yarn v2+) writes a `resolution:` descriptor rather than
          a URL, so its registry comes from .yarnrc.yml
          (`npmRegistryServer`, `npmScopes.<scope>.npmRegistryServer`) —
          Berry does not read .npmrc. A `::__archiveUrl=` in the
          resolution names a host outright and takes precedence. A Berry
          repo with no default `npmRegistryServer` in .yarnrc.yml — no
          file, or a file with `npmScopes` rules only — has its remaining
          entries aged against this URL on this input's word alone: the
          checkout holds no evidence of where yarn installs them from.
          When this URL is not the public registry (registry.npmjs.org,
          or its registry.yarnpkg.com alias) the run says so with a
          `::notice`, without failing. Set `npmRegistryServer` in
          .yarnrc.yml to gate them on evidence; a registry set only in
          CI (YARN_NPM_REGISTRY_SERVER) is invisible here.

          This also gives a pnpm v5 repo on a private default registry a
          real gate. Those lockfiles qualify every key with the registry
          host, which otherwise reads as "nothing from a registry" and
          fails closed; naming the host here gates them normally, rather
          than turning the check off with allow_registry_free.

          Must be https:// — http:// is refused, because the
          package-lock extractor admits only https:// pins and an http
          registry would gate nothing while reporting green.

          The check reads publish dates from this URL, so it must be
          reachable from the runner and serve the standard packument
          API WITHOUT authentication — no credential is sent, so a
          registry requiring a token for reads answers 401 for every
          pin (reported as "requires authentication", failing closed).
        type: string
        required: false
        default: "https://registry.npmjs.org"
      comment_on_failure:
        description: |
          Post a sticky PR comment listing packages that failed the age
          check and how many days each has left until eligible. Requires
          the calling job to grant `pull-requests: write` (Dependabot PRs
          need this granted explicitly; the default Dependabot token is
          read-only). Soft-fails to a `::notice` if the token can't write.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: age-check-npm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: true

jobs:
  check-npm-dependency-age:
    runs-on: ubuntu-latest
    # Clamped, not trusted: `type: number` constrains shape but not
    # range, and a 0 or negative reaching `timeout-minutes:` has GitHub
    # kill the job before the step summary or the PR comment exist — the
    # undiagnosable red that `max_pins` exists to avoid. A script-side
    # check cannot help: it runs inside the job the bad value governs.
    # The floor is 2, not 1: the budget reserves ~1 minute for token
    # mint and checkout, so a 1-minute job leaves nothing to scan with
    # and would refuse any PR touching two dependencies.
    timeout-minutes: ${{ inputs.timeout_minutes >= 2 && inputs.timeout_minutes || 5 }}
    permissions:
      contents: read
      # Only used when `comment_on_failure: true`. Caller's job-level
      # `permissions:` block caps this; if the caller restricts to
      # `contents: read` (or runs as Dependabot without an explicit
      # grant), the post-step soft-fails to a `::notice`.
      pull-requests: write
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'age-check-bypass') }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Write the age-check library — lib/_preflight.sh (part 1 of 2)
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP:?}/ops-routines-lib"
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat > "${RUNNER_TEMP}/ops-routines-lib/_preflight.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #!/usr/bin/env bash
          # ============================================================================
          # _preflight.sh - Shared preflight helpers for age-check-*.sh
          # ============================================================================
          #
          # Sourced by each ecosystem-specific age-check script so the validator
          # logic stays consistent. Covers the class of silent-pass bugs that
          # bit the sibling per-repo dep-age checks (website#189, qurl-mcp#52,
          # qurl-portal#14, qurl-typescript#32, discord#21) before they were
          # hardened, plus the preflight probes those rounds added:
          #
          # - Positive-integer validation for MIN_AGE_DAYS (reject 0 and
          #   non-numeric)
          # - GNU `date -d` availability probe (catches BSD/macOS silently
          #   replacing GNU date)
          # - Required-tool existence checks (caller supplies its exact tool list)
          # - Explicit base_ref verification before `git diff` so a missing ref
          #   doesn't get conflated with "no changes detected" by a trailing
          #   `|| true` on the filter pipeline
          # - One resolution of "the base" — the merge base of base_ref and HEAD —
          #   so a parser that reads a base image (`git show <rev>:<path>`) sees
          #   the same revision its three-dot `git diff` compares against
          # - One comparator for every parser that reads a base image
          #   (`preflight::new_lines_since_base`): probe, read, parse both images,
          #   difference — so the ecosystems cannot drift on those details. A
          #   caller that parsed the head already hands those lines in, and can
          #   take the base's back, rather than have either image parsed twice
          # - Step-summary helpers so the Actions UI never shows an empty panel
          #   on early-exit paths
          # - Shared age comparison + ISO-8601 parsing to keep those callers
          #   minimal
          #
          # REQUIRED CALL ORDER in main():
          #
          #   preflight::require_tools <tool> [...]      # tools first
          #   preflight::require_gnu_date                # then date-d probe
          #   preflight::validate_min_age_days           # then env validation
          #   preflight::verify_base_ref "origin/${BASE_REF}"  # MUST come before any
          #                                              # subsequent `git diff` — see
          #                                              # the function comment for
          #                                              # the silent-pass reason.
          #                                              # Requires git itself. Also
          #                                              # resolves the merge base once;
          #                                              # read it via preflight::base_rev
          #                                              # for every `<rev>:<path>` read.
          #
          # Usage (from an age-check script):
          #
          #   # shellcheck source=lib/_preflight.sh
          #   source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"
          #
          # ============================================================================

          # Guard against double-sourcing — IFS and `set -e` state are caller's.
          if [ -n "${_PREFLIGHT_SOURCED:-}" ]; then
            return 0
          fi
          _PREFLIGHT_SOURCED=1

          # ----- Required-tool probes --------------------------------------------------

          preflight::require_tools() {
            local missing=()
            local tool
            for tool in "$@"; do
              command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
            done
            if [ ${#missing[@]} -gt 0 ]; then
              # A not_run row, like the base-ref failures below: the remedy is the
              # runner image, so the PR comment must not offer a re-run or the
              # bypass label. Joined by safe_list_for_md, not `${missing[*]}`: the
              # libs set IFS to newline+tab, so `*` would join on a newline that
              # _record_reason_row strips, jamming "curl jq" into "curljq".
              local safe_missing; safe_missing=$(preflight::safe_list_for_md "${missing[@]}")
              preflight::fail_not_run "runner" "required tools not available on the runner: ${safe_missing} — this workflow depends on ubuntu-latest, or a runner image with them installed"
            fi
          }

          # GNU date supports `date -d @<epoch>` syntax that BSD/macOS date
          # rejects. Every age-check script converts an ISO-8601 timestamp to
          # epoch via `date -d "$ts" +%s`; probing up front catches a silent
          # regression if the runner ever stops providing GNU date.
          preflight::require_gnu_date() {
            if ! date -d @0 >/dev/null 2>&1; then
              preflight::fail_not_run "runner" "GNU date -d is not available on the runner — this workflow depends on GNU date's @-prefix epoch syntax; run on an ubuntu-latest / Linux runner, or replace the date -d calls with a portable alternative"
            fi
          }

          # ----- MIN_AGE_DAYS validation ----------------------------------------------

          # Accept only POSITIVE integers (numeric value >= 1). Leading zeros are
          # allowed because some config generators pad to fixed width (e.g. "07");
          # a `07 ... 10#` base-10 round-trip keeps later arithmetic from tripping
          # on bash's octal parsing of zero-prefixed numbers at `$age_days -lt
          # $MIN_AGE_DAYS`.
          #
          # Rejects: 0, 00, negatives, non-numeric, empty.
          # Accepts: 1, 07, 100, 0007.
          preflight::validate_min_age_days() {
            local raw="${MIN_AGE_DAYS:-}"
            # Require at least one digit, reject non-digits. The `10#` base-10
            # prefix on the arithmetic below sidesteps bash's octal interpretation
            # of leading zeros (`$((07))` is 7 but `$((08))` is a syntax error).
            # not_run rows (see fail_not_run): the remedy is the workflow input,
            # so the PR comment must not offer a re-run or the bypass label — with
            # MIN_AGE_DAYS=0 the label would switch the gate off on a repo whose
            # quarantine is already a no-op. The value came from the caller's
            # workflow and is rendered as markdown, so it is sanitized first.
            # "unset" only when it IS unset: a value that sanitizes to nothing
            # (`%%%`, whitespace) is present and wrong, and saying "unset" would
            # send the operator to add an input they already have. Parentheses,
            # not angle brackets: this reaches two markdown surfaces, and GitHub
            # drops an unknown tag like `<unprintable>` on both.
            local shown="unset"
            if [ -n "$raw" ]; then
              shown=$(preflight::safe_for_md "$raw"); shown="${shown:-(unprintable)}"
            fi
            if ! [[ "$raw" =~ ^[0-9]+$ ]]; then
              preflight::fail_not_run "MIN_AGE_DAYS" "MIN_AGE_DAYS must be a positive integer (got: ${shown})"
            fi
            if [ "$((10#$raw))" -lt 1 ]; then
              preflight::fail_not_run "MIN_AGE_DAYS" "MIN_AGE_DAYS must be at least 1 (got: ${shown}) — zero would make the quarantine a silent-pass no-op"
            fi
            # Normalize to the base-10 numeric form so all subsequent callers do
            # integer comparisons without re-parsing leading zeros. Exported
            # because the variable was passed via env and most scripts reference
            # it directly rather than through a local.
            MIN_AGE_DAYS=$((10#$raw))
            export MIN_AGE_DAYS
          }

          # ----- Base-ref verification -------------------------------------------------

          # Verify the base ref exists in the local checkout before running
          # `git diff` against it. Without this, `git diff ... 2>/dev/null` on
          # a missing ref produces empty output, and a trailing `|| true` on
          # the downstream filter pipeline silently swallows the failure — the
          # script exits 0 with "No changes detected" even though the diff
          # never ran. Friendly error here, explicit failure exit.
          #
          # MUST BE CALLED before any subsequent `git diff`. Callers that extract
          # a diff via `$(git diff ...)` inside a helper function are protected
          # by this preflight *only* for the expected "missing base ref" failure
          # mode; for catastrophic git failures mid-script the helper still needs
          # its own failure branch — `preflight::git_diff_or_fail` below is that
          # branch, and keeps the diagnosis off the caller's captured stdout.
          #
          # Also resolves "the base" ONCE, as the merge base of base_ref and HEAD,
          # and exposes it via `preflight::base_rev`. Every `git diff
          # ${base_ref}...HEAD` in the ecosystem scripts already compares against
          # that merge base (three-dot semantics); a parser that instead READS a
          # base image — `git show <rev>:<path>`, `git cat-file -e` — must read
          # the same revision, or the two halves of one function disagree about
          # which base they mean. Read at the TIP of base_ref, any dependency the
          # base branch dropped or bumped after this branch forked is present in
          # the head image and absent from the base one, so it reads as newly
          # added and, if young, fails a PR that never touched it. Every
          # ecosystem's main() hands its parsers this revision rather than the
          # ref, so no call site re-derives what "the base" means.
          #
          # Requires git ITSELF rather than trusting each binding's
          # preflight::require_tools list to name it: every ecosystem comes through
          # here, and without git the first probe below exits 127, which reads as
          # "the ref does not resolve" — the operator would be told to fetch the
          # base branch on a runner that has no git to fetch it with. Same
          # fail_not_run exit as the binding's own require_tools call, so the
          # missing-tool row and footer are the ones that call would have written.
          # The per-ecosystem lists KEEP `git` where they have it: that first call
          # names every missing tool in one row, while this one can only add git
          # after the others have been installed, and a binding that runs its own
          # `git diff` should say so in its own list. This call is the backstop
          # for a list that forgot.
          preflight::verify_base_ref() {
            local base_ref="$1"
            if [ -z "$base_ref" ]; then
              echo "::error::preflight::verify_base_ref called with empty argument"
              exit 1
            fi
            preflight::require_tools git
            # Sanitized once, here, for every surface the two failures below reach
            # — the log line, the PR-comment row and the summary footer all render
            # markdown, and a legally-named ref can carry `_`, `#` or a backtick.
            local safe_ref; safe_ref=$(preflight::safe_for_md "$base_ref")
            if ! git rev-parse --verify --quiet "$base_ref" >/dev/null; then
              preflight::fail_not_run "$safe_ref" "base ref ${safe_ref} is not in this checkout — the base branch has to be fetched (fetch-depth: 0 on actions/checkout)"
            fi
            # A ref that resolves is not yet a usable base: on a shallow checkout
            # (fetch-depth: 1) it exists but shares no reachable history with
            # HEAD, and every three-dot diff downstream would fail on the same
            # missing merge base. Failing here names the fix once, for every
            # ecosystem.
            if ! _PREFLIGHT_BASE_REV=$(git merge-base "$base_ref" HEAD); then
              preflight::fail_not_run "$safe_ref" "could not resolve the merge base of ${safe_ref} and HEAD — most often a shallow checkout, in which case the workflow needs fetch-depth: 0 on actions/checkout"
            fi
            # The parsers are handed the revision, not the ref, and name only the
            # revision in their own diagnostics; this is where the log ties the two.
            echo "Base ${safe_ref}: merge base with HEAD is ${_PREFLIGHT_BASE_REV}"
          }

          # Fail a run that never got to examine a pin, on every surface an
          # operator might read: the log annotation, the failures TSV as a
          # `not_run` row (so the PR comment carries the remedy — see
          # record_not_run for why that row gets its own section) and the
          # step-summary footer. For the failures a consumer repo reaches through
          # an ordinary workflow setting — an unfetched base branch, a shallow
          # checkout, a runner image without a required tool, a MIN_AGE_DAYS that
          # is not a positive integer — because the PR comment is the one surface
          # an operator sees without opening the run log. That comment only exists when there is a
          # pull request to put it on: the render step is gated on a PR number,
          # so a `push` or `workflow_dispatch` run — the shapes that reach these
          # failures most easily — gets the ::error and the summary footer only.
          # Coding errors stay ::error-only. The footer lands before any ecosystem
          # header, since preflight runs first; its text stands on its own.
          #
          # Both arguments arrive SANITIZED (see verify_base_ref): they are rendered
          # as markdown twice over. `display_id` names WHERE the fix goes — the
          # base ref, the runner, the input — and heads the comment's "Where"
          # column. `reason` is one lowercase clause with no terminal period — the
          # footer wraps it as `— ${reason}.` and the comment renders it in a
          # table cell beside short sibling clauses.
          preflight::fail_not_run() {
            local display_id="$1" reason="$2"
            echo "::error::${reason}"
            preflight::record_not_run "$display_id" "$reason"
            preflight::step_summary_unverifiable "$reason"
            exit 1
          }

          # Assert verify_base_ref has run. `base_rev` uses it as its guard;
          # callers can also invoke it right before a `git diff` as a static
          # sanity check that the required-call-order convention was followed.
          # Stderr, because `base_rev` is read through `$(...)` and a message on
          # stdout would be captured and lost.
          preflight::require_base_ref_verified() {
            if [ -z "${_PREFLIGHT_BASE_REV:-}" ]; then
              echo "::error::preflight::verify_base_ref must be called before any git diff. This is a coding error, not a runtime condition." >&2
              exit 1
            fi
          }

          # The merge base `verify_base_ref` resolved, on stdout — the revision
          # every parser reads its base image from and diffs against, never the
          # tip of base_ref. Fails closed if verify_base_ref has not run: with an
          # empty revision `git show :<path>` reads the INDEX, a silent wrong
          # answer rather than an error.
          preflight::base_rev() {
            preflight::require_base_ref_verified
            printf '%s\n' "$_PREFLIGHT_BASE_REV"
          }

          # `git diff` for the separable parsers, which `main` reads through
          # `$(...)`. That makes a parser's stdout the work-list, so a failure is
          # announced on stderr — where it reaches the job log and the annotations
          # panel rather than the captured (and, under `set -e`, discarded) stdout —
          # and the caller propagates the non-zero return:
          #
          #   diff_out=$(preflight::git_diff_or_fail "${base_rev}...HEAD" -- "$file") || return 1
          preflight::git_diff_or_fail() {
            git diff "$@" || {
              # `%q` keeps the reproduced command re-runnable (pathspec globs stay
              # quoted) and, unlike `$*`, does not join on the libs' newline+tab IFS.
              local cmd; printf -v cmd ' %q' "$@"
              echo "::error::git diff${cmd} failed" >&2
              return 1
            }
          }

          # ----- Head-only lines: one comparator for every image-reading parser --------

          # Emit the lines <parser_fn> yields for the HEAD image of <file> but not for
          # its image at <base_rev> — "what this branch introduces". <base_rev> is
          # preflight::base_rev: the merge base, already resolved once, handed in as a
          # revision so this function cannot disagree with the caller's three-dot diff
          # about which base it means. <parser_fn> is any function meeting the parser
          # contract every ecosystem's extractors already satisfy: one manifest image
          # on stdin, one work-list line per entry on stdout, every diagnostic on
          # stderr, non-zero on input it cannot read.
          #
          # Message ownership on a parse failure: this helper says WHICH image failed
          # and that the run refuses an empty work-list — "<file> could not be
          # parsed", format-agnostic because the helper never knows the format, and
          # already naming the file ("yarn.lock could not be parsed") — and the
          # PARSER says WHY, on stderr, immediately above it: jq's own parse error
          # for package-lock, yarn_pins' END diagnostic for yarn (which of its three
          # refusals fired, with the counts). A binding may add a check of its own,
          # before or after calling here, when it can say something the parser
          # would not: diff_package_lock's "is not valid JSON" object check catches
          # the empty file jq reads as nothing, and diff_pnpm_lock's shortfall
          # guard reports the numbers for a lockfileVersion only partly understood
          # (rc 5) where the extractor itself exits 0. Such a check does not
          # restate this helper's line, and no format name is spliced into this
          # helper's message. Every npm binding and pre-commit route through here,
          # so this is the one place the split is written down. The pairing is
          # adjacent in the JOB LOG only: this helper's line is a `::error file=`
          # and so also reaches the annotations panel and the Files-changed view,
          # while the parser's reason is plain stderr text — an operator who starts
          # from the annotation has to open the log for the why, exactly as with
          # jq's error today.
          #
          # This is the body `precommit_age::changed_pins` and `npm_age::changed_pins`
          # each carried verbatim — probe, temp-file read, two checked parses, a set
          # difference — and it lives here so the two cannot drift on the details
          # they had already drifted on (`grep -vxF` versus `comm -13`, a bare path
          # versus `./`, whether a failed read is an error or an empty set).
          #
          # Deliberately OVER-checks rather than under-checks: a line reintroduced
          # after removal, or re-pinned to a version the repo used before, is
          # re-verified and simply passes. Records are compared as whole lines, so a
          # caller that encodes provenance in the line (npm's `offregistry<TAB>`
          # prefix) gets a pin that changed registries reported as new for free.
          #
          # Exit codes — the caller MUST branch on these; an unchecked non-zero
          # collapses into an empty work-list, which reads as "nothing changed" and
          # passes the PR. They match what both callers' main() already render:
          #   0 - stdout is the work-list, possibly empty
          #   1 - the HEAD image could not be parsed, or the comparison itself failed
          #   2 - the BASE image exists but could not be read or parsed, no scratch
          #       space for it, or <base_rev> does not resolve to a commit in this
          #       checkout — a checkout or environment problem, not this branch's
          # A coding error (unknown parser, empty revision) aborts instead — see below.
          #
          # MUST be called under `$(...)`, as every binding does: the two coding-error
          # guards `exit`, and a bare `if new_lines_since_base ...; then` would take the
          # script down mid-run instead of reaching the caller's fail-closed branch.
          # Tools: sort, comm — and mktemp unless a path is supplied. Each caller
          # declares them in its own preflight::require_tools list; a new binding
          # owes that list an edit too. git is used here as well, but a binding
          # that passes in preflight::base_rev does not owe it:
          # preflight::verify_base_ref requires git, and base_rev yields nothing
          # until that has run. A caller that bypasses base_rev owes git itself.
          #
          # Optional 4th argument <base_blob>: a caller-owned path. When given, the
          # base image is written THERE and left for the caller, instead of into a
          # temp file this function removes on return. For an ecosystem that wants
          # to say something about a base image that contributed nothing (pnpm's
          # absent/vendored/unreadable/empty classification, package-lock's
          # lockfileVersion-1 probe) without a second `git show` of a 10 MB blob.
          # Untouched when the base has no image, so a caller probes existence the
          # same way this function does before reading it. The caller owns cleanup —
          # and, if it reuses one path across manifests, truncation between them:
          # nothing here empties a file it did not write to.
          #
          # Optional 5th argument <base_lines_out>: a caller-owned path. When given,
          # the lines <parser_fn> yielded for the base image are written THERE, so a
          # caller that classifies the base side (pnpm) reads them back instead of
          # parsing <base_blob> a second time. Same ownership rules as <base_blob>,
          # and likewise untouched when the base has no image; an image that parsed
          # to nothing leaves it zero bytes. A write that fails is rc 2: a short
          # file would hand the caller a base set it cannot tell from a real one.
          #
          # Optional 6th argument <head_lines_in>: a caller-owned path holding the
          # lines <parser_fn> ALREADY yielded for the head image of <file>. When
          # given, they are read from it and the parser is not run on the head — for
          # a caller that had to parse the head first for a triage of its own (pnpm
          # again). The caller vouches that they are that parser's output for that
          # file, complete, and that the file is in the working tree: this function
          # cannot check the first two and, given lines, does not look for the file,
          # so lines handed in for a DELETED file would be promoted where the
          # parser path reports nothing. An unreadable path is
          # rc 1, the head-side code. The base side is read and parsed regardless.
          #
          # An empty string is "not given" for all three, so a caller MUST check the
          # mktemp it gets a path from: an empty <base_lines_out> writes nothing for
          # it to read back.
          preflight::new_lines_since_base() {
            local file="$1" base_rev="$2" parser_fn="$3" base_blob="${4:-}"
            local base_lines_out="${5:-}" head_lines_in="${6:-}"

            # Two coding errors, and both `exit` rather than return: a misspelled
            # parser name would otherwise fail per-image below and be rendered by
            # main() as a manifest that could not be parsed, and an empty revision
            # makes `git show :<path>` read the INDEX — a silent wrong answer. Neither
            # is a runtime condition the exit-code contract below describes, so they
            # take the same path as require_base_ref_verified: abort, naming the bug.
            # (Every caller runs this under `$(...)`, so the abort reaches them as
            # rc 1 and the ::error on stderr; run bare, it stops the script.)
            if ! declare -F "$parser_fn" >/dev/null 2>&1; then
              echo "::error::preflight::new_lines_since_base: '${parser_fn}' is not a shell function. This is a coding error, not a runtime condition." >&2
              exit 1
            fi
            if [ -z "$base_rev" ]; then
              echo "::error::preflight::new_lines_since_base: empty base revision for ${file}. This is a coding error, not a runtime condition." >&2
              exit 1
            fi

            # A NON-EMPTY revision this checkout cannot resolve — a truncated SHA, a
            # ref never fetched or since pruned — would fail the path probe below
            # exactly the way an absent file does, and the whole head image would be
            # promoted as "new on this branch": loud (every pin reported new; on a
            # large lockfile, the job timeout), but blamed on the branch instead of
            # the checkout — the mis-attribution the read step below exists to
            # refuse. Unreachable through preflight::base_rev, which only hands out
            # a merge base it resolved; this is the guard for a caller that did not
            # go through it. rc 2 rather than an abort: a revision the checkout
            # lacks is a checkout problem, not a coding error. `^{commit}` is
            # load-bearing — `rev-parse --verify` accepts any 40-hex string as a
            # revision WITHOUT looking it up, and only peeling it makes the object
            # have to exist. `^{commit}` and not `^{tree}`: the contract is a
            # revision whose history `git merge-base` produced, the base read
            # below spells the path `<rev>:./<file>` (which a tree-ish would also
            # satisfy), and accepting a bare tree would readmit the ambiguity this
            # guard removes — do not "fix" the peel to widen it. A bare
            # `::error::`, like fail_not_run's checkout failures: `file=` would pin
            # a red marker on a manifest that had no part in the fault. The text
            # names the file.
            #
            # The revision is sanitized because this guard exists for callers that
            # bypass base_rev, the same way verify_base_ref sanitizes the ref it
            # echoes: a revision carrying a newline would otherwise close this
            # annotation and open a second workflow command of the attacker's
            # choosing. Nothing downstream reads the sanitized copy; it is display
            # only.
            if ! git rev-parse --verify --quiet "${base_rev}^{commit}" >/dev/null 2>&1; then
              local safe_rev; safe_rev=$(preflight::safe_for_md "$base_rev" 200)
              echo "::error::base revision '${safe_rev}' for ${file} does not resolve to a commit in this checkout — a truncated SHA, or a ref this checkout never fetched or has since pruned" >&2
              return 2
            fi

            # Base side FIRST, and unconditionally when an image exists. A head that
            # parses to nothing — or is deleted on this branch — would let a
            # head-first short-circuit return "nothing new" without ever opening the
            # base image, and a base that cannot be read (a partial clone's lazy blob
            # fetch) would then pass unannounced: an empty work-list is exactly the
            # silent-pass shape this check exists to prevent, so the checkout problem
            # must surface even when there would be nothing to difference.
            #
            # `<rev>:./<path>` — the "./" is load-bearing. `git show <rev>:<path>`
            # resolves <path> from the TOP OF THE WORKING TREE unless it starts with
            # `./`, while the head read below is an ordinary cwd-relative redirect.
            # Under a workflow that sets `working-directory` (npm's does) a bare path
            # would compare a sub-app manifest against the REPO ROOT's, and the set
            # difference would then suppress any head pin that also appears there —
            # a fail-OPEN in a supply-chain gate. Where cwd is the repo root the two
            # spellings coincide, so callers without that input lose nothing.
            # Existence is answered from the TREE — `rev-parse --verify` resolves the
            # entry without needing the blob — and the read below is what touches the
            # object. `git cat-file -e` would touch it too, and on a partial clone
            # whose lazy fetch fails it exits 128: the probe would then report "no
            # base image", the whole head manifest would be promoted, and the
            # operator would be told every pin is new instead of that their checkout
            # is incomplete — on a 3000-package lockfile, the job timeout.
            local base_lines=""
            if git rev-parse --verify --quiet "${base_rev}:./${file}" >/dev/null 2>&1; then
              # Read, then parse, as two checked steps, because they have different
              # remedies: a `git show` that fails on an object the merge base names
              # is a checkout problem (a partial clone's lazy blob fetch — the case
              # the probe above deliberately leaves to this step — or a corrupt
              # object), while an image the parser rejects is a manifest problem —
              # and one pipeline reports both as the second. Through a temp file so
              # a monorepo-scale image is never held in a shell variable (npm
              # lockfiles here run to 10 MB+; a here-string would spool it back out
              # to a temp file anyway). Same mktemp + `trap ... RETURN` idiom as
              # npm_age::published_at; the trap fires when THIS function returns,
              # not when the parser it calls does.
              if [ -z "$base_blob" ]; then
                base_blob=$(mktemp) \
                  || { echo "::error::could not create a temporary file for the base image" >&2; return 2; }
                # shellcheck disable=SC2064
                trap "rm -f \"$base_blob\"" RETURN
              fi
              if ! git show "${base_rev}:./${file}" > "$base_blob"; then
                echo "::error file=${file}::could not read ${file} at the merge base (${base_rev}) — git show failed; see its message above" >&2
                return 2
              fi
              # Fail closed and fast rather than promote the whole head image: on a
              # 3000-package lockfile that promotion is a guaranteed job timeout —
              # the same red build with a far worse message.
              if ! base_lines=$("$parser_fn" < "$base_blob"); then
                echo "::error file=${file}::${file} at the merge base (${base_rev}) could not be parsed; cannot determine which entries this branch introduces" >&2
                return 2
              fi
              # Guarded like the emit at the bottom: an image that parsed to nothing
              # is zero bytes, not a blank line a line-counting caller would read as
              # one record.
              if [ -n "$base_lines_out" ]; then
                { [ -z "$base_lines" ] || printf '%s\n' "$base_lines"; } > "$base_lines_out" \
                  || { echo "::error file=${file}::could not write the parsed base image of ${file} to scratch space; cannot determine which entries this branch introduces" >&2; return 2; }
              fi
            fi
            # An ABSENT base image is not an error — it is what a file this branch
            # adds looks like, and an empty base set promotes the whole head image,
            # which is the right answer for it.

            # The head is read from the WORKING TREE, deliberately: main() selects
            # targets by working-tree presence, and the working tree is what the job
            # would actually install. A file this branch DELETES introduces nothing.
            # A caller that already ran the parser on it hands the lines in instead.
            local head_lines=""
            if [ -n "$head_lines_in" ]; then
              # `-r` first, and a builtin read: under `set -e`, bash 5.2 was seen to
              # exit the shell on a `$(< file)` whose file is missing instead of
              # handing its status to the `||` — and npm declares no `cat`.
              { [ -r "$head_lines_in" ] && head_lines=$(< "$head_lines_in"); } \
                || { echo "::error file=${file}::could not read back the parsed entries of ${file}; refusing to report an empty work-list" >&2; return 1; }
            elif [ -f "$file" ]; then
              head_lines=$("$parser_fn" < "$file") \
                || { echo "::error file=${file}::${file} could not be parsed; refusing to report an empty work-list" >&2; return 1; }
            fi
            # No early return for an empty head: the capture below strips the one
            # blank line comm would emit for it, and the emit guard drops it. An
            # early return here would be a second defence for the same input, which
            # nothing could fence — see the deleted-file and no-blank-line tests,
            # which measure the guard byte-exactly.

            # `comm` wants both sides sorted under one collation and reads an empty
            # operand as the empty set, so neither the added-file case nor a parser
            # that emitted nothing needs special-casing. It also settles the
            # `comm -13` / `grep -vxF -f` split the callers had reached
            # independently: -F needed telling that a record may carry a literal tab
            # and that a URL's regex metacharacters are data, and its exit 1 ("no
            # lines selected") had to be told apart from a real failure at every
            # site; comm compares whole lines and its non-zero status is only ever a
            # failure. The lone blank a printf of an empty base set produces is in
            # neither head set, so comm never emits it.
            #
            # Each sort is its own checked step. `set -o pipefail` does not reach
            # into a process substitution, so a `sort -u` running INSIDE comm's
            # `<(...)` that dies partway (OOM-killed on a monorepo work-list) hands
            # comm a truncated set and comm exits 0 — a silently SHORT work-list,
            # fewer pins aged, green build. Sorted into variables first, each sort's
            # status is observable and a failure is rc 1; what the substitutions
            # below carry is a printf of an already-complete string, which has no
            # partial-failure mode comm's own status does not cover. The work-list
            # is bounded (npm caps it), so two sorted copies do not reintroduce the
            # memory concern the temp-file read avoids.
            local base_sorted head_sorted
            base_sorted=$(printf '%s\n' "$base_lines" | LC_ALL=C sort -u) \
              || { echo "::error file=${file}::failed to sort the base image of ${file} for comparison; refusing to report an empty work-list" >&2; return 1; }
            head_sorted=$(printf '%s\n' "$head_lines" | LC_ALL=C sort -u) \
              || { echo "::error file=${file}::failed to sort ${file} for comparison; refusing to report an empty work-list" >&2; return 1; }
            # comm's status is captured, not inherited: its own 2 would otherwise be
            # rendered by main() as an unreadable base image and a fetch-depth remedy.
            local out cmp_rc=0
            out=$(LC_ALL=C comm -13 <(printf '%s\n' "$base_sorted") <(printf '%s\n' "$head_sorted")) || cmp_rc=$?
            if [ "$cmp_rc" -ne 0 ]; then
              echo "::error file=${file}::failed to compare ${file} against its base image (comm exited ${cmp_rc}); refusing to report an empty work-list" >&2
              return 1
            fi
            # The emit guard is what turns "comm produced only the blank line the
            # empty set printf'd" into zero bytes rather than one newline.
            [ -n "$out" ] && printf '%s\n' "$out"
            return 0
          }

          # ----- ISO-8601 → epoch helper ----------------------------------------------

          # Every ecosystem converts a registry-returned ISO-8601 timestamp into
          # epoch seconds via `date -d "$ts" +%s`, and every one had its own
          # error-handling branch. Shared helper echoes epoch on stdout, exits 1
          # on parse failure with the offending timestamp in the stderr message.
          # Caller can use `if ! epoch=$(preflight::iso8601_to_epoch "$ts"); then
          # ...skip or fail... fi`.
          preflight::iso8601_to_epoch() {
            local ts="$1"
            local epoch
            if [ -z "$ts" ]; then
              return 1
            fi
            if ! epoch=$(date -d "$ts" +%s 2>/dev/null); then
              return 1
            fi
            echo "$epoch"
          }

          # Given a publish epoch + now epoch + MIN_AGE_DAYS, emit the age in
          # days on stdout and return a classification via exit code:
          #   0 - passes; age >= MIN_AGE_DAYS + 2 (clearly past threshold)
          #   2 - passes but borderline; MIN_AGE_DAYS <= age <= MIN_AGE_DAYS + 1
          #       (the "just past threshold" :eyes: case — advance warning that
          #       a small threshold bump or an unpublish would flip this PR)
          #   1 - fails; age < MIN_AGE_DAYS (too new)
          #
          # !!! CALLER CONVENTION !!!
          # Callers MUST use a 3-way `case` on the exit code, NOT a 2-way
          # `if/then/else`. A naïve `if preflight::classify_age …; then ok; else fail; fi`
          # would silently misclassify BOTH `1` (too_new) AND `2` (borderline)
          # as failures — losing the advance-warning signal and (worse) treating
          # a borderline pass as a block.
          #
          # Correct pattern:
          #   rc=0
          #   age_days=$(preflight::classify_age "$pub" "$now" "$MIN_AGE_DAYS") || rc=$?
          #   case "$rc" in
          #     0) ok ;;
          #     2) borderline ;;
          #     *) too_new ;;  # catches 1 and any future non-pass codes
          #   esac
          #
          preflight::classify_age() {
            local publish_epoch="$1" now_epoch="$2" min_age_days="$3"
            local age_days=$(( (now_epoch - publish_epoch) / 86400 ))
            echo "$age_days"
            if [ "$age_days" -lt "$min_age_days" ]; then
              return 1
            fi
            if [ "$age_days" -le "$((min_age_days + 1))" ]; then
              return 2
            fi
            return 0
          }

          # Given a publish epoch + MIN_AGE_DAYS, echo the ISO date (UTC) when
          # the package becomes eligible. Used in the "too new" error message
          # so developers know when to retry without needing the bypass label.
          # Falls back to "unknown" on parse error rather than breaking the
          # error message flow.
          preflight::eligible_date_utc() {
            local publish_epoch="$1" min_age_days="$2"
            date -u -d "@$((publish_epoch + min_age_days * 86400))" +%Y-%m-%d 2>/dev/null || echo "unknown"
          }

          # Append a single failure row to a workflow-level TSV so a downstream
          # job step can render the data into a PR comment without re-doing the
          # classification work. No-op when AGE_CHECK_FAILURES_FILE is unset (the
          # common case — local dev, callers that didn't opt into the comment
          # feature). Format is one row per failed pin:
          #
          #   <display_id>\t<display_version>\t<age_days>\t<min_age_days>\t<eligible_date>\t<days_remaining>\t<kind>
          #
          # `kind` is `too_new` (this helper), or one of the reason-carrying kinds
          # written by the sibling helpers below: `unverifiable`
          # (`preflight::record_unverifiable`), `misconfigured`
          # (`preflight::record_misconfigured`) or `not_run`
          # (`preflight::record_not_run`). The downstream renderer splits on kind
          # so each failure class gets the right operator guidance: too-new →
          # "wait until the eligible date"; unverifiable → "re-run";
          # misconfigured → "fix the pin"; not-run → "fix the checkout".
          #
          # Tabs were chosen over JSON because the consumer (a small bash step in
          # the template) parses with `IFS=$'\t' read` — no jq dependency, and
          # `display_id` / `display_version` have already been run through
          # `safe_for_md` so they cannot contain tabs.
          #
          # `days_remaining` is computed as calendar-day delta between today (UTC,
          # midnight) and the eligible-after date. That matches the `eligible_date`
          # column the user reads on the same row — the alternative (`min - age`)
          # off-by-ones on freshly-committed pins because `age_days` floors:
          # a pin committed 22h ago has age_days=0, so `min - age` would suggest
          # "wait 7 days" when in calendar terms only 6 days remain until eligible.
          # Falls back to the floor approximation only if the eligible string is
          # unparseable (defensive — should never happen since the caller fed it
          # through `eligible_date_utc`). Clamped at 0 to defend against clock
          # skew producing a negative.
          preflight::record_failure() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" age_days="$3"
            local min_age_days="$4" eligible="$5"
            local days_remaining today_epoch eligible_epoch
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s 2>/dev/null || true)
            eligible_epoch=$(date -u -d "${eligible}" +%s 2>/dev/null || true)
            if [ -n "${today_epoch}" ] && [ -n "${eligible_epoch}" ]; then
              days_remaining=$(( (eligible_epoch - today_epoch) / 86400 ))
            else
              days_remaining=$(( min_age_days - age_days ))
            fi
            [ "$days_remaining" -lt 0 ] && days_remaining=0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "$age_days" \
              "$min_age_days" "$eligible" "$days_remaining" \
              "too_new" \
              >> "$file"
          }

          # Sibling of `record_failure` for the "couldn't fetch metadata" failure
          # class — a pin shape-checks fine, but the registry / API / proxy returned
          # an error or empty body so the script can't compute an age. Without
          # this, transient upstream failures produce a red required check with
          # no PR-level explanation: the comment-on-failure step gates on `[ -s
          # FAILURES_FILE ]`, and the only writer was `record_failure` (too-new
          # only). The reviewer then has to dig into the run log to discover that
          # the failure was a 5xx and a re-run will pass.
          #
          # Writes the same TSV schema as `record_failure` so the renderer reads
          # one format. The age / eligible / remaining columns carry sentinels
          # (`?` / "n/a" / `?`) — the renderer hides those columns for the
          # unverifiable section since "wait N days" copy doesn't apply. The
          # `reason` arg is what gets shown to the operator in lieu of the
          # eligible-after date.
          #
          # Args:
          #   $1 display_id        already sanitized via safe_for_md
          #   $2 display_version   already sanitized via safe_for_md
          #   $3 reason            short human-readable cause, e.g.
          #                        "gh api unreachable or commit not found"
          #                        — surfaces in the comment so the reviewer
          #                        knows whether to re-run or open an upstream
          #                        issue. Tabs are stripped to keep the row
          #                        parseable.
          preflight::record_unverifiable() {
            preflight::_record_reason_row "$1" "$2" "${3:-unknown reason}" unverifiable
          }

          # A row of kind `misconfigured`: the check looked at this pin and it
          # cannot be age-checked as the PR wrote it — a FROM with no @sha256
          # digest, an image reference that fails shape validation. Unlike an
          # unverifiable row this is deterministic and the PR's own to fix, so the
          # comment renders these in their own section with no "re-run" copy and
          # no `age-check-bypass` offer: re-running cannot help, and the label
          # would clear the check on exactly the PR that needs it kept. Not
          # `not_run` either — the check did run, and examined the other pins.
          #
          # Args as record_unverifiable; the reason must name the fix.
          preflight::record_misconfigured() {
            preflight::_record_reason_row "$1" "$2" \
              "${3:-cannot be age-checked as written — fix the pin in this PR}" misconfigured
          }

          # A row of kind `not_run`: the check stopped in preflight, before it
          # examined a single pin — an unfetched base branch, a shallow clone. The
          # remedy is a checkout setting, so the comment renders these in their
          # own section with no "re-run" copy and no `age-check-bypass` offer:
          # re-running cannot help, and the label would switch the gate off for a
          # PR whose checkout is what needs fixing. `display_id` is the base ref,
          # already sanitized (see verify_base_ref).
          preflight::record_not_run() {
            preflight::_record_reason_row "$1" "n/a" "$2" not_run
          }

          # Shared writer for the reason-carrying kinds. Strips characters that
          # would corrupt the downstream comment:
          #   - tabs/newlines break `IFS=$'\t' read` (multiline reason would
          #     produce row count != failure count)
          #   - `|` breaks the markdown table layout — the reason cell sits
          #     between two `|` separators in the rendered comment, and an
          #     embedded `|` would split the row into extra columns. All
          #     in-tree call sites pass pipe-free strings today; this strip
          #     defends a future caller forwarding upstream error text (e.g.,
          #     curl stderr that happens to contain `|`).
          preflight::_record_reason_row() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            # An id that sanitized away entirely (a FROM spec made of characters
            # safe_for_md strips) must still render: the comment's loops skip a
            # row with an empty id, leaving a section header over an empty table.
            local display_id="${1:-(unprintable)}" display_version="$2" reason="$3" kind="$4"
            reason=$(printf '%s' "$reason" | tr -d '\t\n|')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "?" \
              "n/a" "$reason" "?" \
              "$kind" \
              >> "$file"
          }

          # ----- Shared age-check outcome helper --------------------------------------

          # Classify a dependency's age and emit the full CI output for it
          # (markdown row + log annotation). Returns an exit code the caller
          # can map to its counters. For the typical caller pattern that
          # updates both `checked_count` and `failed`, use the thin wrapper
          # `preflight::age_row_and_tally` which does the mapping via bash's
          # dynamic scoping.
          #
          # !!! SECURITY CONTRACT !!!
          # `display_id` and `display_version` are interpolated directly into:
          #   - the markdown row (caller-inspectable via $GITHUB_STEP_SUMMARY)
          #   - log lines (visible in the Actions job log)
          # This helper does NOT re-sanitize them. Callers MUST pre-sanitize via
          # `preflight::safe_for_md` (or a tighter ecosystem-specific validator
          # like `is_valid_pkg_name`) before passing in, otherwise a crafted
          # lockfile / registry response could inject active markdown into the
          # step summary.
          #
          # Arguments:
          #   $1 display_id        e.g. "lodash" or "actions/checkout" (sanitized)
          #   $2 display_version   e.g. "4.17.21" or "1a2b3c4d" (sanitized)
          #   $3 publish_time      ISO-8601 string from the registry
          #   $4 now_epoch         caller's pre-computed `date +%s`
          #   $5 min_age_days      positive integer (caller already validated)
          #   $6 verb              past-tense verb for too-new error messages
          #                        ("published" | "committed" | "tagged" |
          #                        "built" | "uploaded"). Defaults to "published".
          #   $7 file_hint         optional source filename for `file=` annotation
          #   $8 separator         how to join id + version in log lines. Default
          #                        "@"; pip uses "==".
          #
          # Exit codes (richer than ok/fail so callers can distinguish borderline
          # from too_new, and parse_error from a real too-new result):
          #   0 — ok (clearly past threshold)
          #   1 — too_new
          #   2 — borderline (just past threshold; counts as pass, with :eyes: row)
          #   3 — parse_error (malformed ISO-8601 or missing required arg)
          preflight::age_row_for_publish() {
            local display_id="$1" display_version="$2" publish_time="$3"
            local now_epoch="$4" min_age_days="$5"
            local verb="${6:-published}"
            local file_hint="${7:-}"
            local sep="${8:-@}"

            # Required-arg validation. Name the specific missing arg in the
            # error so a future caller doesn't have to bisect. `verb`, `file_hint`,
            # `sep` have defaults; the five below do not. Empty values would
            # surface later as arithmetic errors or spurious row text.
            local arg
            for arg in display_id display_version publish_time now_epoch min_age_days; do
              if [ -z "${!arg}" ]; then
                echo "::error::preflight::age_row_for_publish: required arg \`${arg}\` was empty" >&2
                return 3
              fi
            done

            # Full identifier for log lines; row cells stay separate.
            local full_id="${display_id}${sep}${display_version}"

            # GitHub Actions annotation format requires `::` between command
            # (+ optional params) and message. `::error::msg` is valid;
            # `::error msg` is NOT and will render as plain log text. So:
            #   no file_hint → `::` (bare delimiter)
            #   with hint    → ` file=<path>::` (leading space separates
            #                  `::error` from params, trailing `::` closes them)
            local file_prefix="::"
            [ -n "$file_hint" ] && file_prefix=" file=${file_hint}::"

            local publish_epoch
            if ! publish_epoch=$(preflight::iso8601_to_epoch "$publish_time"); then
              echo "::error${file_prefix}Could not parse publish timestamp for ${full_id}: ${publish_time}"
              echo "| \`${display_id}\` | ${display_version} | — | :x: parse error |" >> "$GITHUB_STEP_SUMMARY"
              # Its own row: this fails the run, and without one the exit guard's
              # generic row would stand in for a pin the check did look at. The
              # raw timestamp stays in the log only — it is registry data.
              preflight::record_unverifiable "$display_id" "$display_version" \
                "the registry returned a publish timestamp that could not be parsed — see the job log"
              return 3
            fi

            local age_days class_rc=0
            age_days=$(preflight::classify_age "$publish_epoch" "$now_epoch" "$min_age_days") || class_rc=$?

            case "$class_rc" in
              0)
                echo "  OK: ${full_id} (${age_days} days old)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
                return 0
                ;;
              2)
                echo "::notice${file_prefix}${full_id} is ${age_days} day(s) old — just past the ${min_age_days}-day threshold"
                echo "  OK: ${full_id} (${age_days} days old, barely past threshold)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :eyes: just past threshold |" >> "$GITHUB_STEP_SUMMARY"
                return 2
                ;;
              *)
                local eligible; eligible=$(preflight::eligible_date_utc "$publish_epoch" "$min_age_days")
                echo "::error${file_prefix}${full_id} ${verb} ${age_days} day(s) ago (minimum: ${min_age_days}; eligible after ${eligible})"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :x: **too new** (eligible after ${eligible}) |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_failure "$display_id" "$display_version" "$age_days" "$min_age_days" "$eligible"
                return 1
                ;;
            esac
          }

          # Wraps `preflight::age_row_for_publish` and updates the caller's
          # `checked_count` and `failed` via bash's dynamic scoping. This is the
          # call most ecosystem scripts should use — one line, no case statement
          # at the callsite.
          #
          # Convention: caller MUST have locals named exactly `checked_count`
          # (integer) and `failed` ("true"/"false"). These are looked up through
          # the dynamic scope chain at runtime — no nameref magic, works on
          # bash >= 4.0 (and on macOS bash 3.2 for local-dev tests).
          #
          # Outcome mapping:
          #   ok (rc 0)            → checked_count++
          #   borderline (rc 2)    → checked_count++
          #   too_new (rc 1)       → checked_count++, failed=true
          #   parse_error (rc 3)   → failed=true (checked not incremented)
          #
          # All args are passed through to age_row_for_publish unchanged.
          preflight::age_row_and_tally() {
            local rc=0
            preflight::age_row_for_publish "$@" || rc=$?
            # Deliberate dynamic-scope writes: caller provides `checked_count`
            # and `failed` as locals; we update them in place.
            # shellcheck disable=SC2034
            case "$rc" in
              0|2) checked_count=$((checked_count + 1)) ;;
              1)   checked_count=$((checked_count + 1)); failed=true ;;
              3)   failed=true ;;
            esac
          }

          # ----- Output sanitization --------------------------------------------------

          # Sanitize arbitrary strings before writing to $GITHUB_STEP_SUMMARY.
          # Used for values that either pre-date a validator (the invalid-name
          # branch in each ecosystem) or come from untrusted lockfile / registry
          # output (version strings, image tags). Strips to a character class
          # that can't form active markdown (link/image/emphasis/HTML) and caps
          # length at 80 so a crafted over-long entry can't blow out the summary.
          #
          # Kept permissive enough that legitimate semver (`1.2.3+build.7`) and
          # scoped package names (`@scope/name`) survive round-trip unchanged.
          #
          # `LC_ALL=C` forces byte-level (ASCII-only) behavior so the tr + head
          # combo is deterministic across hosts. In a UTF-8 locale, `[:alnum:]`
          # would keep accented Latin letters and CJK chars, and `head -c 80`
          # could split a multibyte char at the boundary. Neither is a security
          # hole (markdown injection is still blocked), but byte-level behavior
          # is easier to audit and test. Unicode homoglyph attacks on package
          # names are a separate concern — handled (if at all) by the caller's
          # `is_valid_*` ASCII-only allowlists, not here.
          preflight::safe_for_md() {
            # $2 is an optional length; the default keeps a summary-table cell
            # readable. A log annotation has no table to fit and can carry more —
            # a git URL loses its commit fragment at 80.
            LC_ALL=C printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:]@/_.:+-' | LC_ALL=C head -c "${2:-80}"
          }

          # ----- Operational knobs ----------------------------------------------------
          #
          # Not sanitization: these validate tuning inputs. Kept below the
          # sanitization block so the markdown-allowlist rationale above stays
          # attached to safe_for_md, which is the function a maintainer reads it
          # for.

          # Validate an operational positive-integer knob, echoing the value to
          # use. Normalizes leading zeros through a base-10 round-trip for the
          # same reason validate_min_age_days does — a `010` would otherwise be
          # read as octal by arithmetic contexts.
          #
          # Unlike validate_min_age_days this FALLS BACK rather than aborting:
          # MIN_AGE_DAYS is the security threshold, while these are tuning knobs
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/_preflight.sh (part 2 of 2), lib/_npm-lockfile-parsers.sh (part 1 of 3)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/_preflight.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          # (work-list caps, budgets), and a fat-fingered value must not take a
          # supply-chain check offline. The warning goes to stderr because callers
          # read the value from stdout.
          preflight::validate_positive_int() {
            local name="$1" value="$2" fallback="$3"
            # Unset/empty is "not provided", not "misconfigured" — take the
            # fallback silently. Warning here would fire on every run for any
            # consumer whose workflow revision predates the input (the
            # `ref: main` split makes that a real population), and would blame
            # them for a value they never set. The ::warning below is reserved for
            # a value that is present and genuinely unusable.
            if [ -z "$value" ]; then
              printf '%s' "$fallback"
              return 0
            fi
            if [[ "$value" =~ ^[0-9]+$ ]]; then
              value=$((10#$value))
            else
              value=0
            fi
            if [ "$value" -lt 1 ]; then
              echo "::warning::${name} is not a positive integer; falling back to ${fallback}" >&2
              value="$fallback"
            fi
            printf '%s' "$value"
          }

          # Sanitize each element of a list and join with ", ". safe_for_md's
          # `tr -cd` keeps neither `,` nor space, so sanitizing an already-joined
          # string collapses "package-lock.json, yarn.lock" into
          # "package-lock.jsonyarn.lock". Map-then-join makes the safe order the
          # obvious one for the next caller.
          # Sanitize a lib-authored SENTENCE that carries a config value — a
          # validator's own "::error::" line, reused as a not_run row's reason —
          # for the markdown cells it lands in. safe_for_md's allowlist would
          # strip the spaces; this strips only what is markdown-active in a table
          # cell or a blockquote (backticks, emphasis, brackets, angle brackets,
          # backslashes), drops non-printing bytes — so hand it ONE line: a
          # newline is deleted, not spaced — and caps the length. The pipe is
          # stripped again by _record_reason_row.
          preflight::safe_sentence_for_md() {
            # `'\\'` reaches tr as an escaped backslash; a lone one at the end of
            # the set makes GNU tr print a portability warning on every call.
            # shellcheck disable=SC1003
            printf '%s' "$1" | tr -d '`*[]<>\\' | tr -cd '[:print:]' | cut -c1-320
          }

          preflight::safe_list_for_md() {
            local out="" item safe
            for item in "$@"; do
              safe=$(preflight::safe_for_md "$item")
              # Skip an element that sanitized away entirely. Testing the
              # ACCUMULATOR for emptiness instead would emit a dangling "a, " for a
              # trailing empty and "a, , c" for a middle one — the same class of
              # mis-rendering this function was added to fix, one step further out.
              [ -n "$safe" ] || continue
              out="${out:+${out}, }${safe}"
            done
            printf '%s' "$out"
          }

          # ----- Step-summary helpers --------------------------------------------------

          # `GITHUB_STEP_SUMMARY` is provided by GitHub Actions; default to
          # /dev/null for local runs so the helper doesn't error out. The
          # workflow always provides it in CI.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          preflight::step_summary_header() {
            local ecosystem="$1"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "| Package | Version | Age (days) | Status |"
              echo "|---------|---------|------------|--------|"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # For the "no changes" / "no deps" early-exit paths. Writes a single
          # summary blockquote line so the Actions UI reflects the early-exit
          # outcome instead of an empty summary panel.
          preflight::step_summary_no_changes() {
            local ecosystem="$1" reason="$2"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "> ${reason} :white_check_mark:"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          preflight::step_summary_all_passed() {
            local checked_count="$1" min_age_days="$2" skipped_count="${3:-0}"
            {
              echo ""
              echo "> Verified ${checked_count} package(s) at ≥ ${min_age_days} days old. :white_check_mark:"
              if [ "$skipped_count" -gt 0 ]; then
                echo "> ${skipped_count} skipped (see warnings above)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Now accepts optional counts so the footer breakdown matches what
          # callers actually tracked. Positional args are kept backwards-compatible
          # (only min_age_days is required).
          #
          # Optional $4 `no-bypass`: the run recorded a `misconfigured` row (see
          # record_misconfigured), so the footer withholds the label offer exactly
          # as the PR comment does — the label clears the whole check.
          preflight::step_summary_failed() {
            local min_age_days="$1" checked_count="${2:-}" skipped_count="${3:-}" bypass="${4:-}"
            {
              echo ""
              if [ "$bypass" = "no-bypass" ]; then
                echo "> **One or more dependencies failed the ${min_age_days}-day age check.** At least one pin cannot be age-checked as written (see its row above) — fix it in this PR; no bypass is offered while it stands."
              else
                echo "> **One or more dependencies failed the ${min_age_days}-day age check.** Add the \`age-check-bypass\` label to override (verified-CVE bypass only — see runbooks/phase-0-checklist.md)."
              fi
              if [ -n "$checked_count" ] || [ -n "$skipped_count" ]; then
                echo ">"
                echo "> Breakdown: **${checked_count:-?}** checked, **${skipped_count:-0}** skipped. See the table above for which rows failed (marked :x:)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run where one or more manifests were skipped wholesale by
          # explicit configuration rather than examined. Takes both counts because
          # the honest sentence depends on whether anything else WAS checked:
          # with a nonzero checked_count the skip is a caveat on a real result,
          # with zero it is the whole result. Emitting one blockquote per
          # condition produced two adjacent paragraphs saying the same thing, and
          # a forward reference to a count that never followed.
          preflight::step_summary_registry_free() {
            local skipped_files="$1" checked_count="${2:-0}"
            {
              echo ""
              if [ "$checked_count" -gt 0 ]; then
                echo "> **${skipped_files} lockfile(s) were not age-checked at all**, having resolved nothing from a registry; they were skipped by configuration. The count below covers only the rest."
              else
                echo "> **Nothing was age-checked.** ${skipped_files} lockfile(s) resolved nothing from a registry and were skipped by configuration. This is a pass by configuration, not by verification."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run that verified NOTHING — because a manifest could not
          # be read, or because preflight stopped the run before any manifest was
          # examined (see fail_not_run) — as distinct from a dependency failing the
          # age check, which is what `step_summary_failed` is for.
          #
          # Deliberately does NOT mention `age-check-bypass`. That label is scoped
          # to verified-CVE overrides, the conditions reaching this footer can be
          # permanent rather than incidental, and the label genuinely clears the
          # check (the reusable job is gated on its absence) — so naming it here
          # would hand the operator the exact anti-pattern the ecosystem scripts
          # warn against in their own ::error:: on the same failure.
          preflight::step_summary_unverifiable() {
            local reason="$1"
            {
              echo ""
              echo "> **Nothing could be verified — ${reason}.** No dependency was age-checked in this run, so this fails rather than reporting a pass it cannot support."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Fail a run that could not even read one manifest's diff, on every
          # surface an operator reads — the log annotation, the summary ROW
          # (record_unverifiable writes only the TSV, and a footer over an empty
          # table is exactly what this prevents), the failures TSV and the summary
          # footer — then exit 1. Every ecosystem captures its separable parsers
          # with `$(...)`; before this, a parser whose `git diff` failed killed the
          # step under `set -e` with the failures file EMPTY, and
          # templates/snippets/comment-on-failure.sh — which runs on
          # `!cancelled()` and gates on `[ -s "$FAILURES_FILE" ]` — then took its
          # DELETE branch, erasing a legitimate "these pins are too new" sticky
          # from an earlier run and leaving a red check whose only evidence was
          # one log line.
          #
          # The caller closes any open `::group::` first and hands in <safe_file>
          # already sanitized — it is rendered as markdown twice over — plus the
          # RAW path as <path> for the `file=` annotation, which attaches to the
          # Files Changed tab only under the path as it is, not one with its
          # spaces stripped or its length capped (it defaults to <safe_file> for
          # a caller that has only that); and it owns the accuracy of <reason>: this helper writes what it is told, so
          # a caller that maps every non-zero parser status to one sentence must
          # be sure the parser has only that one failure mode. <cell> is the
          # status column of the summary row; <reason> is one lowercase clause
          # with no terminal period, as for fail_not_run, and must name the file,
          # since the footer and the comment cell both stand on their own.
          #
          # Deliberately not step_summary_failed: that footer hands out the
          # age-check-bypass label, which clears the check — the wrong remedy for
          # a transient git failure, where a re-run is. (The PR comment still
          # offers the label for every `unverifiable` row; see the renderer.)
          preflight::fail_unverifiable_file() {
            local safe_file="$1" cell="$2" reason="$3" path="${4:-$1}"
            echo "::error file=${path}::${reason}"
            preflight::_fail_unverifiable_row "$safe_file" "$cell" "$reason"
          }

          # The shared tail of the two failures above: summary row, TSV row,
          # footer, exit. The version column carries the "n/a" sentinel every
          # whole-file row uses; the renderer prints a sentinel-versioned id
          # without its separator, so it does not read as a pin.
          preflight::_fail_unverifiable_row() {
            local display="$1" cell="$2" reason="$3"
            echo "| \`${display}\` | — | — | ${cell} |" >> "$GITHUB_STEP_SUMMARY"
            preflight::record_unverifiable "$display" "n/a" "$reason"
            preflight::step_summary_unverifiable "$reason"
            exit 1
          }

          # The per-file parser's `git diff` failed: close the group the caller
          # opened for <raw_file>, then fail as above. Every ecosystem runs its
          # per-file parser as `x=$(parser "$file" "$rev") || preflight::fail_unreadable_diff "$file"`
          # — `||` rather than a bare capture, because under `set -e` the bare
          # form is the abort this whole family exists to prevent. The one sentence
          # names the failure the parsers announce: git_diff_or_fail's. Under
          # `pipefail` a later stage of a parser's pipeline failing (an awk that
          # cannot run) returns non-zero too and lands here misnamed — still
          # closed, with the job log to disambiguate — so a parser that grows a
          # failure mode of its own should announce it and route it elsewhere.
          preflight::fail_unreadable_diff() {
            echo "::endgroup::"
            local safe_file; safe_file=$(preflight::safe_for_md "$1")
            preflight::fail_unverifiable_file "$safe_file" ":x: diff could not be read" \
              "git diff against the merge base failed for ${safe_file}, so nothing in it was age-checked — re-run the job, and see its log if this repeats" \
              "$1"
          }

          # The file-discovery parser's `git diff --name-only` failed, before the
          # ecosystem header was written and before any file was named: write the
          # header for <header> unless this step's summary already carries it (a
          # header-first caller would otherwise get two), annotate without a file
          # (the failing operation is repo-wide, and a `file=` on a path that may
          # not be in the diff attaches nowhere), and fail as above with <display>
          # — the manifest kind, e.g. `go.sum` — as the row's id and <noun> as its
          # plural in the sentence.
          preflight::fail_unlisted_files() {
            local header="$1" display="$2" noun="$3"
            local reason="git diff --name-only against the merge base failed, so the changed ${noun} could not be listed and nothing was age-checked — re-run the job, and see its log if this repeats"
            # `-s`: the summary is /dev/null outside Actions, and reads as empty.
            # <header> lands in a BRE unescaped: the five ecosystem labels are
            # plain words, and a new one must stay free of regex metacharacters.
            grep -qs "^## Dependency Age Check — ${header}\$" "$GITHUB_STEP_SUMMARY" \
              || preflight::step_summary_header "$header"
            echo "::error::${reason}"
            preflight::_fail_unverifiable_row "$display" ":x: changed files could not be listed" "$reason"
          }

          # Last-resort row for a red exit that recorded none, so that no failing
          # exit that reaches a trap leaves the failures file empty for the comment
          # renderer's delete branch (see fail_unverifiable_file). Specific paths
          # still record their own, better-worded rows first — the preflight exits
          # above are `not_run` rows, the parser failures name their file, a pin
          # that fails names itself — and this only fires when nothing did. Its
          # sentence says only what is then known: a red exit with no per-item
          # reason recorded; NOT "verified nothing", which a future path that
          # fails red without a row (as docker's unpinned FROM once did) would
          # make false. Installed by install_exit_guard; `$?` at function entry
          # is the status the EXIT trap fired with.
          #
          # What it cannot cover: a run step that never starts (a checkout failure
          # ahead of it), a syntax error in the embedded script, or a SIGKILL —
          # the runner's follow-up to an unanswered SIGTERM — none of which reach
          # a trap. Those leave the file empty, and the renderer keeps the sticky
          # there: the comment step passes it this step's RUN_OUTCOME.
          preflight::exit_guard() {
            local ecosystem="$1" rc="${2:-$?}"
            if [ "$rc" -ne 0 ] \
               && [ -n "${AGE_CHECK_FAILURES_FILE:-}" ] \
               && [ ! -s "$AGE_CHECK_FAILURES_FILE" ]; then
              local reason="the age check failed without recording a per-item reason (exit ${rc}) — see the job log"
              preflight::record_unverifiable "$ecosystem" "—" "$reason"
              # The summary too: on this path nothing else has written it, and an
              # empty Job Summary panel was the other half of the original symptom.
              preflight::step_summary_unverifiable "$reason"
            fi
          }

          # Install exit_guard for <ecosystem> as this shell's EXIT trap, followed
          # by <cleanup> (optional shell text), and make a TERM/INT — how a
          # `timeout-minutes` kill arrives — exit through it with the conventional
          # status, so the row names the kill. Each ecosystem calls this first
          # thing in main, ahead of the preflight helpers that `exit`. Cleanup runs
          # AFTER the guard, so its status cannot mask the exit status the guard
          # reads, and inside `{ ...; } || true`, so under the libs' `set -e` a
          # failing command in it can neither cut the trap short nor carry its own
          # status out as the step's. It names its files as `"${VAR:-}"` because
          # the trap can fire before they exist. `trap ... EXIT` replaces rather
          # than appends: every EXIT-time action belongs in <cleanup>, never in a
          # second `trap` — tests/workflow_lint_test.sh fails any other EXIT trap
          # in lib/.
          #
          # Best effort on a signal: bash runs the handler only once the foreground
          # command returns, so a step killed mid-`curl` and then SIGKILLed after
          # the grace period records nothing (see exit_guard).
          preflight::install_exit_guard() {
            local ecosystem="$1" cleanup="${2:-}"
            # The guard is wrapped the same way as the cleanup: its row is one
            # `printf >>`, and if that fails (the file's directory gone, ENOSPC)
            # errexit inside the trap would skip the cleanup and make the printf's
            # status the step's.
            local handler; printf -v handler '{ preflight::exit_guard %q; } || true' "$ecosystem"
            [ -n "$cleanup" ] && handler="${handler}; { ${cleanup}; } || true"
            # shellcheck disable=SC2064
            trap "$handler" EXIT
            trap 'exit 143' TERM
            trap 'exit 130' INT
          }

          # Guard against "registry outage → every package skipped → workflow
          # passes" — if nothing actually got verified, fail and write a
          # summary explaining why.
          preflight::step_summary_all_skipped() {
            local skipped_count="$1"
            {
              echo ""
              echo "> **No packages could be verified** (all ${skipped_count} were skipped). Treating as failure to avoid silent pass on registry outage."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # ----- Step-summary notes ----------------------------------------------------
          #
          # A diagnostic that does not fail the run — a registry the check could
          # not match, an input it is taking on its word — is emitted as a bare
          # `::warning::` / `::notice::`. That reaches the Annotations panel and
          # the raw log, and nothing else; and it fires on runs that PASS, which
          # are exactly the runs nobody opens the log of. These two helpers give
          # such a line a second surface in the step summary.
          #
          # NOT the failures TSV. A row there means failed=true to
          # comment-on-failure.sh — it renders a "Dependency Age Check failed"
          # sticky — so an informational line must never be written to it (the
          # same reason npm_age::report_unreadable_format keeps its non-failing
          # gap out). A note changes no verdict, no counter and no exit status.
          #
          # Buffered in a file and rendered once, at the end: the summary is a
          # markdown table being appended to row by row, and a list item written
          # mid-run would land inside it. A file rather than a variable so a note
          # raised inside `$(...)` survives the subshell.
          #
          # The caller owns the file: set PREFLIGHT_NOTES_FILE to a fresh mktemp
          # before the first note and call preflight::step_summary_notes on exit.
          # With it unset the annotation is still emitted and nothing is buffered,
          # so a script that has not opted in behaves exactly as before.

          # Rendered notes are capped for the reason every other row cap in these
          # scripts exists: past 1 MiB Actions discards the step summary whole.
          # 20 notes of about 1000 bytes each bound the section near 20 KiB. A
          # note cut to fit says so. The annotation itself is never truncated or
          # capped.
          PREFLIGHT_NOTES_ROW_CAP=20
          PREFLIGHT_NOTES_MAX_BYTES=1000

          # Emit `::<level>::<message>` on stdout and buffer the same message for
          # the summary. One call, so the annotation text is the only wording
          # there is — the summary cannot drift from it.
          #
          # Args:
          #   $1 level     `warning` or `notice`
          #   $2 message   the annotation text. Interpolated values must arrive
          #                sanitized (preflight::safe_for_md), as for the record_*
          #                helpers: this renders as markdown. Tabs and newlines
          #                are flattened to spaces — a newline would end the
          #                workflow command early and split the buffered row.
          #                `%` is sent as `%25` in the annotation only: Actions
          #                decodes it back, so both surfaces read the same, and a
          #                literal `%0A` in a value cannot become a line break.
          preflight::annotate_with_note() {
            local level="$1" message="$2"
            message=$(printf '%s' "$message" | tr '\t\r\n' '   ')
            echo "::${level}::${message//%/%25}"
            local file="${PREFLIGHT_NOTES_FILE:-}"
            [ -n "$file" ] || return 0
            # Best-effort: a note that cannot be buffered must not fail a check
            # whose annotation already went out.
            printf '%s\t%s\n' "$level" "$message" >> "$file" 2>/dev/null || true
          }

          # Append the buffered notes to the step summary as a `### Notes` list,
          # then remove the buffer — so a second call (the TERM handler runs the
          # exit path twice) writes nothing. Identical notes collapse to one: the
          # npm check loads registry config once per lockfile, and two lockfiles
          # under one .npmrc raise the same line twice. (Identical means level
          # and text: one text raised at both levels renders twice.) Always
          # returns 0; safe to call from an EXIT trap on a passing or a failing
          # run.
          preflight::step_summary_notes() {
            local file="${PREFLIGHT_NOTES_FILE:-}"
            [ -n "$file" ] || return 0
            if [ -s "$file" ]; then
              {
                echo ""
                echo "### Notes"
                echo ""
                echo "Raised during this run, and also shown as annotations on it. None of them fails the check on its own."
                echo ""
                # `<` is the one character the static wording never uses and
                # markdown would act on; escaping it costs the legitimate text
                # nothing. Backticks are left alone — the messages use them.
                # Nothing else needs escaping: every item starts with `- `, so a
                # `>`, `#` or `|` can never open a line.
                #
                # LC_ALL=C so every awk counts bytes, and the cut is the same on
                # gawk, mawk and BSD awk. A byte cut can land inside a multi-byte
                # character (the messages use an em dash), so a trailing lead
                # byte and its continuation bytes are dropped rather than left to
                # render as a replacement character. That also drops a whole
                # character ending exactly at the cut: a few bytes lost before
                # " [truncated]".
                LC_ALL=C awk -F '\t' -v cap="$PREFLIGHT_NOTES_ROW_CAP" -v max="$PREFLIGHT_NOTES_MAX_BYTES" '
                  seen[$0]++ { next }
                  {
                    n++
                    if (n > cap) next
                    text = $2
                    gsub(/</, "\\&lt;", text)
                    if (length(text) > max) {
                      text = substr(text, 1, max)
                      sub(/[\300-\367][\200-\277]*$/, "", text)
                      # Not mid-entity either: a cut `&lt;` would leave `&`, `&l`
                      # or `&lt`. Exactly those, so a real trailing `&word` stays
                      # (a literal `&`, `&l` or `&lt` ending at the cut goes too).
                      sub(/&(l|lt)?$/, "", text)
                      text = text " [truncated]"
                    }
                    print "- " ($1 == "warning" ? ":warning:" : ":information_source:") " " text
                  }
                  END {
                    if (n > cap) print "- " (n - cap) " more note(s) not shown here; each is an annotation on this run."
                  }' "$file"
              } 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            fi
            rm -f "$file" 2>/dev/null || true
          }
          OPS_ROUTINES_AGE_CHECK_LIB
          cat > "${RUNNER_TEMP}/ops-routines-lib/_npm-lockfile-parsers.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #!/usr/bin/env bash
          # ============================================================================
          # _npm-lockfile-parsers.sh - Lockfile -> pkg@version work-list, for npm
          # ============================================================================
          #
          # Split out of age-check-npm.sh so the highest-risk code is also the most
          # readable: this is the layer that decides WHICH pins get age-checked,
          # and therefore the layer where a bug means a too-new package ships. The
          # calling script keeps policy (thresholds, the registry fetch, the budget
          # cap, summary/comment reporting); everything here is about turning
          # lockfiles into a work-list.
          #
          # The seam is extractor / comparator:
          #
          #   EXTRACTOR  npm_age::pkglock_pins, npm_age::yarn_pins,
          #              npm_age::parse_pnpm_lock
          #              One lockfile IMAGE on stdin -> one record per line on
          #              stdout. Format-specific, no git, no policy. Must be able
          #              to FAIL (non-zero) on input it cannot read, or the
          #              comparator's fail-closed branch is unreachable.
          #
          #              RECORD GRAMMAR:  [ "offregistry" TAB ] pkg "@" version
          #                             |  "vendored" TAB key
          #
          #              A `vendored` record names a SOURCE rather than a version
          #              — git, tarball, link:, file:, workspace:, portal:, or a
          #              v5 key qualified with another registry host. ALL THREE
          #              extractors emit it. pnpm carries its key verbatim (minus
          #              YAML quoting), since a pnpm key already embeds the
          #              source; package-lock emits `name@resolved` and yarn its
          #              header spec, plus the `resolved` line when that adds
          #              something. Each payload names the source, which is what
          #              the notice asks a reviewer to judge — and, because it is
          #              the source rather than the version, a dependency re-pinned
          #              to a new COMMIT with its version unchanged still reads as
          #              a change. Keyed on the version it would not, and that is
          #              the commonest vendored change there is.
          #
          #              It has no publish date, so it can never be age-checked.
          #              main REPORTS every arrival and, when an arrival is ALL the
          #              change brought in, gates on it — see the guard at the end
          #              of npm_age::main. It is in the stream rather than only
          #              counted for the same reason the offregistry tag is: a
          #              record that reaches neither side of the set difference is
          #              invisible, and a PR that vendored a brand-new dependency
          #              into a lockfile whose registry pins did not move used to
          #              report "No new dependencies" and go green with no
          #              annotation at all.
          #
          #              REPORTING THE DECLARED COUNT is an extractor obligation
          #              too. Called as `<extractor> declared`, an extractor
          #              prints how many entries the image declares that its
          #              record stream MUST account for — counted from structure
          #              the record grammar does not depend on (a `resolution:`
          #              line per pnpm key, a `.packages` key, a yarn `name@`
          #              header), less the exclusions it makes on purpose, each
          #              spelled as a positive test beside the denominator. Every
          #              record, pin or vendored, accounts for one;
          #              npm_age::records_cover_declared fails the run (rc 5) on
          #              anything left over. The zero-parse guards are
          #              all-or-nothing: a format that respelled most entries
          #              while leaving one recognisable would gate that one and
          #              render "Verified 1 package(s)", and this is the guard
          #              that sees it. It was documented only on parse_pnpm_lock
          #              and enforced only in diff_pnpm_lock for one release.
          #              ONE record per declared entry: the test is "fewer
          #              records than declared", so an extractor that emitted two
          #              for one entry would hide an entry dropped elsewhere. The
          #              per-format invariant tests assert the two counts EQUAL.
          #              Build the denominator to UNDER-count rather than
          #              over-count: a shortfall fails the run with no margin, so
          #              every way the count can be wrong must make it too small.
          #
          #              Classifying the registry is an extractor OBLIGATION, not
          #              an option. An extractor that emits a bare `pkg@version`
          #              is asserting the pin resolves to $NPM_AGE_WANT_HOST, and
          #              main will fetch its publish date from there. Emitting one
          #              for a pin that came from somewhere else is how a private
          #              package gets aged against a public homonym's release
          #              history — the false pass this tagging exists to close. If
          #              you cannot tell where a pin resolved, the conservative
          #              answer is the tag.
          #
          #              The marker is inside the comparison key on purpose: both
          #              comparators below are full-LINE set differences, so a pin
          #              that moves between registries without changing version
          #              reads as a new record and is re-judged. A side channel
          #              would lose that and force a rejoin.
          #
          #              Same shape as preflight::record_failure's TSV, which
          #              also leads with a kind column.
          #
          #              yarn_pins classifies yarn v1 from the entry's
          #              `resolved` URL. BERRY entries carry a `resolution:`
          #              descriptor, not a location, so they name no host except
          #              in the `::__archiveUrl=` form; otherwise their registry
          #              comes from .yarnrc.yml. See Known limitations in
          #              age-check-npm.sh for what that does and does not close —
          #              it is the single copy of that reasoning, deliberately.
          #
          #   COMPARATOR npm_age::changed_pins — the npm NAME for
          #              preflight::new_lines_since_base, plus one npm-only step
          #              after it: the declared-count check above. It forwards
          #              its arguments. The shared helper owns the
          #              probe, the base-image read, both parses (it calls the
          #              extractor twice) and the full-line set difference, with
          #              the fail-closed branches, so npm and pre-commit
          #              (precommit_age::changed_pins / ::pairs_from_text) cannot
          #              drift on any of them. Format-agnostic by construction.
          #              Since the pnpm fold every parser here goes through it;
          #              nothing in this file compares images itself.
          #              diff_package_lock and diff_pnpm_lock add format-specific
          #              diagnosis around that one call, reading the base image
          #              the helper leaves behind (its optional 4th argument)
          #              rather than a second time.
          #
          # Keeping the two apart is what makes "new lockfile", "missing base" and
          # "bumped pin" fall out of ONE code path instead of each needing a
          # branch — the empty-work-list-means-two-things conflation that made
          # MIN_AGE_DAYS toothless for version bumps in the first place.
          #
          # stdout is the work-list channel. Every diagnostic in this file goes to
          # stderr, because callers read these functions with `$(...)` and an echo
          # to stdout would be captured into the work-list instead of surfacing.
          #
          # Sourced by age-check-npm.sh, which sources _preflight.sh first —
          # preflight::safe_for_md is used below. Note ::record_unverifiable is
          # deliberately NOT called from this file: these paths exit 0, and the
          # comment renderer treats a non-empty failures file as a failed run. See
          # npm_age::report_unreadable_format.
          #
          # ============================================================================

          # Guard against double-sourcing — IFS and `set -e` state are caller's.
          if [ -n "${_NPM_LOCKFILE_PARSERS_SOURCED:-}" ]; then
            return 0
          fi
          _NPM_LOCKFILE_PARSERS_SOURCED=1

          # True when the caller has opted this repo out of the registry-free
          # failure. One definition, because an accepted spelling that drifted
          # between call sites would mean a flag that weakens a supply-chain
          # control behaves differently depending on which lockfile kind a repo
          # happens to use.
          #
          # Explicit truthy match, not `-n`: `=false` or `=0` turning it ON is a
          # footgun for a local run or a future template edit, and a `type:
          # boolean` workflow input renders as the literal string `false`. The
          # workflow expression yields '' for false, so the supported path is
          # unaffected either way. `on`/`ON` are deliberately absent: omitting a
          # spelling from a list that weakens a control fails CLOSED, which is the
          # safe direction.
          npm_age::registry_free_allowed() {
            case "${AGE_CHECK_ALLOW_REGISTRY_FREE:-}" in
              1|true|TRUE|True|yes|YES|Yes) return 0 ;;
            esac
            return 1
          }

          # The two ways a record stream is split by its kind column, kept beside
          # the grammar so the predicate is spelled once. A tagged record is
          # `<kind><TAB>...`; a bare pin has no tab at all. grep exits 1 when it
          # selects nothing — an ordinary outcome for both — so only a status
          # above 1 is a failure.
          npm_age::records_of_kind()     { grep    "^${1}$(printf '\t')" || [ $? -eq 1 ]; }
          npm_age::records_not_of_kind() { grep -v "^${1}$(printf '\t')" || [ $? -eq 1 ]; }

          # ----- Separable: read lockfile diff → pkg@version lines on stdout ----------
          #
          # Shape mirrors precommit_age::changed_pins / ::pairs_from_text in
          # lib/age-check-precommit.sh, which already solved this exact problem:
          # a per-format EXTRACTOR turns one image of the lockfile into pins on
          # stdout, and one shared comparator reports the pins the base image did
          # not already carry. Keeping the two jobs separate is what lets a
          # missing base, a new lockfile and a bumped pin all fall out of the
          # same code path instead of needing branches of their own.

          # Emits `pkg@version` for every registry-hosted entry in ONE
          # package-lock.json image read on stdin. Filters, in order: skip the
          # root `""` key, require a non-null `.version`, require `.resolved` to
          # be a registry URL, then derive the name.
          #
          # `.value.name` is how npm records an ALIASED install, where the install
          # path is not the package name (`node_modules/string-width-cjs` holding
          # `string-width`, which `@isaacs/cliui` puts in a very large fraction of
          # real lockfiles). Without it the pin is `string-width-cjs@4.2.3`, which
          # 404s on npmjs and — when an alias is the only pin a branch moved —
          # fails the PR with the wrong diagnosis.
          #
          # But `.value.name` is lockfile content, i.e. attacker-controlled in a
          # fork PR, so it is only believed when `.resolved` CORROBORATES it. A
          # registry tarball URL embeds the real package name before `/-/`
          # (`…/string-width/-/string-width-4.2.3.tgz`,
          # `…/@babel/core/-/core-7.24.0.tgz`), so the check is: take everything
          # before the FIRST `/-/` and compare whole trailing path SEGMENTS —
          # one for a bare name, two for a scoped one.
          #
          # Both halves of that are load-bearing:
          #
          #   Anchoring — a free `contains("/" + name + "/-/")` matches anywhere
          #   in the URL, so `…/evil/-/evil-1.0.0.tgz?x=/lodash/-/` corroborates
          #   `lodash`. Query string, fragment or a nested path segment all work.
          #
          #   Segments, not a suffix — `endswith("/" + name)` is true for a
          #   SCOPED package whose unscoped half matches, so
          #   `…/@attacker/lodash/-/lodash-1.0.0.tgz` corroborates the name
          #   `lodash` and launders a package published today through the real
          #   lodash publish date. That URL is on registry.npmjs.org, so a
          #   trusted-host allowlist (issue #137) would not catch it, and
          #   name != install path is exactly what a legitimate
          #   `npm i ui-kit@npm:@attacker/lodash` produces — nothing about the
          #   entry looks crafted.
          #
          # Note the scoped/unscoped decision is read from the URL, not the name:
          # whether `$seg[-2]` starts with `@`. Deriving it from the name instead
          # would compare an unscoped `lodash` against the last segment of
          # `@attacker/lodash` and match — which is the impersonation above.
          #
          # Comparing only the trailing segments (rather than the whole path)
          # keeps a corporate mirror that prefixes the path
          # (`https://mirror/npm/lodash/-/…`) working. Trusting `.name` unconditionally
          # would let an entry claim `"name": "lodash"` while `.resolved` points
          # at `evil-pkg`: the gate would age-check lodash, find a 2021 publish
          # date, and render green for a tarball `npm ci` installs from
          # `.resolved`. NOTE this closes the accidental/path half only: the host
          # in `.resolved` is attacker-controlled too, so
          # `https://cdn.attacker.example/lodash/-/lodash-1.0.0.tgz` still
          # corroborates the name `lodash`. That is the unconstrained-host gap in
          # the Known limitations block, tracked as issue #137; the install-path
          # fallback is equally forgeable, so `.name` does not widen it.
          # Uncorroborated, the name falls back to the install path —
          # which is what actually gets installed to — so the pin always describes
          # something real. Path derivation takes the segment after the LAST
          # `node_modules/`, so nested pins
          # (node_modules/parent/node_modules/@scope/child) resolve to
          # `@scope/child`.
          #
          # Single quotes are deliberate — this is a jq program, not shell.
          # shellcheck disable=SC2016
          NPM_AGE_JQ_ENTRIES='
            .packages // {} | to_entries[]
            | select(.key != "" and (.value.version // null) != null)
            | . as $e
            | ($e.value.resolved // "") as $r
            # A pin that resolves from no registry AT ALL — a git URL, a tarball,
            # a committed `file:` archive — becomes a `vendored` record instead of
            # being dropped. Dropped, it reached neither checked_count nor
            # skipped_count, so the all-skipped guard could not fire and a change
            # moving only such pins rendered "Verified 0 package(s)
            # :white_check_mark:" on a change verified in no way at all. pnpm has
            # emitted this record since #165; this is the same record from the
            # package-lock side, so one guard in main covers all three formats.
            #
            # Two exclusions, both load-bearing. An ABSENT `.resolved` is not
            # vendored: npm writes that shape for nested dependencies of ordinary
            # registry packages, and absence of provenance is not evidence of
            # vendoring. A LOCAL PATH is not vendored either — `file:`, `link:`,
            # `portal:`, `workspace:` naming a directory are this repo`s own tree,
            # source reviewed in the same PR rather than an artifact fetched from
            # somewhere this check cannot date. The exception is a tarball behind
            # such a path (`file:vendor/pkg-1.0.0.tgz`), which IS a fetched
            # artifact that happens to be committed — layervai/qurl-desktop ships
            # one — and that exception is what makes this a shape test rather than
            # a protocol test.
            #
            # The payload is `name@resolved`, mirroring the pnpm key that already
            # embeds its source. Naming the SOURCE is what the notice asks a
            # reviewer to judge, and it is also what moves when a vendored
            # dependency is re-pinned to a new commit while its version stays put
            # — an install path alone would make that re-pin invisible to the
            # base-vs-head difference, which is the commonest vendored change
            # there is.
            | if (($r | startswith("https://")) | not) then
                (if ($r != ""
                     and (($r | test("^(file|link|portal|workspace):") | not)
                          or ($r | test("\\.(tgz|tar\\.gz|tar)([?#].*)?$"))))
                 then "vendored\t"
                      + ($e.key | sub("^node_modules/"; "") | split("/node_modules/") | last)
                      + "@" + $r
                 else empty end)
              else
            ($e.key | sub("^node_modules/"; "") | split("/node_modules/") | last) as $path_name
            | (($e.value.resolved // "") | split("/-/")[0] | split("/")) as $seg
            | (if (($seg[-2] // "") | startswith("@"))
               then ($seg[-2:] | join("/"))
               else ($seg[-1] // "") end) as $url_name
            | ((if ($e.value.name // "") != "" and $e.value.name == $url_name
                then $e.value.name
                else $path_name
                end) + "@" + $e.value.version) as $pin
            | (($seg[2] // "") | sub("[?#\\\\].*$"; "") | ascii_downcase | sub("^.*@"; "") | sub(":443$"; "")) as $h
            | (if $h == "registry.yarnpkg.com" then "registry.npmjs.org" else $h end) as $host_c
            | (if $host_c == $host then $pin
               else "offregistry\t" + $pin end)
              end'

          # unquote(s): s without one layer of MATCHING quotes, double or single;
          # anything else is returned untouched. ONE definition for the two awk
          # programs that read YAML scalars — npm_age::parse_pnpm_lock here and
          # npm_age::yarnrc_registries in age-check-npm.sh, which sources this
          # file at its bottom: after that function is defined, before anything
          # calls it. Each prefixes it the way NPM_AGE_AWK_CANON_HOST is prefixed.
          #
          # Matching is the point: npm_age::npmrc_registries strips UNMATCHED
          # quotes with a `gsub(/^"|"$/…)` of its own, which an ini value can
          # afford and a YAML one cannot. Do not point that one here.
          #
          # A variable of its own rather than a third function in
          # NPM_AGE_AWK_CANON_HOST: .yarnrc.yml parsing derives no hosts, and
          # test_registry_fold_sites_are_the_ones_the_canary_drives counts the
          # programs that prefix that variable as the ones that do.
          #
          # \047 is a single quote, spelled octal because an apostrophe would end
          # this literal. POSIX awk only; CI runs it on mawk.
          # shellcheck disable=SC2016
          NPM_AGE_AWK_UNQUOTE='
              function unquote(s,   q) {
                q = substr(s, 1, 1)
                if ((q == "\"" || q == "\047") && substr(s, length(s), 1) == q)
                  s = substr(s, 2, length(s) - 2)
                return s
              }
          '

          # canon_host(u): the host a URL names, reduced the way
          # npm_age::registry_host reduces the configured one, so the two compare
          # by string equality. ONE definition for both awk extractors —
          # npm_age::yarn_pins and npm_age::parse_pnpm_lock each prefix it to
          # their program as "$NPM_AGE_AWK_CANON_HOST"'...', which the shell joins
          # into the single program argument awk sees.
          #
          # The bash and jq derivations cannot call this and stay hand-written;
          # test_host_canonicalisation_does_not_drift_between_extractors holds all
          # three to one table. See the comment on npm_age::registry_host.
          #
          # It canonicalises and decides nothing else. Whether a string with no
          # scheme names a location at all is the CALLER's question, and the two
          # answer it differently on purpose: yarn's url_host() returns "" for
          # one and never calls this, parse_pnpm_lock passes whatever the tarball
          # key holds. Do not fold that gate in here — it would change which
          # entries are tagged. has_scheme() is here so the gate and the strip
          # read ONE pattern for what a scheme is and cannot disagree about it.
          #
          # Single quotes are deliberate — this is awk, not shell — and the body
          # has no apostrophes for the same reason the two programs it joins have
          # none: one would end the literal. POSIX awk only; CI runs it on mawk.
          # shellcheck disable=SC2016
          NPM_AGE_AWK_CANON_HOST='
              # Sets RLENGTH to the length of the `scheme://` prefix, which
              # canon_host() uses to strip it.
              function has_scheme(u) { return match(u, /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//) }
              function canon_host(u,   scheme) {
                scheme = u
                if (sub(/:\/\/.*$/, "", scheme)) scheme = tolower(scheme); else scheme = ""
                if (has_scheme(u)) u = substr(u, RLENGTH + 1)
                # The authority ends at the FIRST of `/`, `?` or `#` (RFC 3986),
                # not at `/` alone. Cutting only at `/` let a URL with no path but
                # a query or fragment carrying `@` reach the userinfo strip below,
                # where the LAST `@` wins: `https://attacker.example?x=@npmjs` read
                # as npmjs while the fetch went to attacker.example — the very
                # impersonation the strip exists to defeat, one delimiter over.
                # `\\` as well: WHATWG URL parsing — Node, and so every fetcher
                # here — ends the authority of an https URL at a backslash, so
                # `attacker.example\@registry.npmjs.org` is fetched from
                # attacker.example while the last-`@` strip below would read npmjs.
                sub(/[\/?#\\].*$/, "", u)
                # Percent-encoding in the USERINFO is legal and inert — RFC 3986
                # makes it mandatory for some characters, and `svc%40corp:tok@host`
                # is the canonical way to write an email-style username, which is
                # exactly what a credentialed private-registry lockfile carries.
                # Refusing any `%` in the authority, as this once did, turned every
                # such repo red. What CAN move the cut is an encoded delimiter that
                # the fetcher decodes, and that only happens on the yarn
                # `__archiveUrl` path, where pct_decode() has already applied the
                # single pass yarn makes before this function sees the value. On
                # every undecoded path a `%` in a host is simply not a host that
                # matches anything.
                #
                # Userinfo, taking the LAST `@`: `user:pass@host` must compare as
                # `host`, or a credentialed URL (which a private-registry lockfile
                # can carry) is both a wrong-red and a credential echoed into the
                # annotation, where safe_for_md escapes markdown but does not
                # redact. It is the impersonation guard too —
                # `https://registry.npmjs.org@attacker.example/...` reads as npmjs
                # to a naive parse while the fetch goes to attacker.example. Only
                # after the authority was cut off above, so an `@` in the path
                # (every scoped package has one) is never read as the boundary.
                sub(/^.*@/, "", u)
                u = tolower(u)
                # A default port is the same registry written two ways. The scheme
                # only SELECTS which port is redundant; it is not compared.
                if (scheme == "https") sub(/:443$/, "", u)
                if (scheme == "http")  sub(/:80$/, "", u)
                # Not a separate registry: see the comment on npm_age::registry_host.
                if (u == "registry.yarnpkg.com") u = "registry.npmjs.org"
                return u
              }
          '

          # The declared count for package-lock: every non-root `.packages` entry
          # the stream above must account for with a pin or a vendored record.
          #
          # Written as its OWN enumeration, not derived from NPM_AGE_JQ_ENTRIES.
          # Counting "whatever the entries program emits" would be a tautology;
          # the point is a second, independent statement of who is in, so that a
          # `select` added to the entries program — which is how the invisible
          # vendored arrival was built in the first place — leaves an entry
          # counted here and emitted nowhere, and fails the run instead of
          # passing in silence.
          #
          # The exclusions are the ones the entries program makes on purpose,
          # each a POSITIVE test, so an entry in none of them is owed a record:
          #   `link: true`               a symlink into this repo`s own tree
          #   key outside node_modules/  a workspace member (`packages/foo`):
          #                              the repo`s own source, not an install
          #   version, no `resolved`     npm writes that shape for nested and
          #                              bundled dependencies of registry
          #                              packages; absence of provenance is not
          #                              evidence of vendoring
          #   version, local directory   `file:`/`link:`/`portal:`/`workspace:`
          #                              naming a directory, not an archive
          # What is left over, and therefore a shortfall, is an INSTALLED,
          # non-link entry with no `version` — not a shape npm writes. That is
          # the under-counting direction the seam header asks for: a lockfile
          # whose `version` key a future npm respelled fails closed here, where
          # it used to yield an empty work-list and "No new dependencies".
          # The limit, stated rather than hidden: a respelled `resolved` reads as
          # the third exclusion and is NOT caught — telling it apart from the
          # resolved-less entries npm really writes would fail real lockfiles.
          #
          # The tarball pattern is the same literal as in NPM_AGE_JQ_ENTRIES and
          # must stay so: an archive behind a local path is vendored there, so it
          # must be owed a record here.
          # shellcheck disable=SC2016
          NPM_AGE_JQ_DECLARED='
            [ .packages // {} | to_entries[]
              | select(.key != "")
              | (.value.resolved // "") as $r
              | ((.value.version // null) != null) as $versioned
              | select(
                  ((.value.link // false) == true
                   or ((.key | test("(^|/)node_modules/")) | not)
                   or ($versioned and $r == "")
                   or ($versioned
                       and ($r | test("^(file|link|portal|workspace):"))
                       and (($r | test("\\.(tgz|tar\\.gz|tar)([?#].*)?$")) | not)))
                  | not)
            ] | length'

          # $1 selects the output, as parse_pnpm_lock's does: "entries" (default)
          # is the record stream, "declared" the count the seam header asks for.
          npm_age::pkglock_pins() {
            local mode="${1:-entries}"
            # jq's stderr is deliberately NOT suppressed: when this fails the
            # caller turns it into a red build, and the operator needs jq's reason
            # (and, via `pipefail`, a git-side failure lands in the same branch).
            case "$mode" in
              entries)  jq -r --arg host "$NPM_AGE_WANT_HOST" "$NPM_AGE_JQ_ENTRIES" ;;
              declared) jq -r "$NPM_AGE_JQ_DECLARED" ;;
              *) echo "::error::npm_age::pkglock_pins: unknown mode '${mode}'" >&2; return 2 ;;
            esac
          }

          # Emits `pkg@version` for every registry-hosted pin in ONE yarn.lock
          # image read on stdin.
          #
          #   header — the only non-indented, non-comment line in a block, e.g.
          #            `pkg@^1.0.0, pkg@^1.2.0:`. Take the first spec and strip
          #            the trailing `@<range>` at the LAST `@`, so a scoped
          #            `@scope/pkg@^1.0.0` keeps its leading `@scope/`.
          #   body   — `version "1.2.3"` (yarn v1) or `version: 1.2.3` (berry).
          #
          # Non-package and non-registry headers are dropped HERE rather than
          # downstream, because only the header carries the protocol: the body
          # version of berry's `__metadata` block is `9` and of a workspace root
          # is `0.0.0-use.local`, both of which read as ordinary semver to
          # main()'s version-string skip. Left in, they 404 against the registry
          # and count as skipped — and a commit that bumped only `__metadata`
          # would reach the all-skipped guard with checked_count 0 and fail the
          # PR outright.
          #
          # $1 selects the output: "entries" (default) is the record stream,
          # "declared" the number of block headers that stream must account for —
          # every header that named a registry package or was held as a vendored
          # record, which leaves out exactly what the header rule leaves out on
          # purpose (file metadata, `patch:` wrappers, local directory paths). A
          # header counted there whose block then yields no record — a body
          # `version` this parser cannot read, beside blocks it can — is a
          # shortfall, where it used to be dropped in silence unless EVERY block
          # failed the same way. The END guard's fail-closed exit applies to both
          # modes: an image this parser refuses has no trustworthy count.
          npm_age::yarn_pins() {
            local mode="${1:-entries}"
            case "$mode" in
              entries|declared) ;;
              *) echo "::error::npm_age::yarn_pins: unknown mode '${mode}'" >&2; return 2 ;;
            esac
            # `mode` is one of the two literals validated above, so it can ride
            # `-v`: there is no escape sequence in it to process.
            # The three configuration values reach awk through ENVIRON, not `-v`.
            # POSIX makes a `-v` value undergo string-literal escape processing,
            # so `\040` in a committed .yarnrc.yml value — which usable() passes,
            # since a backslash is not whitespace — became a real space INSIDE
            # awk, the space-separated scope map split there, and `@acme` bound
            # to the token before it: `registry.npmjs.org\040x` read as npmjs.
            # ENVIRON is byte-for-byte, so the invariant the shell side asserts
            # about its own serialisation actually holds where it is consumed.
            NPM_AGE_WANT_HOST="$NPM_AGE_WANT_HOST" \
            NPM_AGE_YARN_DEFAULT_HOST="$NPM_AGE_YARN_DEFAULT_HOST" \
            NPM_AGE_YARN_SCOPE_MAP="$NPM_AGE_YARN_SCOPE_MAP" \
            awk -v mode="$mode" "$NPM_AGE_AWK_CANON_HOST"'
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/_npm-lockfile-parsers.sh (part 2 of 3)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/_npm-lockfile-parsers.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
              # A selector naming a path in this repo`s own tree rather than an
              # artifact fetched from somewhere. Source reviewed in the same PR is
              # not vendoring; a tarball behind such a path is, which makes this a
              # SHAPE test rather than a protocol test. The `name@` strip is
              # conditional because a local path can carry an `@` of its own
              # (`workspace:packages/@acme/ui`), and stripping unconditionally
              # would eat the protocol and stop it reading as local.
              # (No apostrophes: single-quoted awk program.)
              function local_path(sel,   t) {
                t = sel
                if (t !~ /^(file|link|portal|workspace):/ && match(t, /^@?[^@]+@/)) t = substr(t, RLENGTH + 1)
                if (t !~ /^(file|link|portal|workspace):/) return 0
                if (t ~ /\.(tgz|tar\.gz|tar)([?#].*)?$/) return 0
                return 1
              }

              # Deserialises NPM_AGE_YARN_SCOPE_MAP, the space-separated
              # `@scope=host` list load_registry_config folds .yarnrc.yml into.
              # Mirrors the BEGIN in npm_age::parse_pnpm_lock, which decodes the
              # npm-side map the same way.
              BEGIN {
                want_host = ENVIRON["NPM_AGE_WANT_HOST"]
                yarn_default_host = ENVIRON["NPM_AGE_YARN_DEFAULT_HOST"]
                n = split(ENVIRON["NPM_AGE_YARN_SCOPE_MAP"], sm, " ")
                for (i = 1; i <= n; i++) {
                  eq = index(sm[i], "=")
                  if (eq > 1) yarn_scope_host[substr(sm[i], 1, eq - 1)] = substr(sm[i], eq + 1)
                }
              }
              # Normalised host of an absolute URL, or "" when it names none —
              # which is the test for whether a SCHEME is present, i.e. whether
              # the value named a location at all, NOT whether that scheme was
              # https. Gating on https looks like the `startswith("https://")` in
              # NPM_AGE_JQ_ENTRIES but does not behave like it: that one is a
              # `select`, so a non-https entry is DROPPED and never checked,
              # whereas returning "" here leaves the entry UNTAGGED, i.e. aged
              # against a registry the evidence says it did not come from. A pin
              # resolved over plain `http://` from an internal host is the homonym
              # false pass one scheme over.
              #
              # The normalising itself is canon_host(), defined once in
              # NPM_AGE_AWK_CANON_HOST and shared with npm_age::parse_pnpm_lock:
              # every step npm_age::registry_host applies, in its order. Both the
              # v1 `resolved` rule and the Berry `__archiveUrl` rule come through
              # here, so the gate and the normalising are each in one place for
              # them. Everything after the host is discarded, so the `#<sha>`
              # fragment yarn appends is irrelevant.
              #
              # Callers strip any trailing \r before calling — they must, because
              # their own quote-stripping depends on it — so CRLF is handled in
              # one layer rather than two that can disagree.
              function url_host(u) {
                if (!has_scheme(u)) return ""
                return canon_host(u)
              }
              # Records a host against the BLOCK. yarn writes one `resolved` per
              # block and one `__archiveUrl` per resolution; TWO naming different
              # hosts is not a lockfile yarn produced, and whichever it would
              # install from this parser cannot know — so the entry is tagged
              # rather than aged against either. Fail closed on ambiguity: picking
              # first or last would each be a false pass under the opposite
              # ordering.
              function note_host(u) { record_host(url_host(u)) }
              function record_host(hh) {
                # An unreadable location disagrees with a readable one in EITHER
                # order. Testing only `block_host != ""` at the moment the
                # unreadable value arrived caught `https://host` then `https://`
                # but not the swap — an unreadable FIRST value left block_host
                # empty, so the readable second one landed with no conflict, and
                # the entry was untagged under one ordering and tagged under the
                # other. That is the exact asymmetry the two-readable-hosts rule
                # rejects ("picking first or last would each be a false pass under
                # the opposite ordering"), and the `__archiveUrl` path already
                # refuses an unreadable value unconditionally — so block_badloc
                # makes the two derivations state the same rule.
                if (hh == "") {
                  if (block_host != "") block_conflict = 1
                  block_badloc = 1
                  return
                }
                if (block_badloc) block_conflict = 1
                if (block_host != "" && hh != block_host) block_conflict = 1
                block_host = hh
              }
              # Enough percent-decoding to read an authority out of the encoded
              # `__archiveUrl` below: only the three characters that can appear in
              # one. Anything left encoded stays literal, which makes the host not
              # match and so fails closed rather than open.
              function pct_decode(s) {
                gsub(/%3[Aa]/, ":", s)
                gsub(/%2[Ff]/, "/", s)
                gsub(/%40/, "@", s)
                # `%5C` decodes to a backslash, which the fetcher treats as `/`
                # in an https URL. Decoded straight to `/` so the authority cut
                # in canon_host() lands where the fetcher puts it.
                gsub(/%5[Cc]/, "/", s)
                # `?` and `#` too — exactly ONE decoding pass, which is what yarn
                # applies to this value before fetching. An encoded delimiter
                # (`%3F%40npmjs`) otherwise hides the end of the authority from
                # canon_host(), and the last-`@` strip hands the host to the
                # attacker. One pass only: a double-encoded `%253F` reaches the
                # fetcher as a literal `%3F`, which is inert in userinfo and
                # invalid in a host, so decoding it here would be MORE eager than
                # the fetcher and misplace the cut the other way.
                gsub(/%3[Ff]/, "?", s)
                gsub(/%23/, "#", s)
                return s
              }
              # Where a BERRY block came from. A Berry entry names no host — its
              # `resolution:` is a descriptor, not a location — so this is
              # configuration, read from .yarnrc.yml and arriving as
              # yarn_default_host / yarn_scope_map, exactly as .npmrc arrives for
              # an integrity-only pnpm entry. Berry does not read .npmrc, so the
              # npm pair would be the wrong file to consult here.
              #
              # With no .yarnrc.yml, yarn_default_host IS want_host, so a Berry
              # entry compares equal and stays untagged — the behaviour this
              # parser had before it could read that file at all. Tagging on the
              # ABSENCE of configuration would flip every default Berry repo
              # green -> red, which is a rollout decision and not one this parser
              # gets to make. It also means a fork PR can reach untagged by
              # DELETING .yarnrc.yml, which is visible in review and the same door
              # .npmrc already leaves open for pnpm. The absence IS announced,
              # but not from here: load_registry_config emits a `::notice` when
              # registry_url is private and no .yarnrc.yml names a default, so
              # this function stays a pure reading of the evidence it was handed.
              #
              # The scope is read from pending_name, which holds the alias TARGET:
              # `string-width-cjs@npm:string-width@^4.2.0` buffers `string-width`.
              # That is the package whose registry is in question, so an `@acme`
              # override is looked up under the target rather than under the alias
              # the repo happens to install it as.
              function berry_host(   scope) {
                if (substr(pending_name, 1, 1) == "@") {
                  scope = pending_name
                  sub(/\/.*$/, "", scope)
                  if (scope in yarn_scope_host) return yarn_scope_host[scope]
                }
                return yarn_default_host
              }
              # Emits the buffered entry, if any. A yarn block states its version
              # one line ABOVE the `resolved` URL that says where it came from, so
              # an entry cannot be printed on sight: it is held until that URL has
              # been read. Called before each new header and at EOF — the two ways
              # a block can end. Mirrors the flush() in npm_age::parse_pnpm_lock,
              # which buffers for exactly the same reason.
              function flush(   h) {
                if (pending_vendored != "") {
                  # Buffered for the same reason a pin is: `resolved` sits BELOW the
                  # header, and the record has to carry it. The header alone is
                  # enough when package.json pins an exact commit, but when it pins
                  # a BRANCH the header is stable and only the resolution moves — so
                  # without this a re-pin produces an identical record on both sides
                  # and the base-vs-head difference sees nothing.
                  # Appended only when it ADDS something. For an exact-commit pin
                  # the header already contains the resolution verbatim, and
                  # repeating it makes the notice unreadable; for a branch pin the
                  # header is stable and the resolution is the only moving part.
                  if (mode == "entries")
                    print "vendored\t" pending_vendored \
                          ((block_res == "" || index(pending_vendored, block_res) > 0) ? "" : " -> " block_res)
                  pending_vendored = ""
                }
                if (pending_name == "") return
                # block_conflict forces the tag regardless of host — see the
                # `resolved` and `resolution:` rules.
                #
                # The default is TAGGED, not untagged, and that inversion is the
                # load-bearing part. A yarn v1 block always carries a readable
                # `resolved`; if one produced a pin and no host, this parser did
                # not read where the package came from, and aging it against the
                # configured registry would assert something the lockfile never
                # said. The ways that happens are not exotic — a key spelling the
                # rule below does not match (yarn v1 accepts `resolved`,
                # `"resolved"`, `resolved:` and `"resolved":` for the same key,
                # and decodes escapes in keys, so no literal match is complete), a
                # git conflict marker splitting the block at column 0, or an
                # indent yarn did not write. Matching the key better shrinks that
                # set; defaulting to tagged is what makes the ones left over fail
                # closed instead of green.
                #
                # Berry is exempt per BLOCK, not per file: a block is Berry-shaped
                # only if it carries its own `resolution:` at the direct-child
                # indent. A file-level flag would be forgeable by dropping one
                # `resolution:` line anywhere into a v1 lockfile, which yarn v1
                # ignores and would have re-exempted every entry in it.
                # A `resolved` URL is the more specific evidence and wins; only a
                # Berry block, which can never carry one, falls back to what
                # .yarnrc.yml configured. The hostless NON-Berry arm is untouched
                # by that: such a block still fails closed, exactly as above.
                #
                # `__archiveUrl` therefore BEATS .yarnrc.yml, including when the
                # two disagree, and that is deliberate rather than an oversight.
                # Everywhere else here disagreeing evidence is refused, so the
                # exception needs its reason: `__archiveUrl` is not a claim ABOUT
                # the fetch, it IS the fetch — yarn downloads from that URL. An
                # entry that names npmjs while .yarnrc.yml says the scope is
                # private really is installed from npmjs, so aging it against
                # npmjs describes the artifact that lands. Refusing the pair
                # instead would tag an honest per-package override, and the attack
                # it is imagined to stop does not work: redirecting `__archiveUrl`
                # at the public registry makes yarn fetch the PUBLIC package, not
                # the freshly published private one, so the attacker loses the
                # very artifact they wanted shipped (and the block`s `checksum:`
                # would reject it besides). See Known limitations.
                # `resolved` is a key BERRY never writes — that asymmetry is why
                # it can be trusted as authority for v1. Inside a Berry block it is
                # therefore a forgery, and the mirror of the rule already applied
                # to Berry markers: a marker the OTHER format also writes is not a
                # format signal, it is a bypass. Without this, one added
                # `resolved "https://registry.npmjs.org/..."` line sets block_host,
                # flush() never consults berry_host(), and the .yarnrc.yml verdict
                # is overridden — a private package aged against its public
                # homonym, which is the false pass this whole path closes. Berry
                # ignores unknown keys, so the line does not even break the
                # install. Refused rather than resolved, like two disagreeing
                # `resolved` hosts.
                #
                # Keyed on block_resolved, not on block_host: a Berry block MAY
                # legitimately set block_host, through `::__archiveUrl=`. Testing
                # the host would tag every CodeArtifact and Nexus entry — the
                # population this feature is for — so what is refused is the
                # `resolved` LINE, not the presence of a host.
                if (block_berry && block_resolved) block_conflict = 1
                h = block_host
                if (h == "" && block_berry) h = berry_host()
                # `h == ""` alone, not `h == "" && !block_berry`: the line above
                # gives every Berry block a non-empty h (berry_host() returns a
                # scope-map value or yarn_default_host, and load_registry_config
                # makes both non-empty by construction), so the extra term is
                # always true here. NOT collapsed further to `h != want_host`,
                # though — that would change the hostless arm when want_host is
                # itself empty, which a direct parser caller can reach, and change
                # it in the fail-OPEN direction.
                if (mode == "entries") {
                  if (block_conflict || h == "" || h != want_host)
                    print "offregistry\t" pending_name "@" pending_ver
                  else
                    print pending_name "@" pending_ver
                }
                pending_name = ""; pending_ver = ""
              }
              # Resets ALL per-file state, not just `name`. Unreachable as written
              # — yarn_pins is handed a single stream, never file operands — but
              # the buffered entry and the block host are per-file too, and a
              # half-reset here would colour file N+1s first flush with file Ns
              # host if that ever changed.
              FNR == 1 { flush(); name = ""; block_host = ""; block_conflict = 0; block_berry = 0; block_resolved = 0; block_badloc = 0; pending_vendored = ""; block_res = "" }
              # Counts any line that is not blank and not a comment. MUST come
              # before the header rule: that rule ends in `next`, which skips every
              # remaining rule for the line, so a counter placed after it would
              # never see a header — the exact lines this needs to count.
              /[^[:space:]]/ && !/^[[:space:]]*#/ { content++ }
              /^[[:space:]]*#/ { comments++ }
              # Structural markers only a real lockfile carries. A file with these
              # parsed fine and simply had nothing registry-hosted to report; a
              # truncated or wholesale-replaced file has none of them.
              # `"?resolved"?[[:space:]:]` rather than a bare `resolved `: yarn v1
              # writes this key four ways (see the resolved rule below), and a
              # lockfile using one of the others would otherwise carry no
              # structural evidence at all and trip the "truncated or wholesale
              # replaced" arm of the END guard. (No apostrophes in this block: it
              # is inside a single-quoted awk program.)
              /^[[:space:]]*(__metadata|"?resolution"?[[:space:]]*:|"?resolved"?[[:space:]:]|languageName:|linkType:)/ { structural++ }
              /^[^[:space:]#]/ {
                # A new header ends the previous block, so anything buffered from
                # it can be emitted now: its `resolved` line, if it had one, has
                # already been read. Clearing the host state AFTER that flush is
                # what scopes a host to its own block — including for a header
                # this rule goes on to REJECT (a `github:` pin, a Berry patch
                # descriptor), whose `resolved` line must not colour the entry
                # buffered before it.
                flush()
                block_host = ""; block_conflict = 0; block_berry = 0; block_resolved = 0; block_badloc = 0; block_res = ""
                line = $0
                sub(/:[[:space:]]*$/, "", line)
                split(line, parts, ",")
                spec = parts[1]
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", spec)
                gsub(/"/, "", spec)
                name = ""
                # A real block header always carries `@` between the package name
                # and its range/protocol (`pkg@^1.0.0`, `@scope/pkg@^1.0.0`,
                # `pkg@npm:^1.0.0`). The leading `@` of a scoped name does not
                # count, hence `.@`. Bare keys — berry writes a `__metadata:`
                # block holding the lockfile format version — are file metadata,
                # not packages.
                #
                # What follows the LAST `@` is either a bare semver range
                # (`^1.0.0`, `1.x`, `latest`) or a `<protocol>:` selector. Allowlist
                # rather than denylist: only `npm:` resolves to a registry release
                # with a publish date. A denylist of the protocols we knew about
                # let `github:`, `git://` and `https://` tarball pins through, and
                # the backstop in main cannot catch them either because it inspects
                # the BODY version (an ordinary semver), not the protocol. Those
                # pins reached the registry, returned 404, and could trip the
                # all-skipped guard into failing a PR whose only changed pin was
                # github-sourced.
                # NOTE: no apostrophes in this block — it is inside a single-quoted
                # awk program.
                if (spec ~ /.@/) {
                  rest = spec
                  sub(/^.*@/, "", rest)
                  sub(/^npm:/, "", rest)
                }
                # What follows the last `@` must be a registry range or dist-tag
                # (`^1.0.0`, `1.x`, `*`, `latest`), optionally behind berry`s
                # `npm:` protocol which is stripped above. Anything carrying `/`,
                # `#` or `:` is a non-registry selector.
                #
                # Testing for "not scheme-shaped" was not enough: yarn v1`s GitHub
                # shorthand, `lodash@lodash/lodash#patched`, has no scheme, so it
                # was accepted and the pin became `lodash@4.17.21` — looked up as
                # the real lodash and rendered green, for a tarball that came from
                # codeload.github.com. Forks conventionally keep the upstream
                # name, so that collision is the common case, not an exotic one.
                if (spec ~ /.@/ && rest != "" && rest !~ /[\/#:]/) {
                  name = spec
                  sub(/@[^@]*$/, "", name)
                  # Alias headers (`string-width-cjs@npm:string-width@^4.2.0`)
                  # leave `alias@npm:target` behind. The installed package — and
                  # the one the body version belongs to — is the target, so keep
                  # that. Left as-is the name fails is_valid_pkg_name and becomes
                  # a skip, which trips the all-skipped guard when an alias is the
                  # only changed pin.
                  sub(/^.*@npm:/, "", name)
                  # Then check the SHAPE of what we derived rather than trusting
                  # the selector, because the selector test above does not survive
                  # percent-encoding. Berry writes patch descriptors as
                  # `typescript@patch:typescript@npm%3A5.3.3#optional!builtin<...>`
                  # — the last `@` lands inside the payload, so `rest` is
                  # `npm%3A5.3.3#...`, which matches neither the protocol pattern
                  # nor `^npm:`. A real package name is `pkg` or `@scope/pkg`: no
                  # interior `@`, no `:`, no `%`.
                  if (name !~ /^@?[^@:%]+$/) name = ""
                }
                # Count only headers that actually named a package, so the END
                # guard cannot read a file of pure patch/protocol descriptors as a
                # parse failure.
                if (name != "") specs++
                # A header the allowlist above REJECTED still names a dependency —
                # `github:`, `git+ssh://`, a tarball URL, yarn v1 GitHub shorthand.
                # Emit it as a `vendored` record, the same one the pnpm extractor
                # has produced since #165, so main sees one kind of record for
                # "arrived, and cannot be dated" whatever the lockfile format.
                # Dropped instead, such a pin reached neither checked_count nor
                # skipped_count, and a change moving only those rendered
                # "Verified 0 package(s) :white_check_mark:".
                #
                # The record carries the SPEC, not a name@version. The spec is what
                # identifies the source to a reviewer, and it is what moves when a
                # vendored dependency is re-pinned to a new commit while its
                # version stays put — so a version-keyed record would make that
                # re-pin invisible to the base-vs-head difference. It also needs no
                # buffering, unlike a pin, which must wait for its `version` line.
                #
                # `patch:` is excluded: it wraps a pin that already appears under
                # its own header, so the wrapped release is what gets age-checked.
                # local_path() excludes a selector naming this repo`s own tree.
                # Both are read off the FIRST non-scope `@`, because a rejected
                # selector routinely contains an `@` of its own
                # (`pkg@git+ssh://git@github.com/...`), and the last-`@` split the
                # accepted path uses would cut the name apart mid-URL.
                if (name == "" && spec ~ /.@/ && match(spec, /^@?[^@]+/)) {
                  sel = substr(spec, RSTART + RLENGTH + 1)
                  if (sel !~ /^patch:/ && !local_path(sel)) pending_vendored = spec
                }
                # The denominator for npm_age::records_cover_declared: a header
                # that named a registry package owes a pin, one held as vendored
                # owes that record. Counted HERE, at the header, so it does not
                # depend on the body lines a pin is later built from.
                if (name != "" || pending_vendored != "") declared++
                next
              }
              # Matches the OWN version line of a block. It cannot be tripped by a
              # nested `dependencies:` entry for the real npm package named
              # `version`, because a block always states its own `version` before
              # its `dependencies:` map — and emitting clears `name`, so a later
              # indented `version: ...` inside that map has no name to attach to
              # and is dropped. Load-bearing: reorder these two rules, or stop
              # clearing `name`, and a transitive dep could be attributed to its
              # parent. (No apostrophes here: this is inside a single-quoted awk
              # program, as the note on the header rule above says.)
              /^[[:space:]]+version[[:space:]]*:?[[:space:]]*"?[0-9]/ {
                ver = $0
                sub(/^[[:space:]]*version[[:space:]]*:?[[:space:]]*"?/, "", ver)
                sub(/["[:space:]].*$/, "", ver)
                # Buffered rather than printed (see flush()). pins++ stays here,
                # at the point a version is ACCEPTED, so the END guard below counts
                # exactly what it counted before — every accepted entry is flushed
                # by a later header or at EOF.
                if (name != "" && ver != "") { pending_name = name; pending_ver = ver; pins++ }
                name = ""
              }
              # Berry shape. These four keys are the only trigger for the exemption, and
              # every one is a key yarn v1 NEVER writes — which is the whole
              # requirement, because block_berry is the off-switch for the
              # fail-closed default above. A marker v1 also writes is not a format
              # signal, it is a bypass: `version:` was tried here and had to be
              # withdrawn, since v1 accepts the colon form too (the extractor
              # carries `:?` for it, and the reformat test drives it as a v1
              # shape), so `  version: "1.2.3"` plus any `resolved` spelling the
              # rule below misses switched the default off and shipped the pin
              # untagged.
              #
              # Read at the direct-child indent only, so a nested `dependencies:`
              # line cannot exempt a block — fenced by
              # test_yarn_nested_berry_marker_does_not_forge_the_exemption, since
              # this anchor is load-bearing in exactly the way the `resolved` one
              # below is.
              #
              # v1 ignores unknown keys, so ANY per-block marker is forgeable in
              # principle; narrowing to keys v1 never writes makes the forgery an
              # obviously alien line rather than one the block plausibly needs.
              /^  "?(resolution|checksum|languageName|linkType)"?[[:space:]]*:/ { block_berry = 1 }
              # The descriptor itself, CONFIRMED rather than assumed to agree with
              # the block header. The marker rule above only asks "is this block
              # Berry-shaped"; it does not read what the block says it installed.
              # That gap matters now that a Berry block gets a POSITIVE verdict
              # from .yarnrc.yml instead of merely being exempt: header and
              # resolution are two separate strings and yarn installs from the
              # RESOLUTION, so a crafted `"lodash@npm:^4.17.21":` whose body reads
              # `resolution: "lodash@https://evil.example/x.tgz"` is npm-shaped
              # everywhere the header allowlist looks, Berry-shaped to the marker
              # above, and a tarball fetch where yarn looks. Tagged, on the same
              # fail-closed-on-disagreement rule as a block naming two different
              # `resolved` hosts.
              #
              # Value read at the direct-child indent only, and quoted-key form
              # accepted, to match the marker rule it refines.
              /^  "?resolution"?[[:space:]]*:/ {
                res = $0
                sub(/\r$/, "", res)
                sub(/^[[:space:]]*"?resolution"?[[:space:]]*:[[:space:]]*/, "", res)
                gsub(/^"|"$/, "", res)
                gsub(/^\047|\047$/, "", res)
                # An empty value is a block-style map, which Berry does not write.
                # Nothing was read, so no claim is made either way and the block
                # keeps whatever the marker rule decided — rather than being
                # tagged on a guess about a shape this did not parse.
                if (res != "") {
                  # After the LAST `@` is the protocol half, so a scoped
                  # `@babel/core@npm:7.24.0` reads the same as a bare
                  # `lodash@npm:4.17.21`. The test is for a literal `npm:`
                  # because Berry percent-encodes that separator inside a patch
                  # payload (`typescript@patch:typescript@npm%3A5.3.3#...`), where
                  # the last `@` lands mid-payload and `npm%3A` must NOT count.
                  # Berry hardcodes the tarball URL as `::__archiveUrl=<encoded>`
                  # when the registry does not use the conventional
                  # `/<name>/-/<name>-<ver>.tgz` path. AWS CodeArtifact, Nexus and
                  # multi-registry setups all produce it — i.e. exactly the
                  # private-registry population this gate exists for. It names the
                  # host OUTRIGHT, which is stronger evidence than .yarnrc.yml, so
                  # it is recorded as the block host and wins in berry_host().
                  # Without it such an entry reads as a plain `npm:` resolution,
                  # falls back to the configured registry and is aged against a
                  # public homonym: the false pass this whole path closes, reached
                  # through the one resolution form that does carry a location.
                  #
                  # Split off BEFORE the protocol test below, because decoding can
                  # introduce an `@` (a `%40` in userinfo) and the test takes the
                  # LAST one.
                  #
                  # TWO axes, and both matter. Berry writes bindings as a single
                  # querystring after one `::`, joined by `&`, and parses it
                  # order-insensitively — so `__archiveUrl` need not come first.
                  # Matching only the head of a `::` segment let
                  # `::a=1&__archiveUrl=<evil>` hide the host completely: nothing
                  # was recorded, the entry fell back to the configured registry
                  # and was aged against a public homonym. That is the exact false
                  # pass this rule exists to close, reached by prepending one
                  # throwaway parameter. Scanning every `&` param also makes "two
                  # disagreeing ones conflict" true — before, the first quietly
                  # won and a second, foreign, `__archiveUrl` was never seen.
                  akv_n = split(res, akv, "::")
                  for (aki = 2; aki <= akv_n; aki++) {
                    apn = split(akv[aki], apv, "&")
                    for (api = 1; api <= apn; api++) {
                      if (apv[api] !~ /^__archiveUrl=/) continue
                      arch = apv[api]
                      sub(/^__archiveUrl=/, "", arch)
                      arch = pct_decode(arch)
                      # An `__archiveUrl` that named a location this could not read
                      # is NOT the same as no `__archiveUrl` at all: falling through
                      # to berry_host() would age the entry against a registry the
                      # lockfile has just said it did not come from. Refuse instead.
                      # Computed once and RECORDED as a value, so the refusal and
                      # the record cannot diverge.
                      arch_host = url_host(arch)
                      if (arch_host == "") block_conflict = 1
                      else record_host(arch_host)
                    }
                  }
                  res = akv[1]
                  sub(/^.*@/, "", res)
                  if (res !~ /^npm:/) block_conflict = 1
                }
              }
              # `resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#..."`
              # — the tarball yarn v1 actually fetched, and the only thing in the
              # block that names the registry that served it (see the header note
              # for why the block header cannot).
              #
              # EXACTLY two spaces — a direct child of the block header, which is
              # the only place yarn writes `resolved`. Matching any indent instead
              # reads the `dependencies:` map four spaces below it, and that is
              # FORGEABLE: `resolved` is a legal package name and a tarball URL is
              # a legal yarn range, so `    resolved "https://registry.npmjs.org/x"`
              # inside the dependency map of an entry whose real `resolved` points
              # at an attacker host is a well-formed line that overwrote the real
              # host — the pin was then aged against the genuine public package
              # and rendered green while yarn installs the attacker tarball. Same
              # class as the block-scalar hole anchored against in
              # npm_age::parse_pnpm_lock; see the note there.
              #
              # Recorded against the BLOCK, not the buffered entry, so the order
              # of `version` and `resolved` inside a block does not matter.
              #
              # Every plain spelling yarn v1 accepts for this one key: bare or
              # quoted, with or without a colon. All four set the same field and
              # all four were verified to make yarn fetch the URL, so matching
              # only the canonical one left three ways to hand the gate a pin
              # whose origin it never read.
              # Kept WHOLE for the vendored record. block_host below is only the
              # host, which cannot tell a re-pin apart: a vendored dependency moved
              # to a new commit keeps both its version and its host.
              /^  "?(resolved|resolution)"?[[:space:]:]/ {
                block_res = $0
                sub(/\r$/, "", block_res)
                sub(/^[[:space:]]*"?(resolved|resolution)"?[[:space:]]*:?[[:space:]]*/, "", block_res)
                gsub(/^"|"$/, "", block_res)
              }
              /^  "?resolved"?[[:space:]:]/ {
                url = $0
                sub(/\r$/, "", url)
                sub(/^[[:space:]]*"?resolved"?[[:space:]]*:?[[:space:]]*/, "", url)
                gsub(/^"|"$/, "", url)
                # Host derivation, the https-vs-any-scheme decision and the four
                # normalisations are reached through url_host() — one path, shared
                # with the Berry `__archiveUrl` rule. See its comment.
                # Recorded even when the value names no host, because the
                # forgery-in-a-Berry-block test above is about the LINE being
                # present, not about what it resolved to.
                block_resolved = 1
                note_host(url)
              }
              # awk exits 0 on anything, so without this the fail-closed branch in
              # changed_pins is unreachable for yarn: an unreadable image would
              # yield an empty `before` and quietly promote the whole head
              # lockfile into the work-list. Only fires when the file IS
              # yarn-shaped (real `pkg@range:` headers) but no body version could
              # be read — a comments-only or dependency-free lockfile has no specs
              # and stays a legitimate empty result.
              # Two fail-closed cases, both "the file said something we could not
              # read", which must never present as an empty work-list:
              #   specs>0, pins==0  — real `pkg@range:` headers but no readable
              #                       body version (a format change).
              #   content>0, pins==0, structural==0 — non-blank, non-comment
              #                       content that yielded no pins AND carries no
              #                       lockfile structure: truncated or wholesale
              #                       replaced. The structural test is what keeps
              #                       this off a legitimately dependency-free
              #                       BERRY lockfile, which is not comments-only —
              #                       it has a `__metadata:` block and a workspace
              #                       root, both correctly rejected as non-packages,
              #                       so specs and pins are 0 while content is ~8.
              #                       Without it, such a repo fails on every run,
              #                       and the first PR adding a dependency fails on
              #                       the BASE image with a message naming the
              #                       wrong cause.
              #   content==0 && comments==0 — nothing at all. yarn always writes
              #                       its two `# THIS IS AN AUTOGENERATED FILE`
              #                       header lines, so a totally blank file was
              #                       emptied rather than generated.
              #
              # A comments-only lockfile is NOT a failure: that is what yarn writes
              # for a project with no dependencies, and it keeps comments>0.
              #
              # Failing closed on a blank file matters because an empty yarn.lock
              # is not inert — `yarn install` re-resolves every range in
              # package.json and can pull packages published today, which is the
              # exact thing this gate exists to block. Reporting an empty work-list
              # for it would be the "empty means nothing changed" conflation again.
              END {
                # The last block in the file has no following header to end it.
                flush()
                if (mode == "declared") print declared + 0
                # Each refusal names its own reason on stderr. The comparator that
                # runs this program (preflight::new_lines_since_base, see "Message
                # ownership" there) says WHICH image could not be parsed and that
                # the run fails closed; only this program knows WHY, and the counts
                # are what tell a format change from a truncation. (No apostrophes
                # here: single-quoted awk program.)
                if (specs > 0 && pins == 0) {
                  print "yarn parser: " specs " package header(s) but no readable version line under any of them — a lockfile format this parser does not read?" > "/dev/stderr"
                  exit 1
                }
                if (content > 0 && pins == 0 && structural == 0) {
                  print "yarn parser: " content " non-comment line(s) carrying no lockfile structure (no resolved, resolution or __metadata key) — truncated or wholesale replaced?" > "/dev/stderr"
                  exit 1
                }
                if (content == 0 && comments == 0) {
                  print "yarn parser: empty or whitespace-only file (no content lines and no comment lines) — yarn always writes its header comments, so this was emptied or blanked rather than generated, and yarn install would re-resolve every range" > "/dev/stderr"
                  exit 1
                }
              }'
          }

          # Build the work-list for <lockfile> by running <extractor> over the base
          # and head images and reporting the difference. The probe, the temp-file
          # read, both checked parses and the full-line set difference are
          # `preflight::new_lines_since_base` — the one comparator shared with
          # pre-commit, so the two cannot drift on those details again. The
          # extractors above already meet its parser contract; this function names
          # the binding and keeps the npm-specific record for why it exists.
          #
          # This replaces scraping added (`+`) `git diff` lines, which could not
          # see a version bump at all: the `"node_modules/<pkg>"` key (and yarn's
          # `pkg@range:` header) only reaches the added side when a package is
          # brand new. Bumping an existing package rewrites just the version /
          # resolved / integrity lines inside the block and leaves the key line
          # as unchanged context, so the work-list came back empty and the job
          # went green having resolved zero publish dates. Confirmed in
          # production on layervai/discord#99, where an `electron-to-chromium`
          # published the same day sailed through a `min_age_days: 7` policy.
          #
          # Records are compared as whole lines, so the `offregistry<TAB>` marker
          # is part of the key: a pin that moves between registries without
          # changing version reads as a new record and is re-judged. A brand-new
          # lockfile (no base image) reports everything; a bumped pin is reported;
          # an untouched pin is not; a pin reverted to a previously-used version is
          # re-verified and simply passes.
          #
          # Exit codes pass through unchanged: 2 for the base image (read or parse
          # — a checkout problem: a partial clone's lazy blob fetch, a corrupt
          # object, no scratch space, a base revision the checkout cannot
          # resolve), 1 for a head lockfile that could not be parsed, and 5 from
          # the declared-count check below. main() renders exactly that split.
          # Every diagnostic is on stderr: stdout is the work-list channel, read
          # back with `new_deps=$(...)`. On a parse failure the helper names WHICH
          # image and the extractor says WHY (jq's own error; yarn_pins' END
          # diagnostic) — see the helper's header.
          #
          # The check runs AFTER the comparison, so the comparator's contract —
          # base side first, unconditionally — is untouched and a checkout
          # problem still surfaces ahead of a format one; diff_pnpm_lock, which
          # owns its own zero-pin triage, runs the same check before its base
          # read instead. It is a head-only question, so a lockfile this branch
          # deletes has nothing to answer.
          #
          # And only for a lockfile this branch CHANGED, the same line
          # diff_pnpm_lock draws with its unchanged-file short-circuit. main
          # calls this for every lockfile that merely exists, so an ungated
          # check would fail every PR in a repo — README-only ones included —
          # for a shortfall the branch did not introduce and cannot fix; that
          # is what trains people to reach for a bypass. The ls-files half is
          # load-bearing for the reason it is there too: `git diff <rev> --
          # <path>` ignores untracked paths, so an untracked lockfile reads as
          # unchanged and would skip the check on a file whose every entry is
          # being promoted. A `git diff` that fails outright reads as changed,
          # which is the fail-closed direction.
          npm_age::changed_pins() {   # <lockfile> <base_rev> <extractor> [base_blob]
            local lockfile="$1" extractor="$3" new_lines head_records
            new_lines=$(preflight::new_lines_since_base "$@") || return $?
            if [ -f "$lockfile" ] \
               && { ! git ls-files --error-unmatch "./${lockfile}" >/dev/null 2>&1 \
                    || npm_age::lockfile_changed "$lockfile" "$2"; }; then
              # A third parse of the head image (the comparator does not hand its
              # own back), checked on its own rather than left to pipefail: the
              # comparator just parsed this file, so a failure here is transient,
              # and it must still say so instead of returning a bare rc 1.
              head_records=$("$extractor" < "$lockfile") \
                || { echo "::error file=${lockfile}::${lockfile} could not be re-read for the declared-count check" >&2; return 1; }
              printf '%s\n' "$head_records" \
                | npm_age::records_cover_declared "$lockfile" "$extractor" \
                || return $?
            fi
            # No trailing newline for an empty result: main tests `-z "$new_deps"`
            # after stripping vendored records, and the comparator's own no-blank-
            # line contract is measured byte-exactly by its tests.
            [ -z "$new_lines" ] || printf '%s\n' "$new_lines"
          }

          # The declared-count check the seam header describes, format-agnostic:
          # the HEAD image's record stream on stdin, and `<extractor> declared`
          # run over <lockfile> for the denominator. Every record — a pin, tagged
          # or bare, or a vendored entry — accounts for one declared entry;
          # anything left over exists, resolves to something, and was gated by
          # nothing. rc 5, rendered by main as "lockfile only partly parsed",
          # because the operator is looking at a lockfile that parses.
          #
          # Fails rather than warns, and with no margin, because each extractor
          # builds its denominator to under-count rather than over-count: every
          # way it can be wrong makes the count too SMALL, which cannot trip this
          # branch. A shortfall therefore means the parser demonstrably missed
          # something, which is the silent pass this seam exists to stop.
          #
          # <detail>, optional, is appended to the counts in the message — pnpm
          # passes the number of keys whose version it could not read, which the
          # shared arithmetic cannot see (an unreadable key is deliberately not
          # accounted for, so it surfaces here instead of being dropped on the
          # path where other keys parsed).
          npm_age::records_cover_declared() {   # <lockfile> <extractor> [detail]
            local lockfile="$1" extractor="$2" detail="${3:-}"
            local records total vendored declared
            records=$(cat)
            # `grep -c` prints a count and exits 1 when that count is 0, so a
            # printed "0" is the one non-zero status accepted. Anything else — a
            # read error, grep itself failing — is a real failure and must not be
            # laundered into "0 accounted", which would fail every lockfile with a
            # false shortfall.
            total=$(printf '%s\n' "$records" | grep -c .) \
              || [ "${total:-}" = 0 ] \
              || { echo "::error file=${lockfile}::could not count the records parsed from ${lockfile}" >&2; return 1; }
            # `vendored` only words the message; the verdict below reads `total`.
            vendored=$(printf '%s\n' "$records" | npm_age::records_of_kind vendored | grep -c .) \
              || [ "${vendored:-}" = 0 ] \
              || { echo "::error file=${lockfile}::could not count the vendored records parsed from ${lockfile}" >&2; return 1; }
            declared=$("$extractor" declared < "$lockfile") \
              || { echo "::error file=${lockfile}::could not count the entries ${lockfile} declares; the parser itself failed" >&2; return 1; }
            # One non-negative integer, or fail closed: the test below is
            # arithmetic, and on an empty or non-numeric value it errors and reads
            # FALSE — fail-open in exactly the "the parser misbehaved" case this
            # exists for.
            case "${declared:-x}" in
              *[!0-9]*)
                echo "::error file=${lockfile}::could not count the entries ${lockfile} declares; the parser returned '${declared}'" >&2
                return 1
                ;;
            esac
            if [ "$declared" -gt "$total" ]; then
              echo "::error file=${lockfile}::${lockfile} declares $(( declared - total )) more package(s) than this check could account for (${declared} declared; $(( total - vendored )) readable pins, ${vendored} vendored${detail:+, ${detail}}) — its lockfile format is not fully one this check understands, so the packages it did verify are not the whole file. Until this check is taught the format, pin your caller to the previous ops-routines-workflows release SHA and tell the ops-routines maintainers." >&2
              return 5
            fi
          }

          # An unreadable lockfile FORMAT yields an empty work-list, which reads
          # exactly like "nothing changed". These paths deliberately do not fail
          # the job (see the Known limitations block), so the gap has to be
          # visible somewhere a consumer actually looks: a ::warning annotation,
          # a step-summary row, and an unverifiable record for comment_on_failure.
          # True when <lockfile> differs between the merge base and the working
          # tree. main() iterates every lockfile that merely EXISTS in the
          # checkout, so the format-gap probes below would otherwise fire on every
          # PR — including README-only ones. A permanent per-PR annotation for a
          # defect the consumer cannot fix is what trains people to reach for
          # `age-check-bypass`, which is the same argument this file makes for not
          # hard-failing an unsupported format.
          npm_age::lockfile_changed() {
            local lockfile="$1" base_rev="$2"
            ! git diff --quiet "$base_rev" -- "./${lockfile}" 2>/dev/null
          }

          # Set by main to a temp file; report_unreadable_format appends to it.
          # A plain variable would not survive, because the diff_* functions run
          # inside `new_deps=$(...)` — a subshell whose assignments are discarded.
          NPM_AGE_UNREADABLE_MARKER="${NPM_AGE_UNREADABLE_MARKER:-}"

          npm_age::report_unreadable_format() {
            local file="$1" detail="$2" safe_file
            # safe_for_md for the same reason every other row-writing site uses it:
            # $file is LOCKFILE_PATH, a workflow_call input, and a `|` in it would
            # split the markdown row into extra columns.
            safe_file=$(preflight::safe_for_md "$file")
            echo "::warning file=${safe_file}::${detail} — ${safe_file} is NOT being age-checked" >&2
            echo "| \`${safe_file}\` | — | — | :warning: NOT age-checked (${detail}) |" >> "$GITHUB_STEP_SUMMARY"
            # Recorded so the final footer cannot claim a clean verification while
            # a ":warning: NOT age-checked" row sits above it.
            if [ -n "$NPM_AGE_UNREADABLE_MARKER" ]; then
              printf '%s\n' "$safe_file" >> "$NPM_AGE_UNREADABLE_MARKER"
            fi
            # Deliberately NOT preflight::record_unverifiable. That file is the
            # comment renderer's input, and the renderer gates on the file being
            # non-empty rather than on job status (`if: !cancelled()` in the
            # template, `[ -s "$FAILURES_FILE" ]` in the snippet). These paths exit
            # 0, so recording here would post a sticky "Dependency Age Check
            # failed" comment on a green run — with guidance ("usually a transient
            # registry/API issue — re-run") that can never apply to a parser
            # format gap. Every other writer of that file also sets failed=true;
            # keep that invariant. The ::warning above and the summary row are the
            # right channels for a gap that does not fail the job.
          }

          npm_age::diff_package_lock() {
            local lockfile="$1" base_rev="$2"

            # Require the head image to be a JSON OBJECT before anything else.
            # A zero-byte or whitespace-only lockfile slips past both parse
            # checks: `jq -e` emits no output and exits 4, which the `>1` arm below
            # reads as "malformed, stay quiet", while `jq -r "$NPM_AGE_JQ_ENTRIES"`
            # on empty input exits 0 with no output — so changed_pins does NOT fail
            # closed, and the run prints "No new dependencies" and goes green. That
            # is the exact conflation this check exists to prevent, surviving in
            # the branch built to catch it.
            local head_kind
            head_kind=$(jq -r 'type' "$lockfile" 2>/dev/null) || head_kind=""
            if [ "$head_kind" != "object" ]; then
              echo "::error file=$(preflight::safe_for_md "$lockfile")::${lockfile} is not valid JSON (empty or malformed); refusing to report an empty work-list" >&2
              return 1
            fi
            # npm 6 (lockfileVersion 1) lockfiles carry only the nested
            # `.dependencies` tree and no `.packages` object at all, so the
            # extractor yields zero pins, jq exits 0, and the run goes green
            # having checked nothing. Same conflation of "nothing changed" with
            # "I can't read this" that the pnpm probe below covers — announce it
            # rather than leaving it to a header comment. (Invalid JSON makes
            # `jq -e` non-zero and is left to changed_pins, which fails closed.)

            # jq -e: 0 = "has no packages", 1 = "has packages". 2+ (malformed)
            # cannot occur here — the head_kind guard above already returned — so
            # the `>1` arm is belt-and-braces should that guard ever be relaxed;
            # it keeps the base probe from firing beside a real parse failure and
            # claiming "every head pin is treated as new".
            local head_unreadable=0 probe_rc=0
            jq -e 'has("packages") | not' "$lockfile" >/dev/null 2>&1 || probe_rc=$?
            if [ "$probe_rc" -eq 0 ]; then
              head_unreadable=1
              if npm_age::lockfile_changed "$lockfile" "$base_rev"; then
                npm_age::report_unreadable_format "$lockfile" \
                  "no \`packages\` object (lockfileVersion 1?)"
              fi
            elif [ "$probe_rc" -gt 1 ]; then
              head_unreadable=1
            fi
            # The BASE image matters too. An npm 6 -> 9 migration leaves a v1 base
            # (no `.packages`) against a v3 head: the extractor yields nothing for
            # the base, so `before` is empty and the ENTIRE head lockfile becomes
            # the work-list. That is the unbounded run that times out, and without
            # this probe it would happen with no stated cause.
            #
            # The probe reads the base image the comparator leaves in $base_blob —
            # one jq pass, no second `git show` — so it runs AFTER the comparison
            # and only on an image that was read and parsed successfully; a base
            # the comparator could not read has already returned rc 2 above it.
            # Kept out of the extractor deliberately: folding it in would cost the
            # per-image file context this warning needs to be actionable.
            # Only when the HEAD is readable: if it is not, the probe above already
            # said so, and "every head pin is treated as new" would be false — a v1
            # head yields no pins at all. Two contradictory warnings on one file is
            # worse than one accurate one. `-s`: an absent base image leaves the
            # file empty, and the promotion warning is pnpm's to give, not this.
            # The weaker test than pnpm's `rev-parse` probe, deliberately: a
            # zero-byte base image is not JSON, so jq rejects it either way.
            local base_blob new_pins
            base_blob=$(mktemp) \
              || { echo "::error::could not create a temporary file for the base image" >&2; return 2; }
            # shellcheck disable=SC2064
            trap "rm -f \"$base_blob\"" RETURN
            new_pins=$(npm_age::changed_pins "$lockfile" "$base_rev" npm_age::pkglock_pins "$base_blob") \
              || return $?
            if [ "$head_unreadable" -eq 0 ] \
               && [ -s "$base_blob" ] \
               && npm_age::lockfile_changed "$lockfile" "$base_rev" \
               && jq -e 'has("packages") | not' "$base_blob" >/dev/null 2>&1; then
              npm_age::report_unreadable_format "$lockfile" \
                "base image has no \`packages\` object (lockfileVersion 1 -> 3 migration?); every head pin is treated as new"
            fi
            # Guarded: a bare printf of an empty result would put a blank line on
            # the work-list channel.
            [ -n "$new_pins" ] && printf '%s\n' "$new_pins"
            return 0
          }

          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/_npm-lockfile-parsers.sh (part 3 of 3), lib/age-check-npm.sh (part 1 of 4)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/_npm-lockfile-parsers.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          npm_age::diff_yarn_lock() {
            local lockfile="$1" base_rev="$2"
            # A blank yarn.lock fails closed (see the END guard in yarn_pins:
            # `yarn install` would re-resolve every range). But `main` enqueues
            # yarn.lock whenever the file merely EXISTS, and changed_pins has no
            # "did it move" gate — so a repo carrying a committed zero-byte
            # yarn.lock (a real trick for forcing yarn detection on some hosts)
            # would fail on every PR, including README-only ones, for a state the
            # branch did not introduce. Announce that instead; it still suppresses
            # the clean footer via unreadable_count.
            if ! grep -qE '[^[:space:]]' "$lockfile" 2>/dev/null; then
              if ! npm_age::lockfile_changed "$lockfile" "$base_rev"; then
                npm_age::report_unreadable_format "$lockfile" \
                  "file is empty and unchanged by this branch; nothing to age-check"
                return 0
              fi
            fi
            npm_age::changed_pins "$lockfile" "$base_rev" npm_age::yarn_pins
          }

          # pnpm parser, from PR #135 (lockfileVersion 5/9 support). Lives here
          # with the other extractors rather than in the calling script: it is the
          # same extractor/comparator job, and this is the file that gets read when
          # someone asks which pins are being gated.
          # WHICH REGISTRY an entry came from is read from its BODY, not its key —
          # a pnpm key names no registry in any lockfileVersion. So this is not a
          # key scanner: it buffers each key until it has seen that entry's
          # `resolution:`, and only then decides. `{tarball: URL}` names a host
          # outright; `{integrity: ...}` means "whatever registry was configured",
          # which is .npmrc's business and arrives here as default_host/scope_map.
          # Entries resolving anywhere but want_host are emitted TAGGED rather
          # than dropped, so that a newly added private package is reported as
          # skipped instead of vanishing from both sides of the set difference.
          #
          # $1 selects the output: "entries" (default) prints one record per
          # line — `pkg@version`, prefixed with "offregistry<TAB>" for an entry
          # that resolves somewhere other than want_host, or "vendored<TAB>" plus
          # the verbatim key for one that names a source rather than a version;
          # "counts" prints "<non-registry> <unreadable>"; "declared" prints the
          # number of `resolution:` lines the `packages:` map carries — the
          # denominator the seam header asks every extractor for (see the
          # `resolutions` counter below). There is no off-registry count, because
          # such an entry is PRINTED in entries mode, which makes the zero-pin
          # path that reads "counts" unreachable for it; the vendored count is
          # kept because that path DOES need it — a vendored record is not a pin,
          # so a fully vendored lockfile still has no pins to gate. The caller
          # reads "counts" on the zero-pin path, to tell a format it could not
          # read apart from one it read fine whose every entry is git-, tarball-,
          # link- or workspace-sourced. Both fail closed; asserting the wrong
          # cause is what burns whoever debugs it.
          #
          # awk vars: want_host is the configured registry host, default_host the
          # one an integrity-only entry falls back to (.npmrc `registry=`, else the
          # configured one), scope_map a space-separated `@scope=host` list. All
          # three are globals set by age-check-npm.sh before this file is sourced
          # and narrowed per target by npm_age::load_registry_config, so nothing
          # here derives them.
          npm_age::parse_pnpm_lock() {
            # A typo would otherwise be silently treated as "entries", handing the
            # caller a package list where it expected a number — which then fails
            # as a bash arithmetic error somewhere else entirely.
            local mode="${1:-entries}"
            case "$mode" in
              entries|counts|declared) ;;
              *) echo "::error::npm_age::parse_pnpm_lock: unknown mode '${mode}'" >&2; return 2 ;;
            esac
            # All three are set once at load time in age-check-npm.sh and narrowed
            # per target by npm_age::load_registry_config. default_host equalling
            # want_host is the honest reading of "no .npmrc evidence": with nothing
            # saying the lockfile was written against some OTHER registry, an
            # integrity-only entry came from the configured one.
            # Configuration through ENVIRON, not `-v`: see npm_age::yarn_pins for
            # why — a `-v` value is escape-processed, so a committed `\040` split
            # the space-separated scope map inside awk and bound a scope to the
            # token before it. `mode` is a literal this file controls and stays.
            NPM_AGE_WANT_HOST="$NPM_AGE_WANT_HOST" \
            NPM_AGE_DEFAULT_HOST="$NPM_AGE_DEFAULT_HOST" \
            NPM_AGE_SCOPE_MAP="$NPM_AGE_SCOPE_MAP" \
            awk -v mode="$mode" "$NPM_AGE_AWK_CANON_HOST""$NPM_AGE_AWK_UNQUOTE"'
              BEGIN {
                want_host = ENVIRON["NPM_AGE_WANT_HOST"]
                default_host = ENVIRON["NPM_AGE_DEFAULT_HOST"]
                n = split(ENVIRON["NPM_AGE_SCOPE_MAP"], sm, " ")
                for (i = 1; i <= n; i++) {
                  eq = index(sm[i], "=")
                  if (eq > 1) scope_host[substr(sm[i], 1, eq - 1)] = substr(sm[i], eq + 1)
                }
              }

              # unquote() is NPM_AGE_AWK_UNQUOTE, prefixed above: pnpm quotes
              # values containing YAML-special characters.

              # Position of the (skip+1)-th `tarball:` that is actually a MAP KEY —
              # preceded by "{", "," or whitespace and followed by whitespace — or
              # 0 if there is none. A bare substring search believes a forged one
              # inside a quoted VALUE:
              #   {integrity: sha512-..., x: \047tarball: https://registry.npmjs.org/y\047}
              # That is a single occurrence, so it also slips past the ambiguity
              # guard, and the pin is emitted bare — which under the record grammar
              # asserts it resolves to want_host. Aged against whatever public
              # package shares the name: the same false pass, through the body.
              #
              # `skip` lets one function answer both questions the caller has:
              # skip 0 is "where is the tarball", skip 1 is "is there a second one".
              function tarball_key_pos(s, skip,   off, p, c, d, n) {
                off = 0; n = 0
                while ((p = index(substr(s, off + 1), "tarball:")) > 0) {
                  p = off + p
                  c = (p == 1) ? "{" : substr(s, p - 1, 1)
                  d = substr(s, p + 8, 1)
                  if ((c == "{" || c == "," || c == " " || c == "\t") \
                      && (d == " " || d == "\t")) {
                    n++
                    if (n > skip) return p
                  }
                  off = p + 7
                }
                return 0
              }

              # Host the pending entry actually resolves through. Most specific
              # evidence first: a tarball URL names its host outright, a v5 key
              # qualified with a registry host names it in the key, and only an
              # entry with neither — and with a resolution this parser could
              # actually read — falls back to what .npmrc configured for its scope
              # (or, failing that, the default registry). An empty return means
              # "cannot tell", which the caller turns into the tag.
              function pending_host(   url, scope, p) {
                # Ambiguous entries are never called on-registry. Two direct-child
                # resolution lines, or two tarballs inside one, and this parser
                # cannot know which pnpm would install from — and first-wins and
                # last-wins are each a false pass under the opposite ordering. The
                # empty return matches no host, so the entry is tagged.
                if (res_ambiguous || tarball_key_pos(pending_res, 1) > 0)
                  return ""
                p = tarball_key_pos(pending_res, 0)
                if (p > 0) {
                  # A POSITION, not sub(/^.*tarball:/): POSIX awk matches
                  # leftmost-LONGEST, so `.*` runs to the LAST "tarball:" in the
                  # line. A crafted URL fragment —
                  # `{tarball: https://attacker.example/x.tgz#tarball:https://registry.npmjs.org/y}`
                  # — then yields the npmjs host, the pin is judged on-registry and
                  # aged against a genuine public package, while pnpm installs the
                  # attacker tarball (a fragment is never sent to the server, so
                  # the URL still fetches). The forgery sits INSIDE the real
                  # resolution line, so the indent anchor does not reach it.
                  url = substr(pending_res, p + 8)
                  sub(/[,}].*$/, "", url)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", url)
                  url = unquote(url)
                  # Called UNCONDITIONALLY, scheme or none: whatever the tarball
                  # key holds is where pnpm fetches from. See the note on
                  # NPM_AGE_AWK_CANON_HOST for why yarn gates the same call.
                  return canon_host(url)
                }

                # POSITIVE EVIDENCE, or the tag. Until now "I saw no tarball" and
                # "I could not read this resolution at all" were the same branch,
                # and both fell through to default_host — which emits a BARE pin,
                # and under the record grammar above a bare pin ASSERTS the package
                # resolves to want_host. Two legal-YAML respellings reached that:
                #
                #   "resolution": {tarball: https://attacker/...}   quoted KEY, so
                #                                                   ^    resolution: never matched
                #   resolution: {"tarball": "https://attacker/..."} quoted key, so
                #                                                   index(s,"tarball:") never matched
                #
                # Both are what js-yaml — and therefore pnpm — parses as an
                # ordinary resolution, so the package installs from the attacker
                # host while the pin is aged against a public homonym. Neither
                # needs a second `resolution:`, so res_ambiguous never fires.
                #
                # An unread `tarball` is evidence this parser CANNOT JUDGE the
                # entry, not evidence it is integrity-only. Testing for the
                # presence of `integrity:` was not enough, because integrity is
                # free for an attacker to add alongside a tarball spelled so the
                # key matcher misses it:
                #
                #   {integrity: sha512-a==, "tarball": "https://attacker/..."}
                #   {integrity: sha512-a==, tarball : https://attacker/...}
                #
                # Both are legal YAML flow syntax that pnpm installs from, and
                # both passed the integrity test and fell through to default_host
                # — a bare pin, aged against a public homonym. Execution reaches
                # here only when tarball_key_pos found nothing, so a legitimate
                # resolution has already returned above and no real entry carries
                # the word otherwise.
                if (index(pending_res, "tarball") > 0)
                  return ""

                # pnpm writes `integrity:` on every registry entry, so requiring
                # it costs nothing real. A quoted `"integrity":` also fails this
                # and is tagged — fail-closed, and the direction the grammar asks
                # for.
                if (pending_res == "" || pending_res !~ /integrity[[:space:]]*:/)
                  return ""

                # AFTER the body checks, not before them. A registry-qualified key
                # is evidence, but it is evidence the ATTACKER writes, and ahead of
                # these checks it was an off-switch for all of them:
                #
                #   registry.npmjs.org/evil/1.0.0:
                #     resolution: {"tarball": "https://attacker.example/evil.tgz"}
                #
                # returned want_host straight from the key and emitted a BARE pin,
                # so the quoted-tarball and no-resolution refusals never ran and it
                # was aged against the public `evil`. An exemption marker is the
                # off-switch for a safety default, so it must be subject to the
                # same evidence as everything else: it chooses BETWEEN registries
                # once the body has shown the entry is readable, and never excuses
                # an unreadable one.
                # Only ever want_host: the v5 strip arm requires the key to be
                # prefixed with want_host itself. A v5 key qualified with any OTHER
                # host does not reach here — it takes the source-shaped arm and is
                # counted non-registry, which is fail-closed but is a count rather
                # than the tag the grammar would prefer.
                if (pending_key_host != "") return pending_key_host
                if (substr(pending_name, 1, 1) == "@") {
                  scope = pending_name
                  sub(/\/.*$/, "", scope)
                  if (scope in scope_host) return scope_host[scope]
                }
                return default_host
              }

              # Emits the buffered entry, if any. Called before each new key, on
              # leaving the packages block, and at EOF — the three ways an entry
              # can end.
              function flush(   h) {
                if (pending_name == "") return
                h = pending_host()
                if (h == want_host) {
                  if (mode == "entries") print pending_name "@" pending_ver
                } else {
                  # Tagged, not dropped. A dropped entry reaches neither side of
                  # the set difference in diff_pnpm_lock, so a newly added private
                  # package would go green with no annotation — the invisibility
                  # documented for vendored deps, reached by a second door.
                  if (mode == "entries") print "offregistry\t" pending_name "@" pending_ver
                }
                pending_name = ""; pending_ver = ""; pending_res = ""
                pending_key_host = ""; in_res = 0; res_indent = 0; res_ambiguous = 0
              }

              # Non-comment text in column 0 opens a top-level block; remember
              # whether it is the one holding resolved entries.
              /^[^[:space:]#]/ { flush(); in_packages = ($0 ~ /^packages:[[:space:]]*$/); next }
              !in_packages { next }

              {
                # Entry keys sit at EXACTLY two spaces — pnpm indents the children
                # of `packages:` that way in v5, v6 and v9 alike. Matching any
                # depth would also match content inside a nested block scalar: a
                # dependency own `deprecated:` prose that happens to wrap on a line
                # ending `pkg@1.2.3:` parses as a phantom package. is_valid_pkg_name
                # rejects it, but via the branch that increments skipped_count —
                # enough to trip the all-skipped guard in main and fail a PR whose
                # lockfile changed nothing but a deprecation notice.
                # (\r? tolerates a CRLF checkout.)
                #
                # If a future pnpm changes that indent this parses to zero and takes
                # the fail-closed path below — visible, not silent.
                if ($0 !~ /^  [^[:space:]].*:\r?$/) {
                  # Denominator for npm_age::records_cover_declared (the `declared`
                  # mode): every entry in a pnpm `packages:` map carries exactly
                  # one `resolution:`, v5 through v9, written as a direct child of
                  # the two-space key — so EXACTLY four spaces. Counted ONCE per key
                  # (res_seen), independently of whether the key itself parsed:
                  # the whole point is to know how many entries the file declares
                  # when the key matcher could not read some of them. That is the
                  # case the all-or-nothing zero-pin guard below cannot see — a
                  # format that respelled most keys but left one recognisable
                  # gates that one and renders "Verified 1 package(s)".
                  #
                  # The exact indent is what keeps the count from over-detecting.
                  # A `resolution:` inside a nested block scalar — a `deprecated: |`
                  # whose prose contains the word — cannot land on it, because YAML
                  # requires block content to sit deeper than the key introducing
                  # it, and that key is itself at four spaces. `in_packages` rules
                  # out the same line under `importers:` or `snapshots:`, where v9
                  # repeats every package. Both are load-bearing: a bare grep -c
                  # would double the denominator on every real v9 lockfile.
                  #
                  # res_seen and the indent overlap on purpose. pnpm writes
                  # `resolution:` as the FIRST body line, so under a key that has
                  # one, res_seen alone already ignores anything deeper that
                  # follows; the indent is what stops a nested line from being
                  # counted under a key that has NO resolution of its own — which
                  # is exactly the unreadable-key shape the denominator exists to
                  # notice, and where a false count would become a false shortfall.
                  # test_pnpm_shortfall_denominator_needs_the_exact_indent pins the
                  # indent on its own; the block-scalar test pins the pair.
                  #
                  # Deliberately STRICTER than the `resolution:` grep the zero-pin
                  # path runs. That one is a fail-closed sentinel and wants to
                  # over-detect; this one triggers a failure by itself and wants
                  # to under-detect. Each errs toward safety in its own direction.
                  if (!res_seen && $0 ~ /^    resolution:/) { resolutions++; res_seen = 1 }

                  # Not a key, so it is a body line of the entry whose key was
                  # read last — where `resolution:` lives, and with it the only
                  # statement the lockfile makes about where the package came
                  # from. Everything else in the body is ignored.
                  # Guard clause rather than a wrapping if: this is the block that
                  # decides whether a private package is reported as
                  # npmjs-resolved, and one less level of nesting is one less
                  # thing between a reader and that decision.
                  #
                  # `in_res || pending_res == ""` because once the resolution is
                  # captured every remaining body line (engines, dependencies,
                  # dev, ...) would pay for a substitution and a match that both
                  # inner branches then ignore — measurably, on a monorepo
                  # lockfile.
                  # `body ~ /^    resolution:/` stays in the condition after the
                  # resolution is captured, so a SECOND one is still noticed and
                  # marks the entry ambiguous rather than being skipped as noise.
                  if (pending_name != "" \
                      && (in_res || pending_res == "" || $0 ~ /^    resolution:/)) {
                    body = $0
                    sub(/\r$/, "", body)
                    ind = match(body, /[^ ]/)
                    # A block-style resolution continues on deeper-indented
                    # lines. pnpm writes flow style, but a reformatted or
                    # hand-edited lockfile does not have to, and reading only the
                    # first line of a block-style map would miss a `tarball:`
                    # under it — reporting a private package as npmjs-resolved,
                    # which is the failure this whole path exists to prevent.
                    if (in_res) {
                      # A blank line is a CONTINUATION, not the end of the block.
                      # match() returns 0 for a whitespace-only line, so `ind >
                      # res_indent` was false and accumulation stopped there — a
                      # `tarball:` after the blank was never seen, the entry fell
                      # back to default_host, and a bare pin was emitted for a
                      # package pnpm installs from somewhere else. Blank lines
                      # inside a block mapping are legal YAML, so that is a
                      # formatting quirk away, and it defeats the two-resolution
                      # guard because there is only ever one `resolution:`.
                      #
                      # Safe: a two-space entry key is taken by the key regex
                      # before this point and a column-0 line by the top rule, so
                      # nothing else can leak into pending_res.
                      if (body ~ /^[[:space:]]*$/ || ind > res_indent) {
                        pending_res = pending_res " " body
                        next
                      }
                      in_res = 0
                    }
                    # EXACTLY four spaces — a direct child of the two-space entry
                    # key, which is the only place pnpm writes `resolution:`. Any
                    # indent would also match a line inside a block scalar, and
                    # that is forgeable: a crafted entry whose `deprecated: |` text
                    # contains a `resolution: {tarball: https://registry.npmjs.org/...}`
                    # line before the real one would be judged on-registry while
                    # pnpm installs from the real resolution below it — which is
                    # the very false pass this closes, handed back through the
                    # body. Same
                    # reasoning, and the same fix, as the two-space anchor on keys.
                    #
                    # First resolution only, so a later forged one cannot append.
                    if (pending_res != "" && body ~ /^    resolution:/) res_ambiguous = 1
                    if (pending_res == "" && body ~ /^    resolution:/) {
                      pending_res = body
                      res_indent = ind
                      tail = body
                      sub(/^[[:space:]]*resolution:[[:space:]]*/, "", tail)
                      in_res = (tail == "")
                    }
                  }
                  next
                }
                flush()
                res_seen = 0
                key = $0
                sub(/^[[:space:]]+/, "", key)
                sub(/:\r?$/, "", key)

                key = unquote(key)

                # The key as the lockfile spells it, saved before the peer-suffix,
                # leading-slash and registry-host normalisation below — that
                # normalisation exists to split a NAME from a VERSION, and a
                # vendored key has neither. This is the payload of a `vendored`
                # record, so what the reviewer reads is what they can grep for.
                # Verbatim includes a v6 peer suffix, so a vendored dependency
                # whose peer version changed reads as a new record: a notice, not
                # a gate, for a resolution that genuinely did change.
                raw = key

                # v6/v9 peer suffix, stripped before the split: a scoped peer in
                # vue-loader@15.9.8(@vue/compiler-sfc@3.0.0) would otherwise own
                # both the last "@" and the last "/" in the key.
                sub(/\(.*$/, "", key)

                slashed = (substr(key, 1, 1) == "/")
                if (slashed) key = substr(key, 2)

                # A v5 lockfile written against a non-default registry qualifies
                # EVERY key with the registry host (`example.com/pkg/1.0.0`,
                # no leading slash). Those keys are registry-hosted packages, so
                # when the host is the configured registry they are stripped back
                # to their v5 form and gated normally. Without this arm they fall
                # into the source-shaped arm below and are counted non-registry,
                # which for a whole such lockfile failed the run as "nothing from
                # a registry" — true of npmjs, wrong about the repo, and with no
                # remedy but turning the gate off.
                #
                # index(), not a regex: a host is full of dots, and want_host is
                # caller-supplied.
                key_host = ""
                if (!slashed && want_host != "" && index(key, want_host "/") == 1) {
                  key = substr(key, length(want_host) + 2)
                  slashed = 1
                  key_host = want_host
                }

                # Both patterns anchor to $, so leftmost-longest lands them on the
                # LAST separator — which is what keeps a leading "@scope/" on the
                # name side. Only v5 puts the version after a "/", and requiring
                # it to look like a semver keeps a v6 scoped name that merely
                # starts with a digit (/@develar/7zip-bin@5.2.0) out of that arm.
                # Not airtight: a v6 scoped name beginning <digits>.<digit> —
                # /@scope/1.2beta@3.0.0 — would still take the v5 arm and split to
                # @scope + 1.2beta@3.0.0, which then fails the semver charset and
                # is filed as non-registry. That name shape is close to
                # nonexistent on npm, and the outcome is a fail-closed with a
                # slightly wrong reason rather than a pass, so the discriminator
                # is left simple.
                # The backslash in [^\/] is load-bearing: a bare "/" inside a
                # /.../ literal is a syntax error on BWK awk. POSIX reads it as
                # "not backslash and not slash", which is the same set here.
                if (slashed && match(key, /\/[0-9]+\.[0-9][^\/]*$/)) {
                  name = substr(key, 1, RSTART - 1)
                  ver  = substr(key, RSTART + 1)
                  sub(/_.*$/, "", ver)               # v5 peer suffix; "_" is not legal in semver
                } else if (!slashed && substr(key, 1, 1) != "@" \
                           && (key ~ /^[a-z][a-z0-9+.-]*:\/\// \
                               || key ~ /^(file|link|workspace|portal|git\+):/ \
                               || key ~ /^[^\/]+\.[^\/]+\//)) {
                  # Keys that name a source rather than a package. Three shapes:
                  #   scheme://...    https://host/x.tgz, git+https://host/r.git#sha
                  #   host/path/rev   example.com/pkg/1.0.0, github.com/o/r/<sha>
                  #   scheme:path      file:./x, link:../y, workspace:*, git+...
                  #
                  # The scheme-prefix shape used to sit in its own arm AFTER the
                  # v6/v9 split, which meant a key carrying both a prefix and an
                  # "@" (file:./pkg@1.0.0) was split there and emitted as a
                  # registry package. Testing it here fixes that; folding also
                  # removes a second nonregistry++ site to keep in step.
                  # Neither has an "@" to split on — or, for git+ssh, has one that
                  # belongs to the URL userinfo — so without the scheme alternative
                  # they reach `else next` UNCOUNTED, and a lockfile made entirely
                  # of them reports "lockfileVersion not understood" and sends the
                  # operator off to pin back a release. It is a vendored repo, not
                  # a format gap, and allow_registry_free is the answer.
                  #
                  # Tested here, AFTER the
                  # v5 arm and BEFORE the v6/v9 one, because both neighbours would
                  # get it wrong: a peer suffix (`..._react@16.0.0`) gives the
                  # v6/v9 arm an "@" to split on, yielding a two-slash name that
                  # only is_valid_pkg_name catches, and downgrades a real
                  # diagnosis into "does not match npm package name rules".
                  #
                  # The two guards are what keep it off legitimate packages: an
                  # unscoped v5 key with a dot in the name (`/lodash.merge/4.6.2`)
                  # is `slashed` and has already matched the v5 arm above, and a
                  # scoped name whose scope contains a dot (`@foo.bar/baz@1.0.0`)
                  # is excluded by the leading "@".
                  if (mode == "entries") print "vendored\t" raw
                  nonregistry++
                  next
                } else if (match(key, /@[^@]*$/)) {  # v6/v9
                  name = substr(key, 1, RSTART - 1)
                  ver  = substr(key, RSTART + 1)
                } else next

                # Defensive, not load-bearing: the nested sub-keys this once
                # caught (peerDependenciesMeta children and the like) sit at four
                # spaces and are already rejected by the indent anchor above,
                # before any arm runs. What is left for it is a contrived
                # two-space key that splits to an empty name, such as a bare
                # @1.0.0 — cheap to keep, but do not read it as evidence that the
                # indent anchor could be relaxed. It could not.
                if (name == "") next

                # Registry versions are semver: a leading digit, then only the
                # characters semver allows, mirroring the package-lock parser
                # keeping only https "resolved" — and it keeps ":" out of the
                # version, so a crafted key cannot smuggle ::workflow-command::
                # text into a log line or summary row.
                #
                # The NAME side is deliberately not constrained here — a crafted
                # `pkg::error::foo@1.0.0` does yield that name. It is rejected
                # downstream by npm_age::is_valid_pkg_name before it can reach the
                # curl URL, and the resulting annotation lands mid-line behind a
                # `::warning file=...::` prefix where Actions will not parse a
                # workflow command. Constrained, but not here.
                # Buffered, not printed: the registry this resolves through is in
                # the body, which has not been read yet. flush() emits it once the
                # next key, the end of the block, or EOF says the body is done.
                if (ver ~ /^[0-9][0-9A-Za-z.+-]*$/) {
                  pending_name = name
                  pending_ver = ver
                  pending_res = ""
                  pending_key_host = key_host
                  in_res = 0
                  res_ambiguous = 0
                  next
                }

                # Not semver. Two very different reasons, and they must not share
                # a counter, because they lead to opposite remedies: one says pin
                # back and file an issue, the other says set allow_registry_free
                # — which turns the gate OFF for that repo, permanently. The
                # catch-all therefore has to be the conservative one.
                #
                # A version that still names a SOURCE is a deliberate skip. That
                # includes the shape a v9 git key leaves behind:
                # `gitdep@git+ssh://git@github.com/o/r.git` splits at the last
                # "@" — the one inside `git@github.com` — leaving
                # `github.com/o/r.git`, which names no scheme but is plainly a
                # host path. Testing for "://" anywhere, a known scheme prefix, or
                # a host-shaped head covers the enumerable set; an earlier attempt
                # that tested only scheme prefixes misfiled exactly that git key.
                #
                # Anything else — a future lockfileVersion spelling versions
                # `v1.2.3`, say — is a format this parser cannot read, and falls
                # through to the pin-back message.
                if (ver ~ /:\/\// \
                    || ver ~ /^(file|link|workspace|portal|git|git\+[a-z]+|https?|ssh):/ \
                    || ver ~ /^[^\/]+\.[^\/]+\//) {
                  if (mode == "entries") print "vendored\t" raw
                  nonregistry++
                  next
                }
                unreadable++
                next

              }

              END {
                flush()
                if (mode == "counts")   print nonregistry + 0, unreadable + 0
                if (mode == "declared") print resolutions + 0
              }
            '
          }

          # Emits the pkg@versions present in the head image of the lockfile but
          # not in the base image. Comparing the two images rather than scraping
          # `git diff` added lines is what makes this correct for a version bump:
          # the added line for a bumped package is a brand-new key, but so is a
          # reformatted or re-indented one, and a diff-scraper cannot tell a
          # genuinely new resolution from a line that merely moved.
          #
          # The comparison itself is preflight::new_lines_since_base, the comparator
          # pre-commit and the package-lock/yarn parsers above share. What this
          # function adds around that call is pnpm-specific, and stays here because
          # the shared helper deliberately owns only the mechanism: the
          # unchanged-file short-circuit, the head-side triage (pin count, the
          # `counts` probe, the shortfall guard, allow_registry_free), and the
          # classification of a base image that contributed nothing.
          npm_age::diff_pnpm_lock() {
            local lockfile="$1" base_rev="$2"

            # `base_rev` is preflight::base_rev, the merge base (see verify_base_ref
            # for why the tip is the wrong image); it serves the probe, the read and
            # the unchanged-file short-circuit below alike.

            # Unchanged lockfile: nothing to gate, and parsing both images of a
            # monorepo-scale lockfile to prove it costs real time on every PR.
            # `git diff` compares blobs and applies the same clean filters the
            # checkout did, so this agrees with the parse it skips.
            #
            # The ls-files guard is load-bearing: `git diff <rev> -- <path>`
            # ignores untracked paths, so an untracked or gitignored lockfile —
            # one generated by an earlier job step, say — reports "no change" and
            # would short-circuit to a pass without the file ever being read.
            # That is a silent pass, which is the whole thing this parser exists
            # to stop. Untracked falls through to the full comparison instead,
            # where an absent base image promotes every entry.
            if git ls-files --error-unmatch "$lockfile" >/dev/null 2>&1 \
               && git diff --quiet "$base_rev" -- "$lockfile" 2>/dev/null; then
              return 0
            fi

            # Checked like every other call here. `set -e` does NOT cover this:
            # main runs the function as `new_deps=$(...) || parse_rc=$?`, and
            # errexit is suppressed for the whole body of a command on the left of
            # a `||`. Unchecked, an awk failure (mawk out of memory on a monorepo
            # lockfile is the realistic one) leaves head_entries empty, the counts
            # probe re-runs the same failing awk and also comes back empty, and
            # the run reports "lockfileVersion is not one this check understands"
            # — sending the operator to pin back a release over an OOM.
            local head_entries
            head_entries=$(npm_age::parse_pnpm_lock < "$lockfile") \
              || { echo "::error file=${lockfile}::could not read ${lockfile}; the parser itself failed" >&2; return 1; }

            # How many PINS — bare and offregistry records, what main can
            # age-check — the head declares. `vendored` records are keys naming a
            # source rather than a version, carried so a vendored ARRIVAL is
            # reported instead of vanishing from both sides of the difference.
            # Every "is there anything to gate" decision below reads this count:
            # judged on the whole stream, a fully vendored lockfile would look
            # non-empty here and skip the registry-free classification it needs.
            # `grep -c` prints a count and exits 1 when that count is 0, so a
            # printed "0" is the one non-zero status accepted. Anything else — the
            # kind helper failing, a read error — is a real failure and must not
            # be laundered into "no pins", which would route a lockfile full of
            # pins into the zero-pin triage.
            local pins_n
            pins_n=$(printf '%s\n' "$head_entries" | npm_age::records_not_of_kind vendored | grep -c .) \
              || [ "${pins_n:-}" = 0 ] \
              || { echo "::error file=${lockfile}::could not count the pins in ${lockfile}" >&2; return 1; }

            # Probed unconditionally: the declared-count check further down
            # reports `unreadable` beside its own counts on the path where pins
            # DID parse, which is the path it exists for. One more awk pass over
            # the head image, only on a lockfile that actually changed — the
            # unchanged-file short-circuit above still returns before any of this.
            # Checked for the same reason head_entries is: errexit is suppressed
            # for this whole function. Unchecked, a failing awk yields an empty
            # count, falls past the zero-pin branch to the `resolution:` grep, and
            # reports a format this check cannot understand — the misdiagnosis
            # `counts` exists to prevent, reached by a different door.
            # Explicit IFS: the script sets IFS=$'\n\t' globally, so a bare `read`
            # would not split this pair on its space.
            local counts nonregistry unreadable
            counts=$(npm_age::parse_pnpm_lock counts < "$lockfile") \
              || { echo "::error file=${lockfile}::could not count entries in ${lockfile}; the parser itself failed" >&2; return 1; }
            IFS=' ' read -r nonregistry unreadable <<< "$counts"
            # Two non-negative integers, or fail closed. Every guard below is an
            # arithmetic test; on an empty or short pair those tests error and
            # read FALSE, which would sail a lockfile past the unreadable and
            # zero-pin checks at once — fail-open in exactly the "the parser
            # misbehaved" case they exist for. Unreachable while the awk prints
            # its `+ 0` fields, which is the point of checking it here.
            case "${nonregistry:-x}${unreadable:-x}" in
              *[!0-9]*)
                echo "::error file=${lockfile}::could not count entries in ${lockfile}; the parser returned '${counts}'" >&2
                return 1
                ;;
            esac

            # Two of the zero-pin outcomes need no base image, and are decided
            # before one is fetched: an unreadable format, and a lockfile with no
            # vendored entries either — which is wholly unparsed or genuinely
            # dependency-free. Deciding them first keeps a 10 MB+ base blob from
            # being fetched and parsed for a run that fails a few lines later, and
            # keeps a base-side failure from preempting the HEAD diagnosis: a
            # `git show` failure or a base parse failure would otherwise return
            # first and point the operator at the base image when the actionable
            # fact is the head format.
            #
            # Unreadable wins, deliberately. The unreadable and vendored branches
            # offer opposite remedies — pin back and tell the maintainers, versus
            # set allow_registry_free, which turns the gate OFF for this repo
            # permanently. A format whose keys still split but spell versions
            # differently would otherwise land on the second one, and the
            # operator would disable the check to clear a red build.
            if [ "$pins_n" -eq 0 ] && [ "$unreadable" -gt 0 ]; then
              echo "::error file=${lockfile}::${lockfile} has ${unreadable} package key(s) whose version this check could not read — its lockfileVersion is not one this check understands, so nothing was verified. Until this check is taught the new format, pin your caller to the previous ops-routines-workflows release SHA and tell the ops-routines maintainers." >&2
              return 1
            fi
            if [ "$pins_n" -eq 0 ] && [ "$nonregistry" -eq 0 ]; then
              # `resolution:` is the one key pnpm has kept on every entry from v5
              # through v9, so it survives the section rename that would defeat the
              # parser. Its presence means the file demonstrably has packages we
              # failed to read: verify nothing, fail closed. No knob covers this
              # one, and the sibling error correctly steers operators away from
              # age-check-bypass — so the message has to name the remediation that
              # does exist, or it fails a required check while forbidding every
              # escape it mentions.
              if grep -qE '^[[:space:]]+resolution:' "$lockfile"; then
                echo "::error file=${lockfile}::${lockfile} declares resolved packages but no package key could be parsed — its lockfileVersion is not one this check understands, so nothing was verified. Until this check is taught the new format, pin your caller to the previous ops-routines-workflows release SHA and tell the ops-routines maintainers." >&2
                return 1
              fi
              # No resolution entries at all: a genuinely dependency-free lockfile.
              # Nothing to gate, and nothing wrong.
              echo "::warning file=${lockfile}::${lockfile} declares no resolved dependencies — nothing to age-check for this file" >&2
              return 0
            fi

            # The zero-pin triage above is all-or-nothing, and a format that
            # respelled most keys while leaving one recognisable would sail past it
            # and render "Verified 1 package(s)": a green check asserting coverage
            # it does not have. So account for every entry the file declares, not
            # merely for one — the shared check every extractor answers to, run
            # HERE rather than in changed_pins because this function does not call
            # changed_pins, and on both paths: a lockfile whose only readable keys
            # are vendored ones is the same partial parse, and used to reach the
            # allow_registry_free pass below with no diagnosis at all. Needs no
            # base image, which is why it sits above the fetch. The `unreadable`
            # keys are deliberately NOT accounted for, so they surface here
            # instead of being silently dropped on the path where other entries
            # parsed; the count rides along as the message's detail.
            printf '%s\n' "$head_entries" \
              | npm_age::records_cover_declared "$lockfile" npm_age::parse_pnpm_lock "${unreadable} unreadable" \
              || return $?

            # The remaining zero-pin outcome: vendored entries only. Decided here,
            # BEFORE the base image is fetched, because the failing answer (rc 3)
            # never needs it — only the allow_registry_free pass does, for the
            # arrivals it reports under rc 4, and that pass falls through to the
            # same base fetch and the same trailing difference every other pass
            # takes. Every record on this path is a vendored one, so that
            # difference is exactly the arrivals list.
            local rc=0
            if [ "$pins_n" -eq 0 ]; then
              # Unlike the unreadable-format branch above — a bug in this check
              # that someone can fix — a repo that genuinely vendors everything
              # through git deps would hit this on every PR that touches the
              # lockfile. There is no per-repo opt-out for that today, and
              # age-check-bypass is not one: it is reserved for verified-CVE
              # overrides, so recommending it for a permanent, benign repo
              # shape would erode the signal wherever the label is audited.
              # Say what is true instead of offering the wrong escape hatch.
              # Explicit truthy match, not `-n`: this variable's only job is to
              # weaken a supply-chain control, and `=false` or `=0` turning it ON
              # is a footgun for a local run or a future template edit. The
              # workflow expression yields '' for false, so the supported path is
              # unaffected either way.
              # Spelling lives in npm_age::registry_free_allowed, shared with the
              # whole-run guard in main so the two cannot drift.
              if npm_age::registry_free_allowed; then
                echo "::warning file=${lockfile}::${lockfile} resolves ${nonregistry} package(s), none of them from a registry — nothing in this file was age-checked. Passing because allow_registry_free is set." >&2
                rc=4
              else
                echo "::error file=${lockfile}::${lockfile} resolves ${nonregistry} package(s), none of them from the public npm registry (git, tarball, link:, file:, workspace: or portal: sources — or, in a v5 lockfile, keys qualified with a private registry host) — nothing could be age-checked. If that is this repo's permanent shape, pass allow_registry_free: true to the reusable workflow; age-check-bypass is for verified-CVE overrides only (runbooks/phase-0-checklist.md) and should not be applied every PR." >&2
                return 3
              fi
            fi

            # The comparison — through the shared helper, which reads and parses
            # the base image itself. It used to be read only once the
            # head had something to gate, which meant the allow_registry_free pass
            # returned without it — and so could not report a vendored arrival on
            # exactly the repo shape most likely to vendor something; now every
            # pass that reaches this point takes the same difference, and vendored
            # records ride it, so only one that ARRIVED on this branch is emitted.
            # Each image is parsed ONCE. The head was parsed above, for the triage
            # the shared mechanism deliberately knows nothing about, so the helper
            # is handed those lines ($scratch/head) instead of running the parser
            # on the lockfile again; and it leaves both the base image
            # ($scratch/base, for the `resolution:` probe) and the lines it parsed
            # from it ($scratch/base-lines) for the classification below, which
            # used to re-parse the image to get them. Its exit codes propagate
            # unchanged: rc 2 is a base image that could not be read or parsed,
            # rc 1 a head it could not take — both already announced on stderr,
            # and both rendered by main as their own row.
            #
            # Checked mktemp: errexit is suppressed for this whole function, so an
            # unchecked one would hand the helper empty paths, which it reads as
            # "not given". rc 2 on purpose: the base image could not be obtained,
            # and main renders rc 1 as a head-lockfile parse failure, which this
            # is not. The head write is checked for the opposite reason: a short
            # file (a TMPDIR that filled up) would be a short head set, fewer pins
            # aged, green build — and that one IS the head side, so rc 1.
            local scratch new_entries
            scratch=$(mktemp -d) \
              || { echo "::error::could not create a temporary directory for scratch space" >&2; return 2; }
            # shellcheck disable=SC2064
            trap "rm -rf \"$scratch\"" RETURN
            local base_blob="${scratch}/base" base_lines="${scratch}/base-lines" head_lines="${scratch}/head"
            printf '%s\n' "$head_entries" > "$head_lines" \
              || { echo "::error file=${lockfile}::could not write the parsed entries of ${lockfile} to scratch space; refusing to report an empty work-list" >&2; return 1; }
            new_entries=$(preflight::new_lines_since_base "$lockfile" "$base_rev" npm_age::parse_pnpm_lock "$base_blob" "$base_lines" "$head_lines") \
              || return $?

            # Classify the base side from the image the helper left behind, then
            # report once. The promotion warning used to live inside the existence
            # branch, so it never fired for an ABSENT base image — which is the
            # case that most often causes the promotion: a lockfile this branch
            # adds, an untracked one (the ls-files guard above deliberately routes
            # those here), or a working_directory that does not match where the
            # lockfile lives. Existence is probed the way the helper probes it
            # (`rev-parse --verify`, tree-only): a zero-byte base image is a real
            # image that classifies as `empty`, which `-s` on the blob would
            # misfile as `absent`.
            #
            # The helper parsed this image, failed closed if it could not, and
            # wrote the lines to $base_lines — so the read below fails only if that
            # file went missing in between. Still checked, and still rc 2, because
            # the alternative is an empty capture falling through to `unreadable`
            # and a promotion warning whose remedy ("re-running will not help") is
            # exactly wrong for a scratch-space fault. The stream then answers
            # every question the classifier has:
            # pins present is `ok`; no pins but vendored records is `vendored` —
            # read fine, everything resolves through git/tarball/link, the
            # ordinary case of a repo migrating OFF vendored dependencies, and
            # without this arm the `resolution:` probe claims the image is
            # unreadable.
            local base_entries="" base_state=absent
            if git rev-parse --verify --quiet "${base_rev}:./${lockfile}" >/dev/null 2>&1; then
              # `-r` first for the reason given at the helper's own read-back.
              { [ -r "$base_lines" ] && base_entries=$(< "$base_lines"); } \
                || { echo "::error file=${lockfile}::could not read back the parsed base image of ${lockfile}; cannot determine which entries this branch introduces" >&2; return 2; }
              # Counted, not probed with `grep -q`: a reader that exits on the first
              # match leaves the upstream grep writing into a closed pipe once the
              # base has more pins than a pipe buffer holds (~2,600), it dies of
              # SIGPIPE, the helper reports failure, and under pipefail the whole
              # test reads false — filing a monorepo base as `vendored` and warning
              # that its entire lockfile is being promoted. `grep -c` drains.
              local base_pins_n
              base_pins_n=$(printf '%s\n' "$base_entries" | npm_age::records_not_of_kind vendored | grep -c .) \
                || [ "${base_pins_n:-}" = 0 ] \
                || { echo "::error file=${lockfile}::could not count the pins in the base image of ${lockfile}" >&2; return 2; }
              if [ "$base_pins_n" -gt 0 ]; then
                base_state=ok
              elif [ -n "$base_entries" ]; then
                base_state=vendored
              elif grep -qE '^[[:space:]]+resolution:' "$base_blob"; then
                base_state=unreadable
              else
                base_state=empty
              fi
            fi

            # Every state but `ok` means the difference is taken against an empty
            # base set, so the WHOLE head lockfile is promoted to "newly added" —
            # the entire transitive tree, each pin paying `sleep 0.2` and a
            # registry round trip. On a real tree that is a job timeout, and a
            # timeout reads as flake, so each case says whether re-running helps.
            # Counted in PINS, because that is what pays for a round trip; a
            # vendored record costs nothing here — so on the rc-4 path, which has
            # none, there is nothing to warn about.
            if [ "$base_state" != ok ] && [ "$pins_n" -gt 0 ]; then
              local promo="all ${pins_n} entries in ${lockfile} are being treated as newly added, which at this size can exhaust the job timeout"
              case "$base_state" in
                absent)
                  echo "::warning file=${lockfile}::${lockfile} has no image at the merge base — ${promo}, and a timeout will read as flake rather than as this. Expected for a lockfile this branch adds; if instead the file is untracked or working_directory does not match where it lives, that is the thing to fix." >&2
                  ;;
                vendored)
                  echo "::warning file=${lockfile}::the base image of ${lockfile} resolves nothing from a registry — ${promo}. Expected for a repo moving off vendored dependencies; nothing is wrong with the base image." >&2
                  ;;
                unreadable)
                  echo "::warning file=${lockfile}::the base image of ${lockfile} declares resolved packages this check could not read — ${promo}. Re-running will not help." >&2
                  ;;
                empty)
                  echo "::warning file=${lockfile}::the base image of ${lockfile} had no resolved dependencies — ${promo}. Expected for a project adding its first ones." >&2
                  ;;
              esac
            fi

            # The work-list the helper computed above. Guarded: a bare printf of an
            # empty result would put a blank line on the work-list channel. `rc` is
            # 4 on the allow_registry_free pass and 0 otherwise.
            [ -n "$new_entries" ] && printf '%s\n' "$new_entries"
            return "$rc"
          }
          OPS_ROUTINES_AGE_CHECK_LIB
          cat > "${RUNNER_TEMP}/ops-routines-lib/age-check-npm.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #!/usr/bin/env bash
          # ============================================================================
          # age-check-npm.sh - Block newly published npm dependencies (supply chain)
          # ============================================================================
          #
          # Purpose:
          #   Compares the lockfile against origin/$BASE_REF and fails closed if any
          #   pkg@version this branch would newly ship — whether freshly ADDED or a
          #   BUMP of a package that was already there — was published less than
          #   MIN_AGE_DAYS ago, or if the registry is unreachable.
          #
          # Expected env vars:
          #   MIN_AGE_DAYS   - default 7
          #   BASE_REF       - default 'main'
          #   LOCKFILE_PATH  - default 'package-lock.json' (also inspects
          #                    pnpm-lock.yaml and yarn.lock if detected)
          #   MAX_PINS       - default 350; refuse a work-list larger than this
          #                    rather than time the job out mid-scan. Sized against
          #                    the whole JOB budget (see TIMEOUT_MINUTES), not the
          #                    scan alone — checkout, token mint and setup come out
          #                    of the same allowance.
          #   AGE_CHECK_REGISTRY_URL - set by the reusable workflow from its
          #                    `registry_url` input; default
          #                    https://registry.npmjs.org. Names the ONE registry
          #                    whose publish dates this check reads, which makes it
          #                    two things at once: the host a lockfile entry must
          #                    resolve to before it is age-checked, and the
          #                    packument URL used to age it. An entry resolving
          #                    anywhere else is skipped as "not on the configured
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/age-check-npm.sh (part 2 of 4)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/age-check-npm.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
          #                    registry" — visibly, and without a request — rather
          #                    than looked up on npmjs, which is how a private
          #                    package used to be aged against a public homonym's
          #                    publish date. A reusable workflow does not inherit
          #                    env from its caller, so this needs an input on BOTH
          #                    entry points to be reachable; both are
          #                    machine-checked by tests/workflow_lint_test.sh.
          #   TIMEOUT_MINUTES - default 5; the job timeout the caller set, used
          #                    only to sanity-check MAX_PINS against it. The scan
          #                    runs at ~130 pins/minute, so a workable cap is about
          #                    130 * (TIMEOUT_MINUTES - 1), reserving ~1 minute for
          #                    setup. The 350/5 default pair sits under that
          #                    deliberately. The timeout itself is enforced by the
          #                    workflow, not here.
          #
          # The diff_* parsers use a richer set among themselves, so `main` can
          # tell the operator which thing broke:
          #   0 - work-list on stdout (possibly empty)
          #   1 - the manifest could not be read
          #   2 - the BASE IMAGE could not be read or parsed (not a missing merge
          #       base — preflight already resolved it; see the rc 2 branch in
          #       main)
          #   3 - read fine, but it resolves NOTHING from a registry, so there
          #       was nothing to age-check
          #   4 - as 3, but `allow_registry_free` says that is intended. A pass,
          #       reported separately so the run does not render as a verified one
          #       when nothing was verified.
          #   5 - read, but not read WHOLE: the file declares more packages than
          #       the parser accounted for, so what it did verify is not the whole
          #       file. Kept apart from 1 because the operator is looking at a
          #       lockfile that parses. All three parsers: the check is
          #       npm_age::records_cover_declared, reached through
          #       npm_age::changed_pins by package-lock and yarn and called by
          #       diff_pnpm_lock directly. 3 and 4 stay pnpm-only — package-lock
          #       and yarn return 0, 1, 2 and 5.
          #
          # Exit codes:
          #   0 - every added or bumped dependency is >= MIN_AGE_DAYS old
          #   1 - at least one dependency is too young or its age can't be verified
          #
          # Layout: the lockfile parsers — the code deciding WHICH pins get
          # age-checked — live in lib/_npm-lockfile-parsers.sh, sourced below. This
          # file keeps policy: thresholds, the registry fetch, the work-list budget,
          # and the summary / PR-comment reporting. Function names below that start
          # `npm_age::` and are not defined here are defined there.
          #
          # Known limitations (documented so future maintainers don't re-derive):
          # - npm aliases ARE resolved: package-lock.json entries carry
          #   `.value.name` (believed only when `.resolved` corroborates it), and
          #   yarn `alias@npm:target@range` headers resolve to the target. What is
          #   still not handled is an alias whose target is not a registry release
          #   — `pkg@npm:other@github:user/repo` — which the protocol allowlist
          #   drops rather than mis-attributing. Packages nested under a non-root
          #   `node_modules` (a transitive dep pinned to a different version than
          #   the hoisted one) ARE handled: the package name is the path segment
          #   after the LAST `node_modules/`.
          # - Mixed public/private lockfiles: if a lockfile has 1 public package
          #   and 99 private packages, only the 1 public package is age-checked.
          #   The all-skipped-count guard below catches the fully-private case,
          #   but a partially-public lockfile can pass as long as its public
          #   packages clear the threshold. Acceptable given the alternative
          #   (refusing to gate any mixed-registry lockfile) is strictly worse.
          #   This limitation carries more weight now that BUMPS enter the
          #   work-list: a partially-private lockfile reaches the 404 skip path far
          #   more often than when only newly-ADDED packages were checked, and a
          #   change touching only private pins reaches the all-skipped guard and
          #   fails. That failure is correct (nothing could be verified) but it is
          #   newly common, so the guard names the cause — and, since the registry
          #   is now read from the resolution, points at `registry_url` rather than
          #   at a bypass. A wholly-private lockfile CAN be gated now, by naming
          #   that registry; what cannot be gated is one whose registry this runner
          #   cannot reach.
          # - Entries the package-lock `.resolved` filter DROPS are invisible,
          #   not skipped, and the yarn protocol allowlist drops `github:`,
          #   `patch:` and friends the same way. A pin with `git+ssh://`, plain
          #   `http://`, or no `.resolved` at all never enters the work-list, so
          #   it counts toward neither checked_count nor skipped_count; a change
          #   that moves only such pins prints "No new dependencies" and the
          #   footer rendered "Verified 0 package(s) :white_check_mark:" — a green
          #   tick on a change verified in no way at all. ALL THREE parsers now
          #   emit a `vendored` record for every key naming a source (see the
          #   RECORD GRAMMAR in lib/_npm-lockfile-parsers.sh); the record rides
          #   the same base/head difference as a pin, so one that ARRIVED on the
          #   branch renders as a `::notice` on the lockfile and an
          #   `:information_source:` row.
          #
          #   The record is visibility; the guard in main decides what it MEANS.
          #   When checked_count is 0 and an arrival exists, the run FAILS: a
          #   vendored pin has no publish date, so nothing could be age-checked,
          #   and certifying that as a pass is the conflation this check exists to
          #   remove. `allow_registry_free` turns it back into a warning for a repo
          #   that vendors permanently. It still never touches skipped_count —
          #   feeding the all-skipped guard would produce a worse-worded failure
          #   for the same condition.
          #
          #   Deliberately narrow in both directions: it needs checked_count to be
          #   0, so a change that also moves a registry pin passes on that pin
          #   with the arrival named beside it; and it needs an arrival, so a
          #   change touching no dependency stays a quiet pass. What remains
          #   dropped in silence is an entry with NO `.resolved` at all, which npm
          #   writes for nested dependencies of ordinary registry packages.
          # - WHICH REGISTRY a pin came from is decided from its RESOLUTION, never
          #   from its key, and only pins on AGE_CHECK_REGISTRY_URL are aged. This
          #   used to be a prefix test for `https://`, which a private registry
          #   clears exactly as readily as npmjs — so a pin fetched from a mirror
          #   or a private host was looked up by NAME on npmjs, and an unrelated
          #   public package published years ago rendered a green row for a tarball
          #   that never came from there. For a freshly published internal package
          #   sharing a name with a public one, that inverted the control outright.
          #   Now: a package-lock pin is matched on the host of its `resolved` URL;
          #   a pnpm entry on `resolution: {tarball: ...}`, or — for the
          #   integrity-only entries that are the common case, which name no host
          #   at all — on the default and per-scope registries read from .npmrc.
          #   Anything resolving elsewhere is emitted TAGGED and reported as
          #   "skipped (not on the configured registry)", so it is visible rather
          #   than silently dropped, and no request is made for it. A TAG
          #   ANNOTATES; IT DOES NOT BLOCK. A brand-new dependency pointed at an
          #   unknown host is skipped, and the run still goes green as long as some
          #   other pin verified — only a run that verified NOTHING fails. That is
          #   the same property the 404-skip it replaces had, so it is not a
          #   regression, but it is the sharpest edge left in this control. A repo on a
          #   private registry points registry_url at it and gets a real gate; the
          #   host comparison is what the "trusted-mirror-host input" this bullet
          #   used to call for turned into.
          #   REGISTRY_URL IS SINGLE-VALUED, AND THAT IS A TRADE. Naming a private
          #   registry removes the gate from everything resolving elsewhere —
          #   INCLUDING npmjs. A mixed package-lock monorepo (public deps on
          #   npmjs, `@acme/*` internal) is today gated on the public half and
          #   falsely gated on the private half; after adopting registry_url it is
          #   gated on the private half while its public dependencies are tagged
          #   and skipped, which is the half where a compromised release is
          #   likelier to arrive. The skips are visible and counted rather than
          #   silent, and the run still fails if NOTHING verified, but coverage is
          #   what this check exists to provide and it MOVES rather than only
          #   improving. Gating against a SET of registries — or always
          #   additionally checking npmjs-resolved pins against npmjs, whose
          #   packument URL is known unconditionally — is the real answer; tracked
          #   separately.
          #   Two edges worth knowing. One host serving SEVERAL independent npm
          #   namespaces (Artifactory-style npm-internal vs npm-remote) reads as
          #   one registry, because only the host is compared — far narrower than
          #   the public/private conflation it replaces. NO CREDENTIALS ARE SENT
          #   either: the packument fetch is anonymous, so a registry_url naming a
          #   registry that requires a token for reads answers 401/403 for every
          #   pin — reported as "requires authentication" and failing closed,
          #   distinctly from an outage, but it means this input only helps a
          #   registry serving packuments unauthenticated. A token secret is
          #   tracked separately. And publish dates come from whatever
          #   registry_url names, including a caching PROXY: most pass the
          #   upstream `time` map through unchanged, but one that stamps its own
          #   first-fetch time makes min_age_days measure the age of the cache
          #   entry rather than of the release. And a .npmrc that sets its
          #   registry from an environment variable (`registry=${NPM_REGISTRY}`) is
          #   read literally, matches no host, and so reports its entries
          #   off-registry rather than aging them against the wrong place:
          #   fail-closed and visible, but such a repo has to pass registry_url.
          #   .yarnrc.yml is read line-structurally, not with a YAML parser, so a
          #   FLOW-style `npmScopes: {acme: {...}}` (valid YAML that yarn reads)
          #   is reported unreadable rather than dropped — dropped, the scope
          #   override vanishes and its packages fall back to the default
          #   registry, which is fail-OPEN and invisible. An inline `# comment` on
          #   a registry line IS handled, because that file is hand-written far
          #   more often than a lockfile is. A value Berry would INTERPOLATE
          #   (`${VAR}`, `${VAR:-fallback}`) is likewise unreadable: it names an
          #   environment variable, and read literally the fallback form reduces
          #   to the fallback's host — usually public npm — which is fail-OPEN.
          #   Percent-encoding in a URL's USERINFO is legal and left alone
          #   (`svc%40corp:tok@host` is how a credentialed private registry is
          #   written); only an encoded authority DELIMITER can mislead the host
          #   cut, and that only on the `__archiveUrl` path, which is decoded
          #   exactly once — as yarn does — before the cut.
          #   Unreadable values follow the tools' own precedence: a value that
          #   cannot be used for ONE named key (`?unreadable`) is overridden by a
          #   nearer file exactly as a readable one would be, so a stray root
          #   `registry=//host/` under a good `apps/web/.npmrc` is not a red run.
          #   The one exception is an inline `npmScopes: {...}`
          #   (`?unreadable-scopes`), which poisons the DEFAULT as a proxy for
          #   scopes that cannot be enumerated — a nearer readable default does
          #   not make them visible, so that one survives the chain.
          #   Every .npmrc from the working directory down to the lockfile is read,
          #   nearest winning; npm also merges a per-user and a global one, which a
          #   CI checkout does not have.
          #   THE CONSEQUENCE IS THAT THIS FIX IS OPT-IN WHERE THE REGISTRY IS NOT
          #   COMMITTED. A repo whose private registry is configured only in CI —
          #   `actions/setup-node` with `registry-url`, NPM_CONFIG_REGISTRY, or a
          #   runner-level ~/.npmrc — has integrity-only entries and no committed
          #   evidence, so they are read as the configured registry and aged
          #   against npmjs exactly as before. That repo stays green AND stays
          #   wrong until its caller passes registry_url. It is the one shape this
          #   change does not fix by itself, and the one an operator most needs
          #   told. .npmrc is the wrong
          #   file for yarn BERRY, which reads `npmRegistryServer` /
          #   `npmScopes.<scope>.npmRegistryServer` from .yarnrc.yml — pointing
          #   npm_age::npmrc_registries at a Berry repo would judge its pins
          #   against a registry Berry never used. So Berry has its OWN reader,
          #   npm_age::yarnrc_registries, folded into a SEPARATE pair
          #   (NPM_AGE_YARN_DEFAULT_HOST / NPM_AGE_YARN_SCOPE_MAP) that only the
          #   yarn extractor reads. Both files are walked over the same directory
          #   chain, in two loops rather than one: a directory may hold either,
          #   both or neither, and a `continue` for a missing .npmrc must not skip
          #   a .yarnrc.yml beside it. The CI-only caveat above applies unchanged
          #   to Berry — YARN_NPM_REGISTRY_SERVER in the environment is evidence
          #   this check cannot see either.
          # - yarn.lock is filtered for BOTH v1 and Berry, on different evidence,
          #   because the two formats state different things. npm_age::yarn_pins
          #   reads each v1 block's `resolved "<url>"` and folds the host the same
          #   way npm_age::registry_host does. BERRY (yarn v2+) writes
          #   `resolution:` and `checksum` and no `resolved` URL, and a
          #   `resolution:` is a DESCRIPTOR (`lodash@npm:4.17.21`), not a
          #   location — it names no host, with ONE exception below. So a Berry
          #   block is the yarn analogue of a pnpm integrity-only entry: its
          #   registry comes from .yarnrc.yml (see the bullet above), reached
          #   through berry_host().
          #   THE EXCEPTION IS `::__archiveUrl=<encoded>`, which Berry hardcodes
          #   into the resolution when the registry does not use the conventional
          #   `/<name>/-/<name>-<ver>.tgz` tarball path — AWS CodeArtifact, Nexus
          #   and multi-registry setups all produce it, i.e. exactly this
          #   feature's target population. It names the host outright, so it is
          #   recorded as the block host and BEATS .yarnrc.yml. Read as a plain
          #   `npm:` resolution instead, such an entry would fall back to the
          #   configured registry and be aged against a public homonym — the false
          #   pass this path closes, reached through the one resolution form that
          #   does carry a location. It is percent-encoded, so the userinfo
          #   impersonation `registry.npmjs.org%40attacker.example` only appears
          #   after decoding; both it and the v1 `resolved` rule now derive hosts
          #   through one url_host(), so that strip cannot be applied to one and
          #   missed by the other.
          #   With no .yarnrc.yml that value IS the configured registry, so Berry
          #   entries stay untagged and adopting this still cannot flip a Berry
          #   repo green -> red.
          #   `__archiveUrl` BEATS .yarnrc.yml where the two disagree, which is the
          #   one place in this file that resolves conflicting evidence instead of
          #   refusing it. Deliberate: `__archiveUrl` is not a claim about the
          #   fetch, it IS the fetch, so an entry naming npmjs while .yarnrc.yml
          #   calls the scope private really is installed from npmjs and aging it
          #   there describes the artifact that lands. Refusing the pair would tag
          #   honest per-package overrides, and the attack it would notionally stop
          #   does not work — redirecting `__archiveUrl` at the public registry
          #   fetches the PUBLIC package, not the freshly published private one.
          #   That argument is HOST-level only, as is every comparison here: the
          #   URL's path is not checked against the entry's name and version, so
          #   an `__archiveUrl` on the configured host naming a different tarball
          #   is aged as the entry it sits under. Not new — v1 `resolved` has
          #   always been matched on host alone — and not something the checksum
          #   or this precedence closes.
          #   A `resolution:` line is also CONFIRMED, not merely counted as a
          #   Berry marker: header and resolution are separate strings and yarn
          #   installs from the RESOLUTION, so an npm-shaped header over a
          #   `patch:`/`workspace:`/tarball resolution is tagged instead of aged.
          #   That matters more now than it did as a pure exemption, because a
          #   Berry block now receives a POSITIVE verdict rather than a pass.
          #   Note the scope of that word: block_berry is set by any of
          #   `resolution:`, `checksum:`, `languageName:` or `linkType:`, but only
          #   a `resolution:` line is confirmed — a block carrying just
          #   `checksum:` is Berry-exempt without its protocol ever being read.
          #   Berry requires `resolution:`, so such a lockfile would not install;
          #   this is the "any per-block marker is forgeable in principle"
          #   residual below, not a second hole, but "confirmed" describes the
          #   line, not the exemption.
          #   WHAT THIS DOES NOT CLOSE: tagging needs POSITIVE evidence, so a
          #   Berry repo with no .yarnrc.yml — or one naming no
          #   `npmRegistryServer` — still has its entries aged against
          #   registry_url and keeps the homonym false pass if it installs
          #   elsewhere. Deliberate: Berry defaults to registry.yarnpkg.com (a
          #   public-npm alias, folded in npm_age::registry_host), and tagging on
          #   the ABSENCE of configuration is a rollout decision, not a parser
          #   one. It also means a fork PR can reach untagged by DELETING
          #   .yarnrc.yml — visible in review, and the same door .npmrc already
          #   leaves open for pnpm. Note where that door leads: untagged means
          #   aged against registry_url, so with a private registry_url the
          #   deleted entry is still judged on the private registry, and with the
          #   public default the scoped packages it uncovers were being SKIPPED
          #   (tagged) before, not gated. What IS done about the absence: when
          #   registry_url names a private registry and a Berry lockfile has no
          #   .yarnrc.yml naming a default npmRegistryServer, the input and the
          #   committed yarn configuration disagree about where packages come
          #   from, and npm_age::load_registry_config says so with a `::notice`
          #   naming YARN_NPM_REGISTRY_SERVER as the likely reason. A notice, not
          #   a failure — the aging is still against the registry the caller
          #   named — and nothing at all against the public registry_url, where
          #   Berry's default and the input agree. It is a FILE-level fact standing
          #   in for a per-entry one, and that has one known false-alarm shape: a
          #   .yarnrc.yml whose `npmScopes` rules cover every package the repo
          #   installs, or a lockfile whose every resolution carries
          #   `::__archiveUrl=`, is judged entirely on evidence yet still draws
          #   the notice on every run, because load_registry_config runs before
          #   extraction and cannot see that nothing fell through to the default.
          #   The wording scopes its claim to the entries that DO fall through, so
          #   it is vacuous there rather than wrong; the only way to clear it is a
          #   default `npmRegistryServer` the repo does not otherwise need, and
          #   committing the registry Berry would use anyway is harmless. Expected
          #   in that shape, not a bug. The same holds one directory up: the walk
          #   starts at the working directory and never climbs above it (see
          #   load_registry_config), while Berry itself keeps reading .yarnrc.yml
          #   up to the filesystem root — so a nested project run with
          #   `working_directory: services/api` and its .yarnrc.yml at the checkout
          #   root draws the notice too. Berry's `npmPublishRegistry` is
          #   deliberately not read: it is where packages are pushed, not fetched.
          #   Two details of the v1 path worth knowing:
          #   a `resolved` is read only at EXACTLY two spaces, the block's direct
          #   child, because `resolved` is a legal package name and a tarball URL
          #   a legal range — so a `dependencies:` entry four spaces down is a
          #   well-formed forgery of the real host (same class as the block-scalar
          #   hole in npm_age::parse_pnpm_lock). The DEFAULT for a block that
          #   yields a pin without a readable host is TAGGED, not untagged: a real
          #   yarn v1 block always carries a `resolved`, so its absence means the
          #   parser never read where the package came from, and aging it against
          #   the configured registry would assert something the lockfile never
          #   said. That arm is what catches the layouts the rules do not match —
          #   yarn v1 accepts `resolved`, `"resolved"`, `resolved:` and
          #   `"resolved":` for the same key AND decodes escapes in keys, so no
          #   literal match is ever complete; a git conflict marker also ends the
          #   block at column 0 before either side's URL is reached. Berry is
          #   exempt per BLOCK, keyed on `resolution:`, `checksum:`,
          #   `languageName:` or `linkType:` at the direct-child indent — all keys
          #   yarn v1 NEVER writes. That restriction is the point: block_berry is
          #   the OFF-SWITCH for the fail-closed default, so a marker v1 also
          #   writes is not a format signal but a bypass. A colon-form `version:`
          #   was tried as a marker and withdrawn for exactly that reason (v1
          #   accepts it too, and the extractor carries `:?` for it); a file-level
          #   flag likewise, since one stray line dropped into a v1 lockfile — v1
          #   ignores unknown keys — would re-exempt every entry in it.
          #   Residual: because v1 ignores unknown keys, ANY per-block marker is
          #   forgeable in principle. A block that both spells `resolved` in a way
          #   the rules miss AND carries a forged Berry key is exempted and aged
          #   against the configured registry. Narrowing the markers to keys v1
          #   never writes makes that an obviously alien line rather than one the
          #   block plausibly needs — a large reduction, not a proof. And a block naming TWO different
          #   hosts is tagged rather than aged against either, since whichever
          #   yarn would install from is unknowable here and picking first or last
          #   is a false pass under the opposite ordering.
          #   A BERRY entry, naming no host, is judged on .yarnrc.yml — and on
          #   nothing at all it is emitted untagged (and, under a private
          #   registry_url, noticed — see above), so adopting this cannot flip
          #   a Berry repo from green to red. That exemption does NOT
          #   extend to a v1 block whose `resolved` named no host — a relative or
          #   non-URL value — which is tagged like any other unreadable origin; a
          #   v1 lockfile written entirely that way therefore fails the
          #   all-skipped guard, and that is intended fail-closed behaviour rather
          #   than an oversight. The test is whether a SCHEME was present,
          #   not whether it was https: a pin resolved over plain `http://` from
          #   an internal host is the same false pass one scheme over, and is
          #   tagged.
          # - The work-list is keyed on `pkg@version`, so a change that alters
          #   WHERE a pin comes from without moving its version — `resolved`
          #   swapping registry host, or `integrity` changing under a fixed
          #   version — produces an identical pin and is invisible to the
          #   comparison. The old key-line scrape missed it too; noted because
          #   "every pkg@version this branch would newly ship" reads stronger than
          #   what is actually gated.
          # - The package-lock.json and yarn.lock work-lists are built by
          #   comparing the base and head images of the lockfile. Scraping added
          #   (`+`) diff lines — what both used to do — cannot see a version bump
          #   of a package that already exists, because only the block body
          #   changes while the key/header line stays unchanged context. That made
          #   MIN_AGE_DAYS toothless for the most common lockfile change there is;
          #   see the comment on npm_age::changed_pins for the incident.
          # - npm_age::diff_pnpm_lock reads every key spelling pnpm has shipped (v5
          #   `/pkg/1.2.3`, v6 `/pkg@1.2.3`, v9 `pkg@1.2.3`) and diffs the base and
          #   head images rather than scraping `git diff`. (This bullet previously
          #   described the diff-driven v6-only parser; that was replaced, and the
          #   description was left behind by the merge that brought the two
          #   rewrites together.) It reads only the top-level `packages:` map, so a
          #   future lockfileVersion that renamed or restructured that map would
          #   parse as "no packages" — which is why it fails closed when a lockfile
          #   declares resolved packages it cannot parse, rather than returning an
          #   empty work-list in silence. That zero-parse guard is all-or-nothing;
          #   the partial case is the declared-count check in the next bullet,
          #   whose pnpm denominator is the `resolution:` line under every key
          #   (counted once per key, at the exact four-space indent, inside
          #   `packages:` only).
          # - EVERY parser must account for every entry its lockfile declares, or
          #   the run fails with rc 5, reported as a partial parse rather than an
          #   unreadable file because the operator is looking at a lockfile that
          #   parses. Each extractor answers `declared` with its own denominator,
          #   built to under-count: pnpm's `resolution:` lines; package-lock's
          #   non-root `.packages` keys; yarn's block headers. Each leaves out,
          #   by a positive test, what its record stream leaves out on purpose —
          #   for package-lock a `link: true` entry, a workspace member, an entry
          #   with a version and no `resolved`, and a local directory path; for
          #   yarn file metadata, `patch:` wrappers and local directory paths.
          #   What that catches: a pnpm key respelled beside readable ones; a
          #   yarn block whose body `version` cannot be read beside blocks that
          #   can (dropped in silence before, unless every block failed alike); a
          #   package-lock entry installed under node_modules with no `version`
          #   at all, which is what a respelled `version` key looks like; and any
          #   future edit that makes an extractor drop an entry without saying
          #   so. What it does NOT catch: a package-lock whose `resolved` key was
          #   respelled reads as "version, no resolved", the exclusion npm's own
          #   resolved-less entries need, and still passes with an empty
          #   work-list. Closing that would mean failing lockfiles npm really
          #   writes. A package-lock with no `packages` object at all is the
          #   separate, announced lockfileVersion-1 case.
          # - The pnpm parser has not been fuzzed against workspace / overrides
          #   edge cases the way the package-lock.json path has.
          #
          # ============================================================================

          set -euo pipefail
          IFS=$'\n\t'

          MIN_AGE_DAYS="${MIN_AGE_DAYS:-7}"
          BASE_REF="${BASE_REF:-main}"
          LOCKFILE_PATH="${LOCKFILE_PATH:-package-lock.json}"
          # Hard ceiling on the work-list. Each pin costs ~0.45s (a 0.2s rate-limit
          # sleep plus a registry round-trip). A timeout is the worst available
          # failure: it kills the step before ::endgroup::, the summary footer and
          # the failures TSV, leaving a red required check with no row, no comment
          # and no diagnosis — exactly what trains people to reach for
          # `age-check-bypass`. Refusing above the cap converts that into a failure
          # that explains itself.
          #
          # The budget is the JOB, not the scan. At ~0.45s/pin the scan sustains
          # roughly 130 pins per minute of `timeout_minutes` — but the scan is not
          # the only thing in that budget: the credentials pre-check, the App token
          # mint, `actions/checkout` with `fetch-depth: 0` on the consumer repo
          # (which on a large monorepo is not cheap), the ops-routines sparse
          # checkout, and the merge-base/jq/git-show work before the first fetch
          # all come out of it too.
          #
          # At the DEFAULT `timeout_minutes: 5` (300s) the raw scan ceiling is ~650
          # pins, which would leave ~8s for job setup and so is not a usable
          # default. 350 pins is ~158s, leaving ~140s for everything else. Move the
          # two together: raising `max_pins` without `timeout_minutes` buys back
          # exactly the mid-scan timeout this cap exists to prevent.
          # Whether the caller supplied it, so the refusal message can name a lever
          # they actually have. `.github/workflows/age-check-npm.yml` checks this
          # lib out at `ref: main`, decoupled from the revision a consumer pinned
          # their reusable to — so a shim pinned before this change runs the NEW
          # script under an OLD workflow file that has no `max_pins` input. The cap
          # still applies (via this default); telling that reader to "raise
          # max_pins" would name an input their pinned reusable does not expose.
          NPM_AGE_MAX_PINS_FROM_ENV=0
          # `+set`, not `-n`: the question is whether the caller PASSED the input,
          # not whether the value is usable. `max_pins: ${{ vars.NPM_MAX_PINS }}`
          # against an unset variable presents MAX_PINS as present-but-empty — with
          # `-n` that reads as "not passed", and the budget refusal then tells a
          # consumer who is on a current reusable to go update their pinned
          # reusable, which is the one thing that cannot help them.
          [ -n "${MAX_PINS+set}" ] && NPM_AGE_MAX_PINS_FROM_ENV=1
          MAX_PINS="${MAX_PINS:-350}"

          # Empty, not just unset: the reusable workflow threads this from an
          # input, and an Actions expression yields "" rather than leaving the
          # variable out. An empty value here would build every packument request
          # against nothing at all, so it has to fall back like an absent one.
          NPM_AGE_PUBLIC_REGISTRY_URL="https://registry.npmjs.org"
          REGISTRY_URL="${AGE_CHECK_REGISTRY_URL:-}"
          [ -n "$REGISTRY_URL" ] || REGISTRY_URL="$NPM_AGE_PUBLIC_REGISTRY_URL"
          # A trailing slash is what a caller copying the URL out of their .npmrc
          # will most often pass, and the requests below join with "/". Pure
          # parameter expansion rather than sed: this runs before
          # preflight::require_tools, so reaching for an external tool here would
          # trade the friendly "tool not available" error for a confusing one.
          while [ "$REGISTRY_URL" != "${REGISTRY_URL%/}" ]; do
            REGISTRY_URL="${REGISTRY_URL%/}"
          done

          # shellcheck source=lib/_preflight.sh
          source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"

          # ----- Input validation: package name --------------------------------------

          # Validates input looks like a real npm package name. Blocks any exotic
          # characters in $pkg from reaching the curl URL (defense against crafted
          # lockfile entries with path-traversal / query injection in the URL
          # path). Critical security primitive — DO NOT bypass.
          npm_age::is_valid_pkg_name() {
            local name="$1"
            # 214 = npm's maximum package name length (includes the `@scope/`
            # prefix for scoped packages). Per npm's naming spec.
            [ ${#name} -le 214 ] || return 1
            # Uppercase and tildes are included because npm's
            # `validate-npm-package-name` treats them as warnings (allowed for
            # legacy packages), not hard errors. Packages like `JSONStream`
            # (uppercase) exist in the wild, and rejecting them here would emit
            # a misleading "does not match npm package name rules" warning for
            # a legitimate lockfile entry. Shell metacharacters (`!`, `(`, `)`,
            # `*`, `'`) remain blocked — those would be dangerous in the curl
            # URL.
            [[ "$name" =~ ^(@[a-zA-Z0-9~][a-zA-Z0-9~._-]*/)?[a-zA-Z0-9~][a-zA-Z0-9~._-]*$ ]]
          }

          # ----- Configured registry --------------------------------------------------
          #
          # Defined before the parsers are sourced: they call npm_age::registry_host
          # and read $REGISTRY_URL to decide which pins are on the configured
          # registry at all.

          # The registry URL reaches a curl command line, so it is validated on the
          # same principle as npm_age::is_valid_pkg_name above: constrain the
          # charset before it can reach the network layer, not after. A caller who
          # fat-fingers this gets a refusal naming the value rather than a request
          # to somewhere unintended.
          #
          # Scheme is restricted to http/https: curl speaks file://, scp:// and
          # more, and a registry_url of `file:///etc/passwd` would otherwise turn
          # every package lookup into a local file read whose body lands in the job
          # log. No userinfo is accepted either, so credentials cannot be smuggled
          # into a URL that gets echoed into logs and summaries.
          npm_age::is_valid_registry_url() {
            local url="$1"
            [ ${#url} -le 2000 ] || return 1
            # https ONLY, not http. The package-lock extractor admits a pin only
            # when its `resolved` starts `https://` — a deliberate scope fence, so
            # that git/plain-http/absent sources keep being dropped rather than
            # flipping a fully-vendored repo red. Accepting `http://` here would
            # therefore produce a registry_url under which every package-lock pin
            # is silently dropped and NOTHING is gated: a supply-chain control
            # configured, reporting green, and doing nothing. Refusing is the
            # honest answer, and it is the same posture as everywhere else in this
            # file. (A plaintext packument fetch is also trivially spoofable,
            # which makes the age it reports worthless.)
            [[ "$url" =~ ^https://[a-zA-Z0-9._~-]+(:[0-9]{1,5})?(/[a-zA-Z0-9._~%/-]*)?$ ]]
          }

          # Host[:port] of a registry URL — the token entries are compared against.
          # Path is deliberately dropped: a registry mounted at
          # https://nexus.example/repository/npm-group serves tarballs under that
          # same prefix, but a caller passes the base URL they know, and comparing
          # whole prefixes would then classify every one of those as off-registry.
          # Host identity is the property that actually matters — it is what
          # decides whether a package name means the same package.
          # Lower-cased: hosts are case-insensitive, but every place that derives
          # one compares the results for raw string equality. A .npmrc
          # reading `registry=https://Registry.NpmJS.org` would otherwise be
          # declared a different registry from the configured one and push every
          # integrity-only entry down the off-registry path — a red check on a
          # repo that is squarely on npmjs. Every other derivation — the
          # package-lock jq and the two awk extractors — lower-cases to match.
          # registry.yarnpkg.com is folded to registry.npmjs.org. It is not a
          # different registry — it is an alias in front of the public npm
          # registry, serving the same packages under the same names, and yarn v1
          # writes it into `resolved` by default. Without the fold a repo migrated
          # from yarn to npm (npm 7+ carries yarn.lock `resolved` URLs straight
          # into package-lock.json) has every pin tagged off-registry and fails
          # the all-skipped guard — a red check for pins that are squarely on
          # npmjs. The fold has to be applied to the ENTRY host too, not just
          # here, because an entry host never passes through this function. It
          # is written out in two more places: the package-lock jq
          # (NPM_AGE_JQ_ENTRIES) and canon_host(), the one awk function in
          # NPM_AGE_AWK_CANON_HOST that the yarn and the pnpm extractor both call.
          # Bash, jq and awk cannot share code, so those are repeat sites — change
          # the fold and change all three together, and the same holds for the
          # three normalisations above it. That is enforced rather than asked for
          # by a drift canary that drives this function and the three entry-side
          # extractors over one shared host set, and goes red if any one of them
          # drops any one step.
          #
          # Fenced by: test_host_canonicalisation_does_not_drift_between_extractors
          #
          # That line is a marker, not prose: a guard in the same file checks every
          # `Fenced by:` name still resolves to a test that is both defined AND
          # registered, so this pointer cannot rot into a comment aimed at nothing.
          # Citation is opt-in through that marker precisely so an ordinary
          # `test_dir` mentioned in any lib comment is not mistaken for one.
          #
          # Scope, so the next person does not over-trust it: the canary covers the
          # URL->host derivations only. npm_age::parse_pnpm_lock has ONE MORE
          # host comparison — the v5 registry-qualified KEY arm — which prefix-
          # matches a raw lockfile key against this function's already-canonical
          # output, so a key qualified `registry.yarnpkg.com/`, `Registry.NpmJS.org/`
          # or `registry.npmjs.org:443/` misses it and the entry is counted
          # non-registry. By default that is fail-closed — the file returns rc 3
          # and the run goes red as "resolves nothing from a registry", which is
          # the very red that arm exists to prevent. It is NOT fail-closed under
          # `allow_registry_free`: the same miscount reaches rc 4, a pass, so a
          # repo that set that flag while it genuinely had no registry deps gets a
          # green check over a v5 lockfile full of real ones.
          #
          # The fix, stated here rather than pointed at, so this comment stays
          # useful wherever it is read: canonicalise the key's host segment before
          # that prefix match, with the same steps as above minus the
          # scheme-gating, since a key carries no scheme. It is deliberately not
          # done in the change that added this note — that one is test-only, and
          # this moves a supply-chain gate's verdict.
          npm_age::registry_host() {
            local url="$1" scheme=""
            case "$url" in *://*) scheme="${url%%://*}" ;; esac
            url="${url#*://}"
            # The authority ends at the FIRST of `/`, `?` or `#`, not at `/`
            # alone — a committed `registry=https://attacker.example?x=@npmjs/`
            # otherwise reached the last-`@` userinfo strip below and read as
            # npmjs. Percent-encoding in that userinfo is legal and inert
            # (`svc%40corp:tok@host` is how Artifactory and Azure Artifacts docs
            # write an email-style username); refusing any `%` here, as this once
            # did, turned every such credentialed config into a red run.
            url="${url%%[/?#]*}"
            # A BACKSLASH in what is left is refused, not cut at. WHATWG URL
            # parsing ends an https authority at `\`, so
            # `attacker.example\@registry.npmjs.org` is attacker.example to the
            # fetcher and would be npmjs to the strip below. The lockfile
            # extractors cut there, because the prefix is where the fetch goes;
            # here the value is hand-written configuration, no real host carries
            # one, and cutting would turn `registry.npmjs.org\040x` into a
            # confident npmjs. Empty folds to `?unreadable` in the caller.
            case "$url" in *\\*) printf ''; return 0 ;; esac
            # Userinfo, before anything else looks at this. is_valid_registry_url
            # rejects it in the INPUT precisely so credentials cannot be echoed
            # into logs and summaries, but a value parsed out of a committed
            # .npmrc never passes that validator — and `registry=https://user:pass@host/`
            # is not far-fetched in exactly the private-registry repos this feature
            # is for. Without the strip, `user:pass@host` lands verbatim in the
            # warning below (safe_for_md prevents markdown injection, it does not
            # redact, and Actions cannot mask a value that never came from a
            # secret) and also matches no configured host, so it is a wrong-red
            # as well as a leak.
            url="${url##*@}"
            url=$(printf '%s' "$url" | tr '[:upper:]' '[:lower:]')
            scheme=$(printf '%s' "$scheme" | tr '[:upper:]' '[:lower:]')
            # A default port is the same registry written two ways. Without this,
            # `registry_url: https://npm.corp.example` against a lockfile whose
            # `resolved` carries `:443` classifies every pin off-registry and
            # fails a repo that is squarely on its configured registry — the
            # wrong-red the yarnpkg fold below also exists to prevent.
            case "${scheme}|${url}" in
              https\|*:443) url="${url%:443}" ;;
              http\|*:80)   url="${url%:80}" ;;
            esac
            [ "$url" = "registry.yarnpkg.com" ] && url="registry.npmjs.org"
            printf '%s' "$url"
          }

          # Derived once, at load time, and read directly by every extractor —
          # which is why they carry no fallback of their own. `main` narrows
          # DEFAULT_HOST / SCOPE_MAP per target from that target's .npmrc; a direct
          # caller (the parser unit tests) gets these values as-is.
          #
          # Before is_valid_registry_url runs, deliberately: `main` exits 1 on an
          # invalid URL long before an extractor reads these, and a direct caller
          # gets exactly what it would have computed for itself.
          #
          # Derived, never taken from the environment. Classification uses this
          # host while the packument fetch always uses $REGISTRY_URL, so an
          # inherited NPM_AGE_WANT_HOST would let a run judge pins against one
          # registry and read their dates from another, silently. Tests drive
          # AGE_CHECK_REGISTRY_URL, which moves both together.
          NPM_AGE_WANT_HOST=$(npm_age::registry_host "$REGISTRY_URL")
          # The host a caller who set nothing is judged against. Compared with
          # NPM_AGE_WANT_HOST to tell "registry_url names a private registry" from
          # the default, which is the one distinction the Berry no-.yarnrc.yml
          # notice in npm_age::load_registry_config turns on. Derived through
          # registry_host so an explicit registry.yarnpkg.com folds to the same
          # answer.
          NPM_AGE_PUBLIC_HOST=$(npm_age::registry_host "$NPM_AGE_PUBLIC_REGISTRY_URL")
          NPM_AGE_DEFAULT_HOST="$NPM_AGE_WANT_HOST"
          # Space-separated `@scope=host`. Empty, not unset: the append in
          # npm_age::load_registry_config is unguarded and this file runs under
          # `set -u`.
          NPM_AGE_SCOPE_MAP=""
          # The yarn BERRY pair, read from .yarnrc.yml rather than .npmrc. Kept
          # separate rather than folded into the two above because the two files
          # can disagree and each governs a different tool: a directory can hold a
          # pnpm lockfile governed by .npmrc and a Berry lockfile governed by
          # .yarnrc.yml. Both default to the configured registry, which is what
          # makes "no .yarnrc.yml" mean "no evidence" and leaves Berry entries
          # untagged.
          NPM_AGE_YARN_DEFAULT_HOST="$NPM_AGE_WANT_HOST"
          NPM_AGE_YARN_SCOPE_MAP=""

          # ----- .npmrc: which registry an integrity-only entry came from -------------

          # A pnpm entry whose resolution is `{integrity: ...}` carries no host: it
          # came from whatever registry was configured when the lockfile was
          # written. That configuration lives in .npmrc, so this reads it and emits
          # one `<scope-or-default> <host>` pair per line — `default` plus any
          # `@scope:registry=` overrides.
          #
          # Scoped lines matter as much as the default one: a repo whose default IS
          # npmjs but which pulls `@acme/*` from a private registry has
          # integrity-only entries for both, indistinguishable without this.
          # Reading only the default would age every private @acme package against
          # npmjs — the precise false pass this all exists to stop.
          #
          # Auth lines (`//host/:_authToken=...`, `@scope:_authToken=...`) match
          # neither key shape and are dropped, so no secret reaches stdout.
          #
          # Values are read literally. A `registry=${NPM_REGISTRY}` style
          # indirection resolves to no host, which reports its entries
          # off-registry rather than guessing — see Known limitations.
          npm_age::npmrc_registries() {
            local file="$1"
            [ -f "$file" ] || return 0
            # `sed` first so a CRLF checkout does not leave "\r" glued to the host,
            # and so a UTF-8 BOM does not stay glued to the FIRST key — `registry`
            # on line 1 would otherwise read as "\xef\xbb\xbfregistry", match
            # nothing, and be silently ignored, which is the fail-open direction.
            # Both artifacts travel with the same hand-authoring environments.
            # Blank and comment lines (npm accepts both ";" and "#") are dropped by
            # the anchored match rather than by a separate pass.
            sed -e $'1s/^\xef\xbb\xbf//' -e 's/\r$//' "$file" | awk '
              {
                line = $0
                sub(/^[[:space:]]+/, "", line)
                if (line ~ /^[;#]/) next
                eq = index(line, "=")
                if (eq == 0) next
                key = substr(line, 1, eq - 1)
                val = substr(line, eq + 1)
                gsub(/[[:space:]]/, "", key)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
                # \047 is a single quote, spelled octal so this program stays
                # inside one pair of shell single quotes.
                gsub(/^"|"$/, "", val)
                gsub(/^\047|\047$/, "", val)

                if (key == "registry") scope = "default"
                else if (key ~ /^@[^:]+:registry$/) { scope = key; sub(/:registry$/, "", scope) }
                else next

                # The VALUE is emitted as written; the caller runs it through
                # npm_age::registry_host, so "host" has exactly one definition
                # rather than a second one here that has to be kept in step. An
                # unresolved ${VAR} survives that unchanged, matches no real host,
                # and so lands on the off-registry path instead of a wrong one.
                # A registry line WAS present. If its value is unusable — empty,
                # or carrying whitespace that would split the space-separated
                # scope map — emit a sentinel rather than nothing, so the caller
                # can tell "no registry configured" from "a registry configured
                # that I could not read". Dropping it silently left
                # NPM_AGE_DEFAULT_HOST at the configured host, i.e. every entry
                # judged on-registry: fail-OPEN, in the one place this file cannot
                # afford it.
                if (val == "" || val ~ /[[:space:]]/) val = "?unreadable"
                print scope, val
              }'
          }

          # ----- .yarnrc.yml: the same question, for yarn BERRY -----------------------
          #
          # A Berry entry names no host at all — `resolution: "lodash@npm:4.17.21"`
          # is a DESCRIPTOR, not a location — so it is the yarn analogue of pnpm's
          # integrity-only entry: the registry it came from lives in
          # configuration. But in a DIFFERENT file. Berry does not read .npmrc, so
          # pointing npm_age::npmrc_registries at a Berry repo would judge its
          # pins against a registry Berry never used. This reads `.yarnrc.yml`
          # instead and emits the same `<scope-or-default> <url>` pairs, for the
          # same caller to fold.
          #
          # Three details of Berry's schema differ from npm's, and each is a wrong
          # answer if missed:
          #
          #   `npmScopes` keys carry NO leading `@` (`npmScopes: {acme: {...}}`,
          #   where .npmrc writes `@acme:registry=`). Emitted as written they
          #   build a map keyed `acme`, which the `@acme` of a package name never
          #   matches, and every scoped override is silently ignored — the failure
          #   mode that looks exactly like working code. A leading `@` is stripped
          #   and re-added so both spellings land on one key.
          #
          #   `npmPublishRegistry` is where packages are PUSHED, not fetched, and
          #   Berry lets the two differ. Reading it would age installed packages
          #   against a registry nothing was installed from. It is not matched
          #   here, deliberately — the omission is the feature.
          #
          #   Berry's DEFAULT is https://registry.yarnpkg.com, not npmjs. That is
          #   not a second registry (see npm_age::registry_host for the fold), but
          #   a repo naming it explicitly must compare equal to a default
          #   registry_url, so the value goes back through registry_host like
          #   every other one rather than being compared raw.
          #
          # Auth (`npmAuthToken`, `npmAuthIdent`) matches no key read here, so no
          # secret reaches stdout — the same property npm_age::npmrc_registries
          # has, reached the same way.
          #
          # The `?unreadable` sentinel is npm_age::npmrc_registries' rule applied
          # to this file for the same reason: a registry key WAS present but its
          # value cannot be used, and dropping it silently would leave the default
          # at the configured host — every entry judged on-registry, fail-OPEN.
          #
          # YAML is read structurally rather than with a parser: a key at column 0
          # opens a section, and only inside `npmScopes` is a nested
          # `npmRegistryServer` attributed to a scope. That keeps a
          # `npmRegistryServer` under some OTHER top-level map — `npmRegistries`,
          # which is keyed by URL and holds auth — from being read as the default.
          # Indent WIDTH is not fixed, only required to be deeper than the scope
          # key it belongs to: .yarnrc.yml is hand-written far more often than a
          # lockfile is.
          npm_age::yarnrc_registries() {
            local file="$1"
            [ -f "$file" ] || return 0
            # CRLF and a leading UTF-8 BOM, for the reason given on
            # npm_age::npmrc_registries: both come from the hand-authoring
            # environments this file explicitly expects, and a BOM left in place
            # makes a first-line `npmRegistryServer` match nothing at all.
            sed -e $'1s/^\xef\xbb\xbf//' -e 's/\r$//' "$file" | awk "$NPM_AGE_AWK_UNQUOTE"'
              # unquote() is NPM_AGE_AWK_UNQUOTE from _npm-lockfile-parsers.sh,
              # shared with npm_age::parse_pnpm_lock. That file is sourced at the
              # bottom of this one, which is before anything calls this function.
              # A registry key WAS present; this decides whether its value can be
              # used. One definition for both emit points below, so the default
              # and the per-scope rule cannot drift apart.
              #
              # Whitespace is the half that is fail-OPEN rather than untidy:
              # NPM_AGE_YARN_SCOPE_MAP is a space-separated `@scope=host` list, so
              # a value carrying a space splits inside the map and binds the scope
              # to its FIRST token — `"https://registry.npmjs.org evil.example"`
              # would resolve @acme to npmjs and age every @acme package against
              # its public homonym. Emptiness is the half npm_age::npmrc_registries
              # also guards; a shell-side fallback in load_registry_config catches
              # it too, and it is kept here so both readers state the same rule.
              #
              # `${` is the third: Berry EXPANDS `${VAR}` and `${VAR:-fallback}` in
              # .yarnrc.yml, so the value names an environment variable this check
              # cannot see, not a registry. Read literally, the fallback form is
              # the dangerous one — `${PRIVATE_REGISTRY:-https://registry.npmjs.org/}`
              # splits at `://` and cuts at the first `/`, leaving exactly
              # `registry.npmjs.org`, so a repo whose CI sets the variable to a
              # private registry was aged against public homonyms: fail-OPEN,
              # through a file that says in so many words that its value comes
              # from the environment. Refused wherever it appears in the value
              # rather than only as a prefix, since yarn expands it mid-string too.
              function usable(v) {
                if (v == "" || v ~ /[[:space:]]/ || index(v, "${") > 0) return "?unreadable"
                return v
              }
              {
                line = $0
                # Blank and comment lines carry no key.
                if (line ~ /^[[:space:]]*($|#)/) next
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/age-check-npm.sh (part 3 of 4)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/age-check-npm.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
                # A TAB anywhere in the leading whitespace is not legal YAML
                # indentation, so this is not a file yarn would load. SKIPPING the
                # line — what this once did, and only for a tab at column 1 —
                # silently dropped a tab-indented scope block, so its override
                # vanished and those pins fell through to the default: fail-OPEN,
                # the one direction this reader must not take. A spaces-then-tab
                # line was worse still: the tab vanished in the key trim and the
                # setting was read as a new SCOPE. Same exit as the other
                # invalid-YAML shapes: inside npmScopes the map is unenumerable
                # and takes the sticky sentinel; at top level the default is.
                if (line ~ /^[[:space:]]*\t/) {
                  if (in_scopes) print "default", "?unreadable-scopes"
                  else print "default", "?unreadable"
                  in_scopes = 0; cur_scope = ""; scope_indent = -1
                  next
                }

                ind = 0
                while (substr(line, ind + 1, 1) == " ") ind++
                rest = substr(line, ind + 1)

                # Split at the FIRST colon: the value of npmRegistryServer is a
                # URL carrying one of its own, which a last-colon split would take
                # as the separator.
                c = index(rest, ":")
                if (c == 0) {
                  # Only while INSIDE npmScopes: a stray token elsewhere cannot
                  # misattribute a scope, which is the failure this rule exists
                  # for — and a valid multi-line flow collection (`plugins: [`
                  # ... `]`) closes with exactly such a line, which poisoned the
                  # scope map and sent the operator to fix `npmScopes` when the
                  # line belonged to `plugins`. YAML document markers and
                  # `%YAML`-style directives are the colon-less column-0 lines a
                  # valid file can carry inside that section too; everything
                  # else at column 0 without a
                  # colon means this is not the block mapping the reader can walk
                  # (a bare scalar cannot share a document with a mapping). Yarn
                  # would refuse such a file. Keeping the section state and
                  # reading on produced a WRONG verdict — scope lines after a
                  # stray token were still attributed as scopes — so instead the
                  # scope map is declared unreadable, which is the fail-closed
                  # "no verdict" the rest of this file gives.
                  if (ind == 0 && in_scopes && rest !~ /^(---|\.\.\.)([[:space:]]|$)/ && rest !~ /^%/) {
                    print "default", "?unreadable-scopes"
                    in_scopes = 0; cur_scope = ""; scope_indent = -1
                  }
                  next
                }
                key = substr(rest, 1, c - 1)
                val = substr(rest, c + 1)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                # A YAML inline comment, stripped BEFORE the trim. In YAML a `#`
                # only opens one when it follows whitespace or starts the line, so
                # this is narrow and leaves `https://host#frag` alone. Order is
                # load-bearing: trimming first removes the very whitespace the
                # anchor needs, so a COMMENT-ONLY value (`npmScopes:  # our
                # scopes`, or `  acme:  # private`) survived as a non-empty value,
                # was read as a flow mapping, and poisoned the default or that
                # scope with ?unreadable — a red run on honest hand-written config,
                # which is the failure the strip exists to prevent one line up.
                sub(/[[:space:]]+#.*$/, "", val)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
                key = unquote(key)
                val = unquote(val)
                # Re-trim: a quoted value can hold padding the first trim could
                # not see, and the space-separated scope map cannot carry it.
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)

                # Column 0 opens a section and ends any scope in progress. Only
                # whether it is the `npmScopes` map is remembered — the same shape
                # as in_packages in npm_age::parse_pnpm_lock — which is what keeps
                # an npmRegistryServer nested under some OTHER top-level map
                # (`npmRegistries`, keyed by URL and holding auth) from being read
                # as the default.
                if (ind == 0) {
                  in_scopes = (key == "npmScopes")
                  cur_scope = ""; scope_indent = -1
                  if (key == "npmRegistryServer") print "default", usable(val)
                  # `npmScopes: {acme: {...}}` written inline. Valid YAML that yarn
                  # reads and this line-structured reader cannot walk into, and the
                  # scopes cannot even be enumerated from it — so there is no
                  # narrower thing to distrust than the whole file. Dropped
                  # silently, every scope override in it would vanish and its
                  # packages would fall back to the default registry: fail-OPEN,
                  # and invisible, which is the failure this reader exists to
                  # prevent. A DISTINCT sentinel from `?unreadable`, because the
                  # fold treats the two differently: this one is a proxy for
                  # scopes it cannot see, and a readable default in a nearer file
                  # does not make those scopes visible, so it must stick; a plain
                  # `?unreadable` names one key, which a nearer file legitimately
                  # overrides — see npm_age::fold_registry_files.
                  else if (in_scopes && val != "") print "default", "?unreadable-scopes"
                  next
                }

                if (!in_scopes) next

                # The FIRST indented line inside npmScopes fixes the scope level;
                # anything deeper holds that scope`s settings. (No apostrophes in
                # this program — it is single-quoted.)
                if (scope_indent < 0) scope_indent = ind

                # A line SHALLOWER than the scope level but not at column 0 is
                # invalid YAML (a mapping`s keys share one indent), so yarn would
                # refuse the file. Left alone it fell through both branches with
                # cur_scope still pointing at the PREVIOUS scope, and the next
                # setting line was attributed to it — `@acme` handed another
                # scope`s registry, in the fail-open direction. The scope map is
                # declared unreadable instead: sticky, because the scopes can no
                # longer be enumerated from this file at all.
                if (ind < scope_indent) {
                  print "default", "?unreadable-scopes"
                  in_scopes = 0; cur_scope = ""; scope_indent = -1
                  next
                }

                if (ind == scope_indent) {
                  cur_scope = key; sub(/^@/, "", cur_scope)
                  # A scope name carrying whitespace cannot be represented in the
                  # space-separated map at all: the shell-side `read` splits it, and
                  # the tail of the NAME becomes the head of the HOST. A committed
                  # `"acme x":` naming npmjs, after a real `acme:` naming a private
                  # registry, therefore serialised as a SECOND `@acme=` entry that
                  # won last — every @acme pin aged against its public homonym,
                  # through a key yarn matches to no package. usable() guards the
                  # value; nothing guarded the key. The scope map is unenumerable
                  # from here, so it takes the sticky scopes sentinel.
                  if (cur_scope ~ /[[:space:]]/) {
                    print "default", "?unreadable-scopes"
                    in_scopes = 0; cur_scope = ""; scope_indent = -1
                    next
                  }
                  # `acme: {npmRegistryServer: ...}` — a scope whose settings are
                  # an inline flow mapping. Same reasoning as the inline npmScopes
                  # above, but the scope IS known here, so distrust just that one:
                  # dropping it would fall back to the default registry and age
                  # every @acme package against its public homonym.
                  if (val != "") { print "@" cur_scope, "?unreadable"; cur_scope = "" }
                  next
                }

                # No `scope_indent >= 0` test: it is set unconditionally above, and
                # column 0 resets it with cur_scope together.
                if (cur_scope != "" && ind > scope_indent && key == "npmRegistryServer")
                  print "@" cur_scope, usable(val)
              }'
          }

          # Narrows NPM_AGE_DEFAULT_HOST / NPM_AGE_SCOPE_MAP to the .npmrc
          # governing <dir>, or leaves them at the configured registry when there
          # is none.
          #
          # Per TARGET, not per run. The step runs in the caller's
          # working_directory, but lockfile_path may name a lockfile in a
          # subdirectory of it (`apps/web/pnpm-lock.yaml` under a root
          # working_directory is explicitly supported below) — and that app's
          # .npmrc is what governed the install that wrote that lockfile. Reading
          # only the top-level one would miss an `@acme:registry=` there, fall back
          # to "same as the configured registry", and age those private packages
          # against a public homonym: the exact false pass this all exists to
          # close, reached through the one configuration that looks handled.
          # Folds one registry config file, read from each of <dirs...> in turn,
          # into three lines on stdout: the default host, the scope map, and the
          # provenance of whatever in those two is unreadable. An EMPTY default
          # means the file named none, which the caller reads as "leave it at the
          # configured registry" — distinct from "?unreadable", which means a
          # registry WAS named and could not be used.
          #
          # The provenance line is `<default-src> [<scope>=<src> ...]`. Each <src>
          # is the zero-based position, in <dirs...>, of the directory whose file
          # carries the unreadable value IN EFFECT; <default-src> is `-` when the
          # default is not a sentinel. The fold is the one place that knows this:
          # the caller sees only the folded result, and the warnings used to name
          # the TARGET directory — so an unreadable value in the root file, under
          # a clean `apps/web` one, sent the operator to the clean file. A
          # position rather than a path because the line is split on spaces and a
          # directory name may hold one; the caller owns <dirs...> and turns the
          # position back into a path. A scope appears here exactly when the
          # entry that WINS for it is unreadable, so this is also the list of
          # poisoned scopes, and no caller re-derives it from the map.
          #
          # stdout rather than variables set in place: this repo targets bash 3.2,
          # which has no namerefs (same constraint, same solution, as
          # preflight::age_row_and_tally). .npmrc and .yarnrc.yml need the
          # IDENTICAL fold into different variables, and a copy each is a fold
          # that has to be kept in step in the one file that cannot afford
          # fail-open.
          npm_age::fold_registry_files() {
            local reader="$1" name="$2"; shift 2
            local d scope host default="" map=""
            # `poisoned` keeps a space on BOTH sides of every record, so
            # ` ${scope}=` below only ever matches at a record boundary and
            # `@x@acme=` cannot stand in for `@acme=`.
            local i=-1 default_src="-" poisoned=" " rest
            for d in "$@"; do
              i=$((i + 1))
              [ -f "${d}/${name}" ] || continue
              # Explicit IFS: the script sets IFS=$'\n\t' globally, so a bare `read`
              # would not split this pair on its space.
              while IFS=' ' read -r scope host; do
                case "$host" in
                  # A sentinel is already terminal — and only the two this file
                  # emits count, so file content beginning with `?` still goes
                  # through the normaliser and lands on `?unreadable` with the
                  # actionable warning, rather than being echoed back as a
                  # registry nobody set. It happens to pass through
                  # npm_age::registry_host unchanged today, but that function's
                  # contract is "normalise a registry URL", not "preserve an
                  # arbitrary string" — and if it ever returned empty for one, the
                  # fallback below would flatten `?unreadable-scopes` into plain
                  # `?unreadable` before the stickiness test could see it, losing
                  # the one distinction that keeps unenumerable scopes fail-closed.
                  '?unreadable'|'?unreadable-scopes') ;;
                  *)
                    host=$(npm_age::registry_host "$host")
                    # A value that parses to no host at all (`registry=//host/`,
                    # which npm accepts) must not leave the default at the
                    # configured registry. "?unreadable" matches no real host, so
                    # its entries are tagged and the mismatch warning names the
                    # file.
                    [ -n "$host" ] || host="?unreadable" ;;
                esac
                # Two sentinels, folded differently, and the difference is the
                # tools' own precedence. `?unreadable` names ONE key whose value
                # could not be used; npm and Berry both let a nearer file override
                # that key, so nearest-wins applies to it exactly as to a readable
                # value — a root `registry=//host/` under an `apps/web/.npmrc`
                # naming npmjs is a repo npm resolves without ambiguity, and
                # making the poison stick there turned it red on upgrade.
                # `?unreadable-scopes` is different in kind: the yarnrc reader
                # emits it on the DEFAULT as a proxy for scope overrides it could
                # not enumerate, and a nearer file's readable default does not make
                # those scopes visible, so it must survive — an inline
                # `npmScopes: {...}` followed (in the same file or a nearer one) by
                # a plain `npmRegistryServer` would otherwise lose the signal and
                # age those packages against public homonyms, fail-OPEN.
                if [ "$scope" = "default" ]; then
                  # The provenance follows the value: whichever file sets the
                  # default in effect is the one named, and a readable default
                  # clears it. For the sticky sentinel that is the FIRST file to
                  # emit it, since nothing after it is let through.
                  if [ "$default" != "?unreadable-scopes" ]; then
                    default="$host"
                    case "$host" in
                      '?unreadable'|'?unreadable-scopes') default_src="$i" ;;
                      *) default_src="-" ;;
                    esac
                  fi
                else
                  # Later files override an earlier entry for the same scope
                  # because the awk map assignment is last-wins; appending is
                  # enough, no removal needed. That holds for a poisoned scope too:
                  # `acme: {...}` at the root under a readable `acme:` block nearer
                  # the lockfile is exactly the override Berry itself honours.
                  map="${map}${map:+ }${scope}=${host}"
                  # The same last-wins rule, applied to the provenance: drop the
                  # record an earlier entry for this scope left, then record this
                  # one if it is the unreadable kind. A root `acme: {...}` under a
                  # readable nearer `acme:` therefore leaves nothing here, and no
                  # warning sends the operator to a file that is not in effect.
                  # The expansions are quoted, so a scope is matched literally.
                  case "$poisoned" in
                    *" ${scope}="*)
                      rest="${poisoned#*" ${scope}="}"
                      poisoned="${poisoned%%" ${scope}="*} ${rest#* }" ;;
                  esac
                  [ "$host" != "?unreadable" ] || poisoned="${poisoned}${scope}=${i} "
                fi
              done < <("$reader" "${d}/${name}")
            done
            # TWO lines, not one tab-separated pair: `read` strips LEADING IFS
            # whitespace, and a tab is whitespace, so a `\t<map>` pair with an
            # empty default silently shifts the map into the default field — which
            # sets NPM_AGE_DEFAULT_HOST to `@acme=host`, matches no entry, and
            # tags every package in a repo that only ever configured one scope.
            #
            # The third line never starts with whitespace (`-` or a position comes
            # first), so the same trap is not set again for its reader.
            printf '%s\n%s\n%s\n' "$default" "$map" "${default_src}${poisoned% }"
          }

          # The path of the config file at position <src> of <dirs...>, as the fold
          # reported it, in NPM_AGE_REGISTRY_SRC — empty when <src> is not a
          # position (`-`, or nothing at all because the fold did not finish). A
          # variable rather than stdout: this runs for every target, and the
          # common case — nothing unreadable — must not pay a fork for it.
          npm_age::registry_src_path() {
            local name="$1" src="$2"; shift 2
            NPM_AGE_REGISTRY_SRC=""
            case "$src" in ''|*[!0-9]*) return 0 ;; esac
            [ "$src" -lt "$#" ] || return 0
            shift "$src"
            NPM_AGE_REGISTRY_SRC="${1}/${name}"
          }

          # A scope whose registry could not be read. The default-host warning
          # above never sees these — the poison sits in the scope map — so without
          # this every `@acme` pin is tagged and, if those are the only new
          # dependencies, the all-skipped guard fails the PR with nothing in the
          # log naming the file or the flow-style mapping as the cause. The
          # identical mistake one line up (`npmScopes: {...}` at column 0) gets a
          # precise message; this gives the scope form the same courtesy.
          # <poisoned> is the fold's `<scope>=<src>` list — which scopes, and which
          # of <dirs...> each one's unreadable value sits in. It is not recovered
          # from the scope map: that keeps every entry for a scope, and only the
          # fold knows which one won and where it came from. So there is no
          # last-wins scan here and nothing to deduplicate — the fold lists a
          # scope once, and only when the entry in effect for it is unreadable.
          # The global IFS holds no space, hence the explicit split.
          #
          # One warning per scope, as before, each naming the FILE the value is
          # in: <dir> is only where the lockfile is, and the value may sit in any
          # config file between it and the working directory.
          #
          # All five leading arguments are required, <remedy> included (pass ""
          # for none): <dirs...> is whatever follows them, and a call one short
          # would have `shift 5` fail and the positions resolve against the
          # wrong list.
          npm_age::warn_unreadable_scopes() {
            local name="$1" poisoned="$2" dir="$3" qualifier="$4" remedy="$5"; shift 5
            # Nothing is forked unless something will be printed: a repo with a
            # readable scope map reaches here on every target.
            [ -n "$poisoned" ] || return 0
            local -a pairs=()
            IFS=' ' read -r -a pairs <<< "$poisoned"
            local r safe_dir safe_scope safe_file
            safe_dir=$(preflight::safe_for_md "$dir")
            for r in "${pairs[@]}"; do
              npm_age::registry_src_path "$name" "${r##*=}" "$@"
              safe_scope=$(preflight::safe_for_md "${r%=*}")
              # 200, not the table-cell default: this is a log annotation, and a
              # path cut at 80 names a file that does not exist.
              safe_file=$(preflight::safe_for_md "$NPM_AGE_REGISTRY_SRC" 200)
              preflight::annotate_with_note warning "${name} for ${safe_dir} configures a registry for ${safe_scope} that this check could not parse${safe_file:+ (the value is in ${safe_file})}, so ${qualifier}packages in that scope are reported as skipped rather than age-checked.${remedy:+ }${remedy}"
            done
          }

          # One wording for both files, so the remedy sentence cannot drift into
          # two versions. <qualifier> narrows the noun for a file that governs only
          # part of the ecosystem ("Berry "). <src> is the path of the file whose
          # value made the default unreadable, from the fold; the two sentinel
          # warnings name it, because <dir> is only the directory the lockfile is
          # in and the value may sit in any config file between it and the
          # working directory. Empty leaves the sentence as it was.
          npm_age::warn_registry_mismatch() {
            local name="$1" host="$2" dir="$3" qualifier="$4" remedy="${5:-}" src="${6:-}"
            [ "$host" != "$NPM_AGE_WANT_HOST" ] || return 0
            local safe_dir; safe_dir=$(preflight::safe_for_md "$dir")
            # 200, not the table-cell default: this is a log annotation, and a
            # path cut at 80 names a file that does not exist.
            local where=""
            case "$host" in
              "?unreadable"|"?unreadable-scopes")
                [ -z "$src" ] || where=" (the value is in $(preflight::safe_for_md "$src" 200))" ;;
            esac
            # `?unreadable` is a sentinel, not a host, and rendering it as one
            # sends an operator hunting for a default registry they never set —
            # especially for the inline-npmScopes case, where the poison is
            # applied to the default although the cause was a scope map. Name the
            # real problem instead.
            case "$host" in
              "?unreadable-scopes")
                preflight::annotate_with_note warning "${name} for ${safe_dir} has an npmScopes map this check cannot read${where} — written inline (\`npmScopes: {...}\`), or with a line the block structure does not admit — so it cannot tell which scopes are overridden and reports every ${qualifier}package as skipped rather than age-checked. Rewrite npmScopes in block style with one consistent indent."
                return 0 ;;
              "?unreadable")
                # The generic half is true of both files; only the remedy differs,
                # so it is a parameter rather than a second copy of the sentence.
                # Telling an .npmrc operator to rewrite their YAML in block style is
                # the kind of confidently wrong instruction that costs more than
                # saying nothing.
                preflight::annotate_with_note warning "${name} for ${safe_dir} configures a registry this check could not parse${where}, so ${qualifier}packages are reported as skipped rather than age-checked.${remedy:+ }${remedy}"
                return 0 ;;
            esac
            local safe_host; safe_host=$(preflight::safe_for_md "$host")
            preflight::annotate_with_note warning "${name} for ${safe_dir} sets a default registry (${safe_host}) other than the configured registry_url (${NPM_AGE_WANT_HOST}); ${qualifier}packages resolving through it are reported as skipped, not age-checked. Set registry_url to age them."
          }

          npm_age::load_registry_config() {
            local dir="$1" kind="${2:-}" lockfile="${3:-}" d default map default_src poisoned
            # npm_age::registry_src_path's output, scoped to this call: it is a
            # scratch value read on the line after it is set, and nothing outside
            # should find a stale path in it.
            local NPM_AGE_REGISTRY_SRC=""
            # One clause for the four remedies below, so the next edit to it is
            # atomic: `registry=//host/` and `npmRegistryServer: //host/` both
            # parse to no host, and a remedy that names only whitespace and
            # `${VAR}` describes neither the operator's file nor their problem.
            local rel_clause="a protocol-relative value (\`//host/\`) has no scheme this check can read a host from"
            NPM_AGE_DEFAULT_HOST="$NPM_AGE_WANT_HOST"
            NPM_AGE_SCOPE_MAP=""
            NPM_AGE_YARN_DEFAULT_HOST="$NPM_AGE_WANT_HOST"
            NPM_AGE_YARN_SCOPE_MAP=""

            # Which config file governs THIS lockfile. Berry reads .yarnrc.yml and
            # never .npmrc; npm and pnpm read .npmrc and never .yarnrc.yml. Reading
            # the other one is not merely wasted work — its mismatch warning tells
            # an operator that packages "are reported as skipped, not age-checked"
            # when no package of that kind exists, and main() calls this once per
            # target, so one stray file prints the same false warning up to three
            # times in a run. An empty kind means the caller did not say, which
            # reads both: the parser unit tests call this directly.
            local want_npmrc=1 want_yarnrc=1
            case "$kind" in
              yarn)              want_npmrc=0 ;;
              package-lock|pnpm) want_yarnrc=0 ;;
              # "" is a direct caller (the unit tests) that did not say, and reads
              # both. Anything else is a format added without updating this case —
              # reading both is the safe fallback (no verdict is skipped), and the
              # only cost is the false warning the gate exists to remove, so make
              # the next person notice rather than inherit it silently.
              "")                ;;
              *) echo "::warning::npm_age::load_registry_config: unknown lockfile kind '${kind}'; reading both .npmrc and .yarnrc.yml" ;;
            esac

            # Every config file from the working directory down to the lockfile,
            # applied root-first so the NEAREST one wins. Both directions matter
            # and each is a false pass on its own: reading only the top-level file
            # misses `apps/web/.npmrc`, and reading only the lockfile's own
            # directory misses a registry configured once at the repo root — which
            # is where pnpm workspaces and yarn monorepos normally put it. Either
            # way the private packages get aged against a public homonym.
            #
            # Relative paths only, so this never walks above the working directory
            # — enforced here rather than assumed of the caller, because an
            # absolute or `..`-bearing lockfile_path would otherwise have this
            # reading config files from outside the checkout entirely.
            # Also catches a directory whose NAME merely contains ".." (apps/v1..2),
            # which is broader than traversal alone — harmless, since the fallback
            # is the working directory, and not worth a more delicate pattern on a
            # path that reaches the filesystem.
            case "$dir" in
              /*|*..*) dir="." ;;
            esac
            # `${dirs[@]+"${dirs[@]}"}`, not a bare "${dirs[@]}": the array is
            # empty on the first pass of the loop, and stays empty when the
            # lockfile sits in the working directory. Under `set -u` bash before
            # 4.4 calls that expansion an unbound variable, and macOS /bin/bash is
            # 3.2. tests/bash32_portability_test.sh runs this function there.
            local -a dirs=()
            d="$dir"
            while [ "$d" != "." ] && [ "$d" != "/" ]; do
              dirs=("$d" ${dirs[@]+"${dirs[@]}"})
              d=$(dirname "$d")
            done
            dirs=("." ${dirs[@]+"${dirs[@]}"})
            # This ONE list goes to the fold and to everything that resolves the
            # positions the fold reports (registry_src_path, warn_unreadable_scopes).
            # A caller that hands them different lists gets a plausible path to the
            # wrong file, and no error.

            # `IFS=` on the first two reads so neither value is trimmed: the global
            # IFS holds \n and \t, and the map's own separator is a space, which
            # read would otherwise have to be told to leave alone. The third line
            # is the fold's provenance and IS split, once, at its first space: the
            # default's source, then the poisoned-scope records as one string.
            if [ "$want_npmrc" = 1 ]; then
              { IFS= read -r default; IFS= read -r map; IFS=' ' read -r default_src poisoned; } < <(
                npm_age::fold_registry_files npm_age::npmrc_registries .npmrc "${dirs[@]}")
              [ -n "$default" ] && NPM_AGE_DEFAULT_HOST="$default"
              NPM_AGE_SCOPE_MAP="$map"
              npm_age::registry_src_path .npmrc "$default_src" "${dirs[@]}"
              npm_age::warn_registry_mismatch .npmrc "$NPM_AGE_DEFAULT_HOST" "$dir" "" \
                "A value containing whitespace cannot be used, \`registry=\${VAR}\` is read literally rather than expanded, and ${rel_clause}; use an absolute URL (\`https://host/\`)." \
                "$NPM_AGE_REGISTRY_SRC"
              npm_age::warn_unreadable_scopes .npmrc "$poisoned" "$dir" "" \
                "A value containing whitespace cannot be used, \`@scope:registry=\${VAR}\` is read literally rather than expanded, and ${rel_clause}; use an absolute URL (\`https://host/\`)." \
                "${dirs[@]}"
            fi

            if [ "$want_yarnrc" = 1 ]; then
              { IFS= read -r default; IFS= read -r map; IFS=' ' read -r default_src poisoned; } < <(
                npm_age::fold_registry_files npm_age::yarnrc_registries .yarnrc.yml "${dirs[@]}")
              [ -n "$default" ] && NPM_AGE_YARN_DEFAULT_HOST="$default"
              NPM_AGE_YARN_SCOPE_MAP="$map"
              # `kind` cannot tell yarn v1 from Berry — both are "yarn" — and only
              # BERRY reads .yarnrc.yml. Reading it for a v1 lockfile is harmless
              # (berry_host() only fires for a Berry-shaped block, and v1 has
              # none), but WARNING about it is the same false operator signal the
              # kind gate above exists to remove, one format over: a v1 repo with a
              # .yarnrc.yml lying around — common mid-migration, or kept for
              # nodeLinker/yarnPath alone — would be told its Berry packages are
              # being skipped when it has none. `__metadata:` is a key yarn v1
              # never writes — the same KIND of evidence the extractor keys Berry
              # on, but at file level: the extractor decides per block, on
              # `resolution:`/`checksum:`/`languageName:`/`linkType:`, and never
              # reads `__metadata:` for that. A real lockfile is uniformly one
              # format, so the two agree; this one answers "which file is this",
              # not "which entry is this".
              local berry_lock=0
              [ -f "$lockfile" ] && grep -q '^__metadata:' "$lockfile" && berry_lock=1
              if [ -z "$lockfile" ] || [ "$berry_lock" = 1 ]; then
                npm_age::registry_src_path .yarnrc.yml "$default_src" "${dirs[@]}"
                npm_age::warn_registry_mismatch .yarnrc.yml "$NPM_AGE_YARN_DEFAULT_HOST" "$dir" "Berry " \
                  "Flow-style YAML (\`npmScopes: {…}\`) is not read, a value containing whitespace cannot be used, \`\${VAR}\` interpolation is refused because this check cannot see the environment yarn expands it from, and ${rel_clause}; rewrite it in block style with a plain absolute URL." \
                  "$NPM_AGE_REGISTRY_SRC"
                npm_age::warn_unreadable_scopes .yarnrc.yml "$poisoned" "$dir" "Berry " \
                  "A flow-style scope (\`acme: {…}\`) is not read, a value containing whitespace cannot be used, and ${rel_clause}; rewrite it in block style with a plain absolute URL." \
                  "${dirs[@]}"
              fi
              # The other half of that file's story: no .yarnrc.yml default at all,
              # under a registry_url that is not the public one, so the Berry
              # entries are aged on that input's word alone. Known limitations
              # ("WHAT THIS DOES NOT CLOSE") holds the reasoning for why that is a
              # `::notice` and not a tag; only this call site's guards are
              # explained here. Gated on the Berry marker itself, not merely a
              # lockfile argument: a direct caller with no lockfile has nothing to
              # be told about, and a v1 lockfile never reads .yarnrc.yml. Against
              # the public registry_url there is nothing to say — Berry's own
              # default folds to the same host. `default` is also non-empty for
              # the `?unreadable` / `?unreadable-scopes` sentinels, which the
              # mismatch warning above already covers.
              # The wording scopes its claim: an entry under an `npmScopes` rule, or
              # carrying `::__archiveUrl=`, IS judged on evidence and is not what
              # the notice is about. And the registry.yarnpkg.com it names is
              # Berry's own default — a fact about yarn, not the public-npm
              # constant above, so it is not folded into NPM_AGE_PUBLIC_HOST.
              # Only the path is sanitised: NPM_AGE_WANT_HOST is the caller's own
              # input, already reduced to a bare host by registry_host, the same
              # treatment the all-skipped remedy gives REGISTRY_URL.
              if [ "$berry_lock" = 1 ] && [ -z "$default" ] && [ "$NPM_AGE_WANT_HOST" != "$NPM_AGE_PUBLIC_HOST" ]; then
                local safe_lock; safe_lock=$(preflight::safe_for_md "$lockfile")
                preflight::annotate_with_note notice "${safe_lock} is a yarn Berry lockfile and no default npmRegistryServer is set in .yarnrc.yml, so entries not covered by an npmScopes rule or an __archiveUrl in their resolution are aged against registry_url (${NPM_AGE_WANT_HOST}) on that input alone — Berry's own default here is registry.yarnpkg.com. If yarn's registry is set only in CI (YARN_NPM_REGISTRY_SERVER), commit it as npmRegistryServer in .yarnrc.yml so this check can see where the packages come from."
              fi
            fi
          }

          # ----- Separable: lockfile -> pkg@version work-list -------------------------
          #
          # Extractors and the base-vs-head comparator live in their own file: they
          # are the code that decides WHICH pins get checked, so they are kept small
          # and readable on purpose. See that file's header for the extractor /
          # comparator seam.

          # shellcheck source=lib/_npm-lockfile-parsers.sh
          source "$(dirname "${BASH_SOURCE[0]}")/_npm-lockfile-parsers.sh"

          # ----- Registry fetch: ISO-8601 timestamp on stdout ------------------------

          # Fetches the registry response for $1 and emits the publish time for
          # version $2 on stdout. Exit codes:
          #   0 - success (stdout may still be empty if the version isn't in .time)
          #   1 - registry says 404/410 (package private, scope-only, unpublished)
          #   3 - registry says 401/403: reachable, but refusing us. Distinct from
          #       2 because the operator action is a credential, not a retry — and
          #       this check sends none.
          #   2 - transient failure after --retry exhaustion (including 429)
          #
          # Uses curl's native --retry for the transient case + --compressed to
          # reduce bandwidth on large packuments (lodash ~7MB uncompressed).
          # Temp-file cleanup runs via `trap ... RETURN` (bash-only, fine on
          # ubuntu-latest) so it happens even on unexpected exits.
          #
          # `RETURN` trap lifecycle: each call installs a fresh trap that fires
          # when that call returns (normally or via `return N`). The previous
          # invocation's trap has already fired and been discarded by that
          # point, so there's no trap leak across calls even though we reassign
          # the same trap name.
          npm_age::published_at() {
            local pkg="$1" version="$2" response_file http_code
            response_file=$(mktemp)
            # Expand $response_file *now* (when the trap is set), not when the
            # trap fires — by that point `local` has gone out of scope. Double
            # quotes for the trap command are deliberate; single quotes would
            # defer expansion. Inner path uses escaped double quotes (not single)
            # so a mktemp path containing a single quote (defensive — GNU
            # mktemp doesn't produce them, but safer) wouldn't break cleanup.
            # shellcheck disable=SC2064
            trap "rm -f \"$response_file\"" RETURN

            # URL-encode the `/` in scoped names (`@scope/name` → `@scope%2Fname`).
            # Both forms resolve today, but the encoded form is the canonical
            # registry API path — makes the request unambiguously correct.
            local url_pkg="${pkg//\//%2F}"

            # -sS: silent, but show errors on stderr. --compressed: negotiate
            # gzip/deflate for large packuments. --retry 2 with backoff handles
            # transient 5xx and network blips. `|| echo "000"` covers curl
            # crashing before -w can print, falling us through to the transient
            # branch below.
            http_code=$(curl -sS --compressed -m 10 --retry 2 --retry-delay 2 --retry-all-errors \
              -o "$response_file" -w "%{http_code}" \
              "${REGISTRY_URL}/${url_pkg}" || echo "000")

            case "$http_code" in
              200)
                jq -r --arg v "$version" '.time[$v] // empty' "$response_file"
                return 0
                ;;
              404|410)
                return 1
                ;;
              401|403)
                # Reachable and REFUSING us, which is a different operator action
                # from an outage. Most registries this feature is for (GitHub
                # Packages, Artifactory, Nexus with anonymous read off, npm private
                # orgs) need a token even to read a packument, and this check sends
                # none — so without splitting this out, following the "pass
                # registry_url" advice turns every pin into "<host> unreachable",
                # which is the one thing it is not.
                echo "::warning::${pkg}@${version} — ${REGISTRY_URL} returned ${http_code}: authentication required, and this check has no credential for it" >&2
                return 3
                ;;
              429)
                # --retry-all-errors already retries 429; if we got here, rate
                # limiting has exhausted retries. Log distinctly from generic
                # "unreachable" so it's diagnosable. Must go to stderr —
                # stdout is captured by `$(npm_age::published_at …)` at the
                # call site.
                echo "::warning::${pkg}@${version} — rate-limited by npm registry (429); --retry exhausted" >&2
                return 2
                ;;
              *)
                return 2
                ;;
            esac
          }

          # ----- Main -----------------------------------------------------------------

          # Reports every `vendored` record in $2 (a work-list, any records) as a
          # newly vendored arrival in the lockfile whose already-sanitized name is
          # $1: a `::notice file=` on the
          # lockfile, and an `:information_source:` summary row. Called from main,
          # and it reads and writes main's `vendored_count` / `vendored_rows`
          # through dynamic scoping — the same contract preflight::age_row_and_tally
          # has on `checked_count` and `failed`.
          #
          # A notice, never a gate: a vendored entry has no publish date, so there
          # is no age to threshold, and failing on one would mean failing a PR
          # over a fact this check cannot evaluate. It is not counted as skipped
          # either — that would feed the all-skipped guard and fail a lockfile
          # whose only change is a single vendored entry. What the reviewer gets is
          # the fact that this branch started resolving code from somewhere other
          # than the registry, which for a supply-chain control is the sentence
          # worth surfacing.
          #
          # Rows are capped like the off-registry ones: a fully vendored monorepo
          # promoting its whole lockfile would otherwise write one row per entry,
          # and past 1 MiB Actions discards the step summary entirely. Counting is
          # never capped, so the footer can say how many were held back.
          npm_age::report_vendored_arrivals() {
            local safe_file="$1" records="$2" rec key safe_key
            while IFS= read -r rec; do
              [ -n "$rec" ] || continue
              key="${rec#*$'\t'}"
              vendored_count=$((vendored_count + 1))
              [ "$vendored_rows" -lt "$VENDORED_ROW_CAP" ] || continue
              # Sanitized like a package name, and for the same reason: the key is
              # lockfile-controlled text. safe_for_md keeps ":" and "/" — a
              # vendored key is mostly those — so a crafted key could still spell
              # `::error::`, which is why it sits mid-line behind a `::notice
              # file=` prefix where Actions will not parse a workflow command.
              #
              # Two lengths: the summary ROW keeps the default 80 so the table stays
              # readable, but the annotation is what asks the reviewer to judge the
              # source, and at 80 a git URL loses exactly the part that identifies
              # the pinned commit — so the log line carries 200.
              safe_key=$(preflight::safe_for_md "$key")
              local safe_key_long; safe_key_long=$(preflight::safe_for_md "$key" 200)
              echo "::notice file=${safe_file}::${safe_key_long} — newly resolved from outside the configured registry (git, tarball, link:, file:, workspace: or portal: — or, in a v5 lockfile, a key qualified with another registry host). Not age-checked: a vendored entry has no publish date. Confirm the source is one this repo intends to pull code from."
              echo "| \`${safe_key}\` | — | — | :information_source: new non-registry source (not age-checked) |" >> "$GITHUB_STEP_SUMMARY"
              vendored_rows=$((vendored_rows + 1))
            done < <(printf '%s\n' "$records" | npm_age::records_of_kind vendored)
          }

          npm_age::main() {
            # First, before anything that can exit — the preflight helpers below
            # `exit` from inside _preflight.sh — so that no red exit leaves the
            # failures file empty for the comment renderer's delete branch (see
            # preflight::exit_guard, which also explains what a `timeout-minutes`
            # kill can and cannot leave behind; MAX_PINS is the main mitigation
            # for reaching one at all).
            #
            # The cleanup removes the marker and renders the buffered notes. The
            # notes go here, AFTER the guard, rather than at the end of main():
            # main has a dozen exits, the notes belong under whichever footer the
            # run ended on, and the guard's own fallback footer is one of them.
            # The buffer is cleared before the trap is armed, because rendering
            # REMOVES the file and an inherited value must not reach it on a
            # preflight exit that happens before main assigns its own.
            # Single quotes on purpose: the trap expands the names when it fires.
            PREFLIGHT_NOTES_FILE=""
            # shellcheck disable=SC2016
            preflight::install_exit_guard npm 'rm -f "${NPM_AGE_UNREADABLE_MARKER:-}" 2>/dev/null || true; preflight::step_summary_notes'

            preflight::require_tools curl jq git mktemp awk sed grep sort comm
            preflight::require_gnu_date
            preflight::validate_min_age_days

            # Refuse a bad registry URL before any parsing, not at the first
            # request: every entry is classified against a host derived from it, so
            # a typo would render as "nothing is on your registry" rather than as
            # the configuration error it is.
            if ! npm_age::is_valid_registry_url "$REGISTRY_URL"; then
              local safe_reg; safe_reg=$(preflight::safe_for_md "$REGISTRY_URL")
              echo "::error::registry_url is not a valid http(s) registry URL: ${safe_reg}"
              # Its own row, so the PR comment names the malformed input rather
              # than falling through to exit_guard's generic "see the job log" —
              # the same reason the parse-failure path below records one.
              preflight::record_unverifiable "registry_url" "$safe_reg" \
                "not a valid http(s) registry URL"
              preflight::step_summary_unverifiable "registry_url is not a valid http(s) registry URL: ${safe_reg}"
              exit 1
            fi

            echo "Age-checking against ${REGISTRY_URL}"

            # `type: number` on the workflow input guarantees little once a caller
            # writes `max_pins: ${{ vars.NPM_MAX_PINS }}`. A non-integer would make
            # the `[ "$pin_count" -gt "$MAX_PINS" ]` test below fail with "integer
            # expression expected" — a bare command under `set -e`, so main would
            # abort mid-loop after ::group:: but before ::endgroup::, the summary
            # footer or any TSV row. Fall back rather than hard-fail: this is an
            # operational tuning knob, not a security threshold, and the default is
            # stricter than any value someone fat-fingered.
            # Shared with the other ecosystems on purpose: the 5-minute job budget
            # is not npm-specific, and a copied-and-diverged validator is exactly
            # what _preflight.sh exists to prevent.
            MAX_PINS=$(preflight::validate_positive_int MAX_PINS "$MAX_PINS" 350)
            # Couple the cap to the timeout. The docs tell consumers to move these
            # together, but documentation is the weakest possible enforcement for a
            # knob whose misuse silently disables the protection: raising max_pins
            # to 1000 while leaving timeout_minutes at 5 buys back exactly the
            # mid-scan timeout the cap was added to prevent.
            #
            # Scan rate is ~130 pins/minute (~0.45s each). Reserve about a minute
            # for the token mint, checkout and setup that come out of the same job
            # budget, so a workable cap is ~130 * (timeout_minutes - 1). The
            # default pair (350 @ 5 min) sits deliberately under that.
            # Truncate before validating. `type: number` permits `2.5`, GitHub
            # honours it on `timeout-minutes:` (150s), but the integer validator
            # would reject it and fall back to 5 — a 520-pin budget against a job
            # killed at 150s, i.e. the mid-scan timeout the clamp exists to
            # prevent, reached by tuning the knob DOWN. Flooring is the
            # conservative direction: 2.5 -> 2 -> 130 pins.
            TIMEOUT_MINUTES=$(preflight::validate_positive_int \
              TIMEOUT_MINUTES "${TIMEOUT_MINUTES:-5}" 5)
            # `:-5` first, so this cannot trip `set -u` on an unset variable.
            TIMEOUT_MINUTES="${TIMEOUT_MINUTES%%.*}"
            # Reserve ~1 minute for token mint, checkout and setup. Below 2 minutes
            # there is nothing left to reserve FROM, so fall back to the default
            # rather than flooring at a nonsense value: (1-1)*130 = 0 floors to 1,
            # and a 1-pin cap refuses any PR touching two dependencies — a
            # plausible input turned into a check that can never pass. The workflow
            # clamps timeout_minutes to >= 2 for the same reason; this is the
            # script-side backstop.
            local affordable
            if [ "$TIMEOUT_MINUTES" -lt 2 ]; then
              affordable=$(( (5 - 1) * 130 ))
            else
              affordable=$(( (TIMEOUT_MINUTES - 1) * 130 ))
            fi
            if [ "$MAX_PINS" -gt "$affordable" ]; then
              # CLAMP, don't just warn. A warning is emitted on a run that is about
              # to be killed before the step summary and the failures TSV are
              # written, so the operator never sees it — and an unaffordable cap
              # produces exactly the mid-scan timeout the cap exists to prevent.
              # This is reachable without anyone raising max_pins: a rejected value
              # falls back to the constant default (350), which is already more
              # than a `timeout_minutes: 2` job can finish. Clamping means the run
              # ends in an explained refusal instead.
              echo "::warning::MAX_PINS=${MAX_PINS} exceeds what timeout_minutes=${TIMEOUT_MINUTES} can scan (~${affordable} pins at ~0.45s each, allowing ~1 min for checkout and setup); clamping to ${affordable} so an over-large work-list is refused with an explanation rather than timing out mid-scan. Raise timeout_minutes to lift it."
              MAX_PINS="$affordable"
            fi

            local base_ref="origin/${BASE_REF}"
            preflight::verify_base_ref "$base_ref"
            local base_rev; base_rev=$(preflight::base_rev) || exit 1  # closed even where errexit is off

            NPM_AGE_UNREADABLE_MARKER=$(mktemp)
            export NPM_AGE_UNREADABLE_MARKER
            # Buffer for preflight::annotate_with_note; rendered and removed by
            # the EXIT cleanup installed at the top of main.
            PREFLIGHT_NOTES_FILE=$(mktemp)
            export PREFLIGHT_NOTES_FILE

            local now_epoch; now_epoch=$(date +%s)
            local failed=false
            local checked_count=0
            local skipped_count=0
            # Subset of skipped_count that was a 404 rather than an outage. Now
            # that BUMPS enter the work-list, a repo on a private registry can
            # reach the all-skipped guard on a routine internal bump — before this
            # change such a bump produced an empty work-list and exited 0. Still
            # fails closed (an unverifiable pin must not pass), but the operator
            # gets a message that names the cause instead of a bare "no
            # verification possible".
            local skipped_private=0
            # Subset of skipped_count: pins skipped because they resolve to a
            # registry other than the configured one — identified from the
            # lockfile, so no request is made for them at all. Tracked separately
            # so the all-skipped failure can name registry_url, the remedy that
            # gates them, rather than a way to switch the check off.
            local offregistry_count=0
            # Rows actually written for off-registry pins. Uncapped, a
            # private-registry monorepo promoting a whole lockfile writes one row
            # and one annotation per pin: past 1 MiB Actions discards the step
            # summary ENTIRELY, and the summary is this check's primary human
            # output. Capping the rendering, never the counting, is what keeps the
            # run's own conclusion readable. (GitHub surfaces only ~10 annotations
            # per type per step anyway, so the flood was mostly invisible.)
            local offregistry_rows=0
            local -r OFFREGISTRY_ROW_CAP=50
            # Vendored records reported, and rows written for them — capped for
            # the same reason as the off-registry rows. Written by
            # npm_age::report_vendored_arrivals through dynamic scoping.
            local vendored_count=0 vendored_rows=0
            local -r VENDORED_ROW_CAP=50

            # Lockfiles actually inspected, for the all-skipped guard's failure row.
            local -a processed=()
            # Pins verified across ALL targets. The budget protects the job's
            # 5-minute timeout, which is per RUN — a repo carrying both a
            # package-lock.json and a yarn.lock (a migration PR, or a stale
            # lockfile left in tree) could otherwise present two under-cap
            # work-lists that together blow straight through it.
            local total_pins=0
            # Lockfiles that passed via allow_registry_free rather than by being
            # verified. Counted separately so the footer cannot claim coverage.
            local registry_free_count=0
            local -a targets=()
            # The two auto-detect lines below only look in the CWD, at the literal
            # names. So LOCKFILE_PATH has to be routed by what it actually is:
            #
            #   cwd-level yarn/pnpm  — skip; the auto-detect lines add it, and
            #                          enqueueing it here too would hand a YAML
            #                          file to the package-lock handler, where jq
            #                          fails and the run reports "could not
            #                          determine changed dependencies" — the wrong
            #                          cause. (That configuration WORKED before
            #                          this rewrite, so it must keep working.)
            #   sub-path yarn/pnpm   — enqueue under its OWN handler. Excluding it
            #                          and trusting auto-detection to re-add it
            #                          would drop it entirely: targets ends up
            #                          empty and the run exits 0 with "No npm
            #                          lockfiles found", a silent pass for a
            #                          `lockfile_path: apps/web/yarn.lock`
            #                          consumer.
            #   anything else        — the package-lock handler.
            case "$LOCKFILE_PATH" in
              yarn.lock|./yarn.lock|pnpm-lock.yaml|./pnpm-lock.yaml)
                ;;
              */yarn.lock)
                if [ -f "$LOCKFILE_PATH" ]; then targets+=("yarn:${LOCKFILE_PATH}"); fi
                ;;
              */pnpm-lock.yaml)
                if [ -f "$LOCKFILE_PATH" ]; then targets+=("pnpm:${LOCKFILE_PATH}"); fi
                ;;
              *)
                if [ -f "$LOCKFILE_PATH" ]; then
                  targets+=("package-lock:${LOCKFILE_PATH}")
                fi
                ;;
            esac
            [ -f "pnpm-lock.yaml" ]    && targets+=("pnpm:pnpm-lock.yaml")
            [ -f "yarn.lock" ]         && targets+=("yarn:yarn.lock")

            # A lockfile_path the caller pointed somewhere specific, that is not
            # there — a typo, a renamed directory, an app that moved.
            #
            # "Did the caller configure it?" cannot be answered from the
            # environment: both reusables set LOCKFILE_PATH unconditionally from an
            # input whose own default is `package-lock.json`, so the variable is
            # always set and always non-empty. Comparing against the DEFAULT is the
            # only signal available — and it is the right one, because an absent
            # default just means this repo is not npm (a yarn-only consumer would
            # otherwise get a "NOT age-checked" warning naming a file that was
            # never meant to exist, on every PR).
            local lockfile_path_missing=0
            case "$LOCKFILE_PATH" in
              package-lock.json|./package-lock.json) ;;
              *) [ -f "$LOCKFILE_PATH" ] || lockfile_path_missing=1 ;;
            esac

            if [ "${#targets[@]}" -eq 0 ]; then
              if [ "$lockfile_path_missing" -eq 1 ]; then
                # Nothing was checked AND the one path we were told to check is
                # absent. step_summary_no_changes would render this as a clean
                # pass, so take the failing path instead — the gate is off, and
                # that must not look green.
                preflight::step_summary_header "npm"
                npm_age::report_unreadable_format "$LOCKFILE_PATH" \
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Write the age-check library — lib/age-check-npm.sh (part 4 of 4)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ops-routines-lib"
          cat >> "${RUNNER_TEMP}/ops-routines-lib/age-check-npm.sh" <<'OPS_ROUTINES_AGE_CHECK_LIB'
                  "configured lockfile_path does not exist in the checkout"
                echo "::error::configured lockfile_path '${LOCKFILE_PATH}' does not exist and no other lockfile was found — nothing was age-checked"
                exit 1
              fi
              echo "No npm lockfiles found (looked for ${LOCKFILE_PATH}, pnpm-lock.yaml, yarn.lock)"
              preflight::step_summary_no_changes "npm" "No npm lockfiles found in this checkout."
              exit 0
            fi

            preflight::step_summary_header "npm"

            # After the header, so the row joins the table rather than orphaning
            # above it. Other lockfiles WERE found, so the run continues — but the
            # configured path is still wrong and must not pass silently.
            if [ "$lockfile_path_missing" -eq 1 ]; then
              npm_age::report_unreadable_format "$LOCKFILE_PATH" \
                "configured lockfile_path does not exist in the checkout"
            fi

            local entry
            for entry in "${targets[@]}"; do
              local kind="${entry%%:*}" file="${entry#*:}"
              # Collected raw; preflight::safe_list_for_md sanitizes each element
              # and joins afterwards. Sanitizing an already-joined string would
              # render "package-lock.json, yarn.lock" as "package-lock.jsonyarn.lock",
              # because safe_for_md's `tr -cd` keeps neither `,` nor space.
              processed+=("$file")
              echo "::group::Checking $(preflight::safe_for_md "$file")"

              # Registry config for THIS lockfile, from the config beside it.
              # `dirname` of a cwd-level lockfile is ".", which is the same file
              # the previous shape read — so the common case is unchanged and the
              # subdirectory case stops silently using the wrong one. `kind` picks
              # which config file governs it: .npmrc for npm/pnpm, .yarnrc.yml for
              # yarn, never both.
              npm_age::load_registry_config "$(dirname "$file")" "$kind" "$file"

              local new_deps="" diff_rc=0
              case "$kind" in
                package-lock) new_deps=$(npm_age::diff_package_lock "$file" "$base_rev") || diff_rc=$? ;;
                pnpm)         new_deps=$(npm_age::diff_pnpm_lock    "$file" "$base_rev") || diff_rc=$? ;;
                yarn)         new_deps=$(npm_age::diff_yarn_lock    "$file" "$base_rev") || diff_rc=$? ;;
              esac

              # Both branches below put the file name into rendered surfaces, so
              # sanitize once: record_unverifiable's contract says display_id
              # arrives sanitized, and $file is LOCKFILE_PATH verbatim for the
              # package-lock kind — a path with a "|" would split the comment row.
              local safe_file; safe_file=$(preflight::safe_for_md "$file")

              # rc 4: a pass by explicit configuration rather than by
              # verification. Recorded in the table and counted, so the run cannot
              # report "Verified 0 package(s) :white_check_mark:" — which anyone
              # auditing summaries at fleet scale reads as a pass WITH coverage.
              # This is NOT the could-not-read case; that is the branch below.
              if [ "$diff_rc" -eq 4 ]; then
                echo "| \`${safe_file}\` | — | — | :warning: registry-free (allow_registry_free) |" >> "$GITHUB_STEP_SUMMARY"
                registry_free_count=$((registry_free_count + 1))
                echo "Nothing from a registry in ${file}; skipped via allow_registry_free"
                # stdout on this path carries the vendored records that ARRIVED
                # (diff_pnpm_lock says why it still computes them), so the pass is
                # not a blind one.
                npm_age::report_vendored_arrivals "$safe_file" "$new_deps"
                echo "::endgroup::"
                continue
              fi

              # A parser that could not read its input has verified nothing, so
              # this must not fall through to "no new dependencies". Three surfaces
              # are written by hand, because each covers a different reader: the
              # summary ROW (record_unverifiable writes only the TSV), the failures
              # TSV (comment-on-failure is gated on it being non-empty), and the
              # summary FOOTER. The PR comment is the only one an operator sees
              # without opening the log, so it has to name the right cause — a
              # base image that cannot be read is not a head-lockfile parse
              # failure, and telling that operator their lockfile is unreadable
              # sends them to the wrong file.
              if [ "$diff_rc" -ne 0 ]; then
                echo "::endgroup::"
                local fail_cell fail_reason
                case "$diff_rc" in
                  2)
                    # Not a missing merge base — preflight resolved it and would
                    # have failed there, naming fetch-depth. What reaches this arm
                    # is a base image that could not be read (a partial clone's
                    # lazy blob fetch, a corrupt object) or could not be parsed;
                    # the parser's own ::error says which.
                    fail_cell=":x: base image unreadable"
                    fail_reason="could not read or parse the lockfile's base image at the merge base — not a missing merge base, but a partial clone (filter: on actions/checkout), an unreadable object, or no scratch space for the image can still fail the read; the job log names which image and why"
                    ;;
                  3)
                    # The case allow_registry_free exists for. Reporting it as a
                    # parse failure would send this operator to the README entry
                    # for the OTHER failure, whose remedy is the opposite of what
                    # they need.
                    fail_cell=":x: nothing from a registry"
                    fail_reason="resolves nothing from the public npm registry, so no dependency could be age-checked — if that is this repo's permanent shape, pass allow_registry_free: true to the reusable workflow"
                    ;;
                  5)
                    # Read, but not read WHOLE. Distinct from the generic parse
                    # failure because the operator is looking at a lockfile that
                    # parses — telling them it "could not be parsed" sends them
                    # hunting for a corrupt file rather than for the entries this
                    # check silently could not account for.
                    fail_cell=":x: lockfile only partly parsed"
                    fail_reason="declares more packages than this check could account for, so the packages it did verify are not the whole file; see the job log for the counts"
                    ;;
                  *)
                    fail_cell=":x: lockfile could not be parsed"
                    fail_reason="lockfile could not be parsed; see the job log"
                    ;;
                esac
                echo "::error file=${safe_file}::could not determine new dependencies for ${safe_file} — ${fail_reason}; failing closed"
                echo "| \`${safe_file}\` | — | — | ${fail_cell} |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_unverifiable "$safe_file" "n/a" "$fail_reason"
                # NOT step_summary_failed: its footer tells the operator to add the
                # age-check-bypass label, which is exactly what the parser's own
                # ::error:: on this path tells them not to do.
                preflight::step_summary_unverifiable "${safe_file}: ${fail_reason}"
                exit 1
              fi

              # Vendored arrivals first, and deliberately BEFORE the empty-work-list
              # test: the case that motivates them is exactly a PR whose work-list
              # is empty — one that vendors a new git dependency into a lockfile
              # whose registry pins did not move. Reported here, then removed from
              # the work-list, so nothing below — the budget, the loop, the
              # counters — ever sees a record it cannot age.
              npm_age::report_vendored_arrivals "$safe_file" "$new_deps"
              new_deps=$(printf '%s\n' "$new_deps" | npm_age::records_not_of_kind vendored)

              if [ -z "$new_deps" ]; then
                echo "No new dependencies in ${file}"
                echo "::endgroup::"
                continue
              fi

              # State the size before spending it. Each pin costs ~0.45s (the 0.2s
              # rate-limit sleep plus a registry round-trip), so a large work-list
              # can run out the 5-minute job timeout — and a timeout kills the step
              # before ::endgroup::, the summary footer or the failures TSV, giving
              # the reviewer a red check with no explanation. This line survives
              # that, so an over-budget run at least says how much it was trying to
              # do. See the budget note on the rate-limit sleep below.
              local pin_count total_pins_so_far
              # Off-registry rows are excluded from the budget. They are decided
              # from the lockfile and cost no request and no `sleep 0.2` — roughly
              # 150x cheaper than the ~0.45s per pin this cap is sized against — so
              # counting them refuses a run that would finish in about a second.
              # That lands on the repo shape this feature exists for: a
              # private-registry monorepo promoting a whole lockfile would be told
              # "raise max_pins", spend a re-run on it, and only then reach the
              # all-skipped guard that names registry_url. Two wrong turns, from a
              # message this file's own standard says must name the real cause.
              local off_count off_note=""
              off_count=$(printf '%s\n' "$new_deps" | npm_age::records_of_kind offregistry | grep -c . || true)
              # An explicit test, not `${off_count:+...}`: that expands whenever the
              # variable is non-EMPTY, and "0" is non-empty — so every ordinary run
              # would report "0 more resolve to another registry".
              [ "$off_count" -gt 0 ] && off_note="; ${off_count} more resolve to another registry and are skipped without a request"
              pin_count=$(( $(printf '%s\n' "$new_deps" | grep -c . || true) - off_count ))
              total_pins_so_far=$(( total_pins + pin_count ))
              echo "::notice::$(preflight::safe_for_md "$file"): ${pin_count} pin(s) to verify, ${total_pins_so_far} across this run (~$(( total_pins_so_far * 45 / 100 ))s at ~0.45s each; job timeout is ${TIMEOUT_MINUTES} min)${off_note}. Counts work-list entries; invalid-name skips never reach the registry, so this over-estimates slightly."

              # Refuse rather than run out the clock. This is the same rule the
              # unparseable-base branch in changed_pins already applies ("fail
              # closed and fast … reporting the whole head lockfile would be
              # unbounded"); without it the paths that legitimately promote an
              # entire lockfile — a lockfile new on this branch, or a
              # lockfileVersion 1 base — walk straight into a mystery timeout.
              local safe_target; safe_target=$(preflight::safe_for_md "$file")
              if [ "$total_pins_so_far" -gt "$MAX_PINS" ]; then
                # NB: $total_pins is deliberately NOT advanced here. A refused
                # target's pins were never spent, so carrying them forward would
                # inflate the count a later target reports and refuse a small one
                # for work that never happened — and the message is the whole
                # point of the cap.
                local remedy
                if [ "$NPM_AGE_MAX_PINS_FROM_ENV" -eq 1 ]; then
                  remedy="raise both max_pins and timeout_minutes on the calling workflow"
                else
                  # No MAX_PINS in the environment: this is an older pinned
                  # reusable running a newer lib. Naming `max_pins` here would send
                  # the reader looking for an input their revision lacks.
                  remedy="update the pinned ops-routines reusable to a revision that exposes the max_pins and timeout_minutes inputs"
                fi
                echo "::error file=${safe_target}::${total_pins_so_far} pins to verify across this run exceeds the ${MAX_PINS}-pin budget. This is a lockfile regeneration or a format migration rather than a dependency bump — review it by hand, ${remedy}, or add the 'age-check-bypass' label."
                echo "| \`${safe_target}\` | — | — | :x: work-list too large (${total_pins_so_far} pins > ${MAX_PINS}) |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_unverifiable "$safe_target" "—" \
                  "work-list of ${total_pins_so_far} pins exceeds the ${MAX_PINS}-pin budget"
                failed=true
                echo "::endgroup::"
                continue
              fi
              total_pins=$total_pins_so_far

              while IFS= read -r dep_entry; do
                [ -z "$dep_entry" ] && continue

                # An "offregistry<TAB>pkg@ver" line is a pin the extractor read
                # fine and deliberately did not admit: it resolves through some
                # registry other than the configured one, so its publish date HERE
                # would be a different package's. Reported and counted rather than
                # dropped, because a newly added private dependency going green
                # with no annotation is the failure this replaced. No request is
                # made for it — that 404 round trip is what used to inflate
                # skipped_count on every private entry.
                #
                # The tab cannot occur in a package name or in the semver charset
                # the extractors enforce, so this cannot collide with a real pin.
                if [ "${dep_entry%%$'\t'*}" = "offregistry" ]; then
                  local off_pin="${dep_entry#*$'\t'}"
                  local safe_off safe_off_ver
                  safe_off=$(preflight::safe_for_md "${off_pin%@*}")
                  safe_off_ver=$(preflight::safe_for_md "${off_pin##*@}")
                  # A `::warning file=` like every sibling skip branch, so the skip
                  # shows in the PR's Files-changed view and not only in the job
                  # log. Columns split to match every other row in the table.
                  if [ "$offregistry_rows" -lt "$OFFREGISTRY_ROW_CAP" ]; then
                    echo "::warning file=$(preflight::safe_for_md "$file")::${safe_off}@${safe_off_ver} — resolves to a registry other than ${NPM_AGE_WANT_HOST} (skipped; pass registry_url to age it)"
                    echo "| \`${safe_off}\` | ${safe_off_ver} | — | :warning: skipped (not on the configured registry) |" >> "$GITHUB_STEP_SUMMARY"
                    offregistry_rows=$((offregistry_rows + 1))
                  fi
                  offregistry_count=$((offregistry_count + 1))
                  skipped_count=$((skipped_count + 1))
                  continue
                fi

                local pkg="${dep_entry%@*}" ver="${dep_entry##*@}"
                if [ -z "$pkg" ] || [ -z "$ver" ]; then
                  continue
                fi
                # No protocol test on $ver here. There used to be a backstop
                # skipping `file:`/`link:`/`git+`... versions, from when extractors
                # let such entries through. None can now: yarn and pnpm admit a
                # version only if it starts with a digit, and both decide the
                # protocol at the header or key, where a non-registry source
                # becomes a vendored record or a stated exclusion. The one way to
                # reach it was a crafted package-lock `version` beside an https
                # `resolved`, and for that the path below is the better answer —
                # the registry has no such version, so it renders a visible
                # "version not in registry" row where the backstop printed one
                # log line and no row.

                # Validate pkg name BEFORE it reaches curl. Reject with an
                # auditable warning row rather than silently skipping — makes
                # crafted lockfile entries visible to reviewers.
                if ! npm_age::is_valid_pkg_name "$pkg"; then
                  local safe_pkg; safe_pkg=$(preflight::safe_for_md "$pkg")
                  echo "::warning file=$(preflight::safe_for_md "$file")::${safe_pkg} — does not match npm package name rules (skipped)"
                  echo "| \`${safe_pkg}\` | — | — | :warning: invalid name (skipped) |" >> "$GITHUB_STEP_SUMMARY"
                  skipped_count=$((skipped_count + 1))
                  continue
                fi

                # Sanitize version for markdown output. Semver is well-
                # constrained but a malicious lockfile could stuff markdown
                # into the version string.
                local safe_ver; safe_ver=$(preflight::safe_for_md "$ver")

                # ~5 req/sec rate limit — npm's public registry doesn't document
                # a hard limit but historically throttles at higher rates.
                # --retry-all-errors on the curl handles any 429 that slips
                # through.
                #
                # Budget: this sleep is only half the per-package cost. Measured
                # against the real registry, the fetch itself runs 0.15s
                # (lodash, 47KB) to 0.38s (electron-to-chromium, 1.2MB), so
                # ~0.45s/package all-in — roughly 130 packages per minute of
                # TIMEOUT_MINUTES, which at its default of 5 is a real ceiling
                # near 650, not the ~1500 a sleep-only calculation suggests.
                # Keeping the work-list scoped to the merge base (see
                # npm_age::changed_pins) is what keeps runs far below it.
                sleep 0.2

                local ts
                local fetch_rc=0
                ts=$(npm_age::published_at "$pkg" "$ver") || fetch_rc=$?

                case "$fetch_rc" in
                  0)
                    if [ -z "$ts" ]; then
                      echo "::warning file=$(preflight::safe_for_md "$file")::${pkg}@${safe_ver} — version not in registry timestamps (skipped)"
                      echo "| \`${pkg}\` | ${safe_ver} | — | :warning: skipped (version not in registry) |" >> "$GITHUB_STEP_SUMMARY"
                      skipped_count=$((skipped_count + 1))
                      continue
                    fi
                    ;;
                  1)
                    # 404/410 — package not on the configured registry (internal
                    # scope, unpublished, or a registry this check was not pointed
                    # at). Skip with warning; no way to verify age from metadata
                    # this run can read.
                    echo "::warning file=$(preflight::safe_for_md "$file")::${pkg}@${safe_ver} — not found on ${NPM_AGE_WANT_HOST} (private or unpublished; skipped)"
                    echo "| \`${pkg}\` | ${safe_ver} | — | :warning: skipped (404 — private or unpublished) |" >> "$GITHUB_STEP_SUMMARY"
                    skipped_count=$((skipped_count + 1))
                    skipped_private=$((skipped_private + 1))
                    continue
                    ;;
                  3)
                    # Authentication, not an outage. Still fails closed — an
                    # unverifiable pin must not pass — but the row and the PR
                    # comment name a cause the operator can act on, which is the
                    # standard the rest of this file holds itself to.
                    echo "::error file=$(preflight::safe_for_md "$file")::${pkg}@${safe_ver} — ${NPM_AGE_WANT_HOST} requires authentication and this check has no credential for it"
                    echo "| \`${pkg}\` | ${safe_ver} | — | :x: registry requires authentication |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$pkg" "$safe_ver" \
                      "${NPM_AGE_WANT_HOST} requires authentication; this check sends no credential, so it cannot read publish dates there"
                    failed=true
                    continue
                    ;;
                  *)
                    # Transient failure after curl --retry. Fail closed — an
                    # outage must not silently let new deps through a security
                    # control.
                    echo "::error file=$(preflight::safe_for_md "$file")::${pkg}@${safe_ver} — ${NPM_AGE_WANT_HOST} unreachable after retry"
                    echo "| \`${pkg}\` | ${safe_ver} | — | :x: registry unreachable |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$pkg" "$safe_ver" \
                      "${NPM_AGE_WANT_HOST} unreachable after retry"
                    failed=true
                    continue
                    ;;
                esac

                # Classify + emit. The _and_tally wrapper reads/writes our
                # `checked_count` and `failed` locals via dynamic scoping and
                # does the row emit — one call replaces the whole iso_to_epoch
                # + classify_age + 4-way case + counter bookkeeping block.
                preflight::age_row_and_tally \
                  "$pkg" "$safe_ver" "$ts" "$now_epoch" "$MIN_AGE_DAYS" \
                  "published" "$file" "@"
              done <<< "$new_deps"

              echo "::endgroup::"
            done

            # Immediately after the loop and BEFORE every terminal branch below —
            # the all-skipped guard exits, and a capped run is exactly the shape
            # that reaches it, so a line emitted later never renders on the run
            # that needs it. Same reasoning as the registry-free footer further
            # down, which says so in as many words.
            if [ "$offregistry_count" -gt "$offregistry_rows" ]; then
              echo "| — | — | — | :warning: $(( offregistry_count - offregistry_rows )) more not on the configured registry (rows capped) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$vendored_count" -gt "$vendored_rows" ]; then
              echo "| — | — | — | :information_source: $(( vendored_count - vendored_rows )) more new non-registry source(s) (rows capped) |" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Guard against "registry outage → every package skipped → workflow
            # passes" — if nothing actually got verified but some were skipped
            # (including non-registry SKIPs), err on the side of failing.
            if [ "$checked_count" -eq 0 ] && [ "$skipped_count" -gt 0 ]; then
              preflight::step_summary_all_skipped "$skipped_count"
              local all_skipped_reason
              # Only narrate the private-registry cause when it IS the cause. This
              # branch runs before the `failed` branch, so if another lockfile
              # tripped the budget cap or a parse failure, the advice "drop this
              # check for this repo" would be actively wrong for what happened.
              if [ "$offregistry_count" -gt 0 ] && [ "$failed" = false ]; then
                # Every skip was "resolves somewhere else", which has a real fix
                # that is not a bypass: name that registry and they get gated for
                # real. Saying only "no verification possible" would send this
                # operator looking for a way to switch the check off, which is the
                # outcome this branch exists to avoid.
                # Phrased like its siblings below: all three reasons share "no pin
                # in this change could be verified" so the PR-comment row reads the
                # same whatever the cause, with the cause appended.
                # `-gt 0`, not `-eq skipped_count`: a private-registry repo
                # routinely produces BOTH off-registry rows and pins that 404 on
                # the configured registry. Requiring unanimity dropped that mixed
                # case — the realistic one for this feature's audience — onto the
                # generic message, the only one that never mentions registry_url.
                all_skipped_reason="no pin in this change could be verified; ${offregistry_count} of ${skipped_count} resolve to a registry other than ${NPM_AGE_WANT_HOST}"
                # The remedy depends on whether registry_url was already set. Told
                # to "pass registry_url" by a run that already has one, an operator
                # has nowhere to go; and a host that serves no packument API (a CDN
                # or bucket behind `resolution: {tarball: ...}`) cannot be named
                # here at all, so that case has to admit the label exists.
                local off_remedy
                if [ "$REGISTRY_URL" = "$NPM_AGE_PUBLIC_REGISTRY_URL" ]; then
                  off_remedy="pass registry_url to the reusable workflow naming the registry this repo installs from — it must serve packuments WITHOUT authentication, because this check sends no credential"
                else
                  off_remedy="registry_url is already set to ${REGISTRY_URL}, so these resolve somewhere else again — check it names the registry this repo actually installs from; if that host serves no packument API this check cannot age them, and 'age-check-bypass' is the remaining way out"
                fi
                echo "::error::All ${skipped_count} package(s) in this change were skipped, so none could be age-verified. ${offregistry_count} of them resolve to a registry other than ${NPM_AGE_WANT_HOST}: ${off_remedy}. Failing to avoid a false pass."
              elif [ "$skipped_private" -eq "$skipped_count" ] && [ "$failed" = false ]; then
                all_skipped_reason="no pin in this change could be verified against ${NPM_AGE_WANT_HOST} (internal scope, unpublished, or a registry this check was not pointed at)"
                echo "::error::All ${skipped_count} package(s) in this change are absent from ${NPM_AGE_WANT_HOST} (internal scope, unpublished, or a registry this check was not pointed at), so none could be age-verified. Failing to avoid a false pass. If this repo installs from a private registry, pass registry_url naming it — the check then reads ages from there instead of dropping the gate. If the pins are genuinely unpublished, the 'age-check-bypass' label is the remaining way out."
              else
                all_skipped_reason="no pin in this change could be verified"
                echo "::error::All ${skipped_count} packages were skipped; no verification possible. Failing to avoid a false pass."
              fi
              # Every FAILING exit must leave the comment renderer something to
              # say. The snippet branches on `[ -s "$FAILURES_FILE" ]`, so an empty
              # file on a red run takes its delete path and removes a sticky left
              # by an earlier run — a legitimate "these pins are too new" comment
              # disappears on a run that failed for a different reason.
              preflight::record_unverifiable \
                "$(preflight::safe_list_for_md "${processed[@]}")" "—" "$all_skipped_reason"
              exit 1
            fi

            if [ "$failed" = true ]; then
              preflight::step_summary_failed "$MIN_AGE_DAYS" "$checked_count" "$skipped_count"
              echo ""
              echo "::error::One or more npm dependencies failed the age check."
              echo "To bypass for emergency security updates, add the 'age-check-bypass' label to this PR."
              exit 1
            fi

            # A lockfile the parser could not read is NOT a verified lockfile. The
            # run still exits 0 (see the Known limitations block for why these are
            # warnings rather than failures), but the footer must not assert a
            # clean bill of health directly beneath a ":warning: NOT age-checked"
            # row — that line is the one a reviewer skims.
            local unreadable_count=0
            if [ -s "$NPM_AGE_UNREADABLE_MARKER" ]; then
              unreadable_count=$(sort -u "$NPM_AGE_UNREADABLE_MARKER" | wc -l | tr -d ' ')
            fi
            if [ "$registry_free_count" -gt 0 ]; then
              preflight::step_summary_registry_free "$registry_free_count" "$checked_count"
            fi
            if [ "$checked_count" -eq 0 ] && [ "$registry_free_count" -gt 0 ] \
               && [ "$unreadable_count" -eq 0 ]; then
              echo "No registry dependencies to age-check (allow_registry_free)"
              return 0
            fi

            if [ "$unreadable_count" -gt 0 ]; then
              echo "| — | — | — | :warning: ${unreadable_count} lockfile(s) NOT age-checked |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::${checked_count} package(s) verified, but ${unreadable_count} lockfile(s) could not be age-checked — this run does not certify them"
              echo "Verified ${checked_count} npm package(s); ${unreadable_count} lockfile(s) could not be age-checked"
              return 0
            fi

            # Nothing was age-checked, and the reason is that everything this
            # change brought in resolves from outside a registry. Reporting those
            # arrivals (above) says what happened; this decides what it MEANS.
            #
            # Without it the run reaches the footer below and prints "Verified 0
            # package(s) at >= N days old :white_check_mark:" — a green tick, on a
            # change verified in no way at all. That sentence is what anyone
            # auditing checks at fleet scale reads as a pass WITH coverage, and it
            # is the whole reason this branch exists. A vendored dependency has no
            # publish date, so there is nothing for the age gate to measure; the
            # honest answer is to stop rather than to certify.
            #
            # Deliberately narrow, in both directions. It needs checked_count to
            # be 0, so it cannot fire for a change that also moved a registry pin
            # — that pin is age-checked on its own merits and a mixed change still
            # passes, with the arrivals named in the log and the table. And it
            # needs a vendored arrival, so a change touching no dependency at all
            # stays the quiet pass it should be.
            if [ "$checked_count" -eq 0 ] && [ "$vendored_count" -gt 0 ]; then
              if npm_age::registry_free_allowed; then
                echo "::warning::${vendored_count} newly-added dependency(ies) resolve from outside a registry and none could be age-checked. Passing because allow_registry_free is set."
                preflight::step_summary_registry_free "$vendored_count" 0
                echo "Nothing in this change could be age-checked (allow_registry_free)"
                return 0
              fi
              preflight::step_summary_registry_free "$vendored_count" "$checked_count"
              echo "::error::${vendored_count} newly-added dependency(ies) resolve from outside a registry (git, tarball, file:) and nothing from a registry, so no dependency could be age-checked. The arrivals are named above — review them on their contents rather than their age. If this repo vendors permanently, pass allow_registry_free: true to the reusable workflow; age-check-bypass is for verified-CVE overrides only (runbooks/phase-0-checklist.md)."
              preflight::record_unverifiable "npm" "—" \
                "every dependency this change adds or moves resolves from outside a registry, so none carries a publish date and nothing could be age-checked"
              return 1
            fi

            preflight::step_summary_all_passed "$checked_count" "$MIN_AGE_DAYS" "$skipped_count"
            echo "All npm dependencies are at least ${MIN_AGE_DAYS} days old"
          }

          # Only execute main when invoked directly (not when sourced).
          if [ "${BASH_SOURCE[0]}" = "$0" ] || [ -z "${BASH_SOURCE[0]:-}" ]; then
            npm_age::main "$@"
          fi

          # Example:
          #   MIN_AGE_DAYS=7 BASE_REF=main bash lib/age-check-npm.sh
          OPS_ROUTINES_AGE_CHECK_LIB

      - name: Run age-check-npm.sh
        id: age_check
        working-directory: ${{ inputs.working_directory }}
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          LOCKFILE_PATH: ${{ inputs.lockfile_path }}
          MAX_PINS: ${{ inputs.max_pins }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          # `record_failure` writes a TSV row here for each too-new pkg
          # so the post-step below can render the data into a comment
          # without redoing classification. Unset → no-op.
          AGE_CHECK_FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          # Reusable workflows do not inherit `env` from the caller, so
          # every AGE_CHECK_* the lib reads has to be threaded through an
          # input here or it is unreachable for consumers.
          # tests/workflow_lint_test.sh enforces that.
          AGE_CHECK_ALLOW_REGISTRY_FREE: ${{ inputs.allow_registry_free && '1' || '' }}
          AGE_CHECK_REGISTRY_URL: ${{ inputs.registry_url }}
        run: |
          # Written verbatim from lib/ by the `Write the age-check library` step(s)
          # above, into the same directory, so this resolves the shared libs the
          # way a local checkout does. See the header of
          # scripts/embed-lib-into-workflows.py.
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/ops-routines-lib/age-check-npm.sh"
          npm_age::main

      - name: Comment retry-after dates on PR
        if: ${{ !cancelled() && inputs.comment_on_failure && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          # An empty failures file only means "nothing to report" when
          # the check step itself went green. One that never started or
          # was killed mid-run leaves the same empty file, and the
          # renderer must not clear the sticky comment on that.
          RUN_OUTCOME: ${{ steps.age_check.outcome }}
          # Per-ecosystem render parameters. Bash body below is identical
          # across all reusables; only these env values change.
          ECOSYSTEM: npm
          ITEM_COLUMN: Package
          SEPARATOR: "@"
        run: |
          # ============================================================================
          # comment-on-failure.sh - Post sticky PR comment with retry-after dates
          # ============================================================================
          #
          # Embedded into each `age-check-<eco>.yml.tmpl` at the
          # `# @@COMMENT_ON_FAILURE@@` marker by `scripts/embed-lib-into-workflows.py`.
          #
          # Reads the TSV that `preflight::record_failure`,
          # `preflight::record_unverifiable`, `preflight::record_misconfigured`
          # and `preflight::record_not_run` wrote during the main run step (one
          # row per failed pin) and renders a single sticky comment. Each row
          # carries a `kind` column — `too_new`, `unverifiable`, `misconfigured`
          # or `not_run` — so the renderer can split into sections with the right
          # operator action: too-new pins get an eligible-after date and "wait
          # then push any commit"; unverifiable pins (registry/API outages,
          # missing manifests, etc.) get the upstream reason and "re-run the
          # failed check"; a misconfigured pin (an unpinned FROM, a malformed
          # image reference) and a not-run row (preflight stopped the check
          # before any pin — an unfetched base branch, a shallow clone) get their
          # reason, no re-run copy, and NO bypass offer — see the guard below.
          # Updates an existing sticky in place
          # (marker is `<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->`);
          # deletes the sticky on a clean run so a stale "X days remaining" doesn't
          # outlive the failure that produced it. "Clean" means the check step's
          # own outcome was `success` (RUN_OUTCOME), not merely that the file is
          # empty: a step that never started (a checkout failure ahead of it), a
          # syntax error in its `run:` block, or its shell being SIGKILLed or
          # OOM-killed while the runner survives all leave no rows on a red run,
          # and the sticky from an earlier run is still the best information the
          # PR has. (A cancelled job or a lost runner never gets this far: this
          # step does not run.)
          #
          # Soft-fails on permission denial (typical on Dependabot PRs where the
          # token is read-only) — emits a `::notice` so the run still succeeds and
          # the user can find retry-after dates in the Job Summary.
          #
          # Required env (set per-ecosystem in the calling step):
          #   GH_TOKEN, REPO, PR_NUMBER, RUN_URL, MIN_AGE_DAYS, FAILURES_FILE,
          #   ECOSYSTEM, ITEM_COLUMN, SEPARATOR
          # Optional env:
          #   RUN_OUTCOME — `steps.<id>.outcome` of the check step. Unset or empty
          #   reads as `success`, which is the behaviour before it existed.
          # ============================================================================

          set -euo pipefail

          MARKER="<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->"

          # `gh api ... --paginate` pages through all PR comments. The jq filter
          # selects whichever one carries our marker (there should be 0 or 1).
          # `--jq '... // empty'` returns the empty string when no match — keeps
          # `existing_id` testable with `[ -n "$existing_id" ]`.
          existing_id=$(
            gh api --paginate "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | first | .id // empty" \
              2>/dev/null || true
          )

          if [ -s "${FAILURES_FILE:-/dev/null}" ]; then
            body_file=$(mktemp)
            # Dedupe rows: a single pin referenced in N workflow / lockfile
            # entries records N identical TSV rows (one per file processed by
            # the main script). Per-file `::error file=…` annotations correctly
            # fire N times so each file in the Files Changed tab gets its own
            # inline annotation; this comment is a SUMMARY, not a per-file
            # annotation, so it should list each pin once. `sort -u` works
            # because age / eligible / remaining / kind are identical for a
            # given (id, version) within a single run (the script captures
            # `now_epoch` once at startup).
            deduped_failures=$(mktemp)
            sort -u "${FAILURES_FILE}" > "${deduped_failures}"

            # Split rows by kind, deduping cross-kind for the same pin. The
            # legacy assumption was "a pin is either too_new OR unverifiable in a
            # single run" — true within a single file, but a pin referenced in
            # two changed files can hit both branches if `gh api` succeeds for
            # file A and fails for file B (transient mid-run flake). When that
            # happens the too_new judgment is the durable answer (we have a valid
            # age from the file where the fetch succeeded); the unverifiable from
            # the other file is just noise. Without this dedup, a reviewer sees
            # the same pin in both sections with conflicting actions
            # ("wait until eligible" AND "re-run the failed check"), which is
            # confusing and slightly misleading.
            #
            # Two-pass awk via the `NR==FNR` trick: pass 1 collects the set of
            # (id, version) pairs that have a too_new row; pass 2 emits each row
            # to its kind's output file, skipping an unverifiable row when its
            # (id, version) is already in the too_new set. Empty `kind` column on
            # a legacy row defaults to too_new — defensive only; both writers
            # always set it.
            #
            # Wrapped in `if !` so a future regression in the awk script (output
            # path collision, syntax error, etc.) doesn't trip `set -e` and
            # silently suppress the comment — the whole point of this feature is
            # to surface failures at PR review time without forcing the reviewer
            # to dig into logs. The fallback splits by kind with grep instead, so
            # the reviewer still sees the failed pins, with a `::warning` flagging
            # the degraded render.
            too_new_failures=$(mktemp)
            unverifiable_failures=$(mktemp)
            misconfigured_failures=$(mktemp)
            not_run_failures=$(mktemp)
            if ! awk -F '\t' '
              NR == FNR {
                if (($7 == "" ? "too_new" : $7) == "too_new") {
                  too_new_pins[$1 "\t" $2] = 1
                }
                next
              }
              {
                kind = $7 == "" ? "too_new" : $7
                if (kind == "too_new") {
                  print > too_new_out
                } else if (kind == "unverifiable") {
                  key = $1 "\t" $2
                  if (!(key in too_new_pins)) {
                    print > unverifiable_out
                  }
                } else if (kind == "misconfigured") {
                  print > misconfigured_out
                } else if (kind == "not_run") {
                  print > not_run_out
                }
              }
            ' too_new_out="${too_new_failures}" \
              unverifiable_out="${unverifiable_failures}" \
              misconfigured_out="${misconfigured_failures}" \
              not_run_out="${not_run_failures}" \
              "${deduped_failures}" "${deduped_failures}"; then
              echo "::warning::age-check renderer failed to split rows by kind; falling back to a split without cross-kind dedupe — a pin that is both too-new and unverifiable in one run may be listed twice (see the per-pin annotations in this run for the real classification)."
              # Each kind still gets its own section — the not_run and
              # misconfigured copy is the remedy (a setting or an edit, not a
              # re-run), and the too-new columns would put an unverifiable reason
              # under "Eligible after" — split by the kind column with grep, since
              # awk is what just failed. What is lost is only the cross-kind
              # dedupe above.
              grep $'\tnot_run$' "${deduped_failures}" > "${not_run_failures}" || true
              grep $'\tunverifiable$' "${deduped_failures}" > "${unverifiable_failures}" || true
              grep $'\tmisconfigured$' "${deduped_failures}" > "${misconfigured_failures}" || true
              grep -vE $'\t(not_run|unverifiable|misconfigured)$' "${deduped_failures}" > "${too_new_failures}" || true
            fi

            # A sentinel version (`n/a`, `—`) marks a row for a whole file or a
            # whole run, which is not a "Module" or "Package"; head the id column
            # of every pin table neutrally when any such row is present — decided
            # on the raw rows, and with grep, not awk, so the fallback that exists
            # for a broken awk still heads the table right.
            id_column="${ITEM_COLUMN}"
            if grep -qE $'^[^\t]*\t(n/a|—)\t' "${deduped_failures}"; then
              id_column="Item"
            fi

            # The `| <id> | Reason |` table shared by the two reason-carrying pin
            # sections. $1 = that kind's rows.
            # shellcheck disable=SC2016  # literal backticks, as in the block below
            render_reason_table() {
              printf '| %s | Reason |\n' "${id_column}"
              printf '|---|---|\n'
              while IFS=$'\t' read -r id ver _age _min reason _remaining _kind; do
                [ -z "${id}" ] && continue
                # A row for a whole file or a whole run carries a sentinel
                # version; joining it with the separator renders `go.sum@n/a`,
                # which reads as a pin that does not exist.
                case "${ver}" in
                  n/a|—) printf '| `%s` | %s |\n' "${id}" "${reason}" ;;
                  *)     printf '| `%s%s%s` | %s |\n' \
                           "${id}" "${SEPARATOR}" "${ver}" "${reason}" ;;
                esac
              done < "$1"
              printf '\n'
            }

            # shellcheck disable=SC2016
            # The printf format strings below intentionally contain literal
            # backticks and `%s` placeholders for Markdown rendering — no shell
            # expansion is wanted in those slots.
            {
              printf '%s\n\n' "${MARKER}"
              printf '### Dependency Age Check failed — %s\n\n' "${ECOSYSTEM}"

              # Preflight exits before any pin is examined, so a not-run row never
              # shares a comment with the pin sections below.
              if [ -s "${not_run_failures}" ]; then
                printf '#### The check could not run\n\n'
                printf 'The check stopped before examining any dependency. The reason names the fix — a checkout or workflow setting, not a registry outage — so running the check again will not help until that setting is changed.\n\n'
                printf '| Where | Reason |\n'
                printf '|---|---|\n'
                while IFS=$'\t' read -r id _ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s` | %s |\n' "${id}" "${reason}"
                done < "${not_run_failures}"
                printf '\n'
              fi

              # Ahead of the other pin sections: these always need an edit, and
              # they are why the bypass offer below is missing.
              if [ -s "${misconfigured_failures}" ]; then
                printf '#### Pins that cannot be age-checked as written\n\n'
                printf 'The item(s) below are written in a form the check cannot age. The reason names the fix — a change to this PR, not a registry outage — so running the check again will not help until the pin is corrected.\n\n'
                render_reason_table "${misconfigured_failures}"
              fi

              if [ -s "${too_new_failures}" ]; then
                printf '#### Pins below quarantine\n\n'
                printf 'New pin(s) below have not yet reached the **%s-day** quarantine. Wait until the eligible date, push any new commit, and the check will pass.\n\n' "${MIN_AGE_DAYS}"
                printf '| %s | Age (days) | Eligible after | Days remaining |\n' "${id_column}"
                printf '|---|---:|---|---:|\n'
                while IFS=$'\t' read -r id ver age _min eligible remaining _kind; do
                  [ -z "${id}" ] && continue
                  # Sentinel-aware like render_reason_table above: a row of a kind
                  # the fallback's greps do not name lands here, sentinel and all.
                  case "${ver}" in
                    n/a|—) printf '| `%s` | %s | %s | %s |\n' \
                             "${id}" "${age}" "${eligible}" "${remaining}" ;;
                    *)     printf '| `%s%s%s` | %s | %s | %s |\n' \
                             "${id}" "${SEPARATOR}" "${ver}" "${age}" "${eligible}" "${remaining}" ;;
                  esac
                done < "${too_new_failures}"
                printf '\n'
              fi

              if [ -s "${unverifiable_failures}" ]; then
                printf '#### Pins that could not be verified\n\n'
                printf 'The item(s) below could not be age-checked. The reason names the cause and, where there is one, the fix. For an upstream fetch failure or a git error — usually transient — re-run the failed check from the Actions tab, and open an issue with the reason text if it keeps failing.\n\n'
                render_reason_table "${unverifiable_failures}"
              fi

              # No bypass offer under a not-run or misconfigured row: the label
              # genuinely clears the check, and the checkout would stay broken for
              # the next PR — or the unpinned image would merge on this one. Keyed
              # on the raw rows rather than the awk buckets, so the degraded
              # fallback above cannot restore the offer.
              if ! grep -qE $'\t(not_run|misconfigured)$' "${deduped_failures}"; then
                printf '> Need to merge sooner? Add the **`age-check-bypass`** label — verified-CVE emergencies only.\n'
              elif grep -q $'\tmisconfigured$' "${deduped_failures}"; then
                # Said out loud, for a reader of the too-new section beside it
                # who goes looking for the offer.
                printf '> No bypass is offered while a pin above needs fixing in this PR.\n'
              fi
              printf '\n<sub>Updated by `ops-routines-workflows/age-check-%s` · [run log](%s)</sub>\n' "${ECOSYSTEM}" "${RUN_URL}"
            } > "${body_file}"
            rm -f "${deduped_failures}" "${too_new_failures}" "${unverifiable_failures}" \
              "${misconfigured_failures}" "${not_run_failures}"

            if [ -n "${existing_id}" ]; then
              if ! gh api -X PATCH "/repos/${REPO}/issues/comments/${existing_id}" \
                   -F "body=@${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not update age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            else
              if ! gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not post age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            fi
            rm -f "${body_file}"
          elif [ "${RUN_OUTCOME:-success}" != success ]; then
            # Red (or skipped) check step and no rows: it died before recording
            # anything, so the empty file says nothing about the pins. Leave any
            # sticky alone rather than deleting a legitimate "too new" verdict.
            kept="No age-check comment was posted or changed."
            if [ -n "${existing_id}" ]; then
              kept="The existing age-check comment was kept; it reflects an earlier run and may be out of date."
            fi
            # `skipped` is a step that never started: an earlier step failed.
            what="ended with outcome '${RUN_OUTCOME}' before recording any result"
            if [ "${RUN_OUTCOME}" = skipped ]; then
              what="did not run because an earlier step failed"
            fi
            echo "::notice::The age check ${what}. ${kept} See the job log for why this run stopped."
          elif [ -n "${existing_id}" ]; then
            # Green run with no failures (neither too-new nor unverifiable); clear
            # the stale sticky if one exists so reviewers don't act on outdated
            # retry-after dates or stale upstream-error reasons.
            if ! gh api -X DELETE "/repos/${REPO}/issues/comments/${existing_id}" >/dev/null 2>&1; then
              echo "::notice::Could not delete stale age-check comment (id ${existing_id}). Caller workflow may need \`pull-requests: write\`."
            fi
          fi
