# ============================================================================
# REUSABLE: Go Module Age Check (supply-chain guard, PUBLIC mirror)
# ----------------------------------------------------------------------------
# Self-contained: the bash lib is inlined below. DO NOT EDIT DIRECTLY.
# Generated by `scripts/embed-lib-into-workflows.py` from:
#   - lib/_preflight.sh
#   - lib/age-check-go.sh
#   - templates/workflows/age-check-go.yml.tmpl
# ============================================================================
name: Dependency Age Check (Go, reusable)

on:
  workflow_call:
    inputs:
      min_age_days:
        description: "Minimum age in days for a newly added Go module."
        required: false
        type: number
        default: 7
      base_ref:
        description: "Base ref to diff against. Empty => use PR base ref or 'main'."
        required: false
        type: string
        default: ""
      exempt_module_prefixes:
        description: |
          Optional comma- or newline-separated same-owner module paths.
          Each entry must either end with "/" (a segment-safe module-path
          prefix: github.com/layervai/ matches github.com/layervai/frp but
          never github.com/layervai-evil/frp) or name one full module path to
          match exactly. A matching pin skips the age delay only after the Go
          proxy origin, exact GitHub tag, verified commit, and protected
          default-branch ancestry agree. Private modules require an exact exemption entry (prefixes do not
          select them) plus an exact private declaration. They require
          a published non-prerelease, a verified annotated tag, and its verified
          commit; private source releases need not be deployed first.
          Malformed entries or unverifiable
          provenance fail closed. Prefer this over age-check-bypass, which
          skips the ENTIRE check for every dependency in the PR.
        required: false
        type: string
        default: ""
      comment_on_failure:
        description: |
          Post a sticky PR comment listing modules that failed the age
          check and how many days each has left until eligible. Requires
          the calling job to grant `pull-requests: write` (Dependabot PRs
          need this granted explicitly; the default Dependabot token is
          read-only). Soft-fails to a `::notice` if the token can't write.
        type: boolean
        required: false
        default: false
      private_modules:
        description: |
          Optional newline-delimited exact module=owner/repo declarations for
          private GitHub modules. Root example:
          github.com/acme/widget=acme/widget. Nested example:
          github.com/acme/widget/auth=acme/widget, which resolves auth/vX.Y.Z.
        required: false
        type: string
        default: ""
      private_module_owner:
        description: "GitHub owner shared by every declared private module repository."
        required: false
        type: string
        default: ""
      private_module_repositories:
        description: |
          Newline-delimited repository names. Must exactly match private_modules;
          this is passed verbatim to the App token's repository allowlist.
        required: false
        type: string
        default: ""
      private_module_require_verified_tags:
        description: "Require GitHub-verified annotated tags for private modules. Defaults false; weaker provenance emits a warning."
        required: false
        type: boolean
        default: false
    secrets:
      OPS_ROUTINES_APP_ID:
        description: "App ID used only when private_modules is non-empty."
        required: false
      OPS_ROUTINES_APP_PRIVATE_KEY:
        description: "App private key used only when private_modules is non-empty."
        required: false

permissions:
  contents: read

concurrency:
  group: age-check-go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-go-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only used when `comment_on_failure: true`. Caller's job-level
      # `permissions:` block caps this; if the caller restricts to
      # `contents: read` (or runs as Dependabot without an explicit
      # grant), the post-step soft-fails to a `::notice`.
      pull-requests: write
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'age-check-bypass') }}
    steps:
      - name: Require private-module configuration
        if: ${{ inputs.private_modules != '' }}
        env:
          APP_ID: ${{ secrets.OPS_ROUTINES_APP_ID }}
          PRIVATE_KEY: ${{ secrets.OPS_ROUTINES_APP_PRIVATE_KEY }}
          OWNER: ${{ inputs.private_module_owner }}
          REPOSITORIES: ${{ inputs.private_module_repositories }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$OWNER" ] || [ -z "$REPOSITORIES" ]; then
            echo "::error::Private Go modules require App credentials, owner, and exact repositories."
            exit 1
          fi

      - name: Validate private-module token scope
        if: ${{ inputs.private_modules != '' }}
        # Scope-only defense before minting: the authoritative module-path and
        # provenance validation remains in the inlined age-check-go.sh below.
        # This compact check is deliberately repeated because the token must
        # not exist until its scope is proven; tests execute both forms.
        env:
          PRIVATE_MODULES: ${{ inputs.private_modules }}
          OWNER: ${{ inputs.private_module_owner }}
          REPOSITORIES: ${{ inputs.private_module_repositories }}
        run: |
          if [[ ! "$OWNER" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,37}[A-Za-z0-9])$ ]] \
            || [[ "$OWNER" == *--* ]]; then
            echo "::error::Invalid private-module GitHub owner: $OWNER"
            exit 1
          fi
          declared=""
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            if [[ "$line" != *=* ]] || [[ "${line#*=}" == *=* ]]; then
              echo "::error::Malformed private module declaration: $line"
              exit 1
            fi
            repo="${line#*=}"
            if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]] \
              || [[ "${repo#*/}" == *. ]] || [ "${repo%%/*}" != "$OWNER" ]; then
              echo "::error::Private module repository is invalid or outside owner $OWNER: $repo"
              exit 1
            fi
            declared+="${repo#*/}"$'\n'
          done <<< "$PRIVATE_MODULES"
          supplied=""
          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue
            if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]] || [[ "$repo" == *. ]]; then
              echo "::error::Invalid private-module token repository: $repo"
              exit 1
            fi
            supplied+="$repo"$'\n'
          done <<< "$REPOSITORIES"
          if [ -z "$declared" ] || [ "$(printf '%s' "$declared" | sort -u)" != "$(printf '%s' "$supplied" | sort -u)" ] \
            || [ "$(printf '%s' "$supplied" | sort | uniq -d)" != "" ]; then
            echo "::error::Private-module token repositories must exactly match the declared repositories"
            exit 1
          fi

      - name: Mint exact private-module reader token
        if: ${{ inputs.private_modules != '' }}
        id: private_module_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_ROUTINES_APP_ID }}
          private-key: ${{ secrets.OPS_ROUTINES_APP_PRIVATE_KEY }}
          owner: ${{ inputs.private_module_owner }}
          repositories: ${{ inputs.private_module_repositories }}
          permission-contents: read

      - name: Checkout consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run age-check-go.sh
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          BASE_REF: ${{ inputs.base_ref != '' && inputs.base_ref || (github.event.pull_request.base.ref || 'main') }}
          EXEMPT_MODULE_PREFIXES: ${{ inputs.exempt_module_prefixes }}
          FIRST_PARTY_MODULE_OWNER: ${{ github.repository_owner }}
          FIRST_PARTY_GH_TOKEN: ${{ github.token }}
          PRIVATE_MODULES: ${{ inputs.private_modules }}
          PRIVATE_MODULE_OWNER: ${{ inputs.private_module_owner }}
          PRIVATE_MODULE_REPOSITORIES: ${{ inputs.private_module_repositories }}
          PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS: ${{ inputs.private_module_require_verified_tags }}
          GH_TOKEN: ${{ steps.private_module_token.outputs.token }}
          # `record_failure` writes a TSV row here for each too-new module
          # so the post-step below can render the data into a comment
          # without redoing classification. Unset → no-op.
          AGE_CHECK_FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
        run: |
          # ============================================================================
          # _preflight.sh - Shared preflight helpers for age-check-*.sh
          # ============================================================================
          #
          # Sourced by each ecosystem-specific age-check script so the validator
          # logic stays consistent. Covers the class of silent-pass bugs that
          # bit the sibling per-repo dep-age checks (website#189, qurl-mcp#52,
          # qurl-portal#14, qurl-typescript#32, discord#21) before they were
          # hardened, plus the preflight probes those rounds added:
          #
          # - Positive-integer validation for MIN_AGE_DAYS (reject 0 and
          #   non-numeric)
          # - GNU `date -d` availability probe (catches BSD/macOS silently
          #   replacing GNU date)
          # - Required-tool existence checks (caller supplies its exact tool list)
          # - Explicit base_ref verification before `git diff` so a missing ref
          #   doesn't get conflated with "no changes detected" by a trailing
          #   `|| true` on the filter pipeline
          # - One resolution of "the base" — the merge base of base_ref and HEAD —
          #   so a parser that reads a base image (`git show <rev>:<path>`) sees
          #   the same revision its three-dot `git diff` compares against
          # - Step-summary helpers so the Actions UI never shows an empty panel
          #   on early-exit paths
          # - Shared age comparison + ISO-8601 parsing to keep those callers
          #   minimal
          #
          # REQUIRED CALL ORDER in main():
          #
          #   preflight::require_tools <tool> [...]      # tools first
          #   preflight::require_gnu_date                # then date-d probe
          #   preflight::validate_min_age_days           # then env validation
          #   preflight::verify_base_ref "origin/${BASE_REF}"  # MUST come before any
          #                                              # subsequent `git diff` — see
          #                                              # the function comment for
          #                                              # the silent-pass reason. Also
          #                                              # resolves the merge base once;
          #                                              # read it via preflight::base_rev
          #                                              # for every `<rev>:<path>` read.
          #
          # Usage (from an age-check script):
          #
          #   # shellcheck source=lib/_preflight.sh
          #   source "$(dirname "${BASH_SOURCE[0]}")/_preflight.sh"
          #
          # ============================================================================

          # Guard against double-sourcing — IFS and `set -e` state are caller's.
          if [ -n "${_PREFLIGHT_SOURCED:-}" ]; then
            return 0
          fi
          _PREFLIGHT_SOURCED=1

          # ----- Required-tool probes --------------------------------------------------

          preflight::require_tools() {
            local missing=()
            local tool
            for tool in "$@"; do
              command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Required tools not available on runner: ${missing[*]}. This workflow depends on ubuntu-latest (or a runner image with these installed)."
              exit 1
            fi
          }

          # GNU date supports `date -d @<epoch>` syntax that BSD/macOS date
          # rejects. Every age-check script converts an ISO-8601 timestamp to
          # epoch via `date -d "$ts" +%s`; probing up front catches a silent
          # regression if the runner ever stops providing GNU date.
          preflight::require_gnu_date() {
            if ! date -d @0 >/dev/null 2>&1; then
              echo "::error::GNU date -d not available on runner — this workflow depends on GNU date's \`@\`-prefix epoch syntax. Fix: run on an \`ubuntu-latest\` / Linux runner, or replace the \`date -d\` calls with a portable alternative (e.g., \`python -c 'from datetime import datetime; ...'\`)."
              exit 1
            fi
          }

          # ----- MIN_AGE_DAYS validation ----------------------------------------------

          # Accept only POSITIVE integers (numeric value >= 1). Leading zeros are
          # allowed because some config generators pad to fixed width (e.g. "07");
          # a `07 ... 10#` base-10 round-trip keeps later arithmetic from tripping
          # on bash's octal parsing of zero-prefixed numbers at `$age_days -lt
          # $MIN_AGE_DAYS`.
          #
          # Rejects: 0, 00, negatives, non-numeric, empty.
          # Accepts: 1, 07, 100, 0007.
          preflight::validate_min_age_days() {
            local raw="${MIN_AGE_DAYS:-}"
            # Require at least one digit, reject non-digits. The `10#` base-10
            # prefix on the arithmetic below sidesteps bash's octal interpretation
            # of leading zeros (`$((07))` is 7 but `$((08))` is a syntax error).
            if ! [[ "$raw" =~ ^[0-9]+$ ]]; then
              echo "::error::MIN_AGE_DAYS must be a positive integer (got: ${raw:-<unset>})"
              exit 1
            fi
            if [ "$((10#$raw))" -lt 1 ]; then
              echo "::error::MIN_AGE_DAYS must be >= 1 (got: ${raw}). Zero would make the quarantine a silent-pass no-op."
              exit 1
            fi
            # Normalize to the base-10 numeric form so all subsequent callers do
            # integer comparisons without re-parsing leading zeros. Exported
            # because the variable was passed via env and most scripts reference
            # it directly rather than through a local.
            MIN_AGE_DAYS=$((10#$raw))
            export MIN_AGE_DAYS
          }

          # ----- Base-ref verification -------------------------------------------------

          # Verify the base ref exists in the local checkout before running
          # `git diff` against it. Without this, `git diff ... 2>/dev/null` on
          # a missing ref produces empty output, and a trailing `|| true` on
          # the downstream filter pipeline silently swallows the failure — the
          # script exits 0 with "No changes detected" even though the diff
          # never ran. Friendly error here, explicit failure exit.
          #
          # MUST BE CALLED before any subsequent `git diff`. Callers that extract
          # a diff via `$(git diff ...)` inside a helper function are protected
          # by this preflight *only* for the expected "missing base ref" failure
          # mode; for catastrophic git failures mid-script the helper still needs
          # its own failure branch — `preflight::git_diff_or_fail` below is that
          # branch, and keeps the diagnosis off the caller's captured stdout.
          #
          # Also resolves "the base" ONCE, as the merge base of base_ref and HEAD,
          # and exposes it via `preflight::base_rev`. Every `git diff
          # ${base_ref}...HEAD` in the ecosystem scripts already compares against
          # that merge base (three-dot semantics); a parser that instead READS a
          # base image — `git show <rev>:<path>`, `git cat-file -e` — must read
          # the same revision, or the two halves of one function disagree about
          # which base they mean. Read at the TIP of base_ref, any dependency the
          # base branch dropped or bumped after this branch forked is present in
          # the head image and absent from the base one, so it reads as newly
          # added and, if young, fails a PR that never touched it. Every
          # ecosystem's main() hands its parsers this revision rather than the
          # ref, so no call site re-derives what "the base" means.
          preflight::verify_base_ref() {
            local base_ref="$1"
            if [ -z "$base_ref" ]; then
              echo "::error::preflight::verify_base_ref called with empty argument"
              exit 1
            fi
            # Sanitized once, here, for every surface the two failures below reach
            # — the log line, the PR-comment row and the summary footer all render
            # markdown, and a legally-named ref can carry `_`, `#` or a backtick.
            local safe_ref; safe_ref=$(preflight::safe_for_md "$base_ref")
            if ! git rev-parse --verify --quiet "$base_ref" >/dev/null; then
              preflight::fail_not_run "$safe_ref" "base ref ${safe_ref} is not in this checkout — the base branch has to be fetched (fetch-depth: 0 on actions/checkout)"
            fi
            # A ref that resolves is not yet a usable base: on a shallow checkout
            # (fetch-depth: 1) it exists but shares no reachable history with
            # HEAD, and every three-dot diff downstream would fail on the same
            # missing merge base. Failing here names the fix once, for every
            # ecosystem.
            if ! _PREFLIGHT_BASE_REV=$(git merge-base "$base_ref" HEAD); then
              preflight::fail_not_run "$safe_ref" "could not resolve the merge base of ${safe_ref} and HEAD — most often a shallow checkout, in which case the workflow needs fetch-depth: 0 on actions/checkout"
            fi
            # The parsers are handed the revision, not the ref, and name only the
            # revision in their own diagnostics; this is where the log ties the two.
            echo "Base ${safe_ref}: merge base with HEAD is ${_PREFLIGHT_BASE_REV}"
          }

          # Fail a run that never got to examine a pin, on every surface an
          # operator might read: the log annotation, the failures TSV as a
          # `not_run` row (so the PR comment carries the remedy — see
          # record_not_run for why that row gets its own section) and the
          # step-summary footer. For the failures a consumer repo reaches through
          # an ordinary workflow setting — an unfetched base branch, a shallow
          # checkout — because the PR comment is the one surface an operator sees
          # without opening the run log. That comment only exists when there is a
          # pull request to put it on: the render step is gated on a PR number,
          # so a `push` or `workflow_dispatch` run — the shapes that reach these
          # failures most easily — gets the ::error and the summary footer only.
          # Coding errors stay ::error-only. The footer lands before any ecosystem
          # header, since preflight runs first; its text stands on its own.
          #
          # Both arguments arrive SANITIZED (see verify_base_ref): they are rendered
          # as markdown twice over. `reason` is one lowercase clause with no
          # terminal period — the footer wraps it as `— ${reason}.` and the
          # comment renders it in a table cell beside short sibling clauses.
          preflight::fail_not_run() {
            local display_id="$1" reason="$2"
            echo "::error::${reason}"
            preflight::record_not_run "$display_id" "$reason"
            preflight::step_summary_unverifiable "$reason"
            exit 1
          }

          # Assert verify_base_ref has run. `base_rev` uses it as its guard;
          # callers can also invoke it right before a `git diff` as a static
          # sanity check that the required-call-order convention was followed.
          # Stderr, because `base_rev` is read through `$(...)` and a message on
          # stdout would be captured and lost.
          preflight::require_base_ref_verified() {
            if [ -z "${_PREFLIGHT_BASE_REV:-}" ]; then
              echo "::error::preflight::verify_base_ref must be called before any git diff. This is a coding error, not a runtime condition." >&2
              exit 1
            fi
          }

          # The merge base `verify_base_ref` resolved, on stdout — the revision
          # every parser reads its base image from and diffs against, never the
          # tip of base_ref. Fails closed if verify_base_ref has not run: with an
          # empty revision `git show :<path>` reads the INDEX, a silent wrong
          # answer rather than an error.
          preflight::base_rev() {
            preflight::require_base_ref_verified
            printf '%s\n' "$_PREFLIGHT_BASE_REV"
          }

          # `git diff` for the separable parsers, which `main` reads through
          # `$(...)`. That makes a parser's stdout the work-list, so a failure is
          # announced on stderr — where it reaches the job log and the annotations
          # panel rather than the captured (and, under `set -e`, discarded) stdout —
          # and the caller propagates the non-zero return:
          #
          #   diff_out=$(preflight::git_diff_or_fail "${base_rev}...HEAD" -- "$file") || return 1
          preflight::git_diff_or_fail() {
            git diff "$@" || {
              # `%q` keeps the reproduced command re-runnable (pathspec globs stay
              # quoted) and, unlike `$*`, does not join on the libs' newline+tab IFS.
              local cmd; printf -v cmd ' %q' "$@"
              echo "::error::git diff${cmd} failed" >&2
              return 1
            }
          }

          # ----- ISO-8601 → epoch helper ----------------------------------------------

          # Every ecosystem converts a registry-returned ISO-8601 timestamp into
          # epoch seconds via `date -d "$ts" +%s`, and every one had its own
          # error-handling branch. Shared helper echoes epoch on stdout, exits 1
          # on parse failure with the offending timestamp in the stderr message.
          # Caller can use `if ! epoch=$(preflight::iso8601_to_epoch "$ts"); then
          # ...skip or fail... fi`.
          preflight::iso8601_to_epoch() {
            local ts="$1"
            local epoch
            if [ -z "$ts" ]; then
              return 1
            fi
            if ! epoch=$(date -d "$ts" +%s 2>/dev/null); then
              return 1
            fi
            echo "$epoch"
          }

          # Given a publish epoch + now epoch + MIN_AGE_DAYS, emit the age in
          # days on stdout and return a classification via exit code:
          #   0 - passes; age >= MIN_AGE_DAYS + 2 (clearly past threshold)
          #   2 - passes but borderline; MIN_AGE_DAYS <= age <= MIN_AGE_DAYS + 1
          #       (the "just past threshold" :eyes: case — advance warning that
          #       a small threshold bump or an unpublish would flip this PR)
          #   1 - fails; age < MIN_AGE_DAYS (too new)
          #
          # !!! CALLER CONVENTION !!!
          # Callers MUST use a 3-way `case` on the exit code, NOT a 2-way
          # `if/then/else`. A naïve `if preflight::classify_age …; then ok; else fail; fi`
          # would silently misclassify BOTH `1` (too_new) AND `2` (borderline)
          # as failures — losing the advance-warning signal and (worse) treating
          # a borderline pass as a block.
          #
          # Correct pattern:
          #   rc=0
          #   age_days=$(preflight::classify_age "$pub" "$now" "$MIN_AGE_DAYS") || rc=$?
          #   case "$rc" in
          #     0) ok ;;
          #     2) borderline ;;
          #     *) too_new ;;  # catches 1 and any future non-pass codes
          #   esac
          #
          preflight::classify_age() {
            local publish_epoch="$1" now_epoch="$2" min_age_days="$3"
            local age_days=$(( (now_epoch - publish_epoch) / 86400 ))
            echo "$age_days"
            if [ "$age_days" -lt "$min_age_days" ]; then
              return 1
            fi
            if [ "$age_days" -le "$((min_age_days + 1))" ]; then
              return 2
            fi
            return 0
          }

          # Given a publish epoch + MIN_AGE_DAYS, echo the ISO date (UTC) when
          # the package becomes eligible. Used in the "too new" error message
          # so developers know when to retry without needing the bypass label.
          # Falls back to "unknown" on parse error rather than breaking the
          # error message flow.
          preflight::eligible_date_utc() {
            local publish_epoch="$1" min_age_days="$2"
            date -u -d "@$((publish_epoch + min_age_days * 86400))" +%Y-%m-%d 2>/dev/null || echo "unknown"
          }

          # Append a single failure row to a workflow-level TSV so a downstream
          # job step can render the data into a PR comment without re-doing the
          # classification work. No-op when AGE_CHECK_FAILURES_FILE is unset (the
          # common case — local dev, callers that didn't opt into the comment
          # feature). Format is one row per failed pin:
          #
          #   <display_id>\t<display_version>\t<age_days>\t<min_age_days>\t<eligible_date>\t<days_remaining>\t<kind>
          #
          # `kind` is `too_new` (this helper) or `unverifiable` (sibling helper
          # `preflight::record_unverifiable`). The downstream renderer splits on
          # kind so each failure class gets the right operator guidance:
          # too-new → "wait until the eligible date"; unverifiable → "re-run".
          #
          # Tabs were chosen over JSON because the consumer (a small bash step in
          # the template) parses with `IFS=$'\t' read` — no jq dependency, and
          # `display_id` / `display_version` have already been run through
          # `safe_for_md` so they cannot contain tabs.
          #
          # `days_remaining` is computed as calendar-day delta between today (UTC,
          # midnight) and the eligible-after date. That matches the `eligible_date`
          # column the user reads on the same row — the alternative (`min - age`)
          # off-by-ones on freshly-committed pins because `age_days` floors:
          # a pin committed 22h ago has age_days=0, so `min - age` would suggest
          # "wait 7 days" when in calendar terms only 6 days remain until eligible.
          # Falls back to the floor approximation only if the eligible string is
          # unparseable (defensive — should never happen since the caller fed it
          # through `eligible_date_utc`). Clamped at 0 to defend against clock
          # skew producing a negative.
          preflight::record_failure() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" age_days="$3"
            local min_age_days="$4" eligible="$5"
            local days_remaining today_epoch eligible_epoch
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s 2>/dev/null || true)
            eligible_epoch=$(date -u -d "${eligible}" +%s 2>/dev/null || true)
            if [ -n "${today_epoch}" ] && [ -n "${eligible_epoch}" ]; then
              days_remaining=$(( (eligible_epoch - today_epoch) / 86400 ))
            else
              days_remaining=$(( min_age_days - age_days ))
            fi
            [ "$days_remaining" -lt 0 ] && days_remaining=0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "$age_days" \
              "$min_age_days" "$eligible" "$days_remaining" \
              "too_new" \
              >> "$file"
          }

          # Sibling of `record_failure` for the "couldn't fetch metadata" failure
          # class — a pin shape-checks fine, but the registry / API / proxy returned
          # an error or empty body so the script can't compute an age. Without
          # this, transient upstream failures produce a red required check with
          # no PR-level explanation: the comment-on-failure step gates on `[ -s
          # FAILURES_FILE ]`, and the only writer was `record_failure` (too-new
          # only). The reviewer then has to dig into the run log to discover that
          # the failure was a 5xx and a re-run will pass.
          #
          # Writes the same TSV schema as `record_failure` so the renderer reads
          # one format. The age / eligible / remaining columns carry sentinels
          # (`?` / "n/a" / `?`) — the renderer hides those columns for the
          # unverifiable section since "wait N days" copy doesn't apply. The
          # `reason` arg is what gets shown to the operator in lieu of the
          # eligible-after date.
          #
          # Args:
          #   $1 display_id        already sanitized via safe_for_md
          #   $2 display_version   already sanitized via safe_for_md
          #   $3 reason            short human-readable cause, e.g.
          #                        "gh api unreachable or commit not found"
          #                        — surfaces in the comment so the reviewer
          #                        knows whether to re-run or open an upstream
          #                        issue. Tabs are stripped to keep the row
          #                        parseable.
          preflight::record_unverifiable() {
            preflight::_record_reason_row "$1" "$2" "${3:-unknown reason}" unverifiable
          }

          # A row of kind `not_run`: the check stopped in preflight, before it
          # examined a single pin — an unfetched base branch, a shallow clone. The
          # remedy is a checkout setting, so the comment renders these in their
          # own section with no "re-run" copy and no `age-check-bypass` offer:
          # re-running cannot help, and the label would switch the gate off for a
          # PR whose checkout is what needs fixing. `display_id` is the base ref,
          # already sanitized (see verify_base_ref).
          preflight::record_not_run() {
            preflight::_record_reason_row "$1" "n/a" "$2" not_run
          }

          # Shared writer for the reason-carrying kinds. Strips characters that
          # would corrupt the downstream comment:
          #   - tabs/newlines break `IFS=$'\t' read` (multiline reason would
          #     produce row count != failure count)
          #   - `|` breaks the markdown table layout — the reason cell sits
          #     between two `|` separators in the rendered comment, and an
          #     embedded `|` would split the row into extra columns. All
          #     in-tree call sites pass pipe-free strings today; this strip
          #     defends a future caller forwarding upstream error text (e.g.,
          #     curl stderr that happens to contain `|`).
          preflight::_record_reason_row() {
            local file="${AGE_CHECK_FAILURES_FILE:-}"
            [ -z "$file" ] && return 0
            local display_id="$1" display_version="$2" reason="$3" kind="$4"
            reason=$(printf '%s' "$reason" | tr -d '\t\n|')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$display_id" "$display_version" "?" \
              "n/a" "$reason" "?" \
              "$kind" \
              >> "$file"
          }

          # ----- Shared age-check outcome helper --------------------------------------

          # Classify a dependency's age and emit the full CI output for it
          # (markdown row + log annotation). Returns an exit code the caller
          # can map to its counters. For the typical caller pattern that
          # updates both `checked_count` and `failed`, use the thin wrapper
          # `preflight::age_row_and_tally` which does the mapping via bash's
          # dynamic scoping.
          #
          # !!! SECURITY CONTRACT !!!
          # `display_id` and `display_version` are interpolated directly into:
          #   - the markdown row (caller-inspectable via $GITHUB_STEP_SUMMARY)
          #   - log lines (visible in the Actions job log)
          # This helper does NOT re-sanitize them. Callers MUST pre-sanitize via
          # `preflight::safe_for_md` (or a tighter ecosystem-specific validator
          # like `is_valid_pkg_name`) before passing in, otherwise a crafted
          # lockfile / registry response could inject active markdown into the
          # step summary.
          #
          # Arguments:
          #   $1 display_id        e.g. "lodash" or "actions/checkout" (sanitized)
          #   $2 display_version   e.g. "4.17.21" or "1a2b3c4d" (sanitized)
          #   $3 publish_time      ISO-8601 string from the registry
          #   $4 now_epoch         caller's pre-computed `date +%s`
          #   $5 min_age_days      positive integer (caller already validated)
          #   $6 verb              past-tense verb for too-new error messages
          #                        ("published" | "committed" | "tagged" |
          #                        "built" | "uploaded"). Defaults to "published".
          #   $7 file_hint         optional source filename for `file=` annotation
          #   $8 separator         how to join id + version in log lines. Default
          #                        "@"; pip uses "==".
          #
          # Exit codes (richer than ok/fail so callers can distinguish borderline
          # from too_new, and parse_error from a real too-new result):
          #   0 — ok (clearly past threshold)
          #   1 — too_new
          #   2 — borderline (just past threshold; counts as pass, with :eyes: row)
          #   3 — parse_error (malformed ISO-8601 or missing required arg)
          preflight::age_row_for_publish() {
            local display_id="$1" display_version="$2" publish_time="$3"
            local now_epoch="$4" min_age_days="$5"
            local verb="${6:-published}"
            local file_hint="${7:-}"
            local sep="${8:-@}"

            # Required-arg validation. Name the specific missing arg in the
            # error so a future caller doesn't have to bisect. `verb`, `file_hint`,
            # `sep` have defaults; the five below do not. Empty values would
            # surface later as arithmetic errors or spurious row text.
            local arg
            for arg in display_id display_version publish_time now_epoch min_age_days; do
              if [ -z "${!arg}" ]; then
                echo "::error::preflight::age_row_for_publish: required arg \`${arg}\` was empty" >&2
                return 3
              fi
            done

            # Full identifier for log lines; row cells stay separate.
            local full_id="${display_id}${sep}${display_version}"

            # GitHub Actions annotation format requires `::` between command
            # (+ optional params) and message. `::error::msg` is valid;
            # `::error msg` is NOT and will render as plain log text. So:
            #   no file_hint → `::` (bare delimiter)
            #   with hint    → ` file=<path>::` (leading space separates
            #                  `::error` from params, trailing `::` closes them)
            local file_prefix="::"
            [ -n "$file_hint" ] && file_prefix=" file=${file_hint}::"

            local publish_epoch
            if ! publish_epoch=$(preflight::iso8601_to_epoch "$publish_time"); then
              echo "::error${file_prefix}Could not parse publish timestamp for ${full_id}: ${publish_time}"
              echo "| \`${display_id}\` | ${display_version} | — | :x: parse error |" >> "$GITHUB_STEP_SUMMARY"
              return 3
            fi

            local age_days class_rc=0
            age_days=$(preflight::classify_age "$publish_epoch" "$now_epoch" "$min_age_days") || class_rc=$?

            case "$class_rc" in
              0)
                echo "  OK: ${full_id} (${age_days} days old)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
                return 0
                ;;
              2)
                echo "::notice${file_prefix}${full_id} is ${age_days} day(s) old — just past the ${min_age_days}-day threshold"
                echo "  OK: ${full_id} (${age_days} days old, barely past threshold)"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :eyes: just past threshold |" >> "$GITHUB_STEP_SUMMARY"
                return 2
                ;;
              *)
                local eligible; eligible=$(preflight::eligible_date_utc "$publish_epoch" "$min_age_days")
                echo "::error${file_prefix}${full_id} ${verb} ${age_days} day(s) ago (minimum: ${min_age_days}; eligible after ${eligible})"
                echo "| \`${display_id}\` | ${display_version} | ${age_days} | :x: **too new** (eligible after ${eligible}) |" >> "$GITHUB_STEP_SUMMARY"
                preflight::record_failure "$display_id" "$display_version" "$age_days" "$min_age_days" "$eligible"
                return 1
                ;;
            esac
          }

          # Wraps `preflight::age_row_for_publish` and updates the caller's
          # `checked_count` and `failed` via bash's dynamic scoping. This is the
          # call most ecosystem scripts should use — one line, no case statement
          # at the callsite.
          #
          # Convention: caller MUST have locals named exactly `checked_count`
          # (integer) and `failed` ("true"/"false"). These are looked up through
          # the dynamic scope chain at runtime — no nameref magic, works on
          # bash >= 4.0 (and on macOS bash 3.2 for local-dev tests).
          #
          # Outcome mapping:
          #   ok (rc 0)            → checked_count++
          #   borderline (rc 2)    → checked_count++
          #   too_new (rc 1)       → checked_count++, failed=true
          #   parse_error (rc 3)   → failed=true (checked not incremented)
          #
          # All args are passed through to age_row_for_publish unchanged.
          preflight::age_row_and_tally() {
            local rc=0
            preflight::age_row_for_publish "$@" || rc=$?
            # Deliberate dynamic-scope writes: caller provides `checked_count`
            # and `failed` as locals; we update them in place.
            # shellcheck disable=SC2034
            case "$rc" in
              0|2) checked_count=$((checked_count + 1)) ;;
              1)   checked_count=$((checked_count + 1)); failed=true ;;
              3)   failed=true ;;
            esac
          }

          # ----- Output sanitization --------------------------------------------------

          # Sanitize arbitrary strings before writing to $GITHUB_STEP_SUMMARY.
          # Used for values that either pre-date a validator (the invalid-name
          # branch in each ecosystem) or come from untrusted lockfile / registry
          # output (version strings, image tags). Strips to a character class
          # that can't form active markdown (link/image/emphasis/HTML) and caps
          # length at 80 so a crafted over-long entry can't blow out the summary.
          #
          # Kept permissive enough that legitimate semver (`1.2.3+build.7`) and
          # scoped package names (`@scope/name`) survive round-trip unchanged.
          #
          # `LC_ALL=C` forces byte-level (ASCII-only) behavior so the tr + head
          # combo is deterministic across hosts. In a UTF-8 locale, `[:alnum:]`
          # would keep accented Latin letters and CJK chars, and `head -c 80`
          # could split a multibyte char at the boundary. Neither is a security
          # hole (markdown injection is still blocked), but byte-level behavior
          # is easier to audit and test. Unicode homoglyph attacks on package
          # names are a separate concern — handled (if at all) by the caller's
          # `is_valid_*` ASCII-only allowlists, not here.
          preflight::safe_for_md() {
            LC_ALL=C printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:]@/_.:+-' | LC_ALL=C head -c 80
          }

          # ----- Operational knobs ----------------------------------------------------
          #
          # Not sanitization: these validate tuning inputs. Kept below the
          # sanitization block so the markdown-allowlist rationale above stays
          # attached to safe_for_md, which is the function a maintainer reads it
          # for.

          # Validate an operational positive-integer knob, echoing the value to
          # use. Normalizes leading zeros through a base-10 round-trip for the
          # same reason validate_min_age_days does — a `010` would otherwise be
          # read as octal by arithmetic contexts.
          #
          # Unlike validate_min_age_days this FALLS BACK rather than aborting:
          # MIN_AGE_DAYS is the security threshold, while these are tuning knobs
          # (work-list caps, budgets), and a fat-fingered value must not take a
          # supply-chain check offline. The warning goes to stderr because callers
          # read the value from stdout.
          preflight::validate_positive_int() {
            local name="$1" value="$2" fallback="$3"
            # Unset/empty is "not provided", not "misconfigured" — take the
            # fallback silently. Warning here would fire on every run for any
            # consumer whose workflow revision predates the input (the
            # `ref: main` split makes that a real population), and would blame
            # them for a value they never set. The ::warning below is reserved for
            # a value that is present and genuinely unusable.
            if [ -z "$value" ]; then
              printf '%s' "$fallback"
              return 0
            fi
            if [[ "$value" =~ ^[0-9]+$ ]]; then
              value=$((10#$value))
            else
              value=0
            fi
            if [ "$value" -lt 1 ]; then
              echo "::warning::${name} is not a positive integer; falling back to ${fallback}" >&2
              value="$fallback"
            fi
            printf '%s' "$value"
          }

          # Sanitize each element of a list and join with ", ". safe_for_md's
          # `tr -cd` keeps neither `,` nor space, so sanitizing an already-joined
          # string collapses "package-lock.json, yarn.lock" into
          # "package-lock.jsonyarn.lock". Map-then-join makes the safe order the
          # obvious one for the next caller.
          preflight::safe_list_for_md() {
            local out="" item safe
            for item in "$@"; do
              safe=$(preflight::safe_for_md "$item")
              # Skip an element that sanitized away entirely. Testing the
              # ACCUMULATOR for emptiness instead would emit a dangling "a, " for a
              # trailing empty and "a, , c" for a middle one — the same class of
              # mis-rendering this function was added to fix, one step further out.
              [ -n "$safe" ] || continue
              out="${out:+${out}, }${safe}"
            done
            printf '%s' "$out"
          }

          # ----- Step-summary helpers --------------------------------------------------

          # `GITHUB_STEP_SUMMARY` is provided by GitHub Actions; default to
          # /dev/null for local runs so the helper doesn't error out. The
          # workflow always provides it in CI.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          preflight::step_summary_header() {
            local ecosystem="$1"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "| Package | Version | Age (days) | Status |"
              echo "|---------|---------|------------|--------|"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # For the "no changes" / "no deps" early-exit paths. Writes a single
          # summary blockquote line so the Actions UI reflects the early-exit
          # outcome instead of an empty summary panel.
          preflight::step_summary_no_changes() {
            local ecosystem="$1" reason="$2"
            {
              echo "## Dependency Age Check — ${ecosystem}"
              echo ""
              echo "> ${reason} :white_check_mark:"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          preflight::step_summary_all_passed() {
            local checked_count="$1" min_age_days="$2" skipped_count="${3:-0}"
            {
              echo ""
              echo "> Verified ${checked_count} package(s) at ≥ ${min_age_days} days old. :white_check_mark:"
              if [ "$skipped_count" -gt 0 ]; then
                echo "> ${skipped_count} skipped (see warnings above)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Now accepts optional counts so the footer breakdown matches what
          # callers actually tracked. Positional args are kept backwards-compatible
          # (only min_age_days is required).
          preflight::step_summary_failed() {
            local min_age_days="$1" checked_count="${2:-}" skipped_count="${3:-}"
            {
              echo ""
              echo "> **One or more dependencies failed the ${min_age_days}-day age check.** Add the \`age-check-bypass\` label to override (verified-CVE bypass only — see runbooks/phase-0-checklist.md)."
              if [ -n "$checked_count" ] || [ -n "$skipped_count" ]; then
                echo ">"
                echo "> Breakdown: **${checked_count:-?}** checked, **${skipped_count:-0}** skipped. See the table above for which rows failed (marked :x:)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run where one or more manifests were skipped wholesale by
          # explicit configuration rather than examined. Takes both counts because
          # the honest sentence depends on whether anything else WAS checked:
          # with a nonzero checked_count the skip is a caveat on a real result,
          # with zero it is the whole result. Emitting one blockquote per
          # condition produced two adjacent paragraphs saying the same thing, and
          # a forward reference to a count that never followed.
          preflight::step_summary_registry_free() {
            local skipped_files="$1" checked_count="${2:-0}"
            {
              echo ""
              if [ "$checked_count" -gt 0 ]; then
                echo "> **${skipped_files} lockfile(s) were not age-checked at all**, having resolved nothing from a registry; they were skipped by configuration. The count below covers only the rest."
              else
                echo "> **Nothing was age-checked.** ${skipped_files} lockfile(s) resolved nothing from a registry and were skipped by configuration. This is a pass by configuration, not by verification."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Footer for a run that verified NOTHING — because a manifest could not
          # be read, or because preflight stopped the run before any manifest was
          # examined (see fail_not_run) — as distinct from a dependency failing the
          # age check, which is what `step_summary_failed` is for.
          #
          # Deliberately does NOT mention `age-check-bypass`. That label is scoped
          # to verified-CVE overrides, the conditions reaching this footer can be
          # permanent rather than incidental, and the label genuinely clears the
          # check (the reusable job is gated on its absence) — so naming it here
          # would hand the operator the exact anti-pattern the ecosystem scripts
          # warn against in their own ::error:: on the same failure.
          preflight::step_summary_unverifiable() {
            local reason="$1"
            {
              echo ""
              echo "> **Nothing could be verified — ${reason}.** No dependency was age-checked in this run, so this fails rather than reporting a pass it cannot support."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Guard against "registry outage → every package skipped → workflow
          # passes" — if nothing actually got verified, fail and write a
          # summary explaining why.
          preflight::step_summary_all_skipped() {
            local skipped_count="$1"
            {
              echo ""
              echo "> **No packages could be verified** (all ${skipped_count} were skipped). Treating as failure to avoid silent pass on registry outage."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # ============================================================================
          # age-check-go.sh - Block newly published Go modules (supply chain)
          # ============================================================================
          #
          # Purpose:
          #   Go analog of the npm/pip/docker/actions checks. Walks the go.sum diff
          #   against origin/$BASE_REF, fails closed if any newly-introduced
          #   module@version was published less than MIN_AGE_DAYS ago or if
          #   proxy.golang.org is unreachable.
          #
          #   Pseudo-versions (v0.0.0-YYYYMMDDHHMMSS-hash) are pinned commits, not
          #   published releases, and are skipped — they're not supply chain
          #   attack vectors in the same way a typosquatted release tag is.
          #
          # Expected env vars:
          #   MIN_AGE_DAYS - default 7
          #   BASE_REF     - default 'main'
          #   EXEMPT_MODULE_PREFIXES - optional comma- or newline-separated first-party
          #                  module paths; each public entry ends with "/" (segment-safe
          #                  prefix) or names one full module path exactly. A match only
          #                  bypasses the age delay after exact proxy/GitHub provenance.
          #   FIRST_PARTY_MODULE_OWNER - caller repository owner; required and enforced as
          #                  the GitHub owner for every first-party public module
          #   FIRST_PARTY_GH_TOKEN - optional token for public GitHub provenance lookups
          #   PRIVATE_MODULES - optional newline-delimited exact module=owner/repo pairs;
          #                  a module may be at the repository root or in a subdirectory
          #   PRIVATE_MODULE_OWNER - GitHub owner for every declared private repository
          #   PRIVATE_MODULE_REPOSITORIES - newline-delimited exact repository names
          #   GH_TOKEN - App installation token; required only when PRIVATE_MODULES is set
          #   PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS - true requires a verified annotated tag
          #
          # Exit codes:
          #   0 - all newly-added module versions are >= MIN_AGE_DAYS old
          #   1 - at least one module is too young or its age can't be verified
          #
          # ============================================================================

          set -euo pipefail
          IFS=$'\n\t'

          MIN_AGE_DAYS="${MIN_AGE_DAYS:-7}"
          BASE_REF="${BASE_REF:-main}"
          EXEMPT_MODULE_PREFIXES="${EXEMPT_MODULE_PREFIXES:-}"
          FIRST_PARTY_MODULE_OWNER="${FIRST_PARTY_MODULE_OWNER:-}"
          FIRST_PARTY_GH_TOKEN="${FIRST_PARTY_GH_TOKEN:-}"
          PRIVATE_MODULES="${PRIVATE_MODULES:-}"
          PRIVATE_MODULE_OWNER="${PRIVATE_MODULE_OWNER:-}"
          PRIVATE_MODULE_REPOSITORIES="${PRIVATE_MODULE_REPOSITORIES:-}"
          PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS="${PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS:-false}"


          # ----- Separable: find changed go.sum files ---------------------------------

          # Split `git diff` from the grep/sort pipeline. On base-ref failure
          # the outer function surfaces it rather than letting `|| true` on the
          # filter mask it as "no changes detected."
          go_age::changed_sums() {
            local base_rev="$1"
            local diff_out
            diff_out=$(preflight::git_diff_or_fail --name-only "${base_rev}...HEAD" -- '**/go.sum' 'go.sum') || return 1
            printf '%s\n' "$diff_out" | sort -u
          }

          # Emit "module version" pairs (one per line) for added go.sum entries.
          go_age::added_deps() {
            local sum_file="$1" base_rev="$2"
            local diff_out
            diff_out=$(preflight::git_diff_or_fail "${base_rev}...HEAD" -- "$sum_file") || return 1
            printf '%s\n' "$diff_out" \
              | grep '^+[^+]' \
              | awk '{sub(/^\+/, "", $1); print $1 " " $2}' \
              | sed 's|/go.mod$||' \
              | sort -u || true
          }

          # ----- Separable: Go module proxy query → ISO-8601 publish time -------------

          go_age::proxy_escape() {
            local value="$1" encoded="" i c
            # Go module proxy encoding: each uppercase letter becomes
            # `!<lowercase>` per https://pkg.go.dev/cmd/go#hdr-Module_proxy_protocol
            # so the proxy filesystem is case-insensitive-safe.
            #
            # Previously this used `sed 's/\([A-Z]\)/!\L\1/g'`, which depends on
            # GNU sed's `\L` selective-lowercase flag. BSD sed would emit the
            # literal string `!L` prefix instead, breaking every request. Using
            # bash-native iteration removes the implicit GNU-sed dependency.
            for ((i = 0; i < ${#value}; i++)); do
              c="${value:i:1}"
              if [[ "$c" =~ [A-Z] ]]; then
                encoded+="!${c,}"
              else
                encoded+="$c"
              fi
            done
            printf '%s\n' "$encoded"
          }

          go_age::proxy_file() {
            local module="$1" version="$2" extension="$3"
            local encoded_module encoded_version
            encoded_module=$(go_age::proxy_escape "$module")
            encoded_version=$(go_age::proxy_escape "$version")
            curl -fsS -m 10 --retry 2 --retry-delay 1 --retry-max-time 25 --retry-connrefused \
              "https://proxy.golang.org/${encoded_module}/@v/${encoded_version}.${extension}"
          }

          go_age::published_at() {
            local response
            response=$(go_age::proxy_file "$1" "$2" info) || return 1
            printf '%s' "$response" | jq -er '.Time | select(type == "string" and length > 0)'
          }

          # ----- Separable: exact private-module declaration + GitHub provenance -----

          go_age::valid_module_subpath() {
            local subpath="$1" LC_ALL=C
            if [ -z "$subpath" ] || [[ "$subpath" == /* ]] || [[ "$subpath" == */ ]] \
              || [[ "$subpath" == *//* ]] || [[ "$subpath" == *$'\n'* ]] \
              || [[ "$subpath" == *$'\r'* ]]; then
              return 1
            fi

            local segment short upper
            local -a segments
            local IFS=/
            read -r -a segments <<< "$subpath"
            for segment in "${segments[@]}"; do
              # Match x/mod's module-path character alphabet for repository-relative
              # elements: ASCII letters/digits plus - . _ ~. A leading -, _, or ~ is
              # legal; a leading or trailing dot is not. In particular, '+' is allowed
              # in package import paths but x/mod deliberately rejects it in module paths
              # because it changes meaning in URLs.
              if [[ ! "$segment" =~ ^[A-Za-z0-9_~-][A-Za-z0-9._~-]*$ ]] || [[ "$segment" == *. ]]; then
                return 1
              fi

              # Match x/mod's cross-platform element restrictions too. Windows treats
              # these names as devices even when a suffix follows the first dot. Go also
              # rejects DOS 8.3 short-name shapes in module and import paths.
              short="${segment%%.*}"
              upper=$(printf '%s' "$short" | LC_ALL=C tr 'abcdefghijklmnopqrstuvwxyz' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ')
              case "$upper" in
                CON|PRN|AUX|NUL|COM1|COM2|COM3|COM4|COM5|COM6|COM7|COM8|COM9|LPT1|LPT2|LPT3|LPT4|LPT5|LPT6|LPT7|LPT8|LPT9)
                  return 1
                  ;;
              esac
              if [[ "$short" =~ ~[0-9]+$ ]]; then
                return 1
              fi
            done
            return 0
          }

          # Print the major component of a canonical Go module version. semver.Canonical
          # expands short versions and removes build metadata, so canonical module
          # versions must already contain major.minor.patch and may use only the special
          # +incompatible suffix that module.CanonicalVersion preserves. Numeric
          # prerelease identifiers cannot have leading zeroes.
          go_age::canonical_module_version_major() {
            local base_version="$1" prerelease identifier major LC_ALL=C
            if [[ "$base_version" == *+incompatible ]]; then
              base_version="${base_version%+incompatible}"
            fi
            # Keep a hand-edited go.sum value bounded before it enters a GitHub API URL.
            # The former private-tag validator allowed at most 128 base-version bytes.
            if [ "${#base_version}" -gt 128 ] \
              || [[ "$base_version" == *+* ]] \
              || [[ ! "$base_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
              return 1
            fi

            major="${BASH_REMATCH[1]}"
            if [[ "$base_version" == *-* ]]; then
              prerelease="${base_version#*-}"
              local -a identifiers
              local IFS=.
              read -r -a identifiers <<< "$prerelease"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^[0-9]+$ ]] && [ "${#identifier}" -gt 1 ] && [[ "$identifier" == 0* ]]; then
                  return 1
                fi
              done
            fi

            printf '%s\n' "$major"
          }

          # Return the repository-relative tag prefix for a declared private module.
          # Go tags a module in subdirectory "foo/bar" as "foo/bar/vX.Y.Z". A final
          # semantic-import-version segment belongs to the module path, not the tag
          # prefix: "foo/bar/v2" still uses "foo/bar/v2.3.4". Root modules and their
          # /vN variants have an empty prefix.
          go_age::module_tag_prefix() {
            local module="$1" repo="$2"
            # The repository owner and name are module-path elements too. Validate them
            # before the root-module fast path so an owner-wide first-party declaration
            # cannot bypass x/mod's cross-platform restrictions.
            go_age::valid_module_subpath "$repo" || return 1
            local repo_module="github.com/${repo}"
            if [ "$module" = "$repo_module" ]; then
              printf '\n'
              return 0
            fi
            if [[ "$module" != "$repo_module/"* ]]; then
              return 1
            fi

            local subpath="${module#"$repo_module"/}"
            go_age::valid_module_subpath "$subpath" || return 1

            local last_segment="${subpath##*/}"
            # Match the version-shaped suffix that x/mod SplitPathVersion inspects.
            # A dotted, v0, v1, or zero-padded form is invalid as a module-path major;
            # do not reinterpret it as an ordinary nested directory.
            if [[ "$last_segment" =~ ^v[0-9.]+$ ]]; then
              if [[ ! "$last_segment" =~ ^v([2-9]|[1-9][0-9]+)$ ]]; then
                return 1
              fi
              if [ "$subpath" = "$last_segment" ]; then
                printf '\n'
              else
                printf '%s\n' "${subpath%/*}"
              fi
              return 0
            fi

            printf '%s\n' "$subpath"
          }

          # Return the repository-relative tag prefix after enforcing Go's semantic
          # import-version rule against the dependency version. Both private-module and
          # first-party provenance paths use this function so /vN handling cannot drift.
          go_age::repository_relative_tag_prefix() {
            local module="$1" repo="$2" version="$3" route="$4" route_adjective tag_prefix
            case "$route" in
              Private) route_adjective="private" ;;
              First-party) route_adjective="first-party" ;;
              *)
                echo "Invalid repository-relative tag route: ${route}" >&2
                return 1
                ;;
            esac
            if ! tag_prefix=$(go_age::module_tag_prefix "$module" "$repo"); then
              echo "${route} module path cannot produce a valid repository-relative tag: ${module}" >&2
              return 1
            fi

            local version_major
            if ! version_major=$(go_age::canonical_module_version_major "$version"); then
              echo "Invalid ${route_adjective} module tag: ${version}" >&2
              return 1
            fi
            local last_segment="${module##*/}"
            if [[ "$last_segment" =~ ^v([0-9]+)$ ]]; then
              local path_major="${BASH_REMATCH[1]}"
              if [ "$path_major" != "$version_major" ]; then
                echo "${route} semantic import version does not match ${version}: ${module}" >&2
                return 1
              fi
            elif [ "$version_major" != 0 ] && [ "$version_major" != 1 ] && [[ "$version" != *+incompatible ]]; then
              echo "${route} v${version_major} module path lacks the required /v${version_major} suffix: ${module}" >&2
              return 1
            fi

            printf '%s\n' "$tag_prefix"
          }

          # Private modules never appear on proxy.golang.org, so their age must be
          # established from an authenticated, exact GitHub tag lookup. Keep this path
          # explicit and opt-in: an undeclared module always follows the existing public
          # proxy behavior, and a malformed declaration fails before any API request.
          go_age::validate_private_config() {
            if [ "$PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS" != "true" ] && [ "$PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS" != "false" ]; then
              echo "::error::PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS must be true or false" >&2
              return 1
            fi
            if [ -z "$PRIVATE_MODULES" ]; then
              if [ -n "$PRIVATE_MODULE_OWNER" ] || [ -n "$PRIVATE_MODULE_REPOSITORIES" ] || [ "$PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS" = "true" ]; then
                echo "::error::Private-module owner, repository scope, and verified-tag policy all require PRIVATE_MODULES declarations" >&2
                return 1
              fi
              return 0
            fi

            if [ -z "$PRIVATE_MODULE_OWNER" ] || [ -z "$PRIVATE_MODULE_REPOSITORIES" ] || [ -z "${GH_TOKEN:-}" ]; then
              echo "::error::PRIVATE_MODULES requires PRIVATE_MODULE_OWNER, PRIVATE_MODULE_REPOSITORIES, and GH_TOKEN" >&2
              return 1
            fi
            if [[ ! "$PRIVATE_MODULE_OWNER" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,37}[A-Za-z0-9])$ ]] \
              || [[ "$PRIVATE_MODULE_OWNER" == *--* ]]; then
              echo "::error::Invalid PRIVATE_MODULE_OWNER: ${PRIVATE_MODULE_OWNER}" >&2
              return 1
            fi

            local line module repo repo_owner repo_name
            local declared_modules=$'\n' declared_repositories=""
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if [[ "$line" != *=* ]] || [[ "${line#*=}" == *=* ]]; then
                echo "::error::Malformed PRIVATE_MODULES entry (expected module=owner/repo): ${line}" >&2
                return 1
              fi
              module="${line%%=*}"
              repo="${line#*=}"
              if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]] \
                || [[ "${repo#*/}" == *. ]]; then
                echo "::error::Invalid private GitHub repository: ${repo}" >&2
                return 1
              fi
              if ! go_age::module_tag_prefix "$module" "$repo" >/dev/null; then
                echo "::error::Private module/repository mismatch: ${module} must be the ${repo} root, its /vN major, or a valid nested module below that repository" >&2
                return 1
              fi
              repo_owner="${repo%%/*}"
              repo_name="${repo#*/}"
              if [ "$repo_owner" != "$PRIVATE_MODULE_OWNER" ]; then
                echo "::error::Private repository ${repo} is outside owner ${PRIVATE_MODULE_OWNER}" >&2
                return 1
              fi
              if [[ "$declared_modules" == *$'\n'"${module}"$'\n'* ]]; then
                echo "::error::Duplicate PRIVATE_MODULES entry: ${module}" >&2
                return 1
              fi
              declared_modules+="${module}"$'\n'
              declared_repositories+="${repo_name}"$'\n'
            done <<< "$PRIVATE_MODULES"

            if [ "$declared_modules" = $'\n' ]; then
              echo "::error::PRIVATE_MODULES contains no declarations" >&2
              return 1
            fi

            local supplied_repositories="" seen_repositories=$'\n'
            while IFS= read -r repo_name || [ -n "$repo_name" ]; do
              [ -z "$repo_name" ] && continue
              if [[ ! "$repo_name" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]] || [[ "$repo_name" == *. ]]; then
                echo "::error::Invalid PRIVATE_MODULE_REPOSITORIES entry: ${repo_name}" >&2
                return 1
              fi
              if [[ "$seen_repositories" == *$'\n'"${repo_name}"$'\n'* ]]; then
                echo "::error::Duplicate PRIVATE_MODULE_REPOSITORIES entry: ${repo_name}" >&2
                return 1
              fi
              seen_repositories+="${repo_name}"$'\n'
              supplied_repositories+="${repo_name}"$'\n'
            done <<< "$PRIVATE_MODULE_REPOSITORIES"

            local declared_sorted supplied_sorted
            declared_sorted=$(printf '%s' "$declared_repositories" | sort -u)
            supplied_sorted=$(printf '%s' "$supplied_repositories" | sort -u)
            if [ "$declared_sorted" != "$supplied_sorted" ]; then
              echo "::error::PRIVATE_MODULE_REPOSITORIES must exactly match repositories declared by PRIVATE_MODULES" >&2
              return 1
            fi
          }

          go_age::private_signature_allowed() {
            local tag_kind="$1" verification="$2"
            if [ "$PRIVATE_MODULE_REQUIRE_VERIFIED_TAGS" != "true" ]; then
              return 0
            fi
            [ "$tag_kind" = "annotated" ] && [ "$verification" = "verified" ]
          }

          # Emit "repository<TAB>tag-prefix" for an exact declaration. Return 1 when
          # the module is not declared and 2 when a declared module/version pair violates
          # semantic import versioning. Configuration validation already proves the path
          # shape; the second result is a defensive runtime check for a hand-edited
          # go.sum whose version does not agree with the declared /vN path.
          go_age::private_coordinates_for() {
            local wanted_module="$1" version="$2" line repo tag_prefix
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if [ "${line%%=*}" = "$wanted_module" ]; then
                repo="${line#*=}"
                if ! tag_prefix=$(go_age::repository_relative_tag_prefix "$wanted_module" "$repo" "$version" Private); then
                  return 2
                fi
                printf '%s\t%s\n' "$repo" "$tag_prefix"
                return 0
              fi
            done <<< "$PRIVATE_MODULES"
            return 1
          }

          go_age::github_json() {
            local path="$1"
            # Retry only transient transport/HTTP failures. curl's default retry class
            # excludes definitive 4xx responses such as a missing tag, so provenance
            # errors still fail immediately and closed. GitHub 403 responses also fail
            # immediately: they may be authorization failures, not safe retry signals.
            curl -fsS -m 10 --retry 2 --retry-delay 1 --retry-max-time 25 --retry-connrefused \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL:-https://api.github.com}${path}"
          }

          # Emit one tab-separated provenance row:
          #   timestamp  tag-kind  tag-object-sha  target-commit-sha  verification
          # Annotated tags carry their own tagger timestamp. Lightweight tags do not
          # record a creation timestamp, so the immutable target commit's committer time
          # is the only Git-native age signal available; the provenance row makes that
          # distinction explicit in the hosted log. Unlike proxy.golang.org's
          # server-observed first-seen time, both private timestamps are author-selected
          # metadata and can be backdated. Verified-tag policy authenticates the signer,
          # not the timestamp; this path is therefore only a quarantine aid for trusted
          # internal producers, not an equivalent public transparency guarantee.
          go_age::private_tag_metadata() {
            local repo="$1" version="$2" tag_prefix="${3:-}"
            # Go adds +incompatible to v2+ module versions that retain a v1-style module
            # path, but the repository tag itself omits that Go-only suffix.
            local base_tag_version="${version%+incompatible}"
            # The dispatcher already checked this value. Keep the same canonical check
            # for direct callers and as defense in depth before the value enters a URL.
            if ! go_age::canonical_module_version_major "$version" >/dev/null; then
              echo "Invalid private module tag: ${version}" >&2
              return 1
            fi
            if [ -n "$tag_prefix" ] && ! go_age::valid_module_subpath "$tag_prefix"; then
              echo "Invalid private module tag prefix: ${tag_prefix}" >&2
              return 1
            fi
            local tag_version="${tag_prefix:+${tag_prefix}/}${base_tag_version}"

            local ref_json ref_name object_type object_sha
            if ! ref_json=$(go_age::github_json "/repos/${repo}/git/ref/tags/${tag_version}"); then
              echo "Exact private tag ${repo}@${tag_version} is missing or inaccessible" >&2
              return 1
            fi
            IFS=$'\t' read -r ref_name object_type object_sha <<< "$(printf '%s' "$ref_json" \
              | jq -r '[.ref, .object.type, .object.sha] | map(. // "") | @tsv')"
            if [ "$ref_name" != "refs/tags/${tag_version}" ]; then
              echo "Private tag ${repo}@${tag_version} returned a mismatched ref name" >&2
              return 1
            fi
            if [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Private tag ${repo}@${tag_version} returned an invalid object SHA" >&2
              return 1
            fi

            case "$object_type" in
              tag)
                local tag_json tag_name target_type target_sha tagger_date verification
                if ! tag_json=$(go_age::github_json "/repos/${repo}/git/tags/${object_sha}"); then
                  echo "Annotated tag object ${repo}@${object_sha} is inaccessible" >&2
                  return 1
                fi
                IFS=$'\t' read -r tag_name target_type target_sha tagger_date verification <<< "$(printf '%s' "$tag_json" \
                  | jq -r '[.tag, .object.type, .object.sha, .tagger.date,
                    (if .verification.verified == true then "verified" else ("unverified:" + (.verification.reason // "unknown")) end)]
                    | map(. // "") | @tsv')"
                if [ "$tag_name" != "$tag_version" ] || [ "$target_type" != "commit" ] \
                  || [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]] || [ -z "$tagger_date" ]; then
                  echo "Annotated tag provenance mismatch for ${repo}@${tag_version}" >&2
                  return 1
                fi
                printf '%s\tannotated\t%s\t%s\t%s\n' \
                  "$tagger_date" "$object_sha" "$target_sha" "$verification"
                ;;
              commit)
                local commit_json commit_sha commit_date
                if ! commit_json=$(go_age::github_json "/repos/${repo}/commits/${object_sha}"); then
                  echo "Lightweight tag target ${repo}@${object_sha} is inaccessible" >&2
                  return 1
                fi
                IFS=$'\t' read -r commit_sha commit_date <<< "$(printf '%s' "$commit_json" \
                  | jq -r '[.sha, .commit.committer.date] | map(. // "") | @tsv')"
                if [ "$commit_sha" != "$object_sha" ] || [ -z "$commit_date" ]; then
                  echo "Lightweight tag provenance mismatch for ${repo}@${tag_version}" >&2
                  return 1
                fi
                printf '%s\tlightweight\t%s\t%s\tunavailable\n' \
                  "$commit_date" "$object_sha" "$commit_sha"
                ;;
              *)
                echo "Unsupported private tag target type for ${repo}@${tag_version}: ${object_type:-empty}" >&2
                return 1
                ;;
            esac
          }

          # ----- Separable: provenance-gated first-party public releases --------------

          # First-party modules (e.g. github.com/layervai/*) gain nothing from the
          # release-age cooldown: the org publishes them itself, usually minutes before
          # pinning. EXEMPT_MODULE_PREFIXES selects those module paths, but selection is
          # not enough to skip the delay. Every matching pin must independently prove:
          #   - its public proxy origin is the exact same-org GitHub repository and tag;
          #   - that tag still resolves to the proxy's immutable target commit;
          #   - the commit has a valid GitHub signature and is on the protected default
          #     branch of the public repository; and
          #   - the proxy's go.mod declares the exact module path.
          # This is deliberately narrower than the age-check-bypass PR label, which skips
          # the ENTIRE check for every dependency in the labeled PR.
          #
          # Matching rule (segment-safe by construction):
          #   - An entry ending in "/" matches any module path that starts with it.
          #     Because the entry itself terminates at a path-segment boundary,
          #     "github.com/layervai/" can never match "github.com/layervai-evil/x".
          #   - An entry not ending in "/" matches the full module path exactly.
          # Proven pins are reported in the log and counted in the skipped tally — visible
          # skips, never silent ones. A provenance lookup error fails closed.

          # Emit one normalized exemption entry per line: split on commas and
          # newlines, trim surrounding whitespace, drop blank fields. Blank fields
          # are tolerated (a YAML block scalar always ends with a newline, and a
          # trailing comma is harmless); an input that yields NO entries at all is
          # rejected by the validator below.
          go_age::exempt_entries() {
            printf '%s\n' "$EXEMPT_MODULE_PREFIXES" \
              | tr ',' '\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | grep -v '^$' || true
          }

          go_age::validate_exempt_config() {
            if [ -z "$EXEMPT_MODULE_PREFIXES" ]; then
              return 0
            fi

            if [[ ! "$FIRST_PARTY_MODULE_OWNER" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,37}[A-Za-z0-9])$ ]] \
              || [[ "$FIRST_PARTY_MODULE_OWNER" == *--* ]]; then
              echo "::error::EXEMPT_MODULE_PREFIXES requires a valid FIRST_PARTY_MODULE_OWNER" >&2
              return 1
            fi

            local entries; entries=$(go_age::exempt_entries)
            if [ -z "$entries" ]; then
              echo "::error::EXEMPT_MODULE_PREFIXES is set but contains no entries" >&2
              return 1
            fi

            local entry first_element repository_path seen=$'\n'
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              # Go module paths are ASCII letters/digits plus `-._~/`. Anything
              # else (globs, spaces, `=`) is a config mistake — fail loudly rather
              # than let an entry silently never match.
              if [[ ! "$entry" =~ ^[A-Za-z0-9._~/-]+$ ]]; then
                echo "::error::Malformed EXEMPT_MODULE_PREFIXES entry (allowed: letters, digits, '.', '_', '~', '/', '-'; globs are not supported): ${entry}" >&2
                return 1
              fi
              if [[ "$entry" == /* ]] || [[ "$entry" == *//* ]]; then
                echo "::error::Malformed EXEMPT_MODULE_PREFIXES entry (leading slash or empty path segment): ${entry}" >&2
                return 1
              fi
              # Module paths start with a domain-style element (github.com, k8s.io).
              # An entry like "layervai/" is almost certainly a forgotten host and
              # would otherwise never match anything, silently.
              first_element="${entry%%/*}"
              if [[ "$first_element" != *.* ]]; then
                echo "::error::EXEMPT_MODULE_PREFIXES entry must start with a domain-style path element (e.g. github.com/layervai/): ${entry}" >&2
                return 1
              fi
              local owner_root="github.com/${FIRST_PARTY_MODULE_OWNER}/"
              if [[ "$entry" != "$owner_root"* ]]; then
                echo "::error::EXEMPT_MODULE_PREFIXES entry must stay under the caller's GitHub owner ${FIRST_PARTY_MODULE_OWNER}: ${entry}" >&2
                return 1
              fi
              if [ -z "${entry#"$owner_root"}" ]; then
                # The one allowed owner-wide form is the segment-safe trailing-slash
                # prefix itself. Exact paths must name at least one repository.
                if [[ "$entry" != */ ]]; then
                  echo "::error::EXEMPT_MODULE_PREFIXES exact entry must name a repository: ${entry}" >&2
                  return 1
                fi
              elif [[ "${entry#"$owner_root"}" == /* ]]; then
                echo "::error::Malformed EXEMPT_MODULE_PREFIXES repository path: ${entry}" >&2
                return 1
              fi
              if [ "$entry" != "$owner_root" ]; then
                repository_path="${entry#"$owner_root"}"
                repository_path="${repository_path%/}"
                if ! go_age::valid_module_subpath "$repository_path"; then
                  echo "::error::Malformed first-party GitHub module path: ${entry}" >&2
                  return 1
                fi
              fi
              # A host-only prefix ("github.com/") would exempt EVERY module on that
              # host — a silent broad bypass that defeats per-module exemption. A
              # prefix entry must scope to at least an org/owner segment under the
              # host. (Exact-match entries with one segment stay legal: gopkg.in/yaml.v3
              # is a real module path.)
              if [[ "$entry" == */ ]]; then
                local segment_body="${entry%/}"
                if [[ "$segment_body" != */* ]]; then
                  echo "::error::EXEMPT_MODULE_PREFIXES prefix entry exempts an entire host; scope it to an org (e.g. github.com/layervai/): ${entry}" >&2
                  return 1
                fi
              fi
              if [[ "$seen" == *$'\n'"${entry}"$'\n'* ]]; then
                echo "::error::Duplicate EXEMPT_MODULE_PREFIXES entry: ${entry}" >&2
                return 1
              fi
              seen+="${entry}"$'\n'
            done <<< "$entries"
          }

          go_age::module_is_exempt() {
            local module="$1"
            if [ -z "$EXEMPT_MODULE_PREFIXES" ]; then
              return 1
            fi
            # Normalize the entry list once per run, not once per dependency.
            if [ -z "${GO_AGE_EXEMPT_ENTRIES_CACHED+x}" ]; then
              GO_AGE_EXEMPT_ENTRIES_CACHED=$(go_age::exempt_entries)
            fi
            local entries entry
            entries="$GO_AGE_EXEMPT_ENTRIES_CACHED"
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              if [[ "$entry" == */ ]]; then
                # Segment-safe: the entry ends at a path-segment boundary, so a
                # prefix match implies the module lives strictly under it.
                if [[ "$module" == "$entry"* ]]; then
                  return 0
                fi
              elif [ "$module" = "$entry" ]; then
                return 0
              fi
            done <<< "$entries"
            return 1
          }

          go_age::first_party_github_json() {
            local path="$1"
            local auth=()
            if [ -n "$FIRST_PARTY_GH_TOKEN" ]; then
              auth=(-H "Authorization: Bearer ${FIRST_PARTY_GH_TOKEN}")
            fi
            # Public provenance is independently anchored by proxy.golang.org. The token
            # only raises GitHub's API rate limit; it grants no cross-repository trust.
            curl -fsS -m 10 --retry 2 --retry-delay 1 --retry-max-time 25 --retry-connrefused \
              "${auth[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL:-https://api.github.com}${path}"
          }

          # Emit "owner/repository<TAB>tag" for a same-owner GitHub module. Nested Go
          # modules use repository-relative tag prefixes (submodule/v1.2.3); semantic
          # import-version suffixes (/v2+) are not part of that prefix.
          go_age::first_party_coordinates() {
            local module="$1" version="$2"
            local owner_root="github.com/${FIRST_PARTY_MODULE_OWNER}/"
            [[ "$module" == "$owner_root"* ]] || return 1
            local module_tail="${module#"$owner_root"}" repo_name
            repo_name="${module_tail%%/*}"

            local tag_version="${version%+incompatible}"
            local repo="${FIRST_PARTY_MODULE_OWNER}/${repo_name}" tag_prefix
            # repository_relative_tag_prefix applies the same x/mod element validator
            # used by exemption configuration. Keep one accepted path alphabet for both.
            tag_prefix=$(go_age::repository_relative_tag_prefix "$module" "$repo" "$version" First-party) || return 1
            local expected_tag="$tag_version"
            if [ -n "$tag_prefix" ]; then
              expected_tag="${tag_prefix}/${tag_version}"
            fi
            printf '%s\t%s\n' "$repo" "$expected_tag"
          }

          # Emit "tag-kind<TAB>tag-object-sha<TAB>target-commit-sha<TAB>tag-verification".
          # A lightweight tag has no tag-object signature; the target commit signature is
          # mandatory below. An annotated tag must itself also be GitHub-verified.
          go_age::first_party_tag_target() {
            local repo="$1" expected_tag="$2"
            local ref_json ref_name object_type object_sha
            ref_json=$(go_age::first_party_github_json "/repos/${repo}/git/ref/tags/${expected_tag}") || {
              echo "Exact first-party tag ${repo}@${expected_tag} is missing or inaccessible" >&2
              return 1
            }
            IFS=$'\t' read -r ref_name object_type object_sha <<< "$(printf '%s' "$ref_json" \
              | jq -er '[.ref, .object.type, .object.sha] | map(. // "") | @tsv')" || return 1
            if [ "$ref_name" != "refs/tags/${expected_tag}" ] || [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "First-party tag ref provenance mismatch for ${repo}@${expected_tag}" >&2
              return 1
            fi

            case "$object_type" in
              commit)
                printf 'lightweight\t%s\t%s\tunavailable\n' "$object_sha" "$object_sha"
                ;;
              tag)
                local tag_json tag_name target_type target_sha tag_verified tag_reason
                tag_json=$(go_age::first_party_github_json "/repos/${repo}/git/tags/${object_sha}") || {
                  echo "Annotated first-party tag object ${repo}@${object_sha} is inaccessible" >&2
                  return 1
                }
                IFS=$'\t' read -r tag_name target_type target_sha tag_verified tag_reason <<< "$(printf '%s' "$tag_json" \
                  | jq -er '[.tag, .object.type, .object.sha, ((.verification.verified // false) | tostring), (.verification.reason // "unknown")] | @tsv')" || return 1
                if [ "$tag_name" != "$expected_tag" ] || [ "$target_type" != "commit" ] \
                  || [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Annotated first-party tag provenance mismatch for ${repo}@${expected_tag}" >&2
                  return 1
                fi
                if [ "$tag_verified" != "true" ] || [ "$tag_reason" != "valid" ]; then
                  echo "Annotated first-party tag ${repo}@${expected_tag} is not GitHub-verified (reason: ${tag_reason})" >&2
                  return 1
                fi
                printf 'annotated\t%s\t%s\tverified\n' "$object_sha" "$target_sha"
                ;;
              *)
                echo "Unsupported first-party tag target type for ${repo}@${expected_tag}: ${object_type:-empty}" >&2
                return 1
                ;;
            esac
          }

          # Emit a compact, log-safe provenance row:
          #   repository  tag  commit  default-branch  tag-kind
          go_age::first_party_provenance() {
            local module="$1" version="$2"
            local coordinates repo expected_tag
            coordinates=$(go_age::first_party_coordinates "$module" "$version") || return 1
            IFS=$'\t' read -r repo expected_tag <<< "$coordinates"

            local info_json proxy_version origin_vcs origin_url origin_hash origin_ref
            info_json=$(go_age::proxy_file "$module" "$version" info) || {
              echo "First-party release is not available from proxy.golang.org: ${module}@${version}" >&2
              return 1
            }
            IFS=$'\t' read -r proxy_version origin_vcs origin_url origin_hash origin_ref <<< "$(printf '%s' "$info_json" \
              | jq -er '[.Version, .Origin.VCS, .Origin.URL, .Origin.Hash, .Origin.Ref] | map(. // "") | @tsv')" || {
                echo "First-party proxy metadata is missing exact origin fields: ${module}@${version}" >&2
                return 1
              }
            if [ "$proxy_version" != "$version" ] || [ "$origin_vcs" != "git" ] \
              || [ "$origin_url" != "https://github.com/${repo}" ] \
              || [[ ! "$origin_hash" =~ ^[0-9a-f]{40}$ ]] \
              || [ "$origin_ref" != "refs/tags/${expected_tag}" ]; then
              echo "First-party proxy origin mismatch for ${module}@${version}" >&2
              return 1
            fi

            local mod_file declared_module
            mod_file=$(go_age::proxy_file "$module" "$version" mod) || {
              echo "First-party go.mod is not available from proxy.golang.org: ${module}@${version}" >&2
              return 1
            }
            declared_module=$(printf '%s\n' "$mod_file" | awk '$1 == "module" { gsub(/^"|"$/, "", $2); print $2; exit }')
            if [ "$declared_module" != "$module" ]; then
              echo "First-party proxy go.mod declares ${declared_module:-no-module}, expected ${module}" >&2
              return 1
            fi

            local tag_metadata tag_kind _tag_object_sha target_sha _tag_verification
            tag_metadata=$(go_age::first_party_tag_target "$repo" "$expected_tag") || return 1
            IFS=$'\t' read -r tag_kind _tag_object_sha target_sha _tag_verification <<< "$tag_metadata"
            if [ "$target_sha" != "$origin_hash" ]; then
              echo "First-party GitHub tag target does not match the proxy origin for ${module}@${version}" >&2
              return 1
            fi

            local repo_json full_name repo_owner is_private default_branch
            repo_json=$(go_age::first_party_github_json "/repos/${repo}") || return 1
            IFS=$'\t' read -r full_name repo_owner is_private default_branch <<< "$(printf '%s' "$repo_json" \
              | jq -er '[.full_name, .owner.login, ((.private // false) | tostring), .default_branch] | map(. // "") | @tsv')" || return 1
            if [ "$full_name" != "$repo" ] || [ "$repo_owner" != "$FIRST_PARTY_MODULE_OWNER" ] \
              || [ "$is_private" != "false" ] || [ -z "$default_branch" ]; then
              echo "First-party repository is not the exact public same-owner repository: ${repo}" >&2
              return 1
            fi

            local branch_json branch_name branch_protected branch_head
            branch_json=$(go_age::first_party_github_json "/repos/${repo}/branches/${default_branch}") || return 1
            IFS=$'\t' read -r branch_name branch_protected branch_head <<< "$(printf '%s' "$branch_json" \
              | jq -er '[.name, ((.protected // false) | tostring), .commit.sha] | map(. // "") | @tsv')" || return 1
            if [ "$branch_name" != "$default_branch" ] || [ "$branch_protected" != "true" ] \
              || [[ ! "$branch_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "First-party repository default branch is missing or unprotected: ${repo}@${default_branch}" >&2
              return 1
            fi

            local commit_json commit_sha commit_verified commit_reason
            commit_json=$(go_age::first_party_github_json "/repos/${repo}/commits/${target_sha}") || return 1
            IFS=$'\t' read -r commit_sha commit_verified commit_reason <<< "$(printf '%s' "$commit_json" \
              | jq -er '[.sha, ((.commit.verification.verified // false) | tostring), (.commit.verification.reason // "unknown")] | @tsv')" || return 1
            if [ "$commit_sha" != "$target_sha" ] || [ "$commit_verified" != "true" ] || [ "$commit_reason" != "valid" ]; then
              echo "First-party release commit is not GitHub-verified: ${repo}@${target_sha} (reason: ${commit_reason})" >&2
              return 1
            fi

            local compare_json compare_status base_sha merge_base_sha behind_by
            compare_json=$(go_age::first_party_github_json "/repos/${repo}/compare/${target_sha}...${default_branch}") || return 1
            IFS=$'\t' read -r compare_status base_sha merge_base_sha behind_by <<< "$(printf '%s' "$compare_json" \
              | jq -er '[.status, .base_commit.sha, .merge_base_commit.sha, .behind_by] | map(. // "") | @tsv')" || return 1
            if { [ "$compare_status" != "identical" ] && [ "$compare_status" != "ahead" ]; } \
              || [ "$base_sha" != "$target_sha" ] || [ "$merge_base_sha" != "$target_sha" ] || [ "$behind_by" != "0" ]; then
              echo "First-party release commit is not on ${repo}'s default branch ${default_branch}: ${target_sha}" >&2
              return 1
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' "$repo" "$expected_tag" "$target_sha" "$default_branch" "$tag_kind"
          }

          # Private first-party source releases can precede the coordinated deployment.
          # They have no public proxy record: require a published release, an annotated
          # signed tag, and its exact signed commit. The exact private declaration and
          # same-owner exemption are both required by the caller before this function.
          go_age::private_first_party_release() {
            local repo="$1" version="$2" prefix="$3" kind="$4" commit="$5" verification="$6"
            [ "${repo%%/*}" = "$FIRST_PARTY_MODULE_OWNER" ] || return 1
            [ "$kind" = annotated ] && [ "$verification" = verified ] || return 1
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || return 1
            go_age::canonical_module_version_major "$version" >/dev/null || return 1
            local tag="${version%+incompatible}" repo_json release_json commit_json
            [ -z "$prefix" ] || tag="${prefix}/${tag}"
            repo_json=$(go_age::github_json "/repos/${repo}") || return 1
            printf '%s' "$repo_json" | jq -e --arg repo "$repo" --arg owner "$FIRST_PARTY_MODULE_OWNER" \
              '.full_name == $repo and .owner.login == $owner and .private == true' >/dev/null || return 1
            release_json=$(go_age::github_json "/repos/${repo}/releases/tags/${tag}") || return 1
            printf '%s' "$release_json" | jq -e --arg tag "$tag" \
              '.tag_name == $tag and .draft == false and .prerelease == false and
               (.published_at | type == "string" and length > 0)' >/dev/null || return 1
            commit_json=$(go_age::github_json "/repos/${repo}/commits/${commit}") || return 1
            printf '%s' "$commit_json" | jq -e --arg commit "$commit" \
              '.sha == $commit and .commit.verification.verified == true and
               .commit.verification.reason == "valid"' >/dev/null
          }

          # ----- Main -----------------------------------------------------------------

          go_age::main() {
            preflight::require_tools curl jq awk sed grep sort
            preflight::require_gnu_date
            preflight::validate_min_age_days
            go_age::validate_private_config || exit 1
            go_age::validate_exempt_config || exit 1

            local base_ref="origin/${BASE_REF}"
            preflight::verify_base_ref "$base_ref"
            local base_rev; base_rev=$(preflight::base_rev) || exit 1  # closed even where errexit is off

            local now_epoch; now_epoch=$(date +%s)
            local failed=false
            local checked_count=0
            local skipped_count=0

            local changed_sums; changed_sums=$(go_age::changed_sums "$base_rev")
            if [ -z "$changed_sums" ]; then
              echo "No go.sum changes detected"
              preflight::step_summary_no_changes "Go" "No \`go.sum\` changes detected in this diff."
              exit 0
            fi

            preflight::step_summary_header "Go"

            for sum_file in $changed_sums; do
              echo "::group::Checking ${sum_file}"

              local new_deps; new_deps=$(go_age::added_deps "$sum_file" "$base_rev")
              if [ -z "$new_deps" ]; then
                echo "No new dependencies in ${sum_file}"
                echo "::endgroup::"
                continue
              fi

              while IFS=' ' read -r module version; do
                [[ "$version" =~ ^v ]] || continue

                # Pseudo-versions are pinned commits, not published releases.
                # The Go proxy may 404 or return misleading timestamps. Skip —
                # they're not supply-chain attack vectors the way a typosquatted
                # release tag is.
                #
                # Pseudo-version shapes (per go dev docs):
                #   vX.0.0-<timestamp>-<hash>          (no prior tag)
                #   vX.Y.Z-0.<timestamp>-<hash>        (after release tag; branch off)
                #   vX.Y.Z-pre.0.<timestamp>-<hash>    (pre-release pseudo)
                # The common thread is a 14-digit timestamp + 12-hex-char hash at
                # the end, separated from the preceding part by either `-` (v0
                # shape) or `.` (shapes that have `-0.` or `.pre.0.` before the
                # timestamp). Match that suffix with a `[-.]` separator so v2+
                # pseudo-versions (common for modules with /vN subpaths) are
                # also skipped.
                if [[ "$version" =~ [-.][0-9]{14}-[0-9a-f]{12}$ ]]; then
                  echo "  SKIP: ${module}@${version} (pseudo-version)"
                  skipped_count=$((skipped_count + 1))
                  continue
                fi

                # Sanitize module path + version for step-summary cells. Go
                # module paths contain `/` and `.`; safe_for_md preserves them.
                local safe_module; safe_module=$(preflight::safe_for_md "$module")
                local safe_version; safe_version=$(preflight::safe_for_md "$version")

                # Exact private declarations retain their authenticated tag-age path even
                # when a consumer also configures an owner-wide public first-party prefix.
                local private_coordinates="" private_repo="" private_tag_prefix="" private_coordinates_status=0
                private_coordinates=$(go_age::private_coordinates_for "$module" "$version") || private_coordinates_status=$?
                if [ "$private_coordinates_status" -eq 0 ]; then
                  IFS=$'\t' read -r private_repo private_tag_prefix <<< "$private_coordinates"
                elif [ "$private_coordinates_status" -eq 2 ]; then
                  echo "::error file=${sum_file}::Private declaration cannot resolve ${module}@${version}"
                  echo "| \`${safe_module}\` | ${safe_version} | — | :x: private declaration unresolvable |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_module" "$safe_version" \
                    "declared module/version cannot produce an exact private tag"
                  # Fail closed for this dependency and continue the normal report. The
                  # resolver uses status 2 for every declared-but-unresolvable module:
                  # invalid path, invalid version, or semantic-major mismatch. The
                  # `continue` prevents any proxy or provenance lookup for that invalid
                  # declaration while preserving the gate's all-dependency diagnostics.
                  failed=true
                  continue
                elif [ "$private_coordinates_status" -ne 1 ]; then
                  echo "::error file=${sum_file}::Private declaration lookup failed for ${module}@${version} (status ${private_coordinates_status})"
                  echo "| \`${safe_module}\` | ${safe_version} | — | :x: private declaration lookup failed |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_module" "$safe_version" \
                    "private declaration lookup returned an unexpected status"
                  # Only status 1 means "not declared". Every other status fails closed
                  # for this dependency and must never reach public proxy routing.
                  failed=true
                  continue
                fi

                # A configured same-owner public module may bypass the cooldown only
                # after the proxy origin, exact GitHub tag, verified target commit, and
                # protected-default-branch ancestry all agree. Exact private declarations
                # take precedence; unlike the old path-only exemption, this public path
                # performs every provenance lookup before recording a visible skip.
                if [ -z "$private_repo" ] && go_age::module_is_exempt "$module"; then
                  local first_party_metadata fp_repo fp_tag fp_commit fp_branch fp_tag_kind
                  if ! first_party_metadata=$(go_age::first_party_provenance "$module" "$version"); then
                    echo "::error file=${sum_file}::Could not verify first-party release provenance for ${module}@${version}"
                    echo "| \`${safe_module}\` | ${safe_version} | — | :x: first-party provenance unverifiable |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$safe_module" "$safe_version" \
                      "first-party proxy, tag, commit, or default-branch provenance mismatch"
                    failed=true
                    continue
                  fi
                  IFS=$'\t' read -r fp_repo fp_tag fp_commit fp_branch fp_tag_kind <<< "$first_party_metadata"
                  echo "  FIRST-PARTY: ${module}@${version} repo=${fp_repo} tag=${fp_tag} commit=${fp_commit} default=${fp_branch} tag-kind=${fp_tag_kind} proxy=verified"
                  echo "| \`${safe_module}\` | ${safe_version} | — | :white_check_mark: first-party provenance |" >> "$GITHUB_STEP_SUMMARY"
                  skipped_count=$((skipped_count + 1))
                  continue
                fi

                local publish_time age_verb="published" metadata
                if [ -n "$private_repo" ]; then
                  if ! metadata=$(go_age::private_tag_metadata "$private_repo" "$version" "$private_tag_prefix"); then
                    echo "::error file=${sum_file}::Could not verify private tag provenance for ${module}@${version}"
                    echo "| \`${safe_module}\` | ${safe_version} | — | :x: private tag unverifiable |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$safe_module" "$safe_version" \
                      "private GitHub tag missing or provenance mismatch"
                    failed=true
                    continue
                  fi
                  local tag_kind tag_object_sha target_commit_sha verification
                  IFS=$'\t' read -r publish_time tag_kind tag_object_sha target_commit_sha verification <<< "$metadata"
                  if ! go_age::private_signature_allowed "$tag_kind" "$verification"; then
                    echo "::error file=${sum_file}::Private module ${module}@${version} requires a GitHub-verified annotated tag"
                    echo "| \`${safe_module}\` | ${safe_version} | — | :x: signed tag required |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$safe_module" "$safe_version" \
                      "GitHub-verified annotated tag required"
                    failed=true
                    continue
                  fi
                  if go_age::exempt_entries | grep -Fx -- "$module" >/dev/null; then
                    if ! go_age::private_first_party_release "$private_repo" "$version" "$private_tag_prefix" "$tag_kind" "$target_commit_sha" "$verification"; then
                      echo "::error file=${sum_file}::Could not verify private first-party release for ${module}@${version}"
                      echo "| \`${safe_module}\` | ${safe_version} | — | :x: private first-party release unverifiable |" >> "$GITHUB_STEP_SUMMARY"
                      preflight::record_unverifiable "$safe_module" "$safe_version" \
                        "published release, signed tag, or signed commit missing"
                      failed=true
                      continue
                    fi
                    echo "  FIRST-PARTY PRIVATE: ${module}@${version} repo=${private_repo} tag=${tag_object_sha} commit=${target_commit_sha} release=verified"
                    echo "| \`${safe_module}\` | ${safe_version} | — | :white_check_mark: private first-party release |" >> "$GITHUB_STEP_SUMMARY"
                    skipped_count=$((skipped_count + 1))
                    continue
                  fi
                  if [ "$tag_kind" != "annotated" ] || [ "$verification" != "verified" ]; then
                    echo "::warning file=${sum_file}::Private module ${module}@${version} uses ${tag_kind} provenance (${verification}); its author-selected timestamp is not signature-authenticated"
                  fi
                  echo "  PRIVATE: ${module}@${version} ${tag_kind} tag=${tag_object_sha} commit=${target_commit_sha} signature=${verification}"
                  if [ "$tag_kind" = "lightweight" ]; then
                    age_verb="committed"
                  else
                    age_verb="tagged"
                  fi
                else
                  if ! publish_time=$(go_age::published_at "$module" "$version"); then
                    echo "::error file=${sum_file}::Could not verify age for ${module}@${version} (proxy.golang.org unreachable or module not found)"
                    echo "| \`${safe_module}\` | ${safe_version} | — | :x: proxy unreachable |" >> "$GITHUB_STEP_SUMMARY"
                    preflight::record_unverifiable "$safe_module" "$safe_version" \
                      "proxy.golang.org unreachable or module not found"
                    failed=true
                    continue
                  fi
                fi

                if [ -z "$publish_time" ]; then
                  echo "::error file=${sum_file}::No provenance timestamp returned for ${module}@${version}"
                  echo "| \`${safe_module}\` | ${safe_version} | — | :x: no publish time |" >> "$GITHUB_STEP_SUMMARY"
                  preflight::record_unverifiable "$safe_module" "$safe_version" \
                    "no provenance timestamp returned"
                  failed=true
                  continue
                fi

                # Classify + emit via shared helper. _and_tally updates counters
                # via dynamic scoping. The verb reflects the provenance source:
                # published (public proxy), tagged (annotated), or committed (lightweight).
                preflight::age_row_and_tally \
                  "$safe_module" "$safe_version" "$publish_time" "$now_epoch" "$MIN_AGE_DAYS" \
                  "$age_verb" "$sum_file" "@"
              done <<< "$new_deps"

              echo "::endgroup::"
            done

            if [ "$failed" = true ]; then
              preflight::step_summary_failed "$MIN_AGE_DAYS" "$checked_count" "$skipped_count"
              echo ""
              echo "::error::One or more Go dependencies failed the age check."
              echo "To bypass for emergency security updates, add the 'age-check-bypass' label to this PR."
              exit 1
            fi

            # Go's skip classes are both deliberate: pseudo-version commit pins and
            # provenance-verified first-party releases. Outages and mismatches record an
            # unverifiable failure, so an all-skipped guard is not appropriate.
            preflight::step_summary_all_passed "$checked_count" "$MIN_AGE_DAYS" "$skipped_count"
            echo "All Go dependencies are at least ${MIN_AGE_DAYS} days old"
          }
          go_age::main

      - name: Comment retry-after dates on PR
        if: ${{ !cancelled() && inputs.comment_on_failure && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          FAILURES_FILE: ${{ runner.temp }}/age-check-failures.tsv
          # Per-ecosystem render parameters. Bash body below is identical
          # across all reusables; only these env values change.
          ECOSYSTEM: go
          ITEM_COLUMN: Module
          SEPARATOR: "@"
        run: |
          # ============================================================================
          # comment-on-failure.sh - Post sticky PR comment with retry-after dates
          # ============================================================================
          #
          # Embedded into each `age-check-<eco>.yml.tmpl` at the
          # `# @@COMMENT_ON_FAILURE@@` marker by `scripts/embed-lib-into-workflows.py`.
          #
          # Reads the TSV that `preflight::record_failure`,
          # `preflight::record_unverifiable` and `preflight::record_not_run` wrote
          # during the main run step (one row per failed pin) and renders a single
          # sticky comment. Each row carries a `kind` column — `too_new`,
          # `unverifiable` or `not_run` — so the renderer can split into sections
          # with the right operator action: too-new pins get an eligible-after
          # date and "wait then push any commit"; unverifiable pins (registry/API
          # outages, missing manifests, etc.) get the upstream reason and "re-run
          # the failed check"; a not-run row (preflight stopped the check before
          # any pin — an unfetched base branch, a shallow clone) gets its reason,
          # no re-run copy, and NO bypass offer: the remedy is a checkout setting,
          # and the label would switch the gate off instead. Updates an existing
          # sticky in place
          # (marker is `<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->`);
          # deletes the sticky on a clean run so a stale "X days remaining" doesn't
          # outlive the failure that produced it.
          #
          # Soft-fails on permission denial (typical on Dependabot PRs where the
          # token is read-only) — emits a `::notice` so the run still succeeds and
          # the user can find retry-after dates in the Job Summary.
          #
          # Required env (set per-ecosystem in the calling step):
          #   GH_TOKEN, REPO, PR_NUMBER, RUN_URL, MIN_AGE_DAYS, FAILURES_FILE,
          #   ECOSYSTEM, ITEM_COLUMN, SEPARATOR
          # ============================================================================

          set -euo pipefail

          MARKER="<!-- ops-routines:age-check-comment:${ECOSYSTEM} -->"

          # `gh api ... --paginate` pages through all PR comments. The jq filter
          # selects whichever one carries our marker (there should be 0 or 1).
          # `--jq '... // empty'` returns the empty string when no match — keeps
          # `existing_id` testable with `[ -n "$existing_id" ]`.
          existing_id=$(
            gh api --paginate "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | first | .id // empty" \
              2>/dev/null || true
          )

          if [ -s "${FAILURES_FILE:-/dev/null}" ]; then
            body_file=$(mktemp)
            # Dedupe rows: a single pin referenced in N workflow / lockfile
            # entries records N identical TSV rows (one per file processed by
            # the main script). Per-file `::error file=…` annotations correctly
            # fire N times so each file in the Files Changed tab gets its own
            # inline annotation; this comment is a SUMMARY, not a per-file
            # annotation, so it should list each pin once. `sort -u` works
            # because age / eligible / remaining / kind are identical for a
            # given (id, version) within a single run (the script captures
            # `now_epoch` once at startup).
            deduped_failures=$(mktemp)
            sort -u "${FAILURES_FILE}" > "${deduped_failures}"

            # Split rows by kind, deduping cross-kind for the same pin. The
            # legacy assumption was "a pin is either too_new OR unverifiable in a
            # single run" — true within a single file, but a pin referenced in
            # two changed files can hit both branches if `gh api` succeeds for
            # file A and fails for file B (transient mid-run flake). When that
            # happens the too_new judgment is the durable answer (we have a valid
            # age from the file where the fetch succeeded); the unverifiable from
            # the other file is just noise. Without this dedup, a reviewer sees
            # the same pin in both sections with conflicting actions
            # ("wait until eligible" AND "re-run the failed check"), which is
            # confusing and slightly misleading.
            #
            # Two-pass awk via the `NR==FNR` trick: pass 1 collects the set of
            # (id, version) pairs that have a too_new row; pass 2 emits each row
            # to its kind's output file, skipping an unverifiable row when its
            # (id, version) is already in the too_new set. Empty `kind` column on
            # a legacy row defaults to too_new — defensive only; both writers
            # always set it.
            #
            # Wrapped in `if !` so a future regression in the awk script (output
            # path collision, syntax error, etc.) doesn't trip `set -e` and
            # silently suppress the comment — the whole point of this feature is
            # to surface failures at PR review time without forcing the reviewer
            # to dig into logs. Fallback dumps the deduped data into the too_new
            # bucket so the reviewer at least sees the failed pins, with a
            # `::warning` flagging the degraded render.
            too_new_failures=$(mktemp)
            unverifiable_failures=$(mktemp)
            not_run_failures=$(mktemp)
            if ! awk -F '\t' '
              NR == FNR {
                if (($7 == "" ? "too_new" : $7) == "too_new") {
                  too_new_pins[$1 "\t" $2] = 1
                }
                next
              }
              {
                kind = $7 == "" ? "too_new" : $7
                if (kind == "too_new") {
                  print > too_new_out
                } else if (kind == "unverifiable") {
                  key = $1 "\t" $2
                  if (!(key in too_new_pins)) {
                    print > unverifiable_out
                  }
                } else if (kind == "not_run") {
                  print > not_run_out
                }
              }
            ' too_new_out="${too_new_failures}" \
              unverifiable_out="${unverifiable_failures}" \
              not_run_out="${not_run_failures}" \
              "${deduped_failures}" "${deduped_failures}"; then
              echo "::warning::age-check renderer failed to split rows by kind; falling back to a flat list — some entries may be unverifiable rather than too-new (see the per-pin annotations in this run for the real classification)."
              cp "${deduped_failures}" "${too_new_failures}"
              : > "${unverifiable_failures}"
              : > "${not_run_failures}"
            fi

            # shellcheck disable=SC2016
            # The printf format strings below intentionally contain literal
            # backticks and `%s` placeholders for Markdown rendering — no shell
            # expansion is wanted in those slots.
            {
              printf '%s\n\n' "${MARKER}"
              printf '### Dependency Age Check failed — %s\n\n' "${ECOSYSTEM}"

              # Preflight exits before any pin is examined, so a not-run row never
              # shares a comment with the two pin sections below.
              if [ -s "${not_run_failures}" ]; then
                printf '#### The check could not run\n\n'
                printf 'The check stopped before examining any dependency. The reason names the fix — a checkout setting, not a registry outage — so running the check again will not help until that setting is changed.\n\n'
                printf '| Base ref | Reason |\n'
                printf '|---|---|\n'
                while IFS=$'\t' read -r id _ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s` | %s |\n' "${id}" "${reason}"
                done < "${not_run_failures}"
                printf '\n'
              fi

              if [ -s "${too_new_failures}" ]; then
                printf '#### Pins below quarantine\n\n'
                printf 'New pin(s) below have not yet reached the **%s-day** quarantine. Wait until the eligible date, push any new commit, and the check will pass.\n\n' "${MIN_AGE_DAYS}"
                printf '| %s | Age (days) | Eligible after | Days remaining |\n' "${ITEM_COLUMN}"
                printf '|---|---:|---|---:|\n'
                while IFS=$'\t' read -r id ver age _min eligible remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s | %s | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${age}" "${eligible}" "${remaining}"
                done < "${too_new_failures}"
                printf '\n'
              fi

              if [ -s "${unverifiable_failures}" ]; then
                printf '#### Pins that could not be verified\n\n'
                printf 'Upstream metadata fetch failed for the pin(s) below. This is usually a transient registry/API issue — re-run the failed check from the Actions tab; if it keeps failing, open an issue with the reason text.\n\n'
                printf '| %s | Reason |\n' "${ITEM_COLUMN}"
                printf '|---|---|\n'
                while IFS=$'\t' read -r id ver _age _min reason _remaining _kind; do
                  [ -z "${id}" ] && continue
                  printf '| `%s%s%s` | %s |\n' \
                    "${id}" "${SEPARATOR}" "${ver}" "${reason}"
                done < "${unverifiable_failures}"
                printf '\n'
              fi

              # No bypass offer under a not-run row: the label genuinely clears the
              # check, and the checkout would stay broken for the next PR. Keyed on
              # the raw rows rather than the awk bucket, so the degraded fallback
              # above (which dumps every row into too_new) cannot restore the offer.
              if ! grep -q $'\tnot_run$' "${deduped_failures}"; then
                printf '> Need to merge sooner? Add the **`age-check-bypass`** label — verified-CVE emergencies only.\n'
              fi
              printf '\n<sub>Updated by `ops-routines-workflows/age-check-%s` · [run log](%s)</sub>\n' "${ECOSYSTEM}" "${RUN_URL}"
            } > "${body_file}"
            rm -f "${deduped_failures}" "${too_new_failures}" "${unverifiable_failures}" "${not_run_failures}"

            if [ -n "${existing_id}" ]; then
              if ! gh api -X PATCH "/repos/${REPO}/issues/comments/${existing_id}" \
                   -F "body=@${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not update age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            else
              if ! gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body_file}" >/dev/null 2>&1; then
                echo "::notice::Could not post age-check comment — caller workflow needs \`pull-requests: write\` (Dependabot PRs need this granted explicitly). Retry-after dates are in the Job Summary."
              fi
            fi
            rm -f "${body_file}"
          elif [ -n "${existing_id}" ]; then
            # No failures this run (neither too-new nor unverifiable); clear the
            # stale sticky if one exists so reviewers don't act on outdated
            # retry-after dates or stale upstream-error reasons.
            if ! gh api -X DELETE "/repos/${REPO}/issues/comments/${existing_id}" >/dev/null 2>&1; then
              echo "::notice::Could not delete stale age-check comment (id ${existing_id}). Caller workflow may need \`pull-requests: write\`."
            fi
          fi
